  <title>Eien’s seal</title>
  <!--
    Eien's seal, the app's icon: a vermilion square with 永 (eternity) pressed
    into it. The source every icon is made from (npm run icons).

    The glyph is drawn by hand as outlines of its six strokes (the dot, the
    horizontal, the stem with its hook, the rising stroke and the two
    falling ones), traced from no font, so no font licence comes with it: it
    is Eien's own artwork.

    The colours are the seal's own (--eien-seal and --eien-on-seal in
    src/ui/theme/tokens.css, day). scripts/icons/build.mjs reads the ground's
    fill, the glyph's fill and the glyph's path (only M, L and Z), so keep
    this file's shape.
  -->
