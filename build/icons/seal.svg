<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img">
  <title>Eien’s seal</title>
  <!--
    Eien's seal, the app's icon: a vermilion square with 永 (eternity) pressed
    into it. The source every icon is made from (npm run icons).

    The glyph is 永 from Noto Serif JP, weight 400 (SIL Open Font License 1.1;
    @fontsource/noto-serif-jp 5.3.1, the slice noto-serif-jp-98-400-normal),
    its outline turned into this path. It is placed as the interface sets the
    seal (.seal in src/ui/theme/base.css): 0.68 of the square, its
    ideographic em box (-120 to 880, the font's BASE table) centred. In font
    units, x' = 512 + (x - 500) × 0.69632 and y' = 512 - (y - 380) × 0.69632.
    The OFL covers the font, not artwork drawn with it, so no licence comes
    with the icon.

    The colours are the seal's own (--eien-seal and --eien-on-seal in
    src/ui/theme/tokens.css, day). scripts/icons/build.mjs reads the ground's
    fill, the glyph's fill and the glyph's path (absolute M, L, Q, C and Z
    only), so keep this file's shape.
  -->
  <rect id="ground" width="1024" height="1024" fill="#c4472d"/>
