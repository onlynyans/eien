<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The extension's own files, and a story's images from the web: nothing
         a story holds can run a script, fetch, or pull in a style. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https:; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Eien</title>
    <link rel="stylesheet" href="./reader.css" />
    <script type="module" src="./reader.ts"></script>
  </head>
  <body></body>
</html>
