<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only Eien's own files load: nothing in a note can run a script,
         fetch from the web, or pull in a style. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <title>Eien</title>
    <link rel="stylesheet" href="./theme/app.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
