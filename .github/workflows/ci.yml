name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    # A hung step stops here, not at GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  e2e:
    name: End-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # Electron fetches its binary the first time it's asked for, not on
      # install. Fetch it now: two test workers asking at once unpack it over
      # each other, which fails on Windows.
      - name: Electron's binary
        run: npx install-electron

      # The disk storage's contract on this system's own file system: paths,
      # renames and watching differ between macOS, Windows and Linux.
      - name: Storage tests on this system
        run: npx vitest run src/platform

      - run: npm run build

      # Ubuntu 24.04 stops Chromium's sandbox from creating namespaces. Allow it,
      # rather than turning the sandbox off: the tests check that it's on.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep-invert @timing
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npx playwright test --grep-invert @timing
      # Tests that hold the app to a time run alone, so they measure Eien, not the other tests.
      - name: Timing tests, one at a time (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep @timing --workers=1
      - name: Timing tests, one at a time
        if: runner.os != 'Linux'
        run: npx playwright test --grep @timing --workers=1

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
