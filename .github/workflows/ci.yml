name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    # A hung step stops here, not at GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  phone-page:
    name: Phone page (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The phone's page with Capacitor's web plugins standing in for the phone's
      # (playwright.mobile.config.ts). On a device: npm run test:android, by hand.
      - run: npm run test:mobile
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phone-page-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # The runner has the Android SDK; Gradle needs a JDK it supports.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: The phone's page, copied into the Android project
        run: npm run android
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      # To try on a phone: Settings → install unknown apps for the browser or Files.
      - uses: actions/upload-artifact@v7
        with:
          name: eien-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  e2e:
    name: End-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # Electron fetches its binary the first time it's asked for, not on
      # install. Fetch it now: two test workers asking at once unpack it over
      # each other, which fails on Windows.
      - name: Electron's binary
        run: npx install-electron

      # The disk storage's contract on this system's own file system: paths,
      # renames and watching differ between macOS, Windows and Linux.
      - name: Storage tests on this system
        run: npx vitest run src/platform

      - run: npm run build

      # Ubuntu 24.04 stops Chromium's sandbox from creating namespaces. Allow it,
      # rather than turning the sandbox off: the tests check that it's on.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep-invert @alone
      - name: End-to-end tests
        if: runner.os != 'Linux'
        # bash on Windows too: PowerShell would read "@alone" as a variable.
        shell: bash
        run: npx playwright test --grep-invert @alone
      # Tests that hold the app to a time, or drag with the pointer, run alone (tests/e2e/launch.ts).
      - name: Tests that run alone, one at a time (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep @alone --workers=1
      - name: Tests that run alone, one at a time
        if: runner.os != 'Linux'
        shell: bash
        run: npx playwright test --grep @alone --workers=1

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
