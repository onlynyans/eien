name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    # A hung step stops here, not at GitHub's six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      # What ships (dependencies, not devDependencies) with no known high or critical advisory.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      # Fails under the thresholds in vitest.config.ts.
      - run: npm run test:coverage

  phone-page:
    name: Phone page (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The phone's page with Capacitor's web plugins standing in for the phone's
      # (playwright.mobile.config.ts). On a device: npm run test:android, by hand.
      - run: npm run test:mobile
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phone-page-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  extension:
    name: Browser extension (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Built, loaded into Chromium as a writer loads it, and driven over the test's own story pages
      # (playwright.extension.config.ts).
      - run: npm run test:extension
      # To try it: unzip, then Load unpacked (chrome://extensions) or Load Temporary Add-on (about:debugging).
      - uses: actions/upload-artifact@v7
        with:
          name: eien-reader-extension
          path: out/extension/
          retention-days: 14
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      # The runner has the Android SDK; Gradle needs a JDK it supports.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: The phone's page, copied into the Android project
        run: npm run android
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      # To try on a phone: Settings → install unknown apps for the browser or Files.
      - uses: actions/upload-artifact@v7
        with:
          name: eien-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # Eien's own Swift file operations (ios/App/App/VaultFileOps.swift), on this Mac's Darwin.
      - run: npm run test:ios-files
      - name: The phone's page, copied into the iOS project
        run: npm run ios
      # Built for the simulator, started on one with a crash's leftovers in its vault: it must
      # recover them (scripts/ios/smoke.sh). No signing, no Apple account.
      - name: Build, run on a simulator, check what it did
        run: bash scripts/ios/smoke.sh out/ios-smoke
      - name: Keep the screen and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-smoke
          path: |
            out/ios-smoke/eien.png
            out/ios-smoke/build.log
            out/ios-smoke/app.log
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: End-to-end (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS's suite ran 16.5 minutes of tests in a 20-minute job by 2026-10-27 (the split,
    # tables, Wide screen) and was cancelled at the limit; the others stay at 20.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 20 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # Electron fetches its binary the first time it's asked for, not on
      # install. Fetch it now: two test workers asking at once unpack it over
      # each other, which fails on Windows.
      - name: Electron's binary
        run: npx install-electron

      # The disk storage's contract on this system's own file system: paths,
      # renames and watching differ between macOS, Windows and Linux.
      - name: Storage tests on this system
        run: npx vitest run src/platform

      - run: npm run build

      # Ubuntu 24.04 stops Chromium's sandbox from creating namespaces. Allow it,
      # rather than turning the sandbox off: the tests check that it's on.
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep-invert @alone
      - name: End-to-end tests
        if: runner.os != 'Linux'
        # bash on Windows too: PowerShell would read "@alone" as a variable.
        shell: bash
        run: npx playwright test --grep-invert @alone
      # Tests that hold the app to a time, or drag with the pointer, run alone (tests/e2e/launch.ts).
      - name: Tests that run alone, one at a time (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --grep @alone --workers=1
      - name: Tests that run alone, one at a time
        if: runner.os != 'Linux'
        shell: bash
        run: npx playwright test --grep @alone --workers=1

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
