# THROWAWAY: measures the long book's search on CI's machines. Never merged.
name: Measure

on:
  push:
    branches: [claude/musing-boyd-f2357b]

jobs:
  measure:
    name: Measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Fixed, role locators
        shell: bash
        env: { BUDGETS: '1', NOTRACE: '1' }
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test tests/e2e/budgets.spec.ts -g "searched while" --workers=1 --retries=0 --repeat-each=3 --output=r-role || true
      - name: Fixed, CSS locators
        shell: bash
        env: { BUDGETS: '1', NOTRACE: '1', LOCATORS: css }
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test tests/e2e/budgets.spec.ts -g "searched while" --workers=1 --retries=0 --repeat-each=3 --output=r-css || true
      - name: Fixed, CSS locators, four times slower
        shell: bash
        env: { SLOW: '4', NOTRACE: '1', LOCATORS: css }
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test tests/e2e/budgets.spec.ts -g "searched while" --workers=1 --retries=0 --output=r-slow || true
      - name: Fixed, traced
        shell: bash
        env: { BUDGETS: '1', LOCATORS: css }
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test tests/e2e/budgets.spec.ts -g "searched while" --workers=1 --retries=0 --output=r-trace || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measure-${{ matrix.os }}
          path: |
            r-*/
          retention-days: 7
