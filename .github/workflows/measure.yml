# THROWAWAY: measures the long book's search on CI's machines. Never merged.
name: Measure

on:
  push:
    branches: [claude/musing-boyd-f2357b]

jobs:
  measure:
    name: Measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx install-electron
      - run: npm run build
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Search, as CI runs it
        shell: bash
        env:
          BUDGETS: '1'
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test tests/e2e/budgets.spec.ts -g "searched while" --workers=1 --repeat-each=2 --retries=0 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measure-${{ matrix.os }}
          path: |
            test-results/
            test-results-slow/
          retention-days: 7
