name: Release

# A version tag (v0.1.0) builds the installers and portable copies, each on its
# own system, tries each app as a writer gets it (tests/packaged), and attaches
# them to a draft GitHub Release, to look over and publish by hand. Run by hand,
# it builds and tries them with no release, keeping them as the run's
# artifacts. Never on a pull request: no change waits on it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            downloads: |
              dist/*.dmg
              dist/portable/*.zip
          - os: windows-latest
            downloads: |
              dist/*.exe
              dist/portable/*.exe
          # The AppImage is Linux's installer and portable copy at once.
          - os: ubuntu-latest
            downloads: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: The tag is package.json's version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json's version is $version."
            exit 1
          fi
      # Before anything is built: the release's notes come from its section (the draft job).
      - name: CHANGELOG.md has the version's section
        if: github.ref_type == 'tag'
        run: node scripts/changelog.mjs --notes "${GITHUB_REF_NAME#v}" > /dev/null

      - run: npm ci
      # The test of a new build's storage also starts the development build.
      - name: Electron's binary
        run: npx install-electron
      - run: npm run build

      - name: Installer and portable copy
        env:
          # Signing and notarizing, once these secrets exist (AGENTS.md → Releases).
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # A secret that isn't set arrives as an empty string, which
          # electron-builder would take for a certificate: leave those out.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -n "${!name}" ] || unset "$name"
          done
          node scripts/package.mjs

      # The app as a writer gets it: from the .dmg, as the setup installs it, or
      # unpacked as the AppImage holds it (the tests' default); the portable
      # copy unzipped where it will live (macOS), or unpacked (Windows).
      - name: The app in the .dmg, and the portable copy unzipped (macOS)
        if: runner.os == 'macOS'
        run: |
          mount="$RUNNER_TEMP/eien-dmg"
          carried="$RUNNER_TEMP/carried"
          hdiutil attach dist/*.dmg -nobrowse -readonly -mountpoint "$mount"
          ditto -x -k dist/portable/*.zip "$carried"
          # A broken signature makes macOS call the download damaged, with no way to open it.
          codesign --verify --deep --strict "$mount/Eien.app"
          codesign --verify --deep --strict "$carried/Eien.app"
          echo "EIEN_APP=$mount/Eien.app/Contents/MacOS/Eien" >> "$GITHUB_ENV"
          echo "EIEN_PORTABLE_APP=$carried/Eien.app/Contents/MacOS/Eien" >> "$GITHUB_ENV"
      - name: The app the setup installs, for this user only (Windows)
        if: runner.os == 'Windows'
        # PowerShell: Git's bash would turn the setup's /S into a path.
        shell: pwsh
        run: |
          $setup = Get-Item dist/*-windows-setup.exe
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Join-Path $env:LOCALAPPDATA 'Programs\eien\Eien.exe'
          if (-not (Test-Path $app)) { throw "The setup didn't install Eien at $app." }
          "EIEN_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: The portable .exe keeps its data beside itself (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Its launcher runs Eien from a temp copy, so only the real .exe shows where the data goes.
        run: |
          $carried = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP 'carried')
          $exe = Copy-Item (Get-Item dist/portable/*-windows-portable.exe) $carried -PassThru
          Start-Process -FilePath $exe.FullName
          $data = Join-Path $carried 'Eien Data'
          $kept = { @(Get-ChildItem $data -ErrorAction SilentlyContinue).Count -gt 0 }
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (& $kept) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          Get-Process Eien -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (& $kept)) { throw "The portable Eien kept nothing in $data." }

      # Ubuntu 24.04 stops Chromium's sandbox from creating namespaces (as in ci.yml).
      - name: Allow Chromium's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # These machines are thrown away, so the tests may use their own folders (settings-home.spec.ts).
      - name: Try the app (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          EIEN_REAL_FOLDERS: '1'
        run: xvfb-run --auto-servernum npm run test:packaged
      - name: Try the app
        if: runner.os != 'Linux'
        env:
          EIEN_REAL_FOLDERS: '1'
        run: npm run test:packaged

      - uses: actions/upload-artifact@v7
        with:
          name: downloads-${{ runner.os }}
          path: ${{ matrix.downloads }}
          if-no-files-found: error
          retention-days: 14
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-report-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          pattern: downloads-*
          path: downloads
          merge-multiple: true
      - name: A draft release with the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's section of CHANGELOG.md, under how to open an unsigned app.
        # The portable copies arrive in downloads/portable/: every file, wherever it is.
        run: |
          {
            echo "Not signed yet: macOS and Windows ask before the first start. [How to install](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#install)"
            echo
            node scripts/changelog.mjs --notes "${GITHUB_REF_NAME#v}"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" $(find downloads -type f) \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Eien ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
