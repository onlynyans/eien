<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Tables in Live: 1 · Handles</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/* Shared by every exploration (inlined into each page by _build.py).
   The tokens are the approved ones from ../tokens.css (Washi, day and night),
   plus what the design pass adds: a radius scale, icon sizes, the machine
   face as a setting, and row weights. New tokens are marked NEW. */

:root { color-scheme: light dark; }
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

:root {
  --eien-desk: light-dark(#d9d2c8, #110e0b);
  --eien-blotter: light-dark(#eae5dd, #1a1713);
  --eien-band: light-dark(#f4f1ea, #201d19);
  --eien-paper: light-dark(#fdfbf7, #28241f);
  --eien-paper-raised: light-dark(#ffffff, #312d28);
  --eien-well: light-dark(#f9f7f3, #24201c);
  --eien-hover: light-dark(rgb(35 32 28 / 0.045), rgb(233 226 212 / 0.05));
  --eien-press: light-dark(rgb(35 32 28 / 0.1), rgb(233 226 212 / 0.1));
  --eien-selected: light-dark(#ede9e3, #38332e);
  --eien-scrim: light-dark(rgb(35 32 28 / 0.22), rgb(0 0 0 / 0.5));
  --eien-shadow-sheet: 0 1px 2px light-dark(rgb(58 44 26 / 0.06), rgb(0 0 0 / 0.4)),
    0 6px 24px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45));
  --eien-shadow-float: 0 2px 6px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45)),
    0 14px 36px light-dark(rgb(58 44 26 / 0.16), rgb(0 0 0 / 0.6));
  --eien-ink: light-dark(#23201c, #e9e2d4);
  --eien-ink-soft: light-dark(#51473c, #c3b9a7);
  --eien-pencil: light-dark(#5d5348, #a7a095);
  --eien-faded: light-dark(#766d62, #837c73);
  --eien-rule-soft: light-dark(rgb(35 32 28 / 0.07), rgb(233 226 212 / 0.07));
  --eien-rule: light-dark(rgb(35 32 28 / 0.13), rgb(233 226 212 / 0.14));
  --eien-rule-strong: light-dark(rgb(35 32 28 / 0.26), rgb(233 226 212 / 0.26));
  --eien-hairline: 1px;
  --eien-mark-w: 2px;
  --eien-seal: light-dark(#c4472d, #e0603f);
  --eien-seal-wash: light-dark(rgb(196 71 45 / 0.08), rgb(224 96 63 / 0.12));
  --eien-on-seal: light-dark(#fbf8f2, #1a1714);
  --eien-focus: var(--eien-ink-soft);
  --eien-added: light-dark(#485c2c, #9cb880);
  --eien-added-wash: light-dark(rgb(79 107 58 / 0.13), rgb(156 184 128 / 0.14));
  --eien-removed: light-dark(#93304a, #e98aa0);
  --eien-caution: light-dark(#6b501f, #d0a659);
  --eien-caution-wash: light-dark(rgb(138 100 32 / 0.11), rgb(208 166 89 / 0.12));

  /* The machine voice: IBM Plex Mono by default, now a setting (NEW: set from FACES). */
  --eien-face-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --eien-face-seal: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --eien-size-meta: 11px;
  --eien-size-label: 10px;
  --eien-leading-row: 1.35;
  --eien-track-label: 0.12em;
  --eien-space-1: 4px; --eien-space-2: 8px; --eien-space-3: 12px; --eien-space-4: 16px;
  --eien-space-5: 24px; --eien-space-6: 32px; --eien-space-7: 48px; --eien-space-8: 72px;
  --eien-row-h: 30px;
  --eien-touch: 44px;
  --eien-seal-size: 22px;
  --eien-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --eien-quick: 120ms;
  --eien-calm: 220ms;
  --eien-leading-tighten: 0;
  --eien-sheet-pad-x: var(--eien-space-8);
  --eien-sheet-pad-top: var(--eien-space-7);
  --eien-page-gutter: var(--eien-space-5);
  --eien-title-gap: var(--eien-space-6);
  --eien-paragraph-gap: var(--eien-space-4);
  --eien-row-pad-y: var(--eien-space-3);

  /* NEW: corners. Not everything is square. A small scale: s for what you press
     (buttons, fields, chips), m for what floats (menus, popovers, the tool slip),
     l for what covers the window (a sheet over it, the phone's bottom sheet).
     Paper itself (the sheet, the panes) stays square. Each exploration sets its own. */
  --eien-radius-s: 3px;
  --eien-radius-m: 6px;
  --eien-radius-l: 10px;
  --eien-radius-dot: 999px;

  /* NEW: icons. Drawn on a 16-unit grid, stroked in the ink they sit in. */
  --eien-icon: 16px;
  --eien-icon-stroke: 1.25;
  --eien-control: 28px; /* an icon control's square, desktop */

  /* NEW: row names' weight, two settings (400–700). A selected list title is 100 heavier. */
  --eien-weight-tree: 400;
  --eien-weight-list: 400;
}

/* The text voice: the writer's choice, sizes tuned per face (from ../tokens.css). */
:root, [data-face='newsreader'] { --eien-face-text: 'Newsreader', 'Iowan Old Style', Georgia, serif; --eien-size-prose: 22px; --eien-size-title: 36px; --eien-size-heading: 23px; --eien-size-row: 16px; --eien-size-preview: 14px; --eien-leading-prose: calc(1.5 - var(--eien-leading-tighten)); --eien-measure: 29em; }
[data-face='literata'] { --eien-face-text: 'Literata', Georgia, serif; --eien-size-prose: 19px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.72 - var(--eien-leading-tighten)); --eien-measure: 34em; }
[data-face='plex-sans'] { --eien-face-text: 'IBM Plex Sans', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.76 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='source-sans'] { --eien-face-text: 'Source Sans 3', Arial, sans-serif; --eien-size-prose: 20px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 31em; }
[data-face='atkinson'] { --eien-face-text: 'Atkinson Hyperlegible Next', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='schibsted'] { --eien-face-text: 'Schibsted Grotesk', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 33em; }
[data-face='hanken'] { --eien-face-text: 'Hanken Grotesk', Arial, sans-serif; --eien-size-prose: 19px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='instrument'] { --eien-face-text: 'Instrument Sans', Arial, sans-serif; --eien-size-prose: 18.5px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.7 - var(--eien-leading-tighten)); --eien-measure: 31em; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--eien-blotter);
  color: var(--eien-ink);
  font-family: var(--eien-face-text);
  font-size: var(--eien-size-row);
  line-height: var(--eien-leading-row);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--eien-seal-wash); }
:focus-visible { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 2px; }

.seal {
  display: inline-grid; place-items: center; flex: none;
  width: var(--eien-seal-size); height: var(--eien-seal-size);
  background: var(--eien-seal); color: var(--eien-on-seal);
  font-family: var(--eien-face-seal); font-size: calc(var(--eien-seal-size) * 0.68); line-height: 1;
  border-radius: calc(var(--eien-radius-s) / 2);
  user-select: none;
}
.seal--small { --eien-seal-size: 10px; font-size: 0; }

.label {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil);
}
.count {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  font-variant-numeric: tabular-nums; color: var(--eien-pencil);
}

/* Where a word stays (menus, choices of a setting). */
.word-button {
  appearance: none; border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; padding: var(--eien-space-1) var(--eien-space-2);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft);
  cursor: pointer;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.word-button[aria-pressed='true'], .word-button[aria-checked='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* NEW: the icon control. The word button's states, a square of --eien-control. */
.icon-button {
  appearance: none; display: inline-grid; place-items: center; flex: none;
  width: var(--eien-control); height: var(--eien-control); padding: 0;
  border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; color: var(--eien-ink-soft); cursor: pointer; position: relative;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.icon-button svg, .icon { width: var(--eien-icon); height: var(--eien-icon); display: block; }
.icon { stroke-width: var(--eien-icon-stroke); }
.icon-button[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }
.icon-button:disabled { color: var(--eien-faded); cursor: default; }
@media (hover: hover) {
  .word-button:hover, .icon-button:not(:disabled):hover { color: var(--eien-ink); background: var(--eien-hover); }
}
.word-button:active, .icon-button:not(:disabled):active { background: var(--eien-press); border-color: var(--eien-rule-strong); }

/* NEW: a tooltip names an icon and its key: raised paper, the machine voice. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none;
  left: 50%; top: calc(100% + 6px); translate: -50% 0;
  white-space: pre; padding: 3px 7px; border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em;
  text-transform: none; color: var(--eien-ink-soft);
  opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
}
[data-tip-side='up']::after { top: auto; bottom: calc(100% + 6px); }
[data-tip-side='right']::after { left: calc(100% + 6px); top: 50%; translate: 0 -50%; }
[data-tip-side='left']::after { left: auto; right: calc(100% + 6px); top: 50%; translate: 0 -50%; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: 450ms; } }
[data-tip]:focus-visible::after { opacity: 1; }

.field {
  appearance: none; width: 100%; border: var(--eien-hairline) solid var(--eien-rule);
  border-radius: var(--eien-radius-s); background: var(--eien-well);
  padding: var(--eien-space-2) var(--eien-space-3);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink);
}
.field::placeholder { color: var(--eien-faded); }
.field:focus { outline: none; border-color: var(--eien-focus); }

/* Explorations' own bar: outside the app, like the mockups' bar. */
.xbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--eien-space-1) var(--eien-space-4);
  padding: var(--eien-space-2) var(--eien-space-4);
  background: var(--eien-paper-raised); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.xbar__name { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink); font-weight: 600; }
.xbar__group { display: flex; align-items: center; gap: 2px; }
.xbar__label { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); margin-right: var(--eien-space-1); }
.xnote { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }

/* Shared by the three table explorations (table-*.html): the page, the table
   at rest and while it's edited, the file beside it, the colophon. Each page
   adds only its own controls. */

/* Each layout's corners, as src/ui/chrome/*.css sets them on :root[data-layout]:
   A · Band 2/4/8, B · Slip 4/8/14, C · Running head 3/6/10. */
:root[data-layout='band'] { --eien-radius-s: 2px; --eien-radius-m: 4px; --eien-radius-l: 8px; }
:root[data-layout='slip'] { --eien-radius-s: 4px; --eien-radius-m: 8px; --eien-radius-l: 14px; }
:root[data-layout='runhead'] { --eien-radius-s: 3px; --eien-radius-m: 6px; --eien-radius-l: 10px; }
a.word-button { text-decoration: none; }
.word-button[aria-current='page'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }


body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); background: var(--eien-blotter); }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 40%); } }

/* The page pane: the sheet on the blotter, the colophon at its foot. */
.pane { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) var(--status-h, 40px); position: relative; }
.page { min-height: 0; overflow: auto; padding: var(--eien-space-5); }
.sheet {
  width: min(100%, 860px); margin: 0 auto; min-height: 100%;
  padding: var(--eien-space-7) var(--eien-space-8) var(--eien-space-8);
  background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule); box-shadow: var(--eien-shadow-sheet);
  font-size: var(--eien-size-prose); position: relative;
}
:root[data-layout='slip'] .sheet { border-radius: calc(var(--eien-radius-s) - var(--eien-hairline)); }
.title { font-size: var(--eien-size-title); font-weight: 500; line-height: 1.2; margin: var(--eien-space-5) 0 var(--eien-space-6); }
.prose { line-height: var(--eien-leading-prose); margin: 0 0 var(--eien-space-4); }
.prose:focus { outline: none; }
.colophon {
  display: flex; align-items: center; gap: var(--eien-space-2); padding: 0 var(--eien-space-4);
  background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--eien-pencil); white-space: nowrap; overflow: hidden;
}
.colophon .dot { color: var(--eien-faded); }
.colophon__said { margin-left: auto; color: var(--eien-ink-soft); overflow: hidden; text-overflow: ellipsis; }

/* The table at rest: a book's table, rules across and none down. */
.tbl-wrap { position: relative; margin: var(--eien-space-6) 0; }
.tbl-scroll { overflow-x: auto; }
.tbl {
  border-collapse: collapse; width: 100%;
  font-size: calc(var(--eien-size-prose) * 0.8); line-height: 1.4;
  border-top: var(--eien-hairline) solid var(--eien-rule-strong); border-bottom: var(--eien-hairline) solid var(--eien-rule-strong);
}
.tbl th, .tbl td { padding: 0; vertical-align: top; border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); text-align: left; }
.tbl th { font-weight: 500; border-bottom-color: var(--eien-rule); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl :is(th, td) + :is(th, td) { border-left: var(--eien-hairline) solid transparent; transition: border-color var(--eien-calm) var(--eien-ease); }
/* While it's edited, the grid shows: where one cell ends and the next begins. */
.tbl-wrap.is-in .tbl :is(th, td) + :is(th, td) { border-left-color: var(--eien-rule-soft); }
.tbl [data-align='right'] { text-align: right; font-variant-numeric: tabular-nums; }
.tbl [data-align='center'] { text-align: center; }
.cell {
  min-height: 1.4em; padding: var(--eien-space-2) var(--eien-space-3);
  white-space: pre-wrap; overflow-wrap: break-word; caret-color: var(--eien-seal); outline: none;
  border-radius: var(--eien-radius-s);
}
.cell:focus { box-shadow: inset 0 0 0 var(--eien-hairline) var(--eien-rule-strong); }
.cell:empty::before { content: '\200b'; }
/* A row or column a control points at: the selected fill, as a chosen row has. */
.tbl .is-aimed { background: var(--eien-selected); }
.tbl .is-dragged { background: var(--eien-paper-raised); }
.tbl-layer { position: absolute; inset: 0; pointer-events: none; }
.tbl-layer > * { pointer-events: auto; }

/* The file, beside the page: what Eien writes, line by line. */
.file { min-height: 0; display: grid; grid-template-rows: var(--band, 56px) minmax(0, 1fr) auto; background: var(--eien-desk); border-left: var(--eien-hairline) solid var(--eien-rule); }
@media (max-width: 900px) { .file { border-left: 0; border-top: var(--eien-hairline) solid var(--eien-rule); } }
.file__head { display: flex; align-items: center; gap: var(--eien-space-3); padding: 0 var(--eien-space-4); border-bottom: var(--eien-hairline) solid var(--eien-rule); background: var(--eien-band); }
.file__head .count { margin-left: auto; }
.file__src {
  margin: 0; padding: var(--eien-space-3) var(--eien-space-2); overflow: auto; background: var(--eien-paper);
  font-family: var(--eien-face-mono); font-size: 12px; line-height: 1.75; color: var(--eien-ink-soft);
}
.ln { display: block; white-space: pre; padding: 0 var(--eien-space-2); border-radius: var(--eien-radius-s); min-height: 1.75em; }
.ln.is-table { color: var(--eien-ink); }
.ln.is-here { background: var(--eien-selected); }
.ln.is-changed { animation: changed 1.6s var(--eien-ease); }
@keyframes changed { from { background: var(--eien-added-wash); } }
@media (prefers-reduced-motion: reduce) { .ln.is-changed { animation: none; } * { transition: none !important; } }
.file__notes { border-top: var(--eien-hairline) solid var(--eien-rule); padding: var(--eien-space-3) var(--eien-space-4) var(--eien-space-4); max-height: 46vh; overflow: auto; font-size: var(--eien-size-preview); line-height: 1.55; color: var(--eien-ink-soft); }
.file__notes h2 { margin: var(--eien-space-3) 0 var(--eien-space-1); font: inherit; font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); font-weight: 400; }
.file__notes h2:first-child { margin-top: 0; }
.file__notes ul { margin: 0; padding-left: 1.1em; }
.file__notes p { margin: 0; }
kbd { font-family: var(--eien-face-mono); font-size: 11px; padding: 0 4px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-paper); white-space: nowrap; }

/* A phone: the page in a phone's width, no margins to spare, nothing hovers. */
:root[data-device='phone'] .page { padding: var(--eien-space-4) 0; }
:root[data-device='phone'] .pane { width: 390px; max-width: 100%; justify-self: center; border-left: var(--eien-hairline) solid var(--eien-rule-strong); border-right: var(--eien-hairline) solid var(--eien-rule-strong); background: var(--eien-paper); }
:root[data-device='phone'] .sheet { border: 0; box-shadow: none; border-radius: 0; padding: var(--eien-space-4) var(--eien-space-4) var(--eien-space-8); }
:root[data-device='phone'] .title { font-size: calc(var(--eien-size-title) * 0.8); }
:root[data-device='phone'] .tbl { width: max-content; min-width: 100%; }

/* 1 and 3 put controls on the table's edges: the margins round it count as the
   table, so the pointer can reach them. With no hover (a phone), the table steps
   in from the narrow margin while it's edited, to make room for the row's. */
.tbl-wrap.has-edges { isolation: isolate; transition: margin var(--eien-calm) var(--eien-ease); }
.tbl-wrap.has-edges::before { content: ''; position: absolute; inset: -40px -24px -16px -44px; z-index: -1; }
.is-touch .tbl-wrap.has-edges.is-in { margin-left: 40px; }

/* The + on a line between rows or columns (1 shows a faint dot there till the pointer comes). */
.ins { position: absolute; translate: -50% -50%; appearance: none; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--eien-ink-soft); cursor: pointer; }
.ins--col { width: 16px; height: 24px; }
.ins--row { width: 24px; height: 16px; }
.ins__dot, .ins__plus { grid-area: 1 / 1; transition: opacity var(--eien-quick) var(--eien-ease); }
.ins__dot { width: 4px; height: 4px; border-radius: var(--eien-radius-dot); background: var(--eien-faded); opacity: 0; }
.ins__plus {
  display: grid; place-items: center; width: 18px; height: 18px; opacity: 0;
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-s);
}
.ins__plus svg { width: 12px; height: 12px; }
.ins:is(:hover, :focus-visible, .is-near) .ins__plus { opacity: 1; }
.ins:focus-visible { outline: none; }
.ins:focus-visible .ins__plus { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 1px; }
/* Where it goes: the drop line of your order, 2px ink-soft, across or down the table. */
.ins__line { position: absolute; pointer-events: none; background: var(--eien-ink-soft); border-radius: var(--eien-radius-dot); opacity: 0; }
.ins--col .ins__line { top: calc(100% + 6px); left: calc(50% - 1px); width: var(--eien-mark-w); height: var(--tbl-h); }
.ins--row .ins__line { left: calc(100% + 6px); top: calc(50% - 1px); height: var(--eien-mark-w); width: var(--tbl-w); }
.ins:is(:hover, :focus-visible) .ins__line { opacity: 1; }
.ins[hidden] { display: none; }


/* 1 · Handles: the table's own edges carry its controls. A tab over each
   column and beside each row, a + on each line between them. Quiet until the
   pointer is over the table or the caret is in it. */
.tab { position: absolute; translate: -50% -50%; }

/* The + on each line: a faint dot until the pointer is over it. */
.tbl-wrap:hover .ins__dot, .tbl-wrap.is-in .ins__dot { opacity: 1; }
.ins:is(:hover, :focus-visible, .is-near) .ins__dot { opacity: 0; }

/* The tabs: a small band with a hairline, as a pane's tab is; nothing floats. */
.tab {
  display: flex; padding: 1px; opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
  background: var(--eien-band); border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s);
}
.tab--row { flex-direction: column; }
.tab:is(.is-shown, :hover, :focus-within) { opacity: 1; }
.tab .icon-button { width: 22px; height: 22px; }
.tab .icon-button svg { width: 14px; height: 14px; }
@media (hover: hover) { .tab .tab__off:hover { color: var(--eien-removed); } }
.tab[hidden] { display: none; }

/* No hover: the caret's row and column keep their handles, at a finger's size. */
.is-touch .ins::after, .is-touch .tab .icon-button::after { content: ''; position: absolute; inset: -10px; }
.is-touch .tab .icon-button { width: 30px; height: 30px; }
.is-touch .ins__plus { width: 24px; height: 24px; }
.is-touch .tbl-wrap:not(.is-in) .ins__dot { opacity: 0; }
</style>

/** An icon as SVG markup, stroked in currentColor. */
function icon(name, label) {
  const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
  return `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICONS[name]}</svg>`;
}

/** Fill every [data-icon] with its icon. */
function drawIcons(root = document) {
  for (const el of root.querySelectorAll('[data-icon]')) {
    el.innerHTML = icon(el.dataset.icon) + (el.dataset.iconText ?? '');
  }
}

// One list of faces drives every face setting: the text face and the machine
// voice both choose from it. A face added later is one more entry here (in the
// app: one entry in core/config, its fonts and its tuning in tokens.css).
const FACES = [
  { id: 'plex-mono', name: 'IBM Plex Mono', family: "'IBM Plex Mono', ui-monospace, monospace", mono: true },
  { id: 'newsreader', name: 'Newsreader', family: "'Newsreader', Georgia, serif" },
  { id: 'literata', name: 'Literata', family: "'Literata', Georgia, serif" },
  { id: 'plex-sans', name: 'IBM Plex Sans', family: "'IBM Plex Sans', Arial, sans-serif" },
  { id: 'source-sans', name: 'Source Sans 3', family: "'Source Sans 3', Arial, sans-serif" },
  { id: 'atkinson', name: 'Atkinson Hyperlegible Next', family: "'Atkinson Hyperlegible Next', Arial, sans-serif" },
  { id: 'schibsted', name: 'Schibsted Grotesk', family: "'Schibsted Grotesk', Arial, sans-serif" },
  { id: 'hanken', name: 'Hanken Grotesk', family: "'Hanken Grotesk', Arial, sans-serif" },
  { id: 'instrument', name: 'Instrument Sans', family: "'Instrument Sans', Arial, sans-serif" },
];
/** The faces the text voice offers (all but the mono), and the machine voice (all). */
const TEXT_FACES = FACES.filter((face) => !face.mono);
const MACHINE_FACES = FACES;

function setMachineFace(id) {
  const face = FACES.find((each) => each.id === id) ?? FACES[0];
  document.documentElement.style.setProperty('--eien-face-mono', face.family);
}
function setTextFace(id) {
  if (id === 'newsreader') delete document.documentElement.dataset.face;
  else document.documentElement.dataset.face = id;
}

/** The explorations' bar: [data-x-set="attr"] groups set data-<attr> on <html>. */
function wireBar(onChange = () => {}) {
  for (const group of document.querySelectorAll('[data-x-set]')) {
    const attr = group.dataset.xSet;
    const buttons = [...group.querySelectorAll('button[data-value]')];
    const pick = (value) => {
      document.documentElement.dataset[attr] = value;
      for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.value === value));
      onChange(attr, value);
    };
    for (const b of buttons) b.addEventListener('click', () => pick(b.dataset.value));
    pick(document.documentElement.dataset[attr] ?? buttons[0].dataset.value);
  }
}

// Themes: [day, night] for each colour token. The rules are the ink at low
// strength, so they follow it. Washi is tokens.css's own; the rest are new.
const THEME_TOKENS = ['desk', 'blotter', 'band', 'paper', 'selected', 'ink', 'ink-soft', 'pencil', 'faded', 'seal'];
const THEMES = {
  washi: { name: 'Washi', kanji: '和紙', note: 'Eien’s own: paper and sumi ink', t: {
    desk: ['#d9d2c8', '#110e0b'], blotter: ['#eae5dd', '#1a1713'], band: ['#f4f1ea', '#201d19'], paper: ['#fdfbf7', '#28241f'], selected: ['#ede9e3', '#38332e'],
    ink: ['#23201c', '#e9e2d4'], 'ink-soft': ['#51473c', '#c3b9a7'], pencil: ['#5d5348', '#a7a095'], faded: ['#766d62', '#837c73'], seal: ['#c4472d', '#e0603f'] } },
  kinari: { name: 'Kinari', kanji: '生成り', note: 'Unbleached cloth: yellower paper, a persimmon seal', t: {
    desk: ['#d8cfb8', '#14110a'], blotter: ['#e9e2cd', '#1c180f'], band: ['#f3eedd', '#231e14'], paper: ['#fcf9ee', '#2b251a'], selected: ['#ece5d1', '#3b3426'],
    ink: ['#2a2418', '#ece3cc'], 'ink-soft': ['#574a33', '#c8bb9c'], pencil: ['#5f523d', '#ab9f86'], faded: ['#7b6d56', '#88806d'], seal: ['#b8432a', '#dc6a43'] } },
  aizome: { name: 'Aizome', kanji: '藍染', note: 'Indigo dye: cool paper, blue-black ink', t: {
    desk: ['#c9cfd8', '#0b0e14'], blotter: ['#dfe3e9', '#121620'], band: ['#edf0f4', '#181d28'], paper: ['#fbfcfd', '#1f2533'], selected: ['#e3e8ef', '#2e3648'],
    ink: ['#17213a', '#dde4f0'], 'ink-soft': ['#34405c', '#b3bfd6'], pencil: ['#3f4b64', '#97a3ba'], faded: ['#5f6a80', '#7a8599'], seal: ['#c4472d', '#e3664a'] } },
  koke: { name: 'Koke', kanji: '苔', note: 'A moss garden: green-grey desk, quiet ink', t: {
    desk: ['#cdd2c4', '#0d100b'], blotter: ['#e1e5d9', '#141811'], band: ['#eef0e8', '#1a1f16'], paper: ['#fafbf6', '#21271c'], selected: ['#e5e9dc', '#30382a'],
    ink: ['#1f2619', '#e2e8d6'], 'ink-soft': ['#3e4833', '#bcc6ab'], pencil: ['#48523c', '#a0aa90'], faded: ['#67705a', '#808a72'], seal: ['#a8432f', '#d76a4e'] } },
  rosoku: { name: 'Rōsoku', kanji: '蝋燭', note: 'Candlelight: amber at night, no blue light', t: {
    desk: ['#dccab2', '#120c06'], blotter: ['#ecdfcb', '#1b130b'], band: ['#f5ece0', '#22180e'], paper: ['#fdf8f0', '#2a1f13'], selected: ['#efe3d1', '#3c2d1e'],
    ink: ['#2b1d10', '#f0dcc0'], 'ink-soft': ['#5a4129', '#d2b894'], pencil: ['#634d37', '#b39b7c'], faded: ['#7f6a53', '#8f7c64'], seal: ['#b9442b', '#e8763f'] } },
  sumi: { name: 'Sumi', kanji: '墨', note: 'For tired eyes: the most contrast there is', t: {
    desk: ['#cfcfcc', '#000000'], blotter: ['#e6e6e3', '#0a0a0a'], band: ['#f2f2ef', '#141414'], paper: ['#ffffff', '#1b1b1b'], selected: ['#e8e8e4', '#2c2c2c'],
    ink: ['#000000', '#f5f5f2'], 'ink-soft': ['#262626', '#d9d9d4'], pencil: ['#3a3a3a', '#bdbdb8'], faded: ['#5e5e5e', '#8f8f8a'], seal: ['#c4361d', '#ff6a45'] } },
  sakura: { name: 'Sakura-nezumi', kanji: '桜鼠', note: 'Cherry-grey: plum ink, a rose seal', t: {
    desk: ['#d8cdcc', '#120d0e'], blotter: ['#e9e1e0', '#1b1415'], band: ['#f3eeed', '#221a1b'], paper: ['#fdfafa', '#2a2122'], selected: ['#eee6e5', '#3a2f30'],
    ink: ['#2a1e20', '#efe1e2'], 'ink-soft': ['#573f43', '#cbb5b8'], pencil: ['#5f464a', '#ad989b'], faded: ['#7c6468', '#8d7b7d'], seal: ['#b2394a', '#e0697a'] } },
};
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function luminance(h) {
  return hexRgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; })
    .reduce((sum, v, i) => sum + v * [0.2126, 0.7152, 0.0722][i], 0);
}
const contrast = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const hsl = (h, s, l) => { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return '#' + [f(0), f(8), f(4)].map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); };
/**
 * An ink of hue `h` and saturation `sat`, starting at lightness `l` and stepped
 * darker by day (`dir` -1) or lighter by night (+1) until it reaches `min`
 * contrast on every one of `grounds`: the hue stays, the contrast holds.
 */
function fitInk(h, sat, l, grounds, min, dir) {
  let ink = hsl(h, sat, l);
  while (grounds.some((g) => contrast(ink, g) < min + 0.1) && l > 0 && l < 100) { l += dir; ink = hsl(h, sat, l); }
  return ink;
}
/** "Custom": four choices, and every token worked out from them, day and night. */
function mixTheme({ paper: ph, warmth: w, ink: ih, seal: sh }, name = 'My Room') {
  const surf = (dl, nl) => [hsl(ph, w, dl), hsl(ph, Math.min(w, 22), nl)];
  const t = { desk: surf(83, 5), blotter: surf(89, 8), band: surf(94, 11), paper: surf(98.5, 14), selected: surf(91, 19), seal: [hsl(sh, 63, 47), hsl(sh, 72, 56)] };
  const grounds = (s) => ['desk', 'band', 'paper', 'selected'].map((k) => t[k][s]);
  // The inks carry their hue, saturated enough to see by day, each as light as Eien's contrast allows.
  const ink = (sat, dl, nsat, nl, min) => [fitInk(ih, sat, dl, grounds(0), min, -1), fitInk(ih, nsat, nl, grounds(1), min, 1)];
  Object.assign(t, { ink: ink(48, 16, 38, 88, 7), 'ink-soft': ink(38, 30, 30, 70, 4.5), pencil: ink(30, 34, 20, 62, 4.5), faded: ink(20, 46, 12, 52, 3) });
  return { name, kanji: '', note: 'Your own', t };
}
/** A theme on the whole page: each token as light-dark(day, night); the rules from the ink. */
function applyTheme(theme, el = document.documentElement) {
  for (const k of THEME_TOKENS) el.style.setProperty(`--eien-${k}`, `light-dark(${theme.t[k][0]}, ${theme.t[k][1]})`);
  const [d, n] = theme.t.ink.map((c) => hexRgb(c).join(' '));
  el.style.setProperty('--eien-rule-soft', `light-dark(rgb(${d} / 0.07), rgb(${n} / 0.07))`);
  el.style.setProperty('--eien-rule', `light-dark(rgb(${d} / 0.13), rgb(${n} / 0.14))`);
  el.style.setProperty('--eien-rule-strong', `light-dark(rgb(${d} / 0.26), rgb(${n} / 0.26))`);
  el.style.setProperty('--eien-paper-raised', `light-dark(color-mix(in srgb, ${theme.t.paper[0]} 45%, #fff), color-mix(in srgb, ${theme.t.paper[1]} 88%, #fff))`);

// The table, as the file holds it. Row 0 is the head row, which GFM always has.

const cols = () => T.head.length;

/** The table's lines in the file: tidy pads each column to its widest cell, compact doesn't. */
function tableLines(tidy) {
  const all = [T.head, ...T.rows].map((row) => row.map((s) => s.replace(/\|/g, '\\|')));
  const width = T.head.map((_, c) => (tidy ? Math.max(3, ...all.map((row) => [...row[c]].length)) : 3));
  const pad = (s, c) => {
    if (!tidy) return s;
    const n = width[c] - [...s].length;
    if (T.align[c] === 'right') return ' '.repeat(n) + s;
    if (T.align[c] === 'center') return ' '.repeat(n >> 1) + s + ' '.repeat(n - (n >> 1));
    return s + ' '.repeat(n);
  };
  const line = (row) => `| ${row.map(pad).join(' | ')} |`;
  const rule = (c) => {
    const a = T.align[c];
    const dashes = '-'.repeat(width[c] - (a === 'center' ? 2 : a === 'right' ? 1 : 0));
    return a === 'center' ? `:${dashes}:` : a === 'right' ? `${dashes}:` : dashes;
  };
  return [line(all[0]), `| ${T.head.map((_, c) => rule(c)).join(' | ')} |`, ...all.slice(1).map(line)];

/** Touch: a phone shown here, or a pointer that can't hover. Nothing waits for a hover then. */
function setTouch() {

}
const isTouch = () => document.documentElement.classList.contains('is-touch');

const PLAIN = (() => { const d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; } catch { return false; } })();
function drawTable() {
  const cell = (text, r, c) => `<div class="cell" contenteditable="${PLAIN ? 'plaintext-only' : 'true'}" spellcheck="true" role="textbox" aria-label="${escHtml(r === 0 ? `Heading of column ${c + 1}` : `${colName(c)}, row ${r}`)}" data-r="${r}" data-c="${c}">${escHtml(text)}</div>`;
  table.innerHTML = `<thead><tr data-r="0">${T.head.map((t, c) => `<th scope="col" data-c="${c}" data-align="${T.align[c]}">${cell(t, 0, c)}</th>`).join('')}</tr></thead>
    <tbody>${T.rows.map((row, i) => `<tr data-r="${i + 1}">${row.map((t, c) => `<td data-c="${c}" data-align="${T.align[c]}">${cell(t, i + 1, c)}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
const cellAt = (r, c) => table.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
const posOf = (el) => ({ r: +el.dataset.r, c: +el.dataset.c });

/** Puts the caret in a cell: at its 'start', its 'end', or round 'all' its words. */
function focusCell(r, c, at = 'end') {
  const el = cellAt(r, c);
  if (!el) return;
  el.focus({ preventScroll: false });
  const range = document.createRange();

}
/** Whether the caret is at a cell's start or end, with nothing selected. */

  else rest.setStart(caret.endContainer, caret.endOffset);

// Undo: each change keeps the table as it was, so ⌘Z puts back what a removal took.
const past = [];
const future = [];
const snapshot = () => JSON.stringify({ T, here });
function restore(json) {
  const s = JSON.parse(json);

}
function undo() {

  future.push(snapshot());
  restore(past.pop());
  say('Undone');
}
function redo() {
  if (!future.length) return say('Nothing to redo');
  past.push(snapshot());
  restore(future.pop());
  say('Redone');
}
/** A change to the table's shape: `fn` makes it and says where the caret goes, or false. */
function change(words, fn) {
  const before = snapshot();
  const to = fn();
  if (to === false) return false;
  past.push(before);
  future.length = 0;
  lastTyped = {};

  say(words);

}
const hasWords = (cells) => cells.some((s) => s.trim());
const back = () => ` · ${KEY('Mod-Z')} puts it back`;
const ops = {
  /** A new row at body index `at` (0 is first under the head). */
  insertRow(at, c = here.c) {
    return change('Row added', () => { T.rows.splice(at, 0, T.head.map(() => '')); return { r: at + 1, c }; });
  },
  deleteRow(r) {
    if (r === 0) { say('The head row stays: a Markdown table always has one'); return false; }
    const gone = T.rows[r - 1];
    return change(`Row ${r} removed${hasWords(gone) ? back() : ''}`, () => {
      T.rows.splice(r - 1, 1);
      return { r: Math.min(r, T.rows.length), c: here.c };
    });
  },
  /** A new column at index `at`; the caret goes to its head, to name it. */
  insertCol(at) {
    return change('Column added: name it', () => {
      T.head.splice(at, 0, '');
      T.align.splice(at, 0, 'left');
      for (const row of T.rows) row.splice(at, 0, '');
      return { r: 0, c: at };
    });
  },
  deleteCol(c) {
    if (cols() === 1) { say('The last column stays: delete the table in Source'); return false; }
    const name = colName(c);
    const gone = [T.head[c], ...T.rows.map((row) => row[c])];
    return change(`Column ${name} removed${hasWords(gone) ? back() : ''}`, () => {
      T.head.splice(c, 1);
      T.align.splice(c, 1);
      for (const row of T.rows) row.splice(c, 1);
      return { r: here.r, c: Math.min(c, cols() - 1) };
    });
  },
  align(c, a) {
    if (T.align[c] === a) return false;
    return change(`${colName(c)} aligned ${a}`, () => { T.align[c] = a; return here; });
  },
  /** Moves body row `from` (1-based) to stand at body index `to` of what's left. */
  moveRow(from, to) {
    if (from === 0 || to + 1 === from) return false;
    return change(`Row ${from} moved`, () => {
      const [row] = T.rows.splice(from - 1, 1);
      T.rows.splice(to, 0, row);
      return { r: to + 1, c: here.c };
    });
  },
  moveCol(from, to) {
    if (to === from) return false;
    return change(`${colName(from)} moved`, () => {
      for (const list of [T.head, T.align, ...T.rows]) { const [x] = list.splice(from, 1); list.splice(to, 0, x); }
      return { r: here.r, c: to };
    });
  },

function redraw(to = here) {
  drawTable();
  here = { r: Math.max(0, Math.min(to.r, T.rows.length)), c: Math.max(0, Math.min(to.c, cols() - 1)) };
  drawFile();
  focusCell(here.r, here.c, 'end');
  Table.onDraw();
}

let lastTyped = {};
let saidTimer;
function say(words) {
  said.textContent = words;
  clearTimeout(saidTimer);
  saidTimer = setTimeout(() => { said.textContent = ''; }, 6000);
}
function drawWhere() {
  where.textContent = inTable
    ? `${here.r === 0 ? 'Head row' : `Row ${here.r} of ${T.rows.length}`} · Column ${here.c + 1} of ${cols()} · ${T.align[here.c]}`
    : `Table · ${T.rows.length} rows · ${cols()} columns`;
}

let shown = [];
/** The file, redrawn only where it changed: the lines that differ flash moss once. */
function drawFile() {
  const tidy = document.documentElement.dataset.tidy !== 'compact';
  const lines = [...BEFORE, ...tableLines(tidy), ...AFTER];
  const same = lines.length === shown.length && lines.every((l, i) => l === shown[i]);
  if (!same) {
    let p = 0;
    while (p < lines.length && lines[p] === shown[p]) p++;
    let s = 0;
    while (s < lines.length - p && lines[lines.length - 1 - s] === shown[shown.length - 1 - s]) s++;
    const first = BEFORE.length;
    const last = lines.length - AFTER.length;
    src.innerHTML = lines.map((l, i) => {
      const cls = ['ln', i >= first && i < last && 'is-table', shown.length && i >= p && i < lines.length - s && 'is-changed'];
      // Each line ends in its newline, so the file copies as it's saved.
      return `<span class="${cls.filter(Boolean).join(' ')}">${escHtml(l)}\n</span>`;
    }).join('');
    shown = lines;
  }
  const at = BEFORE.length + (here.r === 0 ? 0 : here.r + 1);
  src.querySelectorAll('.ln').forEach((ln, i) => ln.classList.toggle('is-here', inTable && i === at));
  if (inTable) src.children[at]?.scrollIntoView({ block: 'nearest' });
  drawWhere();
}

/** Where each column and row is, in the wrap's own coordinates, for the controls laid over them. */
function geometry() {
  const base = wrap.getBoundingClientRect();
  const view = scroller.getBoundingClientRect();
  const t = table.getBoundingClientRect();
  const cols = [...table.rows[0].cells].map((th) => { const b = th.getBoundingClientRect(); return { x: b.left - base.left, w: b.width }; });
  const rows = [...table.rows].map((tr) => { const b = tr.getBoundingClientRect(); return { y: b.top - base.top, h: b.height }; });
  return { cols, rows, top: t.top - base.top, height: t.height, left: view.left - base.left, right: Math.min(t.right, view.right) - base.left };

/** The table counts as "in use" while focus is in it or in a control marked data-table-part. */
const inside = (el) => !!el?.closest?.('.tbl-wrap, [data-table-part]');
function setIn(on) {
  if (inTable === on) return;
  inTable = on;
  wrap.classList.toggle('is-in', on);
  drawFile();
  Table.onDraw();
}
/** Back to the caret's cell, from a control. */
const toCell = () => focusCell(here.r, here.c, 'end');

function wireTable() {

    const el = e.target.closest('.cell');
    if (!el) return;
    here = posOf(el);
    setIn(true);
    drawFile();
    Table.onMove(here);
  });
  document.addEventListener('focusout', (e) => {
    if (inside(e.target) && !inside(e.relatedTarget)) setTimeout(() => { if (!inside(document.activeElement)) setIn(false); });
  });
  table.addEventListener('input', (e) => {
    const el = e.target.closest('.cell');
    const { r, c } = posOf(el);
    const key = `${r}:${c}`;
    if (key !== lastTyped.key || Date.now() - lastTyped.at > 1500) { past.push(snapshot()); future.length = 0; }
    lastTyped = { key, at: Date.now() };

    const el = e.target.closest('.cell');
    if (!el || Table.onKey(e)) return;

    const n = cols();

    const go = (r2, c2, at) => { e.preventDefault(); focusCell(r2, c2, at); };
    const k = e.key;

        ArrowDown: () => ops.insertRow(r),

        ArrowRight: () => ops.insertCol(c + 1),
        Backspace: () => (e.shiftKey ? ops.deleteCol(c) : ops.deleteRow(r)),

// The table's edges, for 1 · Handles and 3 · Menus: controls for the row and

let hover = { r: -1, c: -1 };
function useEdges() {

  wrap.addEventListener('transitionend', (e) => { if (e.target === wrap) Table.onDraw(); });
}
/** Lights the row or column a removal would take, before it goes. */
function aim(kind, i) {
  for (const el of table.querySelectorAll('.is-aimed')) el.classList.remove('is-aimed');
  if (kind === 'col') for (const el of table.querySelectorAll(`[data-c="${i}"]:is(th, td)`)) el.classList.add('is-aimed');
  if (kind === 'row') for (const el of table.querySelectorAll(`tr[data-r="${i}"] > *`)) el.classList.add('is-aimed');
}

// The + on each line, with a name that says which line.
function insColName(c) {
  const n = cols();
  if (c === 0) return `Add a column before ${colName(0)}`;
  if (c === n) return `Add a column after ${colName(n - 1)}`;
  return `Add a column between ${colName(c - 1)} and ${colName(c)}`;
}
function insRowName(at) {
  if (at === 0) return 'Add a row under the head row';
  if (at === T.rows.length) return `Add a row after row ${at}`;
  return `Add a row between rows ${at} and ${at + 1}`;
}
/** A + on the line between two columns ('col') or rows ('row'); `at` is the line's index. */
function insertHtml(dir, at) {
  const name = dir === 'col' ? insColName(at) : insRowName(at);
  return `<button class="ins ins--${dir}" data-ins-${dir}="${at}" aria-label="${escHtml(name)}" data-tip="${dir === 'col' ? 'Add a column' : 'Add a row'}" data-tip-side="${dir === 'col' ? 'up' : 'left'}"><span class="ins__dot"></span><span class="ins__plus">${icon('plus')}</span><span class="ins__line"></span></button>`;
}
/** Where each line is: a column line's x, a row line's y, in the wrap's coordinates. */
const colLine = (g, c) => (c < g.cols.length ? g.cols[c].x : g.cols.at(-1).x + g.cols.at(-1).w);
const rowLine = (g, at) => (at < T.rows.length ? g.rows[at + 1].y : g.top + g.height);



mountTablePage({
  id: 'handles',
  name: 'the plan',
  note: 'Point at the table: a tab on each row and column, a + on each line between.',
  notes: `
  <h2>1 · Handles on the edges</h2>
  <p>At rest it's a book's table: rules across, none down. Point at it, or put the caret in it, and its edges wake: a tab over each column and beside each row, and a faint dot on every line between them that turns to + under the pointer, with a line showing where the new row or column will go.</p>
  <h2>Try</h2>
  <ul>
    <li>a + between two columns, between two rows, or after the last of either</li>
    <li>a column's tab: its alignment (left, centre, right, in turn) and its ×</li>
    <li>a row's ×: the row lights up before it goes, and <kbd>${KEY('Mod-Z')}</kbd> puts it back</li>
    <li><kbd>${KEY('Alt-F10')}</kbd> from a cell reaches its column's tab; <kbd>Tab</kbd> walks the edges, <kbd>Esc</kbd> goes back to the cell</li>
  </ul>
  ${SHARED_KEYS()}
  <h2>On a phone</h2>
  <p>Nothing hovers, so the caret's row and column keep their tabs while you're in the table, finger-sized, with a + on each side of them. A phone's margin is too narrow for the row tabs, so the table steps in while you edit it (Show → Phone), and back when you leave.</p>`,
});

useEdges();
let built = '';
const NEXT_ALIGN = { left: 'center', center: 'right', right: 'left' };

/** The edges' controls, made again only when the table's shape or names change. */
function build() {
  const n = cols();
  const m = T.rows.length;
  let html = '';
  for (let c = 0; c <= n; c++) {
    html += insertHtml('col', c);
    if (c < n) {
      const a = T.align[c];
      html += `<div class="tab tab--col" data-col="${c}" role="group" aria-label="Column ${escHtml(colName(c))}">
        <button class="icon-button" data-align-col="${c}" aria-label="${escHtml(colName(c))}: aligned ${a}. Align ${NEXT_ALIGN[a]}" data-tip="Aligned ${a} · next, ${NEXT_ALIGN[a]}">${icon(ALIGN_ICON[a])}</button>
        <button class="icon-button tab__off" data-off-col="${c}" aria-label="Remove column ${escHtml(colName(c))}" data-tip="Remove column  ${KEY('Mod-Alt-Shift-⌫')}"${n === 1 ? ' disabled' : ''}>${icon('colDelete')}</button></div>`;
    }
  }
  for (let at = 0; at <= m; at++) {
    html += insertHtml('row', at);
    if (at < m) {
      html += `<div class="tab tab--row" data-row="${at + 1}" role="group" aria-label="Row ${at + 1}">
        <button class="icon-button tab__off" data-off-row="${at + 1}" aria-label="Remove row ${at + 1}" data-tip="Remove row  ${KEY('Mod-Alt-⌫')}" data-tip-side="left">${icon('rowDelete')}</button></div>`;
    }
  }
  layer.innerHTML = html;
}

/** Each control where its edge is now, and which of them show. */
function place() {
  const key = `${T.head.join('|')}/${T.align.join()}/${T.rows.length}`;
  if (key !== built && !layer.contains(document.activeElement)) { build(); built = key; }
  const g = geometry();
  const touch = isTouch();
  layer.style.setProperty('--tbl-h', `${g.height}px`);
  layer.style.setProperty('--tbl-w', `${g.right - g.left}px`);
  const at = (el, x, y) => {
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.hidden = x < g.left - 1 || x > g.right + 1;
  };
  const top = g.top - 18;
  const side = g.left - 18;
  for (const el of layer.querySelectorAll('[data-ins-col]')) {
    const c = +el.dataset.insCol;
    at(el, colLine(g, c), top);
    el.classList.toggle('is-near', touch && inTable && (c === here.c || c === here.c + 1));
  }
  for (const el of layer.querySelectorAll('[data-col]')) {
    const c = +el.dataset.col;
    at(el, g.cols[c].x + g.cols[c].w / 2, top);
    el.classList.toggle('is-shown', (!touch && hover.c === c) || (inTable && here.c === c));
  }
  for (const el of layer.querySelectorAll('[data-ins-row]')) {
    const i = +el.dataset.insRow;
    at(el, side, rowLine(g, i));
    el.hidden = false;
    el.classList.toggle('is-near', touch && inTable && (i === here.r || i === here.r - 1));
  }
  for (const el of layer.querySelectorAll('[data-row]')) {
    const r = +el.dataset.row;
    at(el, side - 2, g.rows[r].y + g.rows[r].h / 2);
    el.hidden = false;
    el.classList.toggle('is-shown', (!touch && hover.r === r) || (inTable && here.r === r));
  }
}
Table.onDraw = place;
Table.onMove = place;
// Alt-F10, as rich editors have it: from the cell to its column's tab.
Table.onKey = (e) => {
  if (e.key !== 'F10' || !e.altKey) return false;
  e.preventDefault();
  layer.querySelector(`[data-align-col="${here.c}"]`)?.focus();
  return true;
};

for (const type of ['pointerover', 'focusin']) {
  layer.addEventListener(type, (e) => {
    const b = e.target.closest('[data-off-col], [data-off-row]');
    if (b?.dataset.offCol) aim('col', b.dataset.offCol);
    else if (b?.dataset.offRow) aim('row', b.dataset.offRow);
    else aim();
  });
}
layer.addEventListener('pointerleave', () => aim());
// The pointer's press keeps the caret where it is; the keyboard's moves to the control.
layer.addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
layer.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  const fromKeys = e.detail === 0;
  if (d.insCol) ops.insertCol(+d.insCol);
  else if (d.insRow) ops.insertRow(+d.insRow, 0);
  else if (d.offCol) ops.deleteCol(+d.offCol);
  else if (d.offRow) ops.deleteRow(+d.offRow);
  else if (d.alignCol) {
    const c = +d.alignCol;
    ops.align(c, NEXT_ALIGN[T.align[c]]);
    if (fromKeys) { place(); layer.querySelector(`[data-align-col="${c}"]`)?.focus(); }
  }
  aim();
});
layer.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); toCell(); } });

requestAnimationFrame(place);
</script>
</body>
</html>
