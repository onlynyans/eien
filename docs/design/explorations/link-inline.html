<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — A link in Live: 2 · In place</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/* Shared by every exploration (inlined into each page by _build.py).
   The tokens are the approved ones from ../tokens.css (Washi, day and night),
   plus what the design pass adds: a radius scale, icon sizes, the machine
   face as a setting, and row weights. New tokens are marked NEW. */

:root { color-scheme: light dark; }
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

:root {
  --eien-desk: light-dark(#d9d2c8, #110e0b);
  --eien-blotter: light-dark(#eae5dd, #1a1713);
  --eien-band: light-dark(#f4f1ea, #201d19);
  --eien-paper: light-dark(#fdfbf7, #28241f);
  --eien-paper-raised: light-dark(#ffffff, #312d28);
  --eien-well: light-dark(#f9f7f3, #24201c);
  --eien-hover: light-dark(rgb(35 32 28 / 0.045), rgb(233 226 212 / 0.05));
  --eien-press: light-dark(rgb(35 32 28 / 0.1), rgb(233 226 212 / 0.1));
  --eien-selected: light-dark(#ede9e3, #38332e);
  --eien-scrim: light-dark(rgb(35 32 28 / 0.22), rgb(0 0 0 / 0.5));
  --eien-shadow-sheet: 0 1px 2px light-dark(rgb(58 44 26 / 0.06), rgb(0 0 0 / 0.4)),
    0 6px 24px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45));
  --eien-shadow-float: 0 2px 6px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45)),
    0 14px 36px light-dark(rgb(58 44 26 / 0.16), rgb(0 0 0 / 0.6));
  --eien-ink: light-dark(#23201c, #e9e2d4);
  --eien-ink-soft: light-dark(#51473c, #c3b9a7);
  --eien-pencil: light-dark(#5d5348, #a7a095);
  --eien-faded: light-dark(#766d62, #837c73);
  --eien-rule-soft: light-dark(rgb(35 32 28 / 0.07), rgb(233 226 212 / 0.07));
  --eien-rule: light-dark(rgb(35 32 28 / 0.13), rgb(233 226 212 / 0.14));
  --eien-rule-strong: light-dark(rgb(35 32 28 / 0.26), rgb(233 226 212 / 0.26));
  --eien-hairline: 1px;
  --eien-mark-w: 2px;
  --eien-seal: light-dark(#c4472d, #e0603f);
  --eien-seal-wash: light-dark(rgb(196 71 45 / 0.08), rgb(224 96 63 / 0.12));
  --eien-on-seal: light-dark(#fbf8f2, #1a1714);
  --eien-focus: var(--eien-ink-soft);
  --eien-added: light-dark(#485c2c, #9cb880);
  --eien-added-wash: light-dark(rgb(79 107 58 / 0.13), rgb(156 184 128 / 0.14));
  --eien-removed: light-dark(#93304a, #e98aa0);
  --eien-caution: light-dark(#6b501f, #d0a659);
  --eien-caution-wash: light-dark(rgb(138 100 32 / 0.11), rgb(208 166 89 / 0.12));

  /* The machine voice: IBM Plex Mono by default, now a setting (NEW: set from FACES). */
  --eien-face-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --eien-face-seal: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --eien-size-meta: 11px;
  --eien-size-label: 10px;
  --eien-leading-row: 1.35;
  --eien-track-label: 0.12em;
  --eien-space-1: 4px; --eien-space-2: 8px; --eien-space-3: 12px; --eien-space-4: 16px;
  --eien-space-5: 24px; --eien-space-6: 32px; --eien-space-7: 48px; --eien-space-8: 72px;
  --eien-row-h: 30px;
  --eien-touch: 44px;
  --eien-seal-size: 22px;
  --eien-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --eien-quick: 120ms;
  --eien-calm: 220ms;
  --eien-leading-tighten: 0;
  --eien-sheet-pad-x: var(--eien-space-8);
  --eien-sheet-pad-top: var(--eien-space-7);
  --eien-page-gutter: var(--eien-space-5);
  --eien-title-gap: var(--eien-space-6);
  --eien-paragraph-gap: var(--eien-space-4);
  --eien-row-pad-y: var(--eien-space-3);

  /* NEW: corners. Not everything is square. A small scale: s for what you press
     (buttons, fields, chips), m for what floats (menus, popovers, the tool slip),
     l for what covers the window (a sheet over it, the phone's bottom sheet).
     Paper itself (the sheet, the panes) stays square. Each exploration sets its own. */
  --eien-radius-s: 3px;
  --eien-radius-m: 6px;
  --eien-radius-l: 10px;
  --eien-radius-dot: 999px;

  /* NEW: icons. Drawn on a 16-unit grid, stroked in the ink they sit in. */
  --eien-icon: 16px;
  --eien-icon-stroke: 1.25;
  --eien-control: 28px; /* an icon control's square, desktop */

  /* NEW: row names' weight, two settings (400–700). A selected list title is 100 heavier. */
  --eien-weight-tree: 400;
  --eien-weight-list: 400;
}

/* The text voice: the writer's choice, sizes tuned per face (from ../tokens.css). */
:root, [data-face='newsreader'] { --eien-face-text: 'Newsreader', 'Iowan Old Style', Georgia, serif; --eien-size-prose: 22px; --eien-size-title: 36px; --eien-size-heading: 23px; --eien-size-row: 16px; --eien-size-preview: 14px; --eien-leading-prose: calc(1.5 - var(--eien-leading-tighten)); --eien-measure: 29em; }
[data-face='literata'] { --eien-face-text: 'Literata', Georgia, serif; --eien-size-prose: 19px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.72 - var(--eien-leading-tighten)); --eien-measure: 34em; }
[data-face='plex-sans'] { --eien-face-text: 'IBM Plex Sans', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.76 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='source-sans'] { --eien-face-text: 'Source Sans 3', Arial, sans-serif; --eien-size-prose: 20px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 31em; }
[data-face='atkinson'] { --eien-face-text: 'Atkinson Hyperlegible Next', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='schibsted'] { --eien-face-text: 'Schibsted Grotesk', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 33em; }
[data-face='hanken'] { --eien-face-text: 'Hanken Grotesk', Arial, sans-serif; --eien-size-prose: 19px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='instrument'] { --eien-face-text: 'Instrument Sans', Arial, sans-serif; --eien-size-prose: 18.5px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.7 - var(--eien-leading-tighten)); --eien-measure: 31em; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--eien-blotter);
  color: var(--eien-ink);
  font-family: var(--eien-face-text);
  font-size: var(--eien-size-row);
  line-height: var(--eien-leading-row);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--eien-seal-wash); }
:focus-visible { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 2px; }

.seal {
  display: inline-grid; place-items: center; flex: none;
  width: var(--eien-seal-size); height: var(--eien-seal-size);
  background: var(--eien-seal); color: var(--eien-on-seal);
  font-family: var(--eien-face-seal); font-size: calc(var(--eien-seal-size) * 0.68); line-height: 1;
  border-radius: calc(var(--eien-radius-s) / 2);
  user-select: none;
}
.seal--small { --eien-seal-size: 10px; font-size: 0; }

.label {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil);
}
.count {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  font-variant-numeric: tabular-nums; color: var(--eien-pencil);
}

/* Where a word stays (menus, choices of a setting). */
.word-button {
  appearance: none; border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; padding: var(--eien-space-1) var(--eien-space-2);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft);
  cursor: pointer;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.word-button[aria-pressed='true'], .word-button[aria-checked='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* NEW: the icon control. The word button's states, a square of --eien-control. */
.icon-button {
  appearance: none; display: inline-grid; place-items: center; flex: none;
  width: var(--eien-control); height: var(--eien-control); padding: 0;
  border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; color: var(--eien-ink-soft); cursor: pointer; position: relative;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.icon-button svg, .icon { width: var(--eien-icon); height: var(--eien-icon); display: block; }
.icon { stroke-width: var(--eien-icon-stroke); }
.icon-button[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }
.icon-button:disabled { color: var(--eien-faded); cursor: default; }
@media (hover: hover) {
  .word-button:hover, .icon-button:not(:disabled):hover { color: var(--eien-ink); background: var(--eien-hover); }
}
.word-button:active, .icon-button:not(:disabled):active { background: var(--eien-press); border-color: var(--eien-rule-strong); }

/* NEW: a tooltip names an icon and its key: raised paper, the machine voice. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none;
  left: 50%; top: calc(100% + 6px); translate: -50% 0;
  white-space: pre; padding: 3px 7px; border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em;
  text-transform: none; color: var(--eien-ink-soft);
  opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
}
[data-tip-side='up']::after { top: auto; bottom: calc(100% + 6px); }
[data-tip-side='right']::after { left: calc(100% + 6px); top: 50%; translate: 0 -50%; }
[data-tip-side='left']::after { left: auto; right: calc(100% + 6px); top: 50%; translate: 0 -50%; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: 450ms; } }
[data-tip]:focus-visible::after { opacity: 1; }

.field {
  appearance: none; width: 100%; border: var(--eien-hairline) solid var(--eien-rule);
  border-radius: var(--eien-radius-s); background: var(--eien-well);
  padding: var(--eien-space-2) var(--eien-space-3);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink);
}
.field::placeholder { color: var(--eien-faded); }
.field:focus { outline: none; border-color: var(--eien-focus); }

/* Explorations' own bar: outside the app, like the mockups' bar. */
.xbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--eien-space-1) var(--eien-space-4);
  padding: var(--eien-space-2) var(--eien-space-4);
  background: var(--eien-paper-raised); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.xbar__name { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink); font-weight: 600; }
.xbar__group { display: flex; align-items: center; gap: 2px; }
.xbar__label { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); margin-right: var(--eien-space-1); }
.xnote { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }

/* Shared by the three link explorations (link-*.html): the page pane in each
   layout, the note in Live with its links, the file beside it, the colophon.
   Each page adds only its own way of showing a link. */

/* Each layout's corners, as src/ui/chrome/*.css sets them on :root[data-layout]:
   A · Band 2/4/8, B · Slip 4/8/14, C · Running head 3/6/10. */
:root[data-layout='band'] { --eien-radius-s: 2px; --eien-radius-m: 4px; --eien-radius-l: 8px; }
:root[data-layout='slip'] { --eien-radius-s: 4px; --eien-radius-m: 8px; --eien-radius-l: 14px; }
:root[data-layout='runhead'] { --eien-radius-s: 3px; --eien-radius-m: 6px; --eien-radius-l: 10px; }
a.word-button { text-decoration: none; }
.word-button[aria-current='page'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }


:root {
  /* From tokens.css, which shared.css predates: a field at rest is a wash of
     the ink; the Source font's size; the colophon's and C's strip's heights. */
  --eien-field: light-dark(rgb(35 32 28 / 0.06), rgb(233 226 212 / 0.07));
  --eien-size-source: 14px;
  --eien-list-w: 316px;
  --eien-danger: var(--eien-removed);
  --band: calc(var(--eien-space-7) + var(--eien-space-2));
  --status-h: calc(var(--eien-space-6) + var(--eien-space-2));
  --runhead-h: calc(var(--eien-space-6) + var(--eien-space-2));
}

body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); background: var(--eien-blotter); }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 40%); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* The page pane: its top (each layout's), the formatting bar, the sheet on the blotter, the colophon. */
.pane { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) var(--status-h); }
.ptop { grid-row: 1; display: flex; align-items: center; justify-content: space-between; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); min-width: 0; }
.ptop__tools { display: flex; gap: 2px; }
.ptop__tools .icon-button { color: var(--eien-pencil); }
.ptop__crumb, .phone-back { display: none; }
/* A · Band: the band, a rule beneath. */
:root[data-layout='band'] .ptop { background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
/* The views and tools are one slip in B; in A and C they sit apart in the row. */
.ptop__slip { display: contents; }
/* B · Slip: no band; the views and tools ride a raised slip on the blotter, a hairline between. */
:root[data-layout='slip'] .ptop { justify-content: flex-end; }
:root[data-layout='slip'] .ptop__slip { display: flex; gap: 2px; padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
:root[data-layout='slip'] .ptop__views { padding-right: 2px; border-right: var(--eien-hairline) solid var(--eien-rule); }
/* C · Running head: a strip of desk, the crumb in its middle, the tools at its right. */
:root[data-layout='runhead'] .ptop { height: var(--runhead-h); background: var(--eien-desk); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
:root[data-layout='runhead'] .ptop__crumb { display: block; flex: 1; text-align: center; }
:root[data-layout='runhead'] .sheet__head .label { visibility: hidden; }

/* The formatting bar, where each layout puts it: A's band's second row, B's
   raised slip at the blotter's top left, C's raised rail down the margin. */
.fmt { grid-row: 2; display: none; justify-content: center; gap: 2px; padding: 2px var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
:root[data-fmt='on'] .fmt { display: flex; }
.fmt__rule { width: var(--eien-hairline); height: 18px; align-self: center; margin: 0 var(--eien-space-1); background: var(--eien-rule); }
/* B's slip and C's rail float: placed in the pane's own box, not in the bar's row. */
:root:is([data-layout='slip'], [data-layout='runhead']) .fmt { grid-row: auto; }
:root[data-layout='slip'] .fmt { position: absolute; z-index: 3; left: var(--eien-space-3); top: calc((var(--band) - var(--eien-control) - 6px) / 2); padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
:root[data-layout='runhead'] .fmt { position: absolute; z-index: 3; left: var(--eien-space-2); top: calc(var(--runhead-h) + var(--eien-space-4)); flex-direction: column; padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
:root[data-layout='runhead'] .fmt__rule { width: 18px; height: var(--eien-hairline); margin: var(--eien-space-1) auto; }
:root[data-layout='runhead'][data-fmt='on'] .page { padding-left: calc(var(--eien-control) + var(--eien-space-5)); }

/* The sheet at the face's own sizes, leading and measure, on the blotter. */
.page { grid-row: 3; min-height: 0; overflow: auto; display: flex; flex-direction: column; padding: var(--eien-space-4) var(--eien-space-4) 0; }
:root[data-layout='slip'] .page { padding-top: 0; }
.sheet {
  position: relative; flex: 1 0 auto; width: 100%; max-width: calc(var(--eien-measure) + 2 * var(--eien-space-8)); margin: 0 auto;
  padding: var(--eien-space-6) clamp(var(--eien-space-4), 8%, var(--eien-space-8)) var(--eien-space-8);
  background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule); box-shadow: var(--eien-shadow-sheet);
  font-size: var(--eien-size-prose); line-height: var(--eien-leading-prose);
}
:root[data-layout='slip'] .sheet { border-radius: calc(var(--eien-radius-s) - var(--eien-hairline)); }
.sheet__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--eien-space-3); }
.tagset { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); white-space: nowrap; }
.title { font-size: var(--eien-size-title); font-weight: 500; line-height: 1.2; margin: var(--eien-space-4) 0 var(--eien-space-5); }
.prose { outline: none; caret-color: var(--eien-seal); }
.prose p { margin: 0 0 var(--eien-paragraph-gap); }
.prose code, .file__notes code { font-family: var(--eien-face-mono); font-size: 0.9em; }

/* A link, as Live draws it (editor/theme.ts): the words in ink, underlined in
   rule-strong. No colour of its own. The caret's link underlines in ink-soft;
   a note not made yet, dotted (NEW). */
.lk {
  color: var(--eien-ink); text-decoration: underline; text-decoration-color: var(--eien-rule-strong);
  text-decoration-thickness: var(--eien-hairline); text-underline-offset: 0.18em;
  transition: text-decoration-color var(--eien-quick) var(--eien-ease);
}
.lk.is-missing { text-decoration-style: dotted; }
.lk.is-here { text-decoration-color: var(--eien-ink-soft); }
@media (hover: hover) { .lk:hover { text-decoration-color: var(--eien-ink-soft); } }
:root[data-click='follow'] .lk, :root.is-mod .lk { cursor: pointer; }

/* What floats over the page: raised paper, a rule-strong hairline, the float shadow. */
.float {
  position: absolute; z-index: 20;
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float);
  font-size: var(--eien-size-row); line-height: var(--eien-leading-row);
}
.float[hidden] { display: none; }
.icon-button--word { width: auto; grid-auto-flow: column; gap: var(--eien-space-1); padding: 0 var(--eien-space-2); }
.icon-button__word { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; }
.icon-button--danger { color: var(--eien-ink-soft); }
@media (hover: hover) { .icon-button--danger:hover { color: var(--eien-danger) !important; } }

/* A field, as system.md has it: set into what holds it, a wash of ink at rest,
   a 2px focus ring on its own edge when it has the keyboard. */
.lf {
  appearance: none; width: 100%; min-width: 0; margin: 0;
  padding: var(--eien-space-2) var(--eien-space-3); border: var(--eien-hairline) solid transparent;
  border-radius: var(--eien-radius-s); background: var(--eien-field); color: var(--eien-ink);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  transition: border-color var(--eien-quick) var(--eien-ease);
}
.lf--words { font-family: var(--eien-face-text); font-size: var(--eien-size-row); }
@media (hover: hover) { .lf:hover { border-color: var(--eien-rule); } }
.lf:focus { outline: none; background: var(--eien-well); box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.lf::placeholder { color: var(--eien-faded); }
/* A note's name, finished from the vault: the rest of it faded after what's typed. */
.ghost-wrap { position: relative; display: block; }
.ghost { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; padding: var(--eien-hairline) calc(var(--eien-space-3) + var(--eien-hairline)); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); white-space: pre; overflow: hidden; }
.ghost__typed { visibility: hidden; }
.ghost__rest { color: var(--eien-faded); }

/* The colophon: the status line, mono capitals, what was done said at its right. */
.colophon { grid-row: 4; display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-4); background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); letter-spacing: 0.04em; text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; }
.colophon__where { flex: none; }
.colophon__said { margin-left: auto; min-width: 0; color: var(--eien-ink-soft); overflow: hidden; text-overflow: ellipsis; }

/* The file, beside the page: what Eien writes, line by line. */
.file { min-height: 0; display: grid; grid-template-rows: var(--band) auto minmax(0, 1fr); background: var(--eien-desk); border-left: var(--eien-hairline) solid var(--eien-rule); }
@media (max-width: 900px) { .file { border-left: 0; border-top: var(--eien-hairline) solid var(--eien-rule); } }
.file__head { display: flex; align-items: center; gap: var(--eien-space-3); padding: 0 var(--eien-space-4); border-bottom: var(--eien-hairline) solid var(--eien-rule); background: var(--eien-band); min-width: 0; }
.file__head .count { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file__src {
  margin: 0; padding: var(--eien-space-3) var(--eien-space-2); max-height: 34vh; overflow: auto; background: var(--eien-paper);
  font-family: var(--eien-face-mono); font-size: 12px; line-height: 1.75; color: var(--eien-ink-soft); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.ln { display: block; white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 var(--eien-space-2); border-radius: var(--eien-radius-s); min-height: 1.75em; }
.ln.is-here { background: var(--eien-selected); color: var(--eien-ink); }
.ln.is-changed { animation: changed 1.6s var(--eien-ease); }
@keyframes changed { from { background: var(--eien-added-wash); } }
@media (prefers-reduced-motion: reduce) { .ln.is-changed { animation: none; } *, *::before, *::after { transition: none !important; } }
.file__notes { min-height: 0; padding: var(--eien-space-3) var(--eien-space-4) var(--eien-space-4); overflow: auto; font-size: var(--eien-size-preview); line-height: 1.55; color: var(--eien-ink-soft); }
.file__notes h2 { margin: var(--eien-space-4) 0 var(--eien-space-1); font: inherit; font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); font-weight: 400; }
.file__notes h2:first-child { margin-top: 0; }
.file__notes ul { margin: 0; padding-left: 1.1em; }
.file__notes p { margin: 0 0 var(--eien-space-2); }
kbd { font-family: var(--eien-face-mono); font-size: 11px; padding: 0 4px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-paper); white-space: nowrap; }

/* A phone: one pane in a phone's width, its back bar on top, no margins to spare, nothing hovers. */
:root[data-device='phone'] .pane { width: 390px; max-width: 100%; justify-self: center; border-inline: var(--eien-hairline) solid var(--eien-rule-strong); background: var(--eien-paper); }
:root[data-device='phone'] .ptop { height: var(--band); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); justify-content: flex-start; }
:root[data-device='phone'] .ptop > :not(.phone-back), :root[data-device='phone'] .fmt { display: none !important; }
:root[data-device='phone'] .phone-back { display: flex; align-items: center; gap: var(--eien-space-2); flex: 1; min-width: 0; }
:root[data-device='phone'] .phone-back .icon-button { width: var(--eien-touch); height: var(--eien-touch); color: var(--eien-ink-soft); }
:root[data-device='phone'] .phone-back__name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
:root[data-device='phone'] .page { padding: 0; }
:root[data-device='phone'] .sheet { border: 0; box-shadow: none; border-radius: 0; padding: var(--eien-space-4) var(--eien-space-4) var(--eien-space-8); }
:root[data-device='phone'] .sheet__head .label { visibility: visible; }
:root[data-device='phone'] .title { font-size: calc(var(--eien-size-title) * 0.8); }
.is-touch .icon-button[data-tip]::after { display: none; }


/* 2 · In place: nothing floats. With the caret in it, the link's own Markdown
   opens where it stands, for that link alone, as a name opens for Rename: the
   marks faded, as Live shows them; the address in the Source font; the 2px
   focus mark under the part with the keyboard; the caret in the seal. Where a
   link goes on hover is said in the colophon, as a browser's status line does. */
:root { --eien-face-source: var(--eien-face-mono); }
.isle { white-space: normal; }
.mk { color: var(--eien-faded); }
.lk.is-open { text-decoration-thickness: var(--eien-mark-w); text-decoration-color: var(--eien-focus); text-decoration-style: solid; }
.prose:has(.addr:focus) .lk.is-open { text-decoration-thickness: var(--eien-hairline); text-decoration-color: var(--eien-rule-strong); }
.addr {
  font-family: var(--eien-face-source); font-size: var(--eien-size-source); color: var(--eien-ink-soft);
  overflow-wrap: anywhere; outline: none; caret-color: var(--eien-seal); padding: 0 1px;
}
.addr--note { font-family: var(--eien-face-text); font-size: inherit; color: var(--eien-ink-soft); }
.addr:focus { color: var(--eien-ink); box-shadow: 0 var(--eien-mark-w) 0 var(--eien-focus); }
.addr:empty::before { content: attr(data-empty); color: var(--eien-faded); }
.ghost-in { color: var(--eien-faded); }
.addr--note + .ghost-in { font-family: var(--eien-face-text); }
.addr:not(.addr--note) + .ghost-in { font-family: var(--eien-face-source); font-size: var(--eien-size-source); }
/* Its one control, after the closing mark: open, or make the note. */
.open-in {
  vertical-align: middle; margin-inline-start: var(--eien-space-1);
  width: calc(var(--eien-control) - var(--eien-space-1)); height: calc(var(--eien-control) - var(--eien-space-1));
  color: var(--eien-pencil);
}
/* A phone: the same reach as any control, without making the line taller. */
.is-touch .open-in::before { content: ''; position: absolute; inset: calc((var(--eien-touch) - var(--eien-control)) / -2); }
/* The colophon tells where a link goes: the arrow in faded, the rest as said. */
.colophon__said .to { color: var(--eien-faded); }

/** An icon as SVG markup, stroked in currentColor. */
function icon(name, label) {
  const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
  return `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICONS[name]}</svg>`;
}

/** Fill every [data-icon] with its icon. */
function drawIcons(root = document) {
  for (const el of root.querySelectorAll('[data-icon]')) {
    el.innerHTML = icon(el.dataset.icon) + (el.dataset.iconText ?? '');
  }
}

/** The faces the text voice offers (all but the mono), and the machine voice (all). */
const TEXT_FACES = FACES.filter((face) => !face.mono);
const MACHINE_FACES = FACES;

function setMachineFace(id) {
  const face = FACES.find((each) => each.id === id) ?? FACES[0];
  document.documentElement.style.setProperty('--eien-face-mono', face.family);
}
function setTextFace(id) {
  if (id === 'newsreader') delete document.documentElement.dataset.face;
  else document.documentElement.dataset.face = id;
}

/** The explorations' bar: [data-x-set="attr"] groups set data-<attr> on <html>. */
function wireBar(onChange = () => {}) {
  for (const group of document.querySelectorAll('[data-x-set]')) {
    const attr = group.dataset.xSet;
    const buttons = [...group.querySelectorAll('button[data-value]')];
    const pick = (value) => {
      document.documentElement.dataset[attr] = value;
      for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.value === value));
      onChange(attr, value);
    };
    for (const b of buttons) b.addEventListener('click', () => pick(b.dataset.value));
    pick(document.documentElement.dataset[attr] ?? buttons[0].dataset.value);
  }
}

  const pEl = prose.children[p];
  const walker = document.createTreeWalker(pEl, NodeFilter.SHOW_TEXT, { acceptNode: notSkipped });
  let acc = 0;
  let first = null;
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (o >= acc && o <= acc + n.length) {
      const point = { node: n, offset: o - acc };
      const span = n.parentElement.closest('.lk');
      if (Links.opened && span && same(Links.opened, { p: +span.dataset.p, i: +span.dataset.i })) return point;
      first ??= point;
    }
    acc += n.length;
  }
  return first ?? { node: pEl, offset: 0 };
}
function select(a, b = a) {
  const s = getSelection();
  const x = domAt(a.p, a.o);
  const y = domAt(b.p, b.o);
  s.setBaseAndExtent(x.node, x.offset, y.node, y.offset);
}
const before = (a, b) => a.p < b.p || (a.p === b.p && a.o < b.o);
/** The selection in the text, start first; null when it isn't in the text. */
function selRange() {
  const s = getSelection();
  if (!s.rangeCount || !prose.contains(s.anchorNode) || s.anchorNode.parentElement?.closest('[data-field]')) return null;
  const a = posOf(s.anchorNode, s.anchorOffset);
  const b = posOf(s.focusNode, s.focusOffset);
  return before(b, a) ? { a: b, b: a, focus: b } : { a, b, focus: b };
}
const linkAt = (p, o) => {
  const i = DOC[p]?.links.findIndex((l) => l.start <= o && o <= l.end) ?? -1;
  return i < 0 ? null : { p, i };
};
/** Where the caret was last in the text: where Esc from a card or bar goes back to. */
let caret = { p: 0, o: 0 };
let cur = null;
/** The caret's link. A direction may hold a place shut (2, leaving a link by its far side). */
let shutAt = null;

/** Whether the caret's last move was a change's own (typing), not the writer moving it. */
let movedByEdit = false;
function caretMoved() {
  const s = selRange();
  if (!s) return;
  const byEdit = movedByEdit;
  movedByEdit = false;
  caret = s.focus;
  if (shutAt && (shutAt.p !== caret.p || shutAt.o !== caret.o)) shutAt = null;
  const found = shutAt ? null : linkAt(caret.p, caret.o);
  if (!same(found, cur)) {
    cur = found;
    markHere();
    if (cur) sr.textContent = `Link to ${describe(cur).short}. ${KEY('Alt-↩')} opens, ${KEY('Mod-K')} edits, ${KEY('Alt-F10')} its tools.`;
    Links.onCaret(cur, byEdit);
  } else Links.onPlace(cur, byEdit);

}
const toCaret = () => {
  prose.focus({ preventScroll: true });

};

// ---- Changes, each one step of the history: ⌘Z puts back what any of them took.

const past = [];
const future = [];
let lastTyped = 0;
const snapshot = () => JSON.stringify({ DOC, caret, vault: Object.keys(VAULT) });
function checkpoint(typing = false) {
  if (typing && Date.now() - lastTyped < 1500) { lastTyped = Date.now(); return; }
  lastTyped = typing ? Date.now() : 0;
  past.push(snapshot());
  future.length = 0;
}
function restore(json) {
  const s = JSON.parse(json);
  DOC = s.DOC;
  for (const t of Object.keys(VAULT)) if (!s.vault.includes(t)) delete VAULT[t];
  Links.opened = null;
  draw({ a: s.caret });
  toCaret();
}
function undo() {
  if (!past.length) return say('Nothing to undo');
  future.push(snapshot());
  restore(past.pop());
  lastTyped = 0;
  say('Undone');
}
function redo() {
  if (!future.length) return say('Nothing to redo');
  past.push(snapshot());
  restore(future.pop());
  say('Redone');
}

/** Replaces [a, b) with `text` (one line). A link keeps whatever of its words are left. */
function replaceRange(a, b, text) {
  const len = text.length;
  if (a.p === b.p) {
    const par = DOC[a.p];
    const gone = b.o - a.o;
    par.text = par.text.slice(0, a.o) + text + par.text.slice(b.o);
    for (const l of par.links) {
      if (!gone) {
        // Typed at a link's start, the words go before it; at its end, after it; inside, into it.
        if (l.start >= a.o) l.start += len;
        if (l.end > a.o) l.end += len;
        continue;
      }
      // Over a selection: what's typed joins a link the selection began in, or began at its start.
      const start = l.start <= a.o ? l.start : l.start >= b.o ? l.start - gone + len : a.o + len;
      l.end = l.end <= a.o ? l.end : l.end >= b.o ? l.end - gone + len : start <= a.o ? a.o + len : start;
      l.start = start;
    }
    const had = par.links.length;
    par.links = par.links.filter((l) => l.end > l.start);
    return { at: { p: a.p, o: a.o + len }, lost: had - par.links.length };
  }
  const first = DOC[a.p];
  const last = DOC[b.p];
  const shift = a.o + len - b.o;
  const kept = first.links.filter((l) => l.start < a.o).map((l) => ({ ...l, end: Math.min(l.end, a.o) }));
  const after = last.links.filter((l) => l.end > b.o).map((l) => ({ ...l, start: Math.max(l.start, b.o) + shift, end: l.end + shift }));
  const lost = DOC.slice(a.p, b.p + 1).reduce((n, par) => n + par.links.length, 0) - kept.length - after.length;
  DOC.splice(a.p, b.p - a.p + 1, { text: first.text.slice(0, a.o) + text + last.text.slice(b.o), links: [...kept, ...after] });
  return { at: { p: a.p, o: a.o + len }, lost };
}
/** Enter: the paragraph parts at the caret; a link across it goes on in both halves. */
function split(at) {
  const par = DOC[at.p];
  const head = { text: par.text.slice(0, at.o), links: par.links.filter((l) => l.start < at.o).map((l) => ({ ...l, end: Math.min(l.end, at.o) })) };
  const tail = { text: par.text.slice(at.o), links: par.links.filter((l) => l.end > at.o).map((l) => ({ ...l, start: Math.max(l.start, at.o) - at.o, end: l.end - at.o })) };
  DOC.splice(at.p, 1, head, tail);
  return { p: at.p + 1, o: 0 };
}

function edit(a, b, text, typing = false) {
  checkpoint(typing);
  const { at, lost } = replaceRange(a, b, text);
  Links.opened = null;
  movedByEdit = true;
  draw({ a: at });
  if (lost) say(`${lost === 1 ? 'A link' : `${lost} links`} went with ${lost === 1 ? 'its' : 'their'} words · ${KEY('Mod-Z')} puts ${lost === 1 ? 'it' : 'them'} back`);
  Links.onTyping();
}

/** Sets a link's words or where it goes; what's typed there says whether it's a note or the web. */
function setLink(at, { words, target }) {
  const par = DOC[at.p];
  const l = par.links[at.i];
  checkpoint();
  if (words !== undefined && words !== wordsOf(par, l) && words.length) {
    const was = l.kind === 'note' && l.target === null ? wordsOf(par, l) : null;
    replaceRange({ p: at.p, o: l.start }, { p: at.p, o: l.end }, words);
    // [[Rations]] renamed in its words keeps going to Rations: the old words become its target.
    if (was !== null && target === undefined) l.target = was;
  }
  if (target !== undefined) {
    const t = target.trim();
    if (isAddress(t)) { l.kind = 'web'; l.target = asAddress(t); }
    else if (l.kind === 'web' && !t) l.target = '';
    else { l.kind = 'note'; l.target = !t || t === wordsOf(par, l) ? null : t; }
  }
  Links.opened = null;
  draw();
}
function removeLink(at) {
  checkpoint();
  DOC[at.p].links.splice(at.i, 1);
  Links.opened = null;
  cur = null;
  draw();
  toCaret();
  say(`Link taken off; the words stay · ${KEY('Mod-Z')} puts it back`);
}
function makeNote(title) {
  checkpoint();
  VAULT[title] = { ord: 'vi', words: 0, sealed: 'not yet', first: '' };
  draw();
  say(`Made “${title}” in Beneath the Walls, empty`);
}
/** ⌘K, and the formatting bar's Link: the caret's link to edit, or the selected words made one. */
function linkCommand() {
  if (cur) return Links.onEdit(cur);
  const s = selRange() ?? { a: caret, b: caret };
  const par = DOC[s.a.p];
  if (s.a.p !== s.b.p || s.a.o === s.b.o) return say('Select some words to make them a link');
  if (par.links.some((l) => l.start < s.b.o && l.end > s.a.o)) return say('Those words hold a link already');
  checkpoint();
  par.links.push({ kind: 'web', target: '', start: s.a.o, end: s.b.o });
  par.links.sort((x, y) => x.start - y.start);
  const i = par.links.findIndex((l) => l.start === s.a.o);
  cur = { p: s.a.p, i };
  caret = s.b;
  draw({ a: s.b });

}
/** A new link put back, if it was left with nowhere to go. */
function dropIfEmpty(at) {
  const l = linkOf(at);
  if (l && l.kind === 'web' && !l.target) { past.pop(); DOC[at.p].links.splice(at.i, 1); cur = null; draw(); }
}
async function copyLink(at) {
  const par = DOC[at.p];
  const l = par.links[at.i];
  const text = l.kind === 'note' ? `[[${targetOf(par, l)}]]` : l.target;
  try { await navigator.clipboard.writeText(text); say(l.kind === 'note' ? 'Copied the link to the note' : 'Copied the address'); }
  catch { say('Couldn’t reach the clipboard here'); }
}
/** Following: in the app a note opens on the page and an address in the browser. */
function follow(at) {
  const d = describe(at);
  if (d.kind === 'note') say(`Opened ${d.ord} · ${d.title}: in the app the page turns to it`);
  else if (d.kind === 'missing') say(`No note called “${d.title}” yet: make it from the link’s tools`);
  else if (d.kind === 'web') say(`Opened ${d.host} in your browser`);
  else say('This link goes nowhere yet');

// ---- The text's own events: typing, the keys, the pointer.

function wireProse() {
  document.addEventListener('selectionchange', () => {
    const s = getSelection();
    if (s.rangeCount && prose.contains(s.anchorNode) && !s.anchorNode.parentElement?.closest('[data-field]')) caretMoved();
  });
  prose.addEventListener('beforeinput', (e) => {
    if (e.target.closest?.('[data-field]')) return; // 2's fields type for themselves
    e.preventDefault();
    const s = selRange();
    if (!s) return;
    const t = e.inputType;
    const data = (e.dataTransfer?.getData('text/plain') ?? e.data ?? '').replace(/\s*\n\s*/g, ' ');
    if (t === 'insertText' || t === 'insertReplacementText' || t === 'insertFromPaste' || t === 'insertFromDrop') {
      if (t === 'insertReplacementText' && e.getTargetRanges().length) {
        const r = e.getTargetRanges()[0];
        return edit(posOf(r.startContainer, r.startOffset), posOf(r.endContainer, r.endOffset), data);
      }
      return edit(s.a, s.b, data, t === 'insertText');
    }
    if (t === 'insertParagraph' || t === 'insertLineBreak') {
      checkpoint();
      replaceRange(s.a, s.b, '');
      const to = split(s.a);
      Links.opened = null;
      draw({ a: to });
      return;
    }
    if (t === 'historyUndo') return undo();
    if (t === 'historyRedo') return redo();
    if (t.startsWith('delete')) {
      let { a, b } = s;
      const r = e.getTargetRanges()[0];
      if (r) { a = posOf(r.startContainer, r.startOffset); b = posOf(r.endContainer, r.endOffset); }
      else if (a.p === b.p && a.o === b.o) {
        if (t.includes('Backward')) a = a.o > 0 ? { p: a.p, o: a.o - 1 } : a.p > 0 ? { p: a.p - 1, o: DOC[a.p - 1].text.length } : a;
        else b = b.o < DOC[b.p].text.length ? { p: b.p, o: b.o + 1 } : b.p < DOC.length - 1 ? { p: b.p + 1, o: 0 } : b;
      }
      if (before(b, a)) [a, b] = [b, a];
      if (a.p === b.p && a.o === b.o) return;
      return edit(a, b, '', true);
    }
  });
  prose.addEventListener('keydown', (e) => {
    if (e.target !== prose) return;
    document.documentElement.classList.toggle('is-mod', mod(e));
    if (Links.onKey(e)) return;
    const k = e.key.toLowerCase();
    if (mod(e) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod(e) && k === 'y' && !MAC_KEYS) { e.preventDefault(); redo(); }
    else if (mod(e) && k === 'k') { e.preventDefault(); linkCommand(); }
    else if (e.altKey && e.key === 'Enter') { e.preventDefault(); cur ? follow(cur) : say('No link at the caret'); }
    else if (e.altKey && e.key === 'F10') { e.preventDefault(); cur ? Links.onReach(cur) : say('No link at the caret'); }
    else if (mod(e) && ['b', 'i', 'u'].includes(k)) { e.preventDefault(); say('Formatting: not in this exploration'); }
  });
  addEventListener('keyup', (e) => document.documentElement.classList.toggle('is-mod', mod(e)));
  addEventListener('blur', () => document.documentElement.classList.remove('is-mod'));

  // The pointer: ⌘-click always follows; a plain click follows only when the bar says so,
  // and then ⌥-click puts the caret in the link instead.
  prose.addEventListener('mousedown', (e) => {
    const span = e.target.closest?.('.lk');
    if (!span || e.button !== 0) return;
    const at = { p: +span.dataset.p, i: +span.dataset.i };
    if (mod(e) || (clickFollows() && !e.altKey)) { e.preventDefault(); follow(at); }
  });
  let hoverTimer;
  let leaveTimer;
  let hovered = null;
  prose.addEventListener('mouseover', (e) => {
    if (isTouch()) return;
    const span = e.target.closest?.('.lk');
    if (!span) return;
    clearTimeout(leaveTimer);
    const at = { p: +span.dataset.p, i: +span.dataset.i };
    if (same(at, hovered)) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => { hovered = at; Links.onHover(at, span); }, Links.hoverDelay);
  });
  prose.addEventListener('mouseout', (e) => {
    const span = e.target.closest?.('.lk');
    if (!span || span.contains(e.relatedTarget)) return;
    clearTimeout(hoverTimer);
    leaveSoon();
  });
  // A floating part (data-link-part) keeps the hover while the pointer is over it.
  const leaveSoon = () => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      if (document.querySelector('[data-link-part]:hover, .lk:hover')) return;
      if (hovered) { hovered = null; Links.onUnhover(); }
    }, 300);
  };
  document.addEventListener('mouseout', (e) => { if (e.target.closest?.('[data-link-part]') && !e.target.closest('[data-link-part]').contains(e.relatedTarget)) leaveSoon(); });
  Links.forgetHover = () => { clearTimeout(hoverTimer); hovered = null; };
}

// ---- The file and the colophon.

let shown = [];
function drawFile() {
  const lines = DOC.flatMap((par, p) => (p ? ['', markdown(par)] : [markdown(par)]));
  let first = 0;
  while (first < lines.length && lines[first] === shown[first]) first++;
  let tail = 0;
  while (tail < lines.length - first && lines[lines.length - 1 - tail] === shown[shown.length - 1 - tail]) tail++;
  if (first < lines.length || lines.length !== shown.length) {
    src.replaceChildren(...lines.map((l, i) => {
      const ln = document.createElement('span');
      ln.className = 'ln';
      if (shown.length && i >= first && i < lines.length - tail) ln.classList.add('is-changed');
      // Each line ends in its newline, so the file copies as it's saved.
      ln.textContent = `${l}\n`;
      return ln;
    }));
    shown = lines;
  }
  drawWhere();
}
function drawWhere() {
  const all = DOC.reduce((n, par) => n + par.links.length, 0);
  const words = DOC.reduce((n, par) => n + par.text.split(/\s+/).filter(Boolean).length, 0);
  const kinds = { note: 'to a note', missing: 'to a note not made yet', web: 'to the web', empty: 'with no address yet' };
  let n = 0;
  if (cur) for (let p = 0; p < cur.p; p++) n += DOC[p].links.length;
  whereEl.textContent = cur && linkOf(cur)
    ? `Link ${n + cur.i + 1} of ${all} · ${kinds[describe(cur).kind]}`
    : `Notes for iv · ${words} words · ${all} links`;
  // The caret's line in the file, once there's a caret in the text.
  const inText = !!cur || prose.contains(document.activeElement);
  src.querySelectorAll('.ln').forEach((ln, i) => ln.classList.toggle('is-here', inText && i === caret.p * 2));
}
let saidTimer;
/** Says it in the colophon a while; `stay` keeps it there until something else is said. */
function say(words, stay = false) {
  said.textContent = words;
  clearTimeout(saidTimer);
  if (!stay) saidTimer = setTimeout(() => { said.textContent = ''; }, 6000);
}

// ---- What the directions build with.

/** An element, its class and text; never markup. */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
/** An icon button: its name for a screen reader, its tooltip with the key; `word` shown beside the icon where asked. */
function iconButton(name, label, key, run, { word } = {}) {
  const b = el('button', 'icon-button');
  b.type = 'button';
  b.setAttribute('aria-label', label);
  b.dataset.tip = key ? `${label}  ${key}` : label;
  b.insertAdjacentHTML('afterbegin', icon(name));
  if (word) { b.classList.add('icon-button--word'); b.append(el('span', 'icon-button__word', word)); }
  b.addEventListener('mousedown', (e) => e.preventDefault());
  b.addEventListener('click', run);
  return b;
}
/** Arrows along a row of buttons (one tab stop), Esc back to the caret. */
function roving(row) {
  row.addEventListener('keydown', (e) => {
    const bs = [...row.querySelectorAll('button')];
    const i = bs.indexOf(document.activeElement);
    if (i < 0) return;
    const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: bs.length - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); bs[(to + bs.length) % bs.length].focus(); }
  });
  row.addEventListener('focusin', () => row.querySelectorAll('button').forEach((b) => { b.tabIndex = b === document.activeElement ? 0 : -1; }));
}
/** The link's box on the sheet: the line the caret is on, or its first. */
function linkBox(at) {
  const span = spanOf(at);
  if (!span) return null;
  const rects = [...span.getClientRects()];
  let r = rects[0];
  const s = getSelection();
  if (s.rangeCount && span.contains(s.focusNode)) {
    const c = s.getRangeAt(0).getBoundingClientRect();
    r = rects.find((x) => c.top >= x.top - 2 && c.top <= x.bottom) ?? r;
  }
  const base = sheet.getBoundingClientRect();
  return { left: r.left - base.left, right: r.right - base.left, top: r.top - base.top, bottom: r.bottom - base.top, viewTop: r.top, viewBottom: r.bottom };
}
/** Lays a floating part under (or, with no room, over) a box, kept inside the sheet. */
function placeBy(part, box, side = 'below') {
  const gap = 4;
  const w = part.offsetWidth;
  const h = part.offsetHeight;
  const room = page.getBoundingClientRect();
  let below = side === 'below';
  if (below && box.viewBottom + gap + h > room.bottom && box.viewTop - gap - h > room.top) below = false;
  if (!below && box.viewTop - gap - h < room.top) below = true;
  const pad = 8;
  part.style.left = `${Math.max(pad, Math.min(box.left, sheet.clientWidth - w - pad))}px`;
  part.style.top = `${below ? box.bottom + gap : box.top - gap - h}px`;
  part.dataset.side = below ? 'below' : 'above';
}

Links.hoverDelay = 120;
let firstValue = '';

/** Where a link goes, said in the colophon: the arrow, then the place, then how to go. */
function sayWhere(at, how) {
  const d = describe(at);

}
const quiet = () => { if (cur) sayWhere(cur, `${KEY('Alt-↩')} opens`); else said.textContent = ''; };

/** The open link's Markdown, round its words: marks, a field, the one control. */
Links.render = (span, at) => {
  if (!same(Links.opened, at)) return span;
  const l = linkOf(at);
  span.classList.add('is-open');
  const isle = (...parts) => {
    const s = el('span', 'isle');
    s.dataset.skip = '';
    s.contentEditable = 'false';
    s.append(...parts);
    return s;
  };
  const mk = (t) => { const m = el('span', 'mk', t); m.setAttribute('aria-hidden', 'true'); return m; };
  const frag = document.createDocumentFragment();
  if (l.kind === 'web') frag.append(isle(mk('[')), span, isle(mk(']('), ...field(at, 'address'), mk(')'), openIn(at)));
  else if (l.target === null) frag.append(isle(mk('[[')), span, isle(mk(']]'), openIn(at)));
  else frag.append(isle(mk('[['), ...field(at, 'note'), mk('|')), span, isle(mk(']]'), openIn(at)));
  return frag;
};

function openIn(at) {
  const d = describe(at);
  const b = d.kind === 'missing'
    ? iconButton('plus', `Make the note “${d.title}”`, '', () => { makeNote(d.title); reopen(at); })
    : iconButton('openLink', d.kind === 'web' ? `Open ${d.host}` : `Open ${d.title ?? 'the link'}`, KEY('Alt-↩'), () => follow(at));
  b.classList.add('open-in');
  b.dataset.tipSide = 'up';
  return b;
}

/** A field in the line: the address, or the note's name before the words. */
function field(at, kind) {
  const par = DOC[at.p];
  const l = par.links[at.i];
  const f = el('span', `addr${kind === 'note' ? ' addr--note' : ''}`, l.target);
  f.contentEditable = 'plaintext-only';
  f.spellcheck = false;
  f.dataset.field = kind;
  f.dataset.empty = kind === 'note' ? 'a note’s name' : 'an address';
  f.setAttribute('role', 'textbox');
  f.setAttribute('aria-label', kind === 'note' ? 'The note it goes to' : 'The address');
  const ghost = el('span', 'ghost-in');
  ghost.setAttribute('aria-hidden', 'true');
  const offer = () => {
    const end = caretIn(f) === f.textContent.length;
    ghost.textContent = kind === 'note' && end ? completion(f.textContent) : '';
  };
  const apply = () => {
    const t = f.textContent.replace(/\n/g, '');
    if (kind === 'note') l.target = t.trim() ? t.trim() : null;
    else l.target = t.trim();
    drawFile();
    markMissing();
    // Open, or make the note: whichever the name now calls for.
    spanOf(at)?.parentElement.querySelector('.open-in')?.replaceWith(openIn(at));
    sayWhere(at, `${KEY('Alt-↩')} opens`);
  };
  f.addEventListener('focus', () => { firstValue = f.textContent; checkpoint(); offer(); sayWhere(at, `${KEY('Enter')} back to the words · esc puts back`); });
  f.addEventListener('input', () => { apply(); offer(); });
  f.addEventListener('keyup', offer);
  f.addEventListener('keydown', (e) => {
    const pos = caretIn(f);
    const len = f.textContent.length;
    const take = () => { e.preventDefault(); f.textContent += ghost.textContent; apply(); caretTo(f, f.textContent.length); offer(); };
    if (e.altKey && e.key === 'Enter') { e.preventDefault(); follow(at); }
    else if ((e.key === 'Tab' && !e.shiftKey || e.key === 'ArrowRight') && ghost.textContent && pos === len) take();
    else if (e.key === 'ArrowLeft' && !e.shiftKey && pos === 0) { e.preventDefault(); kind === 'address' ? toText(at, 'end') : leave(at, 'before'); }
    else if (e.key === 'ArrowRight' && !e.shiftKey && pos === len) { e.preventDefault(); kind === 'address' ? leave(at, 'after') : toText(at, 'start'); }
    // Up and down leave the field for the words and the lines round them, as the arrows do in text.
    else if (e.key === 'ArrowUp' && !e.shiftKey) { e.preventDefault(); kind === 'address' ? toText(at, 'end') : leave(at, 'before'); }
    else if (e.key === 'ArrowDown' && !e.shiftKey) { e.preventDefault(); kind === 'address' ? leave(at, 'after') : toText(at, 'start'); }
    else if (e.key === 'Enter') { e.preventDefault(); toText(at, 'end'); }
    else if (e.key === 'Escape') { e.preventDefault(); f.textContent = firstValue; apply(); toText(at, 'end'); }
    else if (mod(e) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });
  f.addEventListener('paste', (e) => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain').replace(/\s+/g, ' ').trim()); });
  return [f, ghost];
}
const caretIn = (f) => { const s = getSelection(); return s.rangeCount && f.contains(s.focusNode) ? (s.focusNode === f ? (s.focusOffset ? f.textContent.length : 0) : s.focusOffset) : 0; };
function caretTo(f, at) {
  f.focus();
  const node = f.firstChild ?? f;
  getSelection().collapse(node, Math.min(at, node.textContent.length));
}
const fieldOf = (at) => (same(Links.opened, at) ? spanOf(at)?.parentElement.querySelector('[data-field]') : null);
function focusField(at, where) {
  const f = fieldOf(at);
  if (!f) return;
  caretTo(f, where === 'start' ? 0 : f.textContent.length);
  if (where === 'all') getSelection().selectAllChildren(f);
}
/** Back into the words, at their start or end. */
function toText(at, where) {
  const l = linkOf(at);
  prose.focus({ preventScroll: true });
  caret = { p: at.p, o: where === 'start' ? l.start : l.end };
  select(caret);
}
/** Out of the link by its near or far side; it closes. */
function leave(at, side) {
  const l = linkOf(at);
  const o = side === 'before' ? l.start : l.end;
  shutAt = { p: at.p, o };
  prose.focus({ preventScroll: true });
  close();
  select({ p: at.p, o });
}

function open(at) {
  Links.opened = at;
  const s = selRange();
  draw(s ? { a: s.a, b: s.b } : undefined);
  quiet();
}
function close() {
  if (!Links.opened) return;
  const l = linkOf(Links.opened);
  // [[Below the Gate|Below the Gate]] is [[Below the Gate]]: the name goes when it's the words.
  if (l && l.kind === 'note' && l.target !== null && l.target === wordsOf(DOC[Links.opened.p], l)) l.target = null;
  Links.opened = null;
  const s = selRange();
  draw(s ? { a: s.a, b: s.b } : undefined);
}
function reopen(at) { Links.opened = null; open(at); toText(at, 'end'); }

Links.onCaret = (at) => {
  if (at) open(at);
  else if (!document.activeElement?.closest?.('[data-field]')) close();
  quiet();
};
Links.onHover = (at) => sayWhere(at, openHint());
Links.onUnhover = quiet;
Links.onEdit = (at) => {
  const l = linkOf(at);
  if (!same(Links.opened, at)) open(at);
  // [[Below the Gate]]: its name opens before the words, to point it at another note.
  if (l.kind === 'note' && l.target === null) { l.target = wordsOf(DOC[at.p], l); Links.opened = null; open(at); }
  focusField(at, 'all');
  if (!fieldOf(at)) toText(at, 'end');
};
Links.onReach = (at) => { if (!same(Links.opened, at)) open(at); spanOf(at)?.parentElement.querySelector('.open-in')?.focus(); };
Links.onKey = (e) => {
  const at = Links.opened;
  if (!at || e.shiftKey || e.altKey || mod(e)) return false;
  const s = selRange();
  if (!s || s.a.p !== s.b.p || s.a.o !== s.b.o) return false;
  const l = linkOf(at);
  if (e.key === 'ArrowRight' && s.a.o === l.end && l.kind === 'web') { e.preventDefault(); focusField(at, 'start'); return true; }
  if (e.key === 'ArrowLeft' && s.a.o === l.start && l.kind === 'note' && l.target !== null) { e.preventDefault(); focusField(at, 'end'); return true; }
  return false;
};
Links.onBar = () => quiet();
// Focus leaving the page closes the open link; the open control goes back to the words on Esc.
pane.addEventListener('focusout', () => setTimeout(() => {
  if (!pane.contains(document.activeElement) && Links.opened) { close(); quiet(); }
}));
prose.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && e.target.closest('.open-in') && Links.opened) { e.preventDefault(); toText(Links.opened, 'end'); }
}, true);
</script>
</body>
</html>
