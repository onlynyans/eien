<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Split window: 5 · A companion</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/* Shared by every exploration (inlined into each page by _build.py).
   The tokens are the approved ones from ../tokens.css (Washi, day and night),
   plus what the design pass adds: a radius scale, icon sizes, the machine
   face as a setting, and row weights. New tokens are marked NEW. */

:root { color-scheme: light dark; }
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

:root {
  --eien-desk: light-dark(#d9d2c8, #110e0b);
  --eien-blotter: light-dark(#eae5dd, #1a1713);
  --eien-band: light-dark(#f4f1ea, #201d19);
  --eien-paper: light-dark(#fdfbf7, #28241f);
  --eien-paper-raised: light-dark(#ffffff, #312d28);
  --eien-well: light-dark(#f9f7f3, #24201c);
  --eien-hover: light-dark(rgb(35 32 28 / 0.045), rgb(233 226 212 / 0.05));
  --eien-press: light-dark(rgb(35 32 28 / 0.1), rgb(233 226 212 / 0.1));
  --eien-selected: light-dark(#ede9e3, #38332e);
  --eien-scrim: light-dark(rgb(35 32 28 / 0.22), rgb(0 0 0 / 0.5));
  --eien-shadow-sheet: 0 1px 2px light-dark(rgb(58 44 26 / 0.06), rgb(0 0 0 / 0.4)),
    0 6px 24px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45));
  --eien-shadow-float: 0 2px 6px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45)),
    0 14px 36px light-dark(rgb(58 44 26 / 0.16), rgb(0 0 0 / 0.6));
  --eien-ink: light-dark(#23201c, #e9e2d4);
  --eien-ink-soft: light-dark(#51473c, #c3b9a7);
  --eien-pencil: light-dark(#5d5348, #a7a095);
  --eien-faded: light-dark(#766d62, #837c73);
  --eien-rule-soft: light-dark(rgb(35 32 28 / 0.07), rgb(233 226 212 / 0.07));
  --eien-rule: light-dark(rgb(35 32 28 / 0.13), rgb(233 226 212 / 0.14));
  --eien-rule-strong: light-dark(rgb(35 32 28 / 0.26), rgb(233 226 212 / 0.26));
  --eien-hairline: 1px;
  --eien-mark-w: 2px;
  --eien-seal: light-dark(#c4472d, #e0603f);
  --eien-seal-wash: light-dark(rgb(196 71 45 / 0.08), rgb(224 96 63 / 0.12));
  --eien-on-seal: light-dark(#fbf8f2, #1a1714);
  --eien-focus: var(--eien-ink-soft);
  --eien-added: light-dark(#485c2c, #9cb880);
  --eien-added-wash: light-dark(rgb(79 107 58 / 0.13), rgb(156 184 128 / 0.14));
  --eien-removed: light-dark(#93304a, #e98aa0);
  --eien-caution: light-dark(#6b501f, #d0a659);
  --eien-caution-wash: light-dark(rgb(138 100 32 / 0.11), rgb(208 166 89 / 0.12));

  /* The machine voice: IBM Plex Mono by default, now a setting (NEW: set from FACES). */
  --eien-face-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --eien-face-seal: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --eien-size-meta: 11px;
  --eien-size-label: 10px;
  --eien-leading-row: 1.35;
  --eien-track-label: 0.12em;
  --eien-space-1: 4px; --eien-space-2: 8px; --eien-space-3: 12px; --eien-space-4: 16px;
  --eien-space-5: 24px; --eien-space-6: 32px; --eien-space-7: 48px; --eien-space-8: 72px;
  --eien-row-h: 30px;
  --eien-touch: 44px;
  --eien-seal-size: 22px;
  --eien-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --eien-quick: 120ms;
  --eien-calm: 220ms;
  --eien-leading-tighten: 0;
  --eien-sheet-pad-x: var(--eien-space-8);
  --eien-sheet-pad-top: var(--eien-space-7);
  --eien-page-gutter: var(--eien-space-5);
  --eien-title-gap: var(--eien-space-6);
  --eien-paragraph-gap: var(--eien-space-4);
  --eien-row-pad-y: var(--eien-space-3);

  /* NEW: corners. Not everything is square. A small scale: s for what you press
     (buttons, fields, chips), m for what floats (menus, popovers, the tool slip),
     l for what covers the window (a sheet over it, the phone's bottom sheet).
     Paper itself (the sheet, the panes) stays square. Each exploration sets its own. */
  --eien-radius-s: 3px;
  --eien-radius-m: 6px;
  --eien-radius-l: 10px;
  --eien-radius-dot: 999px;

  /* NEW: icons. Drawn on a 16-unit grid, stroked in the ink they sit in. */
  --eien-icon: 16px;
  --eien-icon-stroke: 1.25;
  --eien-control: 28px; /* an icon control's square, desktop */

  /* NEW: row names' weight, two settings (400–700). A selected list title is 100 heavier. */
  --eien-weight-tree: 400;
  --eien-weight-list: 400;
}

/* The text voice: the writer's choice, sizes tuned per face (from ../tokens.css). */
:root, [data-face='newsreader'] { --eien-face-text: 'Newsreader', 'Iowan Old Style', Georgia, serif; --eien-size-prose: 22px; --eien-size-title: 36px; --eien-size-heading: 23px; --eien-size-row: 16px; --eien-size-preview: 14px; --eien-leading-prose: calc(1.5 - var(--eien-leading-tighten)); --eien-measure: 29em; }
[data-face='literata'] { --eien-face-text: 'Literata', Georgia, serif; --eien-size-prose: 19px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.72 - var(--eien-leading-tighten)); --eien-measure: 34em; }
[data-face='plex-sans'] { --eien-face-text: 'IBM Plex Sans', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.76 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='source-sans'] { --eien-face-text: 'Source Sans 3', Arial, sans-serif; --eien-size-prose: 20px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 31em; }
[data-face='atkinson'] { --eien-face-text: 'Atkinson Hyperlegible Next', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='schibsted'] { --eien-face-text: 'Schibsted Grotesk', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 33em; }
[data-face='hanken'] { --eien-face-text: 'Hanken Grotesk', Arial, sans-serif; --eien-size-prose: 19px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='instrument'] { --eien-face-text: 'Instrument Sans', Arial, sans-serif; --eien-size-prose: 18.5px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.7 - var(--eien-leading-tighten)); --eien-measure: 31em; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--eien-blotter);
  color: var(--eien-ink);
  font-family: var(--eien-face-text);
  font-size: var(--eien-size-row);
  line-height: var(--eien-leading-row);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--eien-seal-wash); }
:focus-visible { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 2px; }

.seal {
  display: inline-grid; place-items: center; flex: none;
  width: var(--eien-seal-size); height: var(--eien-seal-size);
  background: var(--eien-seal); color: var(--eien-on-seal);
  font-family: var(--eien-face-seal); font-size: calc(var(--eien-seal-size) * 0.68); line-height: 1;
  border-radius: calc(var(--eien-radius-s) / 2);
  user-select: none;
}
.seal--small { --eien-seal-size: 10px; font-size: 0; }

.label {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil);
}
.count {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  font-variant-numeric: tabular-nums; color: var(--eien-pencil);
}

/* Where a word stays (menus, choices of a setting). */
.word-button {
  appearance: none; border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; padding: var(--eien-space-1) var(--eien-space-2);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft);
  cursor: pointer;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.word-button[aria-pressed='true'], .word-button[aria-checked='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* NEW: the icon control. The word button's states, a square of --eien-control. */
.icon-button {
  appearance: none; display: inline-grid; place-items: center; flex: none;
  width: var(--eien-control); height: var(--eien-control); padding: 0;
  border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; color: var(--eien-ink-soft); cursor: pointer; position: relative;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.icon-button svg, .icon { width: var(--eien-icon); height: var(--eien-icon); display: block; }
.icon { stroke-width: var(--eien-icon-stroke); }
.icon-button[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }
.icon-button:disabled { color: var(--eien-faded); cursor: default; }
@media (hover: hover) {
  .word-button:hover, .icon-button:not(:disabled):hover { color: var(--eien-ink); background: var(--eien-hover); }
}
.word-button:active, .icon-button:not(:disabled):active { background: var(--eien-press); border-color: var(--eien-rule-strong); }

/* NEW: a tooltip names an icon and its key: raised paper, the machine voice. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none;
  left: 50%; top: calc(100% + 6px); translate: -50% 0;
  white-space: pre; padding: 3px 7px; border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em;
  text-transform: none; color: var(--eien-ink-soft);
  opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
}
[data-tip-side='up']::after { top: auto; bottom: calc(100% + 6px); }
[data-tip-side='right']::after { left: calc(100% + 6px); top: 50%; translate: 0 -50%; }
[data-tip-side='left']::after { left: auto; right: calc(100% + 6px); top: 50%; translate: 0 -50%; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: 450ms; } }
[data-tip]:focus-visible::after { opacity: 1; }

.field {
  appearance: none; width: 100%; border: var(--eien-hairline) solid var(--eien-rule);
  border-radius: var(--eien-radius-s); background: var(--eien-well);
  padding: var(--eien-space-2) var(--eien-space-3);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink);
}
.field::placeholder { color: var(--eien-faded); }
.field:focus { outline: none; border-color: var(--eien-focus); }

/* Explorations' own bar: outside the app, like the mockups' bar. */
.xbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--eien-space-1) var(--eien-space-4);
  padding: var(--eien-space-2) var(--eien-space-4);
  background: var(--eien-paper-raised); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.xbar__name { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink); font-weight: 600; }
.xbar__group { display: flex; align-items: center; gap: 2px; }
.xbar__label { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); margin-right: var(--eien-space-1); }
.xnote { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }

/* The split window's second set (split-alt-*.html): the window, its panes and
   the parts all three directions share. Each direction's own look is in its
   page. Every value is a token or made of tokens; the few the app has and
   shared.css doesn't are mirrored here from src/ui/theme/tokens.css. */
/* Each layout's corners, as src/ui/chrome/*.css sets them on :root[data-layout]:
   A · Band 2/4/8, B · Slip 4/8/14, C · Running head 3/6/10. */
:root[data-layout='band'] { --eien-radius-s: 2px; --eien-radius-m: 4px; --eien-radius-l: 8px; }
:root[data-layout='slip'] { --eien-radius-s: 4px; --eien-radius-m: 8px; --eien-radius-l: 14px; }
:root[data-layout='runhead'] { --eien-radius-s: 3px; --eien-radius-m: 6px; --eien-radius-l: 10px; }
a.word-button { text-decoration: none; }
.word-button[aria-current='page'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* The seal as a button, as the app draws it: no ground, a hairline that shows on hover.
   Shared by the corner and split explorations. */
.seal-button { appearance: none; display: grid; place-items: center; padding: var(--eien-space-1); border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s); background: none; cursor: pointer; transition: border-color var(--eien-quick) var(--eien-ease); }
@media (hover: hover) { .seal-button:hover { border-color: var(--eien-rule); } }
.seal-button:active { background: var(--eien-press); }


:root {
  /* The app's own, from src/ui/theme/tokens.css. */
  --eien-field: color-mix(in srgb, var(--eien-ink) 6%, transparent);
  --eien-sidebar-w: 264px;
  --eien-list-w: 316px;
  --eien-panel-w: 284px;
  --status-h: 40px;
  /* Half a step: between the icons of one group, and a slip's lip round them. */
  --tool-gap: calc(var(--eien-space-1) / 2);
  /* Outside Eien: the desktop the window lies on, a step behind the desk. */
  --outside: color-mix(in oklab, var(--eien-desk) 88%, var(--eien-ink));
}

/* ── The exploration's frame: the bar, the window scaled to fit, the notes ── */
body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(var(--eien-panel-w), calc(var(--eien-panel-w) + var(--eien-space-8))); }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 45%); } }
.canvas { min-height: 0; overflow: auto; padding: var(--eien-space-4); background: var(--outside); }
.fit { position: relative; margin: 0 auto; }
.fit > .win { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.xbar input[type='range'] { width: calc(var(--eien-space-8) + var(--eien-space-7)); accent-color: var(--eien-ink-soft); }
.xbar output { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); min-width: 9ch; }
.notes { min-height: 0; overflow: auto; padding: var(--eien-space-4) var(--eien-space-5); background: var(--eien-desk); border-left: var(--eien-hairline) solid var(--eien-rule); font-size: var(--eien-size-preview); line-height: 1.55; color: var(--eien-ink-soft); }
@media (max-width: 900px) { .notes { border-left: 0; border-top: var(--eien-hairline) solid var(--eien-rule); } }
.notes h2 { margin: var(--eien-space-5) 0 var(--eien-space-2); font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); font-weight: 400; }
.notes h2:first-child { margin-top: 0; }
.notes p { margin: 0 0 var(--eien-space-2); }
.notes ul { margin: 0 0 var(--eien-space-2); padding-left: 1.1em; }
.notes li { margin-bottom: var(--eien-space-1); }
.notes b { color: var(--eien-ink); font-weight: 500; }
.notes a { color: var(--eien-ink); }
/* The skill's checkpoint, at the top of each page's notes: a term in the machine voice, its reason in the text face. */
.checkpoint { display: grid; grid-template-columns: auto 1fr; gap: var(--eien-space-1) var(--eien-space-3); margin: 0; padding: var(--eien-space-3) 0; border-block: var(--eien-hairline) solid var(--eien-rule-soft); }
.checkpoint dt { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); padding-top: var(--tool-gap); }
.checkpoint dd { margin: 0; }
kbd { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); padding: 0 var(--eien-space-1); border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-paper); white-space: nowrap; }

/* ── The window: the app's lengths ── */
.win {
  --band: calc(var(--eien-space-7) + var(--eien-space-2));
  --runhead-h: 0px;
  --controls-left: calc(var(--eien-space-8) + var(--eien-space-2)); /* the system's three lights */
  --sb: var(--eien-sidebar-w);
  --ls: var(--eien-list-w);
  --seal-box: calc(var(--eien-seal-size) + var(--eien-space-2) + 2 * var(--eien-hairline));
  width: var(--win-w); height: var(--win-h); position: relative; overflow: hidden;
  display: grid; grid-template-rows: var(--runhead-h) minmax(0, 1fr); grid-template-columns: var(--sb) var(--ls) minmax(0, 1fr);
  background: var(--eien-desk); color: var(--eien-ink); font-size: var(--eien-size-row);
  border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-l); box-shadow: var(--eien-shadow-float);
}
.win[data-layout='runhead'] { --band: var(--eien-space-7); --runhead-h: calc(var(--eien-space-6) + var(--eien-space-2)); }
.win[data-sb='shut'] { --sb: 0px; }
.win[data-layout='runhead'][data-sb='shut'] { --sb: var(--band); }
.win[data-list='away'] { --ls: 0px; }
.win > :is(.sb, .ls, .pg) { grid-row: 2; min-width: 0; min-height: 0; overflow: hidden; }
.win > .sb { grid-column: 1; }
.win > .ls { grid-column: 2; }
.win > .pg { grid-column: 3; }

/* The seal: past the lights in A and B, open or shut; at the sidebar's head in C, and its strip shut. */
.win { --seal-x: calc(var(--controls-left) + var(--eien-space-3)); --seal-y: calc((var(--band) - var(--seal-box)) / 2); }
.win[data-layout='runhead'] { --seal-x: var(--eien-space-3); --seal-y: calc(var(--runhead-h) + (var(--band) - var(--seal-box)) / 2); }
.win[data-layout='runhead'][data-sb='shut'] { --seal-x: calc((var(--band) - var(--seal-box)) / 2); }
/* Whatever band lies under the seal starts a gutter past it. */
.win { --past-seal: calc(var(--seal-x) + var(--seal-box) + var(--eien-space-4)); }
.seal-btn { position: absolute; z-index: 6; left: var(--seal-x); top: var(--seal-y); }
/* The system's lights, drawn as where they sit (their colours are the system's, not Eien's). */
.lights { position: absolute; z-index: 5; left: var(--eien-space-5); top: calc((var(--band) - var(--eien-space-3)) / 2); display: flex; gap: var(--eien-space-2); }
.win[data-layout='runhead'] .lights { top: calc((var(--runhead-h) - var(--eien-space-3)) / 2); }
.lights i { width: var(--eien-space-3); height: var(--eien-space-3); border-radius: var(--eien-radius-dot); border: var(--eien-hairline) solid var(--eien-rule-strong); background: var(--eien-hover); }

/* C's running head: one strip across the window, the lights and the panes' toggles, then the page's part. */
.runhead { grid-row: 1; grid-column: 1 / -1; display: flex; min-width: 0; background: var(--eien-desk); border-bottom: var(--eien-hairline) solid var(--eien-rule); }

/* ── The sidebar: the desk, a book's contents page ── */
.sb { display: flex; flex-direction: column; border-right: var(--eien-hairline) solid var(--eien-rule); }

.sb__sec { display: flex; align-items: center; height: var(--eien-row-h); padding: 0 var(--eien-space-4); margin-top: var(--eien-space-2); }
.trow {
  appearance: none; position: relative; display: flex; align-items: baseline; gap: var(--eien-space-2); height: var(--eien-row-h); line-height: var(--eien-row-h);
  padding: 0 var(--eien-space-4) 0 calc(var(--eien-space-4) * (1 + var(--d, 0))); border: 0; background: none; text-align: left; font: inherit;
  color: var(--eien-ink-soft); font-weight: var(--eien-weight-tree);
}
.trow__name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow--note { cursor: pointer; }
.trow--note .count { flex: none; width: var(--eien-space-5); }
@media (hover: hover) { .trow--note:hover { background: var(--eien-hover); color: var(--eien-ink); } }
.trow--note:focus-visible { outline-offset: calc(var(--eien-mark-w) * -1); }
.book-mark { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); padding: 0 var(--eien-space-1); border: var(--eien-hairline) solid var(--eien-rule); line-height: 1.4; }

:is(.trow, .row).is-chosen { background: var(--eien-selected); color: var(--eien-ink); }

:is(.trow, .row).is-beside::before { background: var(--eien-rule-strong); }

/* ── The note list: paper, an index ── */
.ls { background: var(--eien-paper); border-right: var(--eien-hairline) solid var(--eien-rule); display: flex; flex-direction: column; }
.ls__band { flex: none; display: flex; align-items: center; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-4); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.win[data-sb='shut']:not([data-layout='runhead']) .ls__band { padding-left: var(--past-seal); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--eien-space-2); padding: 0 var(--eien-space-3); height: var(--eien-control); background: var(--eien-field); border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-m); color: var(--eien-pencil); transition: border-color var(--eien-quick) var(--eien-ease); }
@media (hover: hover) { .search:hover { border-color: var(--eien-rule); } }
.search:focus-within { background: var(--eien-well); box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 0; outline: none; font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink); }
.search input::placeholder { color: var(--eien-faded); }
.ls__head { flex: none; padding: var(--eien-space-3) var(--eien-space-4) var(--eien-space-2); border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); }
.ls__title { font-size: var(--eien-size-heading); font-weight: 500; line-height: 1.3; }
.rows { overflow: auto; }
.row {
  appearance: none; position: relative; display: grid; grid-template-columns: var(--eien-space-6) minmax(0, 1fr) auto; gap: 0 var(--eien-space-1); width: 100%;
  padding: var(--eien-row-pad-y) var(--eien-space-4); border: 0; border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); background: none;
  text-align: left; cursor: pointer; font: inherit; color: var(--eien-ink);
}
@media (hover: hover) { .row:hover { background: var(--eien-hover); } }
.row:focus-visible { outline-offset: calc(var(--eien-mark-w) * -1); }
.row__ord { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); padding-top: var(--tool-gap); }
.row__title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: var(--eien-weight-list); }
.row.is-chosen .row__title { font-weight: 500; }
.row__preview { grid-column: 2 / 4; font-size: var(--eien-size-preview); color: var(--eien-pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.is-dragged { opacity: 0.72; }

/* ── The page pane and its parts, which each direction arranges ── */
.pg { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--eien-blotter); }
.pg > * { min-width: 0; min-height: 0; }
.tools { display: flex; align-items: center; gap: var(--tool-gap); min-width: 0; }
.tools .icon-button { color: var(--eien-pencil); }
/* Quiet until the pointer is over the part they belong to, or the keyboard is in them. */
.quiet { opacity: 0; transition: opacity var(--eien-calm) var(--eien-ease); }
.hover-scope:hover .quiet, .quiet:focus-within, .quiet:focus-visible { opacity: 1; }
@media (hover: none) { .quiet { opacity: 1; } }
/* A · Band: the page's band. B · Slip: a row of blotter with the raised slip in it. */
.band { display: flex; align-items: center; justify-content: space-between; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); min-width: 0; }
.topline { display: flex; align-items: center; justify-content: flex-end; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); min-width: 0; }
.slip { display: flex; align-items: center; gap: var(--tool-gap); padding: var(--tool-gap); background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
.tools-rule { width: var(--eien-hairline); height: var(--eien-space-4); margin: 0 var(--eien-space-1); background: var(--eien-rule); }
/* The formatting bar: A's band's second row; B's raised slip at the page's top left; C's raised rail down its margin. */
.fmt { display: flex; justify-content: center; align-items: center; gap: var(--tool-gap); padding: var(--tool-gap) var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.fmt .icon-button { color: var(--eien-ink-soft); }
.fmt__rule { width: var(--eien-hairline); height: var(--eien-space-4); margin: 0 var(--eien-space-1); background: var(--eien-rule); }
.win[data-layout='slip'] .fmt { position: absolute; z-index: 3; left: var(--eien-space-3); flex-wrap: wrap; justify-content: flex-start; max-width: calc(100% - 2 * var(--eien-space-3)); top: calc((var(--band) - var(--eien-control)) / 2 - var(--tool-gap)); padding: var(--tool-gap); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); background: var(--eien-paper-raised); box-shadow: var(--eien-shadow-float); }
.win[data-layout='runhead'] .fmt { position: absolute; z-index: 3; left: var(--eien-space-2); top: var(--eien-space-4); flex-direction: column; padding: var(--tool-gap); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); background: var(--eien-paper-raised); box-shadow: var(--eien-shadow-float); }
.win[data-layout='runhead'] .fmt__rule { width: var(--eien-space-4); height: var(--eien-hairline); margin: var(--eien-space-1) 0; }

.blotter { position: relative; min-height: 0; overflow: auto; padding: var(--eien-space-4) var(--eien-space-4) 0; }
.win[data-layout='runhead'] .has-rail .blotter { padding-left: calc(var(--eien-control) + var(--eien-space-5)); }
.sheet {
  --sheet-x: clamp(var(--eien-space-4), 7%, var(--eien-sheet-pad-x));
  position: relative; max-width: calc(var(--eien-measure) + 2 * var(--eien-sheet-pad-x)); min-height: 100%; margin: 0 auto;
  padding: var(--eien-space-5) var(--sheet-x) var(--eien-space-6);

.win[data-layout='slip'] .sheet { border-radius: calc(var(--eien-radius-s) - var(--eien-hairline)); }
.sheet__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--eien-space-3); min-height: var(--eien-space-4); min-width: 0; }
.tagset { display: flex; gap: var(--eien-space-2); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); white-space: nowrap; }
.title { font-size: var(--eien-size-title); font-weight: 500; line-height: 1.2; margin: var(--eien-space-4) 0 var(--eien-space-5); }
.slips { display: flex; flex-wrap: wrap; gap: var(--eien-space-1); margin: calc(var(--eien-space-3) * -1) 0 var(--eien-space-5); }
.slips span { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink-soft); padding: 0 var(--eien-space-2); border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-band); }
.prose { outline: none; caret-color: var(--eien-seal); font-size: var(--eien-size-prose); line-height: var(--eien-leading-prose); }
.prose p { margin: 0 0 var(--eien-paragraph-gap); }
/* The colophon: the status line, a band at the page's foot. */
.colophon { display: flex; align-items: center; gap: var(--eien-space-2); height: var(--status-h); min-width: 0; padding: 0 var(--eien-space-4); background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; }
/* Its optional items go first in a narrow page, as the app's colophon drops them. */
.colophon { container: colophon / inline-size; }
.opt, .kept { display: contents; }
@container colophon (width < 600px) { .opt { display: none; } }
@container colophon (width < 400px) { .opt-narrow { display: none; } }
@container folio (width < 300px) { .opt-narrow { display: none; } }
/* A bar too narrow for every tool keeps the spare ones behind a ⋯. */
.band, .topline, .runhead__page, .runhead__seg { container-type: inline-size; }
.tool--more { display: none; }
@container (width < 520px) { .tool--spare { display: none; } .tool--more { display: inline-grid; } }
.dot { color: var(--eien-faded); }
.sealmark { color: var(--eien-seal); }
.pill { text-transform: none; padding: 0 var(--eien-space-2); border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-dot); }
.said { margin-left: auto; padding-left: var(--eien-space-3); color: var(--eien-ink-soft); text-transform: none; overflow: hidden; text-overflow: ellipsis; }

/* The divider: the pane edge's handle over a hairline; rule-strong under the pointer; the
   focus ink, 2px, while it's dragged or has the keyboard. */
.divider { position: relative; z-index: 4; width: var(--eien-space-2); margin: 0 calc(var(--eien-space-1) * -1); cursor: col-resize; outline: none; touch-action: none; }
.divider::after { content: ''; position: absolute; inset-block: 0; left: calc(50% - var(--eien-hairline) / 2); width: var(--eien-hairline); background: var(--eien-rule); transition: background var(--eien-quick) var(--eien-ease); }
.divider[data-axis='y'] { width: auto; height: var(--eien-space-2); margin: calc(var(--eien-space-1) * -1) 0; cursor: row-resize; }
.divider[data-axis='y']::after { inset-block: auto; inset-inline: 0; top: calc(50% - var(--eien-hairline) / 2); left: 0; width: auto; height: var(--eien-hairline); }
@media (hover: hover) { .divider:hover::after { background: var(--eien-rule-strong); } }
.divider:focus-visible::after, .divider.is-dragging::after { left: calc(50% - var(--eien-mark-w) / 2); width: var(--eien-mark-w); background: var(--eien-focus); }
.divider[data-axis='y']:is(:focus-visible, .is-dragging)::after { left: 0; width: auto; top: calc(50% - var(--eien-mark-w) / 2); height: var(--eien-mark-w); }

/* A note dragged over the page pane: where it would land. */
.drop-preview { position: absolute; z-index: 8; display: grid; place-items: center; pointer-events: none; background: color-mix(in srgb, var(--eien-paper-raised) 84%, transparent); border-left: var(--eien-mark-w) solid var(--eien-ink-soft); }
.drop-preview[data-edge='top'] { border-left: 0; border-top: var(--eien-mark-w) solid var(--eien-ink-soft); }
.drop-preview[data-edge='none'] { border-left: 0; outline: var(--eien-mark-w) solid var(--eien-ink-soft); outline-offset: calc(var(--eien-mark-w) * -1); }
.drop-preview .label { color: var(--eien-ink-soft); max-width: 80%; text-align: center; }

/* The menu: raised paper, the row's name at its head, an icon, a word and a key per choice. */
.menu { position: fixed; z-index: 40; min-width: calc(var(--eien-panel-w) - var(--eien-space-5)); padding: var(--eien-space-1); background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
.menu[hidden] { display: none; }
.menu__head { padding: var(--eien-space-2) var(--eien-space-2) var(--eien-space-1); font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); }
.menu__item { appearance: none; display: grid; grid-template-columns: var(--eien-icon) 1fr auto; align-items: center; gap: var(--eien-space-2); width: 100%; padding: var(--eien-space-1) var(--eien-space-2); min-height: var(--eien-control); border: 0; border-radius: var(--eien-radius-s); background: none; cursor: pointer; text-align: left; font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink-soft); }
.menu__item:focus { outline: none; background: var(--eien-selected); color: var(--eien-ink); }
@media (hover: hover) { .menu__item:hover { background: var(--eien-hover); color: var(--eien-ink); } }
.menu__key { font-size: var(--eien-size-label); color: var(--eien-pencil); }
.menu__rule { height: var(--eien-hairline); margin: var(--eien-space-1) var(--eien-space-2); background: var(--eien-rule-soft); }

@keyframes arrive { from { opacity: 0; } }
.win.is-arriving .arrives { animation: arrive var(--eien-calm) var(--eien-ease); }
@media (prefers-reduced-motion: reduce) { .quiet, .win.is-arriving .arrives { transition: none; animation: none; } }

/* A page's rows keep their places whether or not the formatting bar is there: the top
   (A's band, B's row of blotter), the formatting bar, the blotter, the colophon. B's and
   C's formatting bars float, placed against the page. */
.page { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.page > :is(.band, .topline) { grid-row: 1; }
.page > .fmt { grid-row: 2; }
.page > .blotter { grid-row: 3; }
.page > .colophon { grid-row: 4; }
.win:is([data-layout='slip'], [data-layout='runhead']) .page > .fmt { grid-row: auto; }
/* B: where a page is too narrow for both slips side by side, the formatting slip goes under
   the tools' row and the sheet makes room, as the app's slip.css does. */
.page { container: page / inline-size; }
@container page (width < 720px) {
  .win[data-layout='slip'] .page > .fmt { top: var(--band); }
  .win[data-layout='slip'] .page.has-fmt > .blotter { padding-top: calc(var(--eien-control) + var(--eien-space-4)); }
}


/* 5 · A companion: the second note isn't a second page. It's a companion at the
   window's right edge, where Versions opens: narrower, set in a smaller hand,
   with its own head and foot. The page keeps all its tools, and they act on it.
   The companion has its own few. Whichever one you aren't writing in sits back a
   step: its paper takes the band's tone. */
.pair { display: grid; min-width: 0; min-height: 0; height: 100%; }

.companion { display: grid; grid-template-rows: var(--band) minmax(0, 1fr) var(--status-h); background: var(--eien-paper); transition: background-color var(--eien-calm) var(--eien-ease); }
.companion__head { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-2) 0 var(--eien-space-4); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.companion__name { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.companion__scroll { overflow: auto; padding: var(--eien-space-4) var(--eien-space-5) var(--eien-space-6); }
.companion .tagset { margin-bottom: var(--eien-space-3); }
/* A smaller hand: a note beside the chapter, read more than written. */
.companion .prose { font-size: var(--eien-size-row); }
.companion .prose p { margin-bottom: var(--eien-space-3); }
.companion__foot { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-4); background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; }
/* Sitting back a step: the paper you aren't writing in takes the band's tone, darker being further back. */
.sheet { transition: background-color var(--eien-calm) var(--eien-ease); }
.is-resting, .sheet.is-resting { background: var(--eien-band); }

/* C: the running head's page part sits over the page; the companion keeps its own head. */
.runhead__page, .runhead__pair { display: grid; height: 100%; min-width: 0; }
.runhead__seg { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-3); }
.runhead__seg .crumb { flex: 1; text-align: center; }

<script>

/** The explorations' bar: [data-x-set="attr"] groups set data-<attr> on <html>. */
function wireBar(onChange = () => {}) {
  for (const group of document.querySelectorAll('[data-x-set]')) {
    const attr = group.dataset.xSet;
    const buttons = [...group.querySelectorAll('button[data-value]')];
    const pick = (value) => {
      document.documentElement.dataset[attr] = value;
      for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.value === value));
      onChange(attr, value);
    };
    for (const b of buttons) b.addEventListener('click', () => pick(b.dataset.value));
    pick(document.documentElement.dataset[attr] ?? buttons[0].dataset.value);
  }
}

  ctx.room = ctx.winW - sbW - (ctx.listShown ? 316 : 0);
  ctx.same = split && S.sides[0] === S.sides[1];
  Object.assign(ctx, helpers(ctx));
  ctx.state = DIR.state ? DIR.state(ctx) : '';
  return ctx;
}

/** The pieces: buttons, the views, the formatting bar, a note's head, words and foot. */
function helpers(ctx) {
  const h = {
    id: (i) => S.sides[i],
    note: (i) => NOTES[S.sides[i]],
    /** An icon control: its name, its key in the tooltip, `attrs` for what it does. */
    btn: (icon, label, { key = '', attrs = '', cls = '', tip = '' } = {}) =>
      `<button class="icon-button ${cls}" data-icon="${icon}" aria-label="${esc(label)}" data-tip="${esc(label)}${key ? `  ${KEY(key)}` : ''}"${tip ? ` data-tip-side="${tip}"` : ''} ${attrs}></button>`,
    views: () => `<span class="tools" role="group" aria-label="View">${[['live', 'Live'], ['source', 'Source'], ['reading', 'Reading']].map(([n, w], k) => h.btn(n, w, { attrs: `aria-pressed="${k === 0}" data-say="${w}: the view, for the page you're writing in"` })).join('')}</span>`,
    tool: (name, i, cls = '') => {
      const t = NOTES[S.sides[i ?? S.active]].title;
      const all = {
        compare: ['compare', 'Compare', 'Mod-Shift-D', `Compare: ${t} against its last seal`],
        versions: ['versions', 'Versions', '', `Versions: ${t}'s seals open at the window's right edge`],
        copy: ['copy', 'Copy as HTML', 'Mod-Shift-C', `Copied ${t} as HTML`],
        focus: ['focus', 'Focus mode', 'Mod-Shift-Enter', 'Focus mode: every paragraph but the caret’s fades back'],
        cards: ['cards', 'Outline cards', 'Mod-Shift-O', 'Outline cards: the book’s cards take the page'],
        format: ['format', 'Formatting bar', 'Mod-Shift-B', ''],
      };
      const [icon, label, key, said] = all[name];
      return name === 'format'
        ? h.btn(icon, label, { key, attrs: `aria-pressed="${ctx.fmt}" data-fmt-toggle` })
        : h.btn(icon, label, { key, cls: SPARE.includes(name) ? `tool--spare ${cls}` : cls, attrs: `data-say="${esc(said)}"` });
    },
    /** In a narrow bar, the spare tools go behind one ⋯, which only shows then. */
    spare: (i) => h.btn('more', 'More tools', { cls: 'tool--more', attrs: `data-more="spare" data-for="${i ?? S.active}" aria-haspopup="menu"` }),
    tools: (names, i, cls = '') => `<span class="tools ${cls}">${names.map((n) => h.tool(n, i)).join('')}</span>`,
    closeBtn: (i, cls = '') => h.btn('close', `Close this side: ${NOTES[S.sides[i]].title}`, { key: 'Mod-W', cls: `close-side ${cls}`, attrs: `data-close-side="${i}"` }),
    swapBtn: (cls = 'tool--spare') => h.btn('swap', 'Swap the sides', { cls, attrs: 'data-swap' }),
    fmtBar: (extra = '', attrs = '') => {
      if (!ctx.fmt) return '';
      const runs = [['bold', 'italic', 'underline', 'strike'], ['heading', 'highlight', 'link'], ['quote', 'bullets', 'numbers', 'checklist'], ['table']];
      const name = (n) => ({ bullets: 'Bulleted list', numbers: 'Numbered list', strike: 'Strikethrough' })[n] ?? n[0].toUpperCase() + n.slice(1);
      return `<div class="fmt ${extra}" role="toolbar" aria-label="Format" ${attrs}>${runs.map((run) => run.map((n) => h.btn(n, name(n), { attrs: 'data-format' })).join('')).join('<span class="fmt__rule" aria-hidden="true"></span>')}</div>`;
    },
    crumb: (i, cls = '') => `<span class="crumb ${cls}">${esc(NOTES[S.sides[i]].crumb)}</span>`,
    tagset: (i) => `<span class="tagset">${NOTES[S.sides[i]].tags.map((t) => `<span>#${esc(t)}</span>`).join('')}</span>`,
    slips: (i) => `<div class="slips">${NOTES[S.sides[i]].tags.map((t) => `<span>#${esc(t)}</span>`).join('')}</div>`,
    pills: (i) => NOTES[S.sides[i]].tags.map((t) => `<span class="pill">#${esc(t)}</span>`).join(''),
    /** The sheet's running head: A's crumb and tags, B's crumb; C's is the window's strip. */
    head: (i) => (ctx.layout === 'band' ? `<div class="sheet__head">${h.crumb(i)}${h.tagset(i)}</div>`
      : ctx.layout === 'slip' ? `<div class="sheet__head">${h.crumb(i)}</div>` : ''),
    /** The title (B's tag slips under it) and the words, which take the keyboard. */
    words: (i, { title = true } = {}) => {
      const n = h.note(i);
      return `${title ? `<h1 class="title">${esc(n.title)}</h1>` : ''}${ctx.layout === 'slip' && title ? h.slips(i) : ''}
        <div class="prose" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" data-note="${S.sides[i]}" data-side="${i}" aria-label="${esc(n.title)}: its words">${paraHtml(S.sides[i])}</div>`;
    },
    /** A note's figures, in the machine voice: words, and its last seal (the seal's mark is the status line's own). */
    figures: (i, { ord = ctx.split, today = false, keepOrd = false } = {}) => {
      const n = h.note(i);
      const id = S.sides[i];
      // A note outside the book's chapters has no number to give.
      return `${ord && n.ord !== '·' ? `<span class="${keepOrd ? 'kept' : 'opt'}"><span>${esc(n.ord)}</span><span class="dot" aria-hidden="true">·</span></span>` : ''}<span><span data-words="${id}">${words(id)}</span> words</span>${today ? '<span class="opt"><span class="dot" aria-hidden="true">·</span><span>today 412</span></span>' : ''}<span class="dot" aria-hidden="true">·</span><span class="sealed"><span class="sealmark" aria-hidden="true">▪</span> <span class="opt-narrow">sealed </span>${esc(n.sealed)}</span>`;
    },
    said: () => `<span class="said" role="status" aria-live="polite" data-said>${esc(S.said)}</span>`,
  };
  return h;
}

/** The window: the lights, the seal, the sidebar, the list (unless it stepped aside) and the page pane. */
function windowHtml(ctx) {
  const d = root.dataset;
  const tree = DIR.treeNotes?.(ctx) ?? false;
  const trow = (name, count, depth = 0, cls = '') => `<div class="trow${cls}" style="--d:${depth}"><span class="trow__name">${name}</span>${count}</div>`;
  const noteRow = (id, kind) => {
    const n = NOTES[id];
    const chosen = S.sides[S.active] === id;
    const beside = ctx.split && !chosen && S.sides.includes(id);
    const mark = `${chosen ? ' is-chosen' : ''}${beside ? ' is-beside' : ''}`;
    const say = beside ? ` aria-description="Open on the other side"` : '';
    return kind === 'tree'
      ? `<button class="trow trow--note${mark}" style="--d:2" data-note-row="${id}" draggable="true" aria-current="${chosen ? 'page' : 'false'}"${say}><span class="count">${esc(n.ord)}</span><span class="trow__name">${esc(n.title)}</span></button>`
      : `<button class="row${mark}" data-note-row="${id}" draggable="true" aria-current="${chosen ? 'page' : 'false'}"${say}><span class="row__ord">${esc(n.ord)}</span><span class="row__title">${esc(n.title)}</span><span class="count" data-words="${id}">${words(id)}</span><span class="row__preview" data-preview="${id}">${esc(plain(id))}</span></button>`;
  };
  const runhead = ctx.layout === 'runhead'
    ? `<div class="runhead"><div class="runhead__panes">${ctx.btn('sidebar', 'Sidebar', { key: 'Mod-\\', attrs: 'data-sb-toggle' })}${ctx.btn('list', 'Note list', { key: 'Mod-Shift-\\', attrs: 'data-list-toggle aria-pressed="' + ctx.listShown + '"' })}</div><div class="runhead__page">${DIR.strip(ctx)}</div></div>` : '';
  return `<div class="win" data-layout="${ctx.layout}" data-sb="${d.sb}" data-list="${ctx.listShown ? 'shown' : 'away'}" data-dir="${DIR.id}" style="--win-w:${ctx.winW}px; --win-h:${WIN_H}px">
  ${runhead}
  <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
  <button class="seal-button seal-btn" data-sb-toggle aria-label="${d.sb === 'open' ? 'Hide' : 'Show'} the sidebar" aria-expanded="${d.sb === 'open'}" data-tip="${d.sb === 'open' ? 'Hide' : 'Show'} the sidebar  ${KEY('Mod-\\')}"><span class="seal" aria-hidden="true">永</span></button>
  <aside class="sb" aria-label="Sidebar"><div class="sb__head">Eien</div>
    <div class="sb__sec"><span class="label">Library</span></div>${trow('All notes', '<span class="count">214</span>')}${trow('Pinned', '<span class="count">3</span>')}
    <div class="sb__sec"><span class="label">Folders</span></div>${trow('Fic', '<span class="count">41</span>')}
    ${trow('Beneath the Walls', '<span class="book-mark">Book</span><span class="count">14</span>', 1, tree ? '' : ' is-chosen')}
    ${tree ? BOOK.map((id) => noteRow(id, 'tree')).join('') : ''}${trow('Ideas', '<span class="count">57</span>')}
  </aside>
  ${ctx.listShown ? `<section class="ls" aria-label="Note list"><div class="ls__band"><label class="search"><svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS.search}</svg><input type="search" placeholder="Search" aria-label="Search notes" /></label>${DIR.listBand?.(ctx) ?? ''}</div>
    <div class="ls__head"><div class="ls__title">Beneath the Walls</div><span class="label">14 notes · 33,206 words · book</span></div>
    <div class="rows">${BOOK.map((id) => noteRow(id, 'list')).join('')}</div></section>` : ''}
  <main class="pg" aria-label="${ctx.split ? 'Two notes' : 'Page'}">${DIR.page(ctx)}</main>
</div>`;
}

let drawn = null;
/** Draws the window, keeping the caret and each scroll where they were. */
function draw() {
  const d = root.dataset;
  if (!d.layout || !d.theme || !d.sb || !d.fmt || !d.width) return;
  const caret = keepCaret();
  const scrolls = Object.fromEntries([...canvas.querySelectorAll('[data-scroll]')].map((el) => [el.dataset.scroll, el.scrollTop]));
  const ctx = context();
  canvas.innerHTML = `<div class="fit">${windowHtml(ctx)}</div>`;
  drawIcons(canvas);
  for (const el of canvas.querySelectorAll('[data-scroll]')) el.scrollTop = scrolls[el.dataset.scroll] ?? 0;
  if (S.arrive && !matchMedia('(prefers-reduced-motion: reduce)').matches) canvas.querySelector('.win').classList.add('is-arriving');
  S.arrive = false;
  drawn = ctx;
  fit();
  caret();
  document.querySelector('.xbar output').textContent = `${d.width} px${ctx.state ? ` · ${ctx.state}` : ''}`;
}
/** Where the caret is, by side and character, to put it back after a draw. */
function keepCaret() {
  const el = document.activeElement;
  const sel = getSelection();
  if (!el?.classList?.contains('prose')) return () => {};
  if (!sel.rangeCount) return () => canvas.querySelector(`.prose[data-side="${el.dataset.side}"]`)?.focus({ preventScroll: true });
  const range = sel.getRangeAt(0).cloneRange();
  range.selectNodeContents(el);
  range.setEnd(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
  const at = range.toString().length;
  const side = el.dataset.side;
  return () => {
    const prose = canvas.querySelector(`.prose[data-side="${side}"]`);
    if (prose) placeCaret(prose, at);
  };
}
function placeCaret(prose, at) {
  const walk = document.createTreeWalker(prose, NodeFilter.SHOW_TEXT);
  let left = at;
  let node = walk.nextNode();
  while (node && left > node.length) { left -= node.length; node = walk.nextNode(); }
  prose.focus({ preventScroll: true });
  const range = document.createRange();
  if (node) range.setStart(node, left); else range.selectNodeContents(prose);
  range.collapse(!!node);
  getSelection().removeAllRanges();
  getSelection().addRange(range);
}
/** The window keeps its real size and is scaled to fit what's left of the screen. */
function fit() {
  const box = canvas.querySelector('.fit');
  const win = box?.firstElementChild;
  if (!win) return;
  const w = +root.dataset.width;
  const scale = Math.min(1, (canvas.clientWidth - 32) / w, (canvas.clientHeight - 32) / WIN_H);
  win.style.transform = `scale(${scale})`;
  box.style.width = `${w * scale}px`;
  box.style.height = `${WIN_H * scale}px`;
}

let saidTimer;
/** What Eien says, in the colophon, for a few seconds. */
function say(text) {
  S.said = text;
  for (const el of canvas.querySelectorAll('[data-said]')) el.textContent = text;
  clearTimeout(saidTimer);
  saidTimer = setTimeout(() => { S.said = ''; for (const el of canvas.querySelectorAll('[data-said]')) el.textContent = ''; }, 5000);
}
const focusProse = (i) => canvas.querySelector(`.prose[data-side="${i}"]`)?.focus();

// What the writer does.
const act = {
  /** A side becomes the active one: the list, the tools and the keys follow it. */
  activate(i, focus = false) {
    if (i >= S.sides.length) return;
    if (i !== S.active) { S.active = i; S.arrive = true; draw(); }
    if (focus) focusProse(i);
  },
  /** A note chosen in the list or the tree opens in the active page. */
  open(id) { S.sides[S.active] = id; draw(); },
  /** A note dropped on a page opens there, and that page is active. */
  openAt(i, id) { S.active = i; S.sides[i] = id; draw(); focusProse(i); },
  /** Open to the Side: a second page (or the other one), now active, unless the direction refuses. */
  toSide(id) {
    const refused = DIR.refuse?.(context());
    if (refused) { say(refused); return; }
    const at = S.sides.length === 1 ? 1 : 1 - S.active;
    S.sides[at] = id;
    S.active = at;
    S.arrive = true;
    draw();
    const word = DIR.opened?.(context());
    if (word) say(word);
    focusProse(S.active);
  },
  close(i) {
    const t = NOTES[S.sides[i]].title;
    S.sides.splice(i, 1);
    S.active = 0;
    S.listBack = false;
    draw();
    say(`Closed ${t}: it's in the list as it was`);
  },
  swap() { S.sides.reverse(); S.active = 1 - S.active; draw(); say('Swapped'); },
  /** ⌘D: the note opened beside itself; split, the other side closed. */
  toggle() { if (S.sides.length === 2) act.close(1 - S.active); else act.toSide(S.sides[0]); },
};

function wire() {
  // A click or the keyboard in a page makes it active, once the caret has landed.
  const activateFrom = (el) => {
    const side = el?.closest?.('[data-side]');
    if (side && drawn?.split && +side.dataset.side !== S.active) act.activate(+side.dataset.side);
  };
  canvas.addEventListener('click', (e) => { if (!e.target.closest('button, .divider, a, input')) activateFrom(e.target); });
  canvas.addEventListener('focusin', (e) => { if (e.target.classList.contains('prose')) setTimeout(() => activateFrom(document.activeElement)); });
  // Typing: one document, so the same note on both sides shows it in both, and its counts follow.
  canvas.addEventListener('input', (e) => {
    const prose = e.target.closest('.prose');
    if (!prose) return;
    const id = prose.dataset.note;
    NOTES[id].paras = prose.innerText.split(/\n+/).filter((t) => t.trim());
    for (const other of canvas.querySelectorAll(`.prose[data-note="${id}"]`)) {
      if (other === prose) continue;
      other.replaceChildren(...NOTES[id].paras.map((t) => Object.assign(document.createElement('p'), { textContent: t })));
    }
    for (const el of canvas.querySelectorAll(`[data-words="${id}"]`)) el.textContent = words(id);
    for (const el of canvas.querySelectorAll(`[data-preview="${id}"]`)) el.textContent = plain(id);
  });
  canvas.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.noteRow) (mod(e) ? act.toSide : act.open)(d.noteRow);
    else if (d.closeSide) act.close(+d.closeSide);
    else if ('swap' in d) act.swap();
    else if (d.turn) act.activate(+d.turn, true);
    else if ('sbToggle' in d) document.querySelector(`[data-x-set="sb"] [data-value="${root.dataset.sb === 'open' ? 'shut' : 'open'}"]`).click();
    else if ('fmtToggle' in d) document.querySelector(`[data-x-set="fmt"] [data-value="${root.dataset.fmt === 'on' ? 'off' : 'on'}"]`).click();
    else if ('listToggle' in d) DIR.toggleList ? DIR.toggleList(context()) : say('The note list stays while split, in this direction');
    else if (d.say) say(d.say);
    else if (d.more === 'spare') openMenu(spareMenu(+d.for), b.getBoundingClientRect());
    else if ('more' in d) openMenu(DIR.more(context(), +d.more), b.getBoundingClientRect());
    else DIR.click?.(b, context());
  });
  // Keep the caret in the words when a formatting button is pressed.
  canvas.addEventListener('mousedown', (e) => { if (e.target.closest('[data-format]')) e.preventDefault(); });
  canvas.addEventListener('keydown', (e) => {
    const row = e.target.closest('[data-note-row]');
    if (row && e.key === 'Enter') { e.preventDefault(); (mod(e) ? act.toSide : act.open)(row.dataset.noteRow); }
    if (row && (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey))) { e.preventDefault(); openMenu(rowMenu(row.dataset.noteRow), row.getBoundingClientRect()); }
  });
  canvas.addEventListener('contextmenu', (e) => {
    const row = e.target.closest('[data-note-row]');
    if (!row) return;
    e.preventDefault();
    openMenu(rowMenu(row.dataset.noteRow), { left: e.clientX, bottom: e.clientY });
  });
  wireDivider();
  wireDrop();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
    if (!mod(e) || e.altKey) return;
    // ⌘3 goes to the page; pressed in a page, to the other one.
    if (e.key === '3' && !e.shiftKey) {
      e.preventDefault();
      const inPage = document.activeElement?.classList.contains('prose');
      if (inPage && S.sides.length === 2) act.activate(1 - S.active, true);
      else focusProse(S.active);
    }
    if (e.key.toLowerCase() === 'd' && !e.shiftKey) { e.preventDefault(); act.toggle(); }
  });
}

/** Re-applies each [data-grid]'s tracks, from the state, while the divider is dragged. */
function applyGrids() {
  const ctx = context();
  for (const el of canvas.querySelectorAll('[data-grid]')) {
    const [prop, value] = DIR.grid(el.dataset.grid, ctx);
    el.style[prop] = value;
  }
  for (const div of canvas.querySelectorAll('.divider')) div.setAttribute('aria-valuenow', String(DIR.valueNow(ctx)));
}
const gridStyle = (name, ctx) => { const [prop, value] = DIR.grid(name, ctx); return `data-grid="${name}" style="${prop === 'gridTemplateRows' ? 'grid-template-rows' : 'grid-template-columns'}:${value}"`; };

function wireDivider() {
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    const div = e.target.closest('.divider');
    if (!div) return;
    e.preventDefault();
    div.setPointerCapture(e.pointerId);
    div.classList.add('is-dragging');
    drag = { div, axis: div.dataset.axis ?? 'x', box: div.parentElement };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const r = drag.box.getBoundingClientRect();
    const f = drag.axis === 'x' ? (e.clientX - r.left) / r.width : (e.clientY - r.top) / r.height;
    DIR.resize(f, drag.axis === 'x' ? drag.box.offsetWidth : drag.box.offsetHeight, context());
    applyGrids();
  });
  const end = () => { if (drag) { drag.div.classList.remove('is-dragging'); drag = null; } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('dblclick', (e) => { if (e.target.closest('.divider')) { DIR.even(context()); applyGrids(); } });
  canvas.addEventListener('keydown', (e) => {
    const div = e.target.closest?.('.divider');
    if (!div) return;
    const back = div.dataset.axis === 'y' ? 'ArrowUp' : 'ArrowLeft';
    const on = div.dataset.axis === 'y' ? 'ArrowDown' : 'ArrowRight';
    const step = { [back]: -1, [on]: 1, Home: -50, End: 50 }[e.key];
    if (step) { e.preventDefault(); DIR.nudge(step, context()); applyGrids(); }
    if (e.key === 'Enter') { e.preventDefault(); DIR.even(context()); applyGrids(); }
  });
}

/** A divider: the window splitter's role and value; `axis` x is side by side. */
const dividerHtml = (ctx, { axis = 'x', label = 'Between the two pages', cls = '' } = {}) =>
  `<div class="divider ${cls}" data-axis="${axis}" role="separator" aria-orientation="${axis === 'x' ? 'vertical' : 'horizontal'}" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${DIR.valueNow(ctx)}" tabindex="0" title="Drag, or ${axis === 'x' ? '← →' : '↑ ↓'} · double-click to even"></div>`;

// Dragging a note from the list or the tree onto the page pane: where it would land, shown first.
function wireDrop() {
  let dragged = null;
  const preview = document.createElement('div');
  preview.className = 'drop-preview';
  preview.innerHTML = '<span class="label"></span>';
  canvas.addEventListener('dragstart', (e) => {
    const row = e.target.closest('[data-note-row]');
    if (!row) return;
    dragged = row.dataset.noteRow;
    e.dataTransfer.setData('text/plain', NOTES[dragged].title);
    e.dataTransfer.effectAllowed = 'copy';
    row.classList.add('is-dragged');
  });
  const where = (e) => {
    const pg = canvas.querySelector('.pg');
    const r = pg.getBoundingClientRect();
    return { pg, w: DIR.drop(context(), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height) };
  };
  canvas.addEventListener('dragover', (e) => {
    if (!dragged || !e.target.closest('.pg')) { preview.remove(); return; }
    e.preventDefault();
    const { pg, w } = where(e);
    if (preview.parentElement !== pg) pg.append(preview);
    const [l, t, r, b] = w.box;
    Object.assign(preview.style, { left: `${l * 100}%`, top: `${t * 100}%`, right: `${(1 - r) * 100}%`, bottom: `${(1 - b) * 100}%` });
    preview.dataset.edge = w.edge ?? 'left';
    preview.firstElementChild.textContent = w.label;
  });
  canvas.addEventListener('dragleave', (e) => { if (!e.relatedTarget || !canvas.querySelector('.pg')?.contains(e.relatedTarget)) preview.remove(); });
  canvas.addEventListener('drop', (e) => {
    if (!dragged || !e.target.closest('.pg')) return;
    e.preventDefault();
    const { w } = where(e);
    const id = dragged;
    preview.remove();
    if (w.side === 'new') act.toSide(id); else act.openAt(w.side, id);
  });
  canvas.addEventListener('dragend', () => { dragged = null; preview.remove(); canvas.querySelector('.is-dragged')?.classList.remove('is-dragged'); });
}

// The menu: a note's right-click menu, or a direction's own (the companion's ⋯).
const menu = document.createElement('div');
menu.className = 'menu';
menu.setAttribute('role', 'menu');
menu.hidden = true;
let menuBack = null;
/** A note's menu, with the split's choices. */
function rowMenu(id) {
  const split = S.sides.length === 2;
  return { head: NOTES[id].title, items: [
    ['open', 'Open', 'Enter', () => act.open(id)],
    ['side', DIR.sideWord ?? 'Open to the Side', `${KEY('Mod-')}click`, () => act.toSide(id)],
    ['window', 'Open in New Window', '', () => say('A new window opens on this note: see New window & phone')],
    ...(split ? ['|', ['swap', 'Swap Sides', '', () => act.swap()], ['close', 'Close the Other Side', KEY('Mod-D'), () => act.close(1 - S.active)]] : []),
  ] };
}
/** The spare tools, for a note, when its bar is too narrow to show them. */
function spareMenu(i) {
  const t = NOTES[S.sides[i]].title;
  return { head: t, items: [
    ['versions', 'Versions', '', () => say(`Versions: ${t}'s seals open at the window's right edge`)],
    ['compare', 'Compare', KEY('Mod-Shift-D'), () => say(`Compare: ${t} against its last seal`)],
    ['copy', 'Copy as HTML', KEY('Mod-Shift-C'), () => say(`Copied ${t} as HTML`)],
    ['cards', 'Outline cards', KEY('Mod-Shift-O'), () => say('Outline cards: the book’s cards take the page')],
    ...(S.sides.length === 2 ? ['|', ['swap', 'Swap the sides', '', () => act.swap()]] : []),
  ] };
}
function openMenu({ head, items }, at) {
  menuBack = document.activeElement;
  const svg = (name) => (ICONS[name] ? `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>` : '<span></span>');
  menu.innerHTML = `<div class="menu__head" aria-hidden="true">${esc(head)}</div>${items.map((it, k) => (it === '|' ? '<div class="menu__rule" role="separator"></div>'
    : `<button class="menu__item" role="menuitem" data-run="${k}">${svg(it[0])}<span>${esc(it[1])}</span><span class="menu__key">${esc(it[2])}</span></button>`)).join('')}`;
  menu.setAttribute('aria-label', head);
  menu.hidden = false;
  menu.style.left = `${Math.min(at.left + 8, innerWidth - menu.offsetWidth - 8)}px`;
  menu.style.top = `${Math.min(at.bottom + 4, innerHeight - menu.offsetHeight - 8)}px`;
  menu.onclick = (e) => {
    const k = e.target.closest('[data-run]')?.dataset.run;
    if (k === undefined) return;
    closeMenu(false);
    items[+k][3]();
  };
  menu.onkeydown = (e) => {
    const all = [...menu.querySelectorAll('.menu__item')];
    const i = all.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: all.length - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); all[(to + all.length) % all.length].focus(); }
    if (e.key === 'Tab') { e.preventDefault(); closeMenu(); }
  };
  menu.querySelector('.menu__item').focus();
}
function closeMenu(back = true) {
  if (menu.hidden) return;
  menu.hidden = true;
  if (back) menuBack?.focus?.();
}
document.addEventListener('pointerdown', (e) => { if (!menu.contains(e.target)) closeMenu(false); });

/** The exploration: its bar, the window, and the notes beside it. */
function mountAlt(dir) {
  DIR = dir;
  const mine = [['facing', '4 · Facing pages'], ['companion', '5 · A companion'], ['follow', '6 · Tools that follow']];
  const earlier = [['apart', '1'], ['shared', '2'], ['sheets', '3'], ['window', 'New window']];
  const group = (attr, label, choices) => `<div class="xbar__group" data-x-set="${attr}"><span class="xbar__label">${label}</span>${choices.map(([v, w]) => `<button class="word-button" data-value="${v}">${w}</button>`).join('')}</div>`;
  document.body.insertAdjacentHTML('afterbegin', `
<header class="xbar">
  <span class="xbar__name">Eien · Split window, more</span>
  <nav class="xbar__group" aria-label="These directions">${mine.map(([p, w]) => `<a class="word-button" href="split-alt-${p}.html"${p === dir.id ? ' aria-current="page"' : ''}>${w}</a>`).join('')}</nav>
  <nav class="xbar__group" aria-label="The first three"><span class="xbar__label">Earlier</span>${earlier.map(([p, w]) => `<a class="word-button" href="split-${p}.html">${w}</a>`).join('')}</nav>
  ${group('layout', 'Layout', [['band', 'A · Band'], ['slip', 'B · Slip'], ['runhead', 'C · Running head']])}
  ${group('theme', 'Light', [['light', 'Day'], ['dark', 'Night']])}
  ${group('sb', 'Sidebar', [['open', 'Open'], ['shut', 'Shut']])}
  ${group('fmt', 'Formatting bar', [['on', 'On'], ['off', 'Off']])}
  <label class="xbar__group"><span class="xbar__label">Window</span><input type="range" min="900" max="1680" step="20" value="1440" data-win-width aria-label="Window width" /><output></output></label>
  <span class="xnote">${dir.line}</span>
</header>
<div class="stage"><div class="canvas"></div><aside class="notes" aria-label="About this direction">${dir.notes}${COMMON_NOTES()}</aside></div>`);
  document.body.append(menu);
  canvas = document.querySelector('.canvas');
  root.dataset.theme ??= matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const width = document.querySelector('[data-win-width]');
  root.dataset.width = width.value;
  width.addEventListener('input', () => { root.dataset.width = width.value; draw(); });
  wire();
  wireBar(draw);
  addEventListener('resize', fit);
  draw();
}

/** The same in all three of these. */
const COMMON_NOTES = () => `
  <h2>In all three of these</h2>
  <ul>
    <li><b>Opening:</b> a note's right-click, Open to the Side; <kbd>${KEY('Mod-')}click</kbd> or <kbd>${KEY('Mod-Enter')}</kbd> on a row; drag a row onto the page's right edge (a preview shows where it lands; dropped on a page, it opens there); <kbd>${KEY('Mod-D')}</kbd> opens the note beside itself, and split, closes the other side.</li>
    <li><b>Why ${KEY('Mod-D')}:</b> it's free in the menu and in the editor. <kbd>${KEY('Mod-\\')}</kbd> is Toggle Sidebar, and <kbd>${KEY('Alt-Mod-\\')}</kbd>, which 1–3 use, is CodeMirror's Indent Selection in the default keymap Eien's editor loads. ${KEY('Mod-D')} splits a pane in terminals too.</li>
    <li><b>Changing the active page:</b> a click in it, or <kbd>${KEY('Mod-3')}</kbd> (Go to Page), which pressed in a page goes to the other one. The list's chosen row is the active page's note; the other open note keeps a hairline-strength rule and no fill.</li>
    <li><b>Choosing a note</b> in the list or the tree opens it in the active page.</li>
    <li><b>Closing</b> never touches a note: it's in the list as it was. <kbd>${KEY('Mod-W')}</kbd> in a side closes that side first.</li>
    <li><b>The same note on both sides</b> is one document: type in one, it shows in the other (try ${KEY('Mod-D')} with one note open). Seals, counts and undo are the note's.</li>
    <li><b>Not offered:</b> the split on a phone, which holds one page; each direction says what it does instead. New Window is on <a href="split-window.html">split-window.html</a>.</li>
  </ul>`;


const MAIN_MIN = 400; // the page keeps the text's measure, with a margin
const COMP_MIN = 300; // a companion can be narrower: its hand is smaller
const COMP_W = 380;
/** Too narrow to stand beside: the companion goes under the page, as on a phone. */
const isUnder = (ctx) => ctx.room < MAIN_MIN + COMP_MIN;
const compW = (ctx) => Math.round(Math.min(Math.max(S.compW, COMP_MIN), ctx.room - MAIN_MIN));

/** The page as it always is: its tools act on it alone. */
function mainHtml(ctx) {
  const resting = ctx.split && ctx.active !== 0;
  const tools = `<span class="tools" role="group" aria-label="Page tools">${['compare', 'versions', 'copy', 'focus', 'cards', 'format'].map((t) => ctx.tool(t, 0)).join('')}${ctx.spare(0)}</span>`;
  const top = ctx.layout === 'band' ? `<div class="band"><span class="quiet">${ctx.views()}</span><span class="quiet">${tools}</span></div>`
    : ctx.layout === 'slip' ? `<div class="topline"><span class="slip quiet">${ctx.views()}<span class="tools-rule" aria-hidden="true"></span>${tools}</span></div>` : '';
  return `<div class="page hover-scope${ctx.fmt ? ' has-fmt' : ''}${ctx.layout === 'runhead' && ctx.fmt ? ' has-rail' : ''}" data-side="0" role="region" aria-label="${esc(ctx.note(0).title)}, the page${ctx.split && !resting ? ', where you’re writing' : ''}">
    ${top}${ctx.fmtBar()}
    <div class="blotter" data-scroll="main-${S.sides[0]}"><article class="sheet${resting ? ' is-resting' : ''}">${ctx.head(0)}${ctx.words(0)}</article></div>
    <footer class="colophon">${ctx.figures(0, { ord: false, today: true })}${ctx.layout === 'runhead' ? `<span class="dot" aria-hidden="true">·</span>${ctx.pills(0)}` : ''}${ctx.said()}</footer>
  </div>`;
}
/** The companion: its name and its few tools at its head, its words, its figures at its foot. */
function companionHtml(ctx) {
  const n = ctx.note(1);
  const resting = ctx.active !== 1;
  return `<section class="companion hover-scope${resting ? ' is-resting' : ''}" data-side="1" role="region" aria-label="Companion: ${esc(n.title)}${resting ? '' : ', where you’re writing'}">
    <div class="companion__head"><span class="companion__name">${esc(n.title)}</span><span class="tools quiet">${ctx.btn('swap', 'Make it the page', { attrs: 'data-swap' })}${ctx.btn('more', `More for ${n.title}`, { attrs: 'data-more="1" aria-haspopup="menu"' })}${ctx.closeBtn(1)}</span></div>
    <div class="companion__scroll" data-scroll="comp-${S.sides[1]}">${ctx.tagset(1)}${ctx.words(1, { title: false })}</div>
    <footer class="companion__foot">${ctx.figures(1, { ord: false })}</footer>
  </section>`;
}

const companion = {
  id: 'companion',
  line: 'The second note is a companion at the window’s edge: the page keeps its tools; the one you aren’t in sits back a step.',
  state: (ctx) => (ctx.split && isUnder(ctx) ? 'companion under the page' : ''),
  grid: (name, ctx) => {
    if (isUnder(ctx)) return name === 'strip' ? ['gridTemplateColumns', 'minmax(0, 1fr)'] : ['gridTemplateRows', `minmax(0, 1fr) auto ${Math.round(S.compH * 100)}%`];
    return ['gridTemplateColumns', `minmax(0, 1fr) ${name === 'strip' ? '' : 'auto '}${compW(ctx)}px`];
  },
  valueNow: (ctx) => Math.round(isUnder(ctx) ? (1 - S.compH) * 100 : (1 - compW(ctx) / ctx.room) * 100),
  resize: (f, px, ctx) => {
    if (isUnder(ctx)) S.compH = Math.min(0.7, Math.max(0.25, 1 - f));
    else S.compW = Math.min(px - MAIN_MIN, Math.max(COMP_MIN, (1 - f) * px));
  },
  nudge: (step, ctx) => {
    if (isUnder(ctx)) S.compH = Math.min(0.7, Math.max(0.25, S.compH - step * 0.02));
    else S.compW = Math.min(ctx.room - MAIN_MIN, Math.max(COMP_MIN, compW(ctx) - step * 16));
  },
  even: () => { S.compW = COMP_W; S.compH = 0.42; },
  page(ctx) {
    if (!ctx.split) return mainHtml(ctx);
    const under = isUnder(ctx);
    return `<div class="pair" data-dock="${under ? 'under' : 'beside'}" ${gridStyle('pair', ctx)}>${mainHtml(ctx)}${dividerHtml(ctx, { axis: under ? 'y' : 'x', label: 'Between the page and its companion' })}${companionHtml(ctx)}</div>`;
  },
  strip(ctx) {
    const seg = `<div class="runhead__seg">${ctx.crumb(0)}${ctx.views()}<span class="tools-rule" aria-hidden="true"></span><span class="tools">${['compare', 'versions', 'copy', 'focus', 'cards', 'format'].map((t) => ctx.tool(t, 0)).join('')}${ctx.spare(0)}</span></div>`;
    return ctx.split ? `<div class="runhead__pair" ${gridStyle('strip', ctx)}>${seg}<span></span></div>` : seg;
  },
  drop(ctx, x, y) {
    const t = (i) => NOTES[S.sides[i]].title;
    const page = { side: 0, box: [0, 0, 1, 1], edge: 'none', label: `Open on the page, in place of ${t(0)}` };
    if (!ctx.split) {
      if (isUnder(ctx)) return y > 0.6 ? { side: 'new', box: [0, 0.58, 1, 1], edge: 'top', label: 'Open as the companion, under the page' } : page;
      const at = 1 - COMP_W / ctx.room;
      return x > 0.7 ? { side: 'new', box: [at, 0, 1, 1], label: 'Open as the companion' } : page;
    }
    if (isUnder(ctx)) return y > 1 - S.compH ? { side: 1, box: [0, 1 - S.compH, 1, 1], edge: 'none', label: `Open in the companion, in place of ${t(1)}` } : { ...page, box: [0, 0, 1, 1 - S.compH] };
    const at = 1 - compW(ctx) / ctx.room;
    return x > at ? { side: 1, box: [at, 0, 1, 1], edge: 'none', label: `Open in the companion, in place of ${t(1)}` } : { ...page, box: [0, 0, at, 1] };
  },
  opened: (ctx) => (isUnder(ctx) ? 'Too narrow to stand beside: the companion goes under the page' : ''),
  /** The companion's ⋯: what the page's tools do, for the companion. */
  more: (ctx, i) => {
    const t = ctx.note(i).title;
    const said = (w) => () => say(w);
    return { head: t, items: [
      ['live', 'Live', '', said(`${t}: Live`)], ['source', 'Source', '', said(`${t}: Source`)], ['reading', 'Reading', '', said(`${t}: Reading`)], '|',
      ['', 'Seal', KEY('Mod-S'), said(`Sealed ${t}`)], ['versions', 'Versions', '', said(`Versions: ${t}'s seals open at the window's right edge, over the companion`)],
      ['compare', 'Compare', '', said(`Compare: ${t} against its last seal, in the companion`)], ['copy', 'Copy as HTML', '', said(`Copied ${t} as HTML`)], '|',
      ['window', 'Open in New Window', '', said('A new window opens on this note: see New window & phone')],
    ] };
  },
};

mountAlt({
  ...companion,
  notes: `
  <h2>Checkpoint</h2>
  <dl class="checkpoint">
    <dt>Intent</dt><dd>A chapter on the desk, and the notes for it on a card beside it. The writer reads one and writes in the other.</dd>
    <dt>Palette</dt><dd>Paper and band. No colour of its own: the cue is a tone Eien already has.</dd>
    <dt>Depth</dt><dd>A pane edge and hairlines, no new shadow. The companion is a pane, not something floating.</dd>
    <dt>Surfaces</dt><dd>The page you aren't in goes from paper to band, a step back, because darker is further back.</dd>
    <dt>Type</dt><dd>The companion in a smaller hand (row size) and its name in the text face. Its figures in the machine voice.</dd>
    <dt>Spacing</dt><dd>A 4px base. The companion is 380px (at least 300), with a 16px gutter and 24px inside.</dd>
  </dl>
  <h2>5 · A companion</h2>
  <p>The page pane isn't split. The second note opens as a companion at the window's right edge, where Versions opens: narrower, its words in a smaller hand, its own head and foot. The page keeps every tool it has (A's band, B's slip, C's running head), and they act on the page. The companion carries its own few.</p>
  <ul>
    <li><b>Side by side</b> while there's room. The companion's edge is the divider: drag it, or use <kbd>←</kbd> <kbd>→</kbd> on it, and double-click or <kbd>Enter</kbd> to put it back to 380px. The page keeps at least ${MAIN_MIN}px and the companion ${COMP_MIN}px.</li>
    <li><b>Top and bottom</b> is offered only where it's needed. In a page pane narrower than ${MAIN_MIN + COMP_MIN}px (about 1,280px of window with both panes, 1,020px with the sidebar shut), the companion goes under the page, and its edge drags up and down. That's what the phone does too.</li>
    <li><b>The page's tools</b> stay where the layout puts them and act on the page: the views, Compare, Versions, Copy as HTML, Focus mode, Outline cards. <b>The formatting bar</b> is the page's, and it formats whatever words the caret is in, the companion's too, as the keys do.</li>
    <li><b>The companion's tools</b> sit at its head, quiet till the pointer is over it: ⇄ makes it the page (a swap), ⋯ has its views, Seal, Versions, Compare, Copy as HTML and Open in New Window, and × closes it. Its foot has its words and last seal. Its tags sit at the top of its words in all three layouts.</li>
    <li><b>The active one</b> has the caret, and the other sits back a step: its paper takes the band's tone. There's no colour and no new mark. A click, or <kbd>${KEY('Mod-3')}</kbd>, moves between them.</li>
    <li><b>Choosing a note</b> in the list opens it in whichever one is active. Usually that's the page, so the companion stays put while you move through chapters.</li>
    <li><b>Closing:</b> the companion's ×. <kbd>${KEY('Mod-W')}</kbd> on the page closes the page, and the companion takes its place.</li>
    <li><b>On a phone:</b> the companion is a sheet pulled up from the page's foot by its name, half the screen, and a swipe down puts it away.</li>
  </ul>
  <h2>For</h2>
  <ul><li>It fits how a chapter and its notes are really used: one is written, the other consulted. The page is never cut in half.</li><li>The page is exactly Eien's page. Every tool sits by what it acts on, and there's no second set.</li><li>Its narrow answer, under the page, is also the phone's, so one idea covers both.</li></ul>
  <h2>Against</h2>
  <ul><li>It isn't symmetrical. Two chapters side by side make one of them the companion, in a smaller hand.</li><li>The band's tone is a quiet cue, and it's the only one besides the caret.</li><li>The companion takes the place where Versions opens, so Versions lies over it while open.</li></ul>`,
});
</script>
</body>
</html>
