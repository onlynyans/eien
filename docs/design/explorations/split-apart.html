<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Split window: 1 · Two whole pages</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/* Shared by every exploration (inlined into each page by _build.py).
   The tokens are the approved ones from ../tokens.css (Washi, day and night),
   plus what the design pass adds: a radius scale, icon sizes, the machine
   face as a setting, and row weights. New tokens are marked NEW. */

:root { color-scheme: light dark; }
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

:root {
  --eien-desk: light-dark(#d9d2c8, #110e0b);
  --eien-blotter: light-dark(#eae5dd, #1a1713);
  --eien-band: light-dark(#f4f1ea, #201d19);
  --eien-paper: light-dark(#fdfbf7, #28241f);
  --eien-paper-raised: light-dark(#ffffff, #312d28);
  --eien-well: light-dark(#f9f7f3, #24201c);
  --eien-hover: light-dark(rgb(35 32 28 / 0.045), rgb(233 226 212 / 0.05));
  --eien-press: light-dark(rgb(35 32 28 / 0.1), rgb(233 226 212 / 0.1));
  --eien-selected: light-dark(#ede9e3, #38332e);
  --eien-scrim: light-dark(rgb(35 32 28 / 0.22), rgb(0 0 0 / 0.5));
  --eien-shadow-sheet: 0 1px 2px light-dark(rgb(58 44 26 / 0.06), rgb(0 0 0 / 0.4)),
    0 6px 24px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45));
  --eien-shadow-float: 0 2px 6px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45)),
    0 14px 36px light-dark(rgb(58 44 26 / 0.16), rgb(0 0 0 / 0.6));
  --eien-ink: light-dark(#23201c, #e9e2d4);
  --eien-ink-soft: light-dark(#51473c, #c3b9a7);
  --eien-pencil: light-dark(#5d5348, #a7a095);
  --eien-faded: light-dark(#766d62, #837c73);
  --eien-rule-soft: light-dark(rgb(35 32 28 / 0.07), rgb(233 226 212 / 0.07));
  --eien-rule: light-dark(rgb(35 32 28 / 0.13), rgb(233 226 212 / 0.14));
  --eien-rule-strong: light-dark(rgb(35 32 28 / 0.26), rgb(233 226 212 / 0.26));
  --eien-hairline: 1px;
  --eien-mark-w: 2px;
  --eien-seal: light-dark(#c4472d, #e0603f);
  --eien-seal-wash: light-dark(rgb(196 71 45 / 0.08), rgb(224 96 63 / 0.12));
  --eien-on-seal: light-dark(#fbf8f2, #1a1714);
  --eien-focus: var(--eien-ink-soft);
  --eien-added: light-dark(#485c2c, #9cb880);
  --eien-added-wash: light-dark(rgb(79 107 58 / 0.13), rgb(156 184 128 / 0.14));
  --eien-removed: light-dark(#93304a, #e98aa0);
  --eien-caution: light-dark(#6b501f, #d0a659);
  --eien-caution-wash: light-dark(rgb(138 100 32 / 0.11), rgb(208 166 89 / 0.12));

  /* The machine voice: IBM Plex Mono by default, now a setting (NEW: set from FACES). */
  --eien-face-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --eien-face-seal: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --eien-size-meta: 11px;
  --eien-size-label: 10px;
  --eien-leading-row: 1.35;
  --eien-track-label: 0.12em;
  --eien-space-1: 4px; --eien-space-2: 8px; --eien-space-3: 12px; --eien-space-4: 16px;
  --eien-space-5: 24px; --eien-space-6: 32px; --eien-space-7: 48px; --eien-space-8: 72px;
  --eien-row-h: 30px;
  --eien-touch: 44px;
  --eien-seal-size: 22px;
  --eien-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --eien-quick: 120ms;
  --eien-calm: 220ms;
  --eien-leading-tighten: 0;
  --eien-sheet-pad-x: var(--eien-space-8);
  --eien-sheet-pad-top: var(--eien-space-7);
  --eien-page-gutter: var(--eien-space-5);
  --eien-title-gap: var(--eien-space-6);
  --eien-paragraph-gap: var(--eien-space-4);
  --eien-row-pad-y: var(--eien-space-3);

  /* NEW: corners. Not everything is square. A small scale: s for what you press
     (buttons, fields, chips), m for what floats (menus, popovers, the tool slip),
     l for what covers the window (a sheet over it, the phone's bottom sheet).
     Paper itself (the sheet, the panes) stays square. Each exploration sets its own. */
  --eien-radius-s: 3px;
  --eien-radius-m: 6px;
  --eien-radius-l: 10px;
  --eien-radius-dot: 999px;

  /* NEW: icons. Drawn on a 16-unit grid, stroked in the ink they sit in. */
  --eien-icon: 16px;
  --eien-icon-stroke: 1.25;
  --eien-control: 28px; /* an icon control's square, desktop */

  /* NEW: row names' weight, two settings (400–700). A selected list title is 100 heavier. */
  --eien-weight-tree: 400;
  --eien-weight-list: 400;
}

/* The text voice: the writer's choice, sizes tuned per face (from ../tokens.css). */
:root, [data-face='newsreader'] { --eien-face-text: 'Newsreader', 'Iowan Old Style', Georgia, serif; --eien-size-prose: 22px; --eien-size-title: 36px; --eien-size-heading: 23px; --eien-size-row: 16px; --eien-size-preview: 14px; --eien-leading-prose: calc(1.5 - var(--eien-leading-tighten)); --eien-measure: 29em; }
[data-face='literata'] { --eien-face-text: 'Literata', Georgia, serif; --eien-size-prose: 19px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.72 - var(--eien-leading-tighten)); --eien-measure: 34em; }
[data-face='plex-sans'] { --eien-face-text: 'IBM Plex Sans', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.76 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='source-sans'] { --eien-face-text: 'Source Sans 3', Arial, sans-serif; --eien-size-prose: 20px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 31em; }
[data-face='atkinson'] { --eien-face-text: 'Atkinson Hyperlegible Next', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='schibsted'] { --eien-face-text: 'Schibsted Grotesk', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 33em; }
[data-face='hanken'] { --eien-face-text: 'Hanken Grotesk', Arial, sans-serif; --eien-size-prose: 19px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='instrument'] { --eien-face-text: 'Instrument Sans', Arial, sans-serif; --eien-size-prose: 18.5px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.7 - var(--eien-leading-tighten)); --eien-measure: 31em; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--eien-blotter);
  color: var(--eien-ink);
  font-family: var(--eien-face-text);
  font-size: var(--eien-size-row);
  line-height: var(--eien-leading-row);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--eien-seal-wash); }
:focus-visible { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 2px; }

.seal {
  display: inline-grid; place-items: center; flex: none;
  width: var(--eien-seal-size); height: var(--eien-seal-size);
  background: var(--eien-seal); color: var(--eien-on-seal);
  font-family: var(--eien-face-seal); font-size: calc(var(--eien-seal-size) * 0.68); line-height: 1;
  border-radius: calc(var(--eien-radius-s) / 2);
  user-select: none;
}
.seal--small { --eien-seal-size: 10px; font-size: 0; }

.label {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil);
}
.count {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  font-variant-numeric: tabular-nums; color: var(--eien-pencil);
}

/* Where a word stays (menus, choices of a setting). */
.word-button {
  appearance: none; border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; padding: var(--eien-space-1) var(--eien-space-2);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft);
  cursor: pointer;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.word-button[aria-pressed='true'], .word-button[aria-checked='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* NEW: the icon control. The word button's states, a square of --eien-control. */
.icon-button {
  appearance: none; display: inline-grid; place-items: center; flex: none;
  width: var(--eien-control); height: var(--eien-control); padding: 0;
  border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; color: var(--eien-ink-soft); cursor: pointer; position: relative;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.icon-button svg, .icon { width: var(--eien-icon); height: var(--eien-icon); display: block; }
.icon { stroke-width: var(--eien-icon-stroke); }
.icon-button[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }
.icon-button:disabled { color: var(--eien-faded); cursor: default; }
@media (hover: hover) {
  .word-button:hover, .icon-button:not(:disabled):hover { color: var(--eien-ink); background: var(--eien-hover); }
}
.word-button:active, .icon-button:not(:disabled):active { background: var(--eien-press); border-color: var(--eien-rule-strong); }

/* NEW: a tooltip names an icon and its key: raised paper, the machine voice. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none;
  left: 50%; top: calc(100% + 6px); translate: -50% 0;
  white-space: pre; padding: 3px 7px; border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em;
  text-transform: none; color: var(--eien-ink-soft);
  opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
}
[data-tip-side='up']::after { top: auto; bottom: calc(100% + 6px); }
[data-tip-side='right']::after { left: calc(100% + 6px); top: 50%; translate: 0 -50%; }
[data-tip-side='left']::after { left: auto; right: calc(100% + 6px); top: 50%; translate: 0 -50%; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: 450ms; } }
[data-tip]:focus-visible::after { opacity: 1; }

.field {
  appearance: none; width: 100%; border: var(--eien-hairline) solid var(--eien-rule);
  border-radius: var(--eien-radius-s); background: var(--eien-well);
  padding: var(--eien-space-2) var(--eien-space-3);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink);
}
.field::placeholder { color: var(--eien-faded); }
.field:focus { outline: none; border-color: var(--eien-focus); }

/* Explorations' own bar: outside the app, like the mockups' bar. */
.xbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--eien-space-1) var(--eien-space-4);
  padding: var(--eien-space-2) var(--eien-space-4);
  background: var(--eien-paper-raised); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.xbar__name { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink); font-weight: 600; }
.xbar__group { display: flex; align-items: center; gap: 2px; }
.xbar__label { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); margin-right: var(--eien-space-1); }
.xnote { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }

/* Shared by the split-window explorations (split-*.html): Eien's window at its
   real size, in A · Band, B · Slip or C · Running head, its page pane holding
   one note or two. Each direction draws the page pane its own way (split.js's
   Split.page); the window, the sidebar, the list, the menus, the divider and the
   keys are the same in all three. */
/* Each layout's corners, as src/ui/chrome/*.css sets them on :root[data-layout]:
   A · Band 2/4/8, B · Slip 4/8/14, C · Running head 3/6/10. */
:root[data-layout='band'] { --eien-radius-s: 2px; --eien-radius-m: 4px; --eien-radius-l: 8px; }
:root[data-layout='slip'] { --eien-radius-s: 4px; --eien-radius-m: 8px; --eien-radius-l: 14px; }
:root[data-layout='runhead'] { --eien-radius-s: 3px; --eien-radius-m: 6px; --eien-radius-l: 10px; }
a.word-button { text-decoration: none; }
.word-button[aria-current='page'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* The seal as a button, as the app draws it: no ground, a hairline that shows on hover.
   Shared by the corner and split explorations. */
.seal-button { appearance: none; display: grid; place-items: center; padding: var(--eien-space-1); border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s); background: none; cursor: pointer; transition: border-color var(--eien-quick) var(--eien-ease); }
@media (hover: hover) { .seal-button:hover { border-color: var(--eien-rule); } }
.seal-button:active { background: var(--eien-press); }


body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 45%); } }
/* A quiet desktop the window sits on, outside Eien; the window scales to fit it. */
.canvas { min-height: 0; overflow: auto; padding: var(--eien-space-4); background: light-dark(#cfc8bd, #0b0907); }
.fit { position: relative; margin: 0 auto; }
.fit > .win { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.notes { min-height: 0; overflow: auto; padding: var(--eien-space-4); background: var(--eien-desk); border-left: var(--eien-hairline) solid var(--eien-rule); font-size: var(--eien-size-preview); line-height: 1.55; color: var(--eien-ink-soft); }
@media (max-width: 900px) { .notes { border-left: 0; border-top: var(--eien-hairline) solid var(--eien-rule); } }
.notes h2 { margin: var(--eien-space-4) 0 var(--eien-space-1); font: inherit; font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); font-weight: 400; }
.notes h2:first-child { margin-top: 0; }
.notes p { margin: 0 0 var(--eien-space-2); }
.notes ul { margin: 0 0 var(--eien-space-2); padding-left: 1.1em; }
.notes code { font-family: var(--eien-face-mono); font-size: 0.9em; }
kbd { font-family: var(--eien-face-mono); font-size: 11px; padding: 0 4px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-paper); white-space: nowrap; }
.xbar input[type='range'] { width: 120px; accent-color: var(--eien-ink-soft); }
.xbar output { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); min-width: 7ch; }

/* The window. Its lengths are the app's: --band 56px (48 in C), C's running
   head 40px, sidebar 264px, list 316px, the colophon 40px. */
.win {
  --band: 56px; --sb-w: 264px; --list-w: 316px; --status-h: 40px; --head-h: 0px; --controls-left: 80px;
  --sb: var(--sb-w);
  width: var(--win-w, 1440px); height: 860px; overflow: hidden; position: relative;
  display: grid; grid-template-rows: var(--head-h) minmax(0, 1fr); grid-template-columns: var(--sb) var(--list-w) minmax(0, 1fr);
  background: var(--eien-desk); color: var(--eien-ink); font-size: var(--eien-size-row);
  border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: 10px; box-shadow: var(--eien-shadow-float);
}
.win[data-layout='runhead'] { --band: 48px; --head-h: 40px; }
/* Shut, the sidebar is the seal alone in A and B (the default), and C's 48px strip. */
.win[data-sb='shut'] { --sb: 0px; }
.win[data-layout='runhead'][data-sb='shut'] { --sb: var(--band); }
/* The seal: beside the lights in A and B, open or shut; on C's sidebar head. */
.win { --seal-x: calc(var(--controls-left) + var(--eien-space-3)); --seal-y: calc((var(--band) - 32px) / 2); }
.win[data-layout='runhead'] { --seal-x: var(--eien-space-3); --seal-y: calc(var(--head-h) + (var(--band) - 32px) / 2); }
.win[data-layout='runhead'][data-sb='shut'] { --seal-x: calc((var(--band) - 32px) / 2); }
.seal-btn { position: absolute; z-index: 6; left: var(--seal-x); top: var(--seal-y); }
.win > .sb, .win > .ls, .win > .pg { grid-row: 2; min-width: 0; min-height: 0; overflow: hidden; }
.lights { position: absolute; z-index: 5; left: 20px; top: 22px; display: flex; gap: 8px; }
.win[data-layout='runhead'] .lights { top: 14px; }
.lights i { width: 12px; height: 12px; border-radius: var(--eien-radius-dot); background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.18); }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }

/* C's running head: one strip across the window; its page part is the direction's. */
.strip { grid-row: 1; grid-column: 1 / -1; display: grid; grid-template-columns: var(--sb) var(--list-w) minmax(0, 1fr); background: var(--eien-desk); border-bottom: var(--eien-hairline) solid var(--eien-rule); min-width: 0; }
.strip__panes { grid-column: 1 / 3; display: flex; align-items: center; gap: 2px; padding-left: calc(var(--controls-left) + var(--eien-space-2)); }
.strip__page { grid-column: 3; min-width: 0; display: flex; align-items: center; }
.crumb { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The sidebar: the desk. */
.sb { display: flex; flex-direction: column; border-right: var(--eien-hairline) solid var(--eien-rule); }
.win[data-sb='shut'] .sb { visibility: hidden; }
.sb > * { width: var(--sb-w); }
.sb__head { flex: none; display: flex; align-items: center; height: var(--band); padding-left: calc(var(--seal-x) + 32px + var(--eien-space-2)); font-weight: 600; }
.sb__sec { display: flex; align-items: center; height: var(--eien-row-h); padding: 0 var(--eien-space-4); margin-top: var(--eien-space-2); }
.trow { position: relative; display: flex; align-items: baseline; gap: var(--eien-space-2); height: var(--eien-row-h); line-height: var(--eien-row-h); padding: 0 var(--eien-space-4) 0 calc(var(--eien-space-4) + var(--d, 0) * 16px); color: var(--eien-ink-soft); }
.trow .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.is-chosen { background: var(--eien-selected); color: var(--eien-ink); }
.trow.is-chosen::before, .row.is-chosen::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: var(--eien-mark-w); background: var(--eien-seal); }
.book { font-family: var(--eien-face-mono); font-size: 9px; letter-spacing: var(--eien-track-label); padding: 0 3px; border: var(--eien-hairline) solid var(--eien-rule); color: var(--eien-pencil); line-height: 14px; }

/* The list: paper, its search on a band. A note open on the other side keeps a
   fainter rule, in pencil and with no fill, so both open notes are findable. */
.ls { background: var(--eien-paper); border-right: var(--eien-hairline) solid var(--eien-rule); }
.ls__band { display: flex; align-items: center; height: var(--band); padding: 0 var(--eien-space-4); background: var(--eien-band); }
.win[data-sb='shut']:not([data-layout='runhead']) .ls__band { padding-left: calc(var(--seal-x) + 32px + var(--eien-space-3)); }
.ls__band .field { padding: 6px var(--eien-space-3); color: var(--eien-faded); }
.ls__head { padding: var(--eien-space-3) var(--eien-space-4) var(--eien-space-2); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.ls__title { font-size: var(--eien-size-heading); font-weight: 500; line-height: 1.3; }
.row {
  appearance: none; position: relative; display: grid; grid-template-columns: 28px 1fr auto; gap: 0 var(--eien-space-1); width: 100%;
  padding: var(--eien-space-3) var(--eien-space-4); border: 0; border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); background: none;
  text-align: left; cursor: pointer; font: inherit; color: var(--eien-ink);
}
@media (hover: hover) { .row:hover { background: var(--eien-hover); } }
.row .ord { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); padding-top: 2px; }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .p { grid-column: 2 / 4; font-size: var(--eien-size-preview); color: var(--eien-pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.is-chosen { background: var(--eien-selected); }
.row.is-beside::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: var(--eien-mark-w); background: var(--eien-pencil); opacity: 0.6; }
.row:focus-visible { outline-offset: -2px; }
.row.is-dragged { opacity: 0.72; }

/* The page pane and its parts, which each direction arranges. A page's parts
   keep their rows whether or not the formatting bar is there: the band (or B's
   top line), the formatting bar, the sheet's blotter, the colophon. */

.pg > * { min-width: 0; min-height: 0; }
.duo { display: grid; min-width: 0; min-height: 0; }
.side, .page { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
:is(.side, .page) > :is(.band, .topline) { grid-row: 1; }
:is(.side, .page) > .fmt { grid-row: 2; }
:is(.side, .page) > :is(.blotter, .duo) { grid-row: 3; }
:is(.side, .page) > .colophon { grid-row: 4; height: var(--status-h); }
.topline { display: flex; align-items: center; justify-content: flex-end; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); min-width: 0; }
.win[data-layout='slip'] .blotter { padding-top: 0; }
.band { display: flex; align-items: center; justify-content: space-between; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); min-width: 0; }
.tools { display: flex; gap: 2px; min-width: 0; }
.tools .icon-button { color: var(--eien-pencil); }
.quiet { opacity: 0; transition: opacity var(--eien-calm) var(--eien-ease); }
.pg:hover .quiet, .quiet:focus-within { opacity: 1; }
.slip { display: flex; gap: 2px; padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
.blotter { position: relative; min-height: 0; overflow: auto; padding: var(--eien-space-4) var(--eien-space-4) 0; }
.sheet { position: relative; max-width: 640px; min-height: 100%; margin: 0 auto; padding: var(--eien-space-6) clamp(var(--eien-space-4), 7%, var(--eien-space-7)); background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule); box-shadow: var(--eien-shadow-sheet); font-size: 19px; line-height: 1.55; transition: box-shadow var(--eien-calm) var(--eien-ease); }
.win[data-layout='slip'] .sheet { border-radius: calc(var(--eien-radius-s) - var(--eien-hairline)); }
.sheet__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--eien-space-3); min-height: 18px; }
.sheet h1 { font-size: 28px; font-weight: 500; line-height: 1.2; margin: var(--eien-space-3) 0 var(--eien-space-4); }
.prose { outline: none; caret-color: var(--eien-seal); }
.prose p { margin: 0 0 var(--eien-space-3); }
.tagset { display: flex; gap: var(--eien-space-2); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); white-space: nowrap; }
.slips { display: flex; gap: var(--eien-space-1); margin: calc(var(--eien-space-3) * -1) 0 var(--eien-space-4); }
.slips span { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink-soft); padding: 1px 8px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-band); }
.colophon { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-4); background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; }

.colophon .said { margin-left: auto; color: var(--eien-ink-soft); overflow: hidden; text-overflow: ellipsis; }

/* The formatting bar, where each layout puts it: A's band's second row, B's
   raised slip at the blotter's top left, C's raised rail down the margin. */
.fmt { display: flex; justify-content: center; gap: 2px; padding: 2px var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }

.same { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); white-space: nowrap; }

.menu__item:focus { outline: none; background: var(--eien-selected); color: var(--eien-ink); }

.menu__key { font-size: var(--eien-size-label); color: var(--eien-pencil); }
.menu__rule { height: var(--eien-hairline); margin: var(--eien-space-1) var(--eien-space-2); background: var(--eien-rule-soft); }

.strip__page > * { flex: 1; height: 100%; }
.seg { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-3); }
.seg .crumb { flex: 1; text-align: center; }
/* C's formatting rail keeps a margin of its own, so it never lies over the words. */
.win[data-layout='runhead'] :is(.side, .page):has(> .fmt) .blotter { padding-left: calc(var(--eien-control) + var(--eien-space-5)); }
/* B's slip and C's rail float: placed in the page's own box, not in the bar's row. */
.win:is([data-layout='slip'], [data-layout='runhead']) :is(.side, .page) > .fmt { grid-row: auto; }


/* 1 · Two whole pages: each page has all its own parts: A's band, B's slip,
   C's half of the running head; its formatting bar; its colophon. The active

.band .tools-row:last-child { margin-left: auto; }

/** An icon as SVG markup, stroked in currentColor. */
function icon(name, label) {
  const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
  return `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICONS[name]}</svg>`;

/** Fill every [data-icon] with its icon. */
function drawIcons(root = document) {
  for (const el of root.querySelectorAll('[data-icon]')) {
    el.innerHTML = icon(el.dataset.icon) + (el.dataset.iconText ?? '');
  }
}

/** The explorations' bar: [data-x-set="attr"] groups set data-<attr> on <html>. */
function wireBar(onChange = () => {}) {
  for (const group of document.querySelectorAll('[data-x-set]')) {
    const attr = group.dataset.xSet;
    const buttons = [...group.querySelectorAll('button[data-value]')];
    const pick = (value) => {
      document.documentElement.dataset[attr] = value;
      for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.value === value));
      onChange(attr, value);
    };
    for (const b of buttons) b.addEventListener('click', () => pick(b.dataset.value));
    pick(document.documentElement.dataset[attr] ?? buttons[0].dataset.value);
  }
}

const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function luminance(h) {
  return hexRgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; })
    .reduce((sum, v, i) => sum + v * [0.2126, 0.7152, 0.0722][i], 0);
}
const contrast = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const hsl = (h, s, l) => { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return '#' + [f(0), f(8), f(4)].map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); };
/**
 * An ink of hue `h` and saturation `sat`, starting at lightness `l` and stepped
 * darker by day (`dir` -1) or lighter by night (+1) until it reaches `min`
 * contrast on every one of `grounds`: the hue stays, the contrast holds.
 */
function fitInk(h, sat, l, grounds, min, dir) {
  let ink = hsl(h, sat, l);
  while (grounds.some((g) => contrast(ink, g) < min + 0.1) && l > 0 && l < 100) { l += dir; ink = hsl(h, sat, l); }
  return ink;
}
/** "Custom": four choices, and every token worked out from them, day and night. */
function mixTheme({ paper: ph, warmth: w, ink: ih, seal: sh }, name = 'My Room') {
  const surf = (dl, nl) => [hsl(ph, w, dl), hsl(ph, Math.min(w, 22), nl)];
  const t = { desk: surf(83, 5), blotter: surf(89, 8), band: surf(94, 11), paper: surf(98.5, 14), selected: surf(91, 19), seal: [hsl(sh, 63, 47), hsl(sh, 72, 56)] };
  const grounds = (s) => ['desk', 'band', 'paper', 'selected'].map((k) => t[k][s]);
  // The inks carry their hue, saturated enough to see by day, each as light as Eien's contrast allows.
  const ink = (sat, dl, nsat, nl, min) => [fitInk(ih, sat, dl, grounds(0), min, -1), fitInk(ih, nsat, nl, grounds(1), min, 1)];
  Object.assign(t, { ink: ink(48, 16, 38, 88, 7), 'ink-soft': ink(38, 30, 30, 70, 4.5), pencil: ink(30, 34, 20, 62, 4.5), faded: ink(20, 46, 12, 52, 3) });

}
/** A theme on the whole page: each token as light-dark(day, night); the rules from the ink. */
function applyTheme(theme, el = document.documentElement) {

const MAC = /Mac|iPhone|iPad/.test(navigator.platform);
const mod = (e) => (MAC ? e.metaKey : e.ctrlKey);
/** A key as this system writes it: KEY('Mod-Alt-↓') is ⌥⌘↓ on a Mac (its order), Ctrl+Alt+↓ elsewhere. */
function KEY(k) {
  const parts = k.split('-');
  const key = parts.pop();
  const has = (m) => parts.includes(m);
  return MAC
    ? `${has('Alt') ? '⌥' : ''}${has('Shift') ? '⇧' : ''}${has('Mod') ? '⌘' : ''}${key}`
    : [has('Mod') && 'Ctrl', has('Alt') && 'Alt', has('Shift') && 'Shift', key].filter(Boolean).join('+');
}

/** What a direction draws with: the state, and the pieces every layout shares. */
function context() {
  const d = root.dataset;
  const layout = d.layout;
  const winW = +d.width;
  const sbW = d.sb === 'shut' ? (layout === 'runhead' ? 48 : 0) : 264;
  const pageW = winW - sbW - 316;
  const split = S.sides.length === 2;
  // Too narrow for two pages: they fold into one, with a pager between them.
  const folded = split && pageW < MIN_SIDE * 2;
  const ctx = {
    layout, split, folded, pageW, active: S.active, fmt: d.fmt === 'on',
    shown: !split ? [0] : folded ? [S.active] : [0, 1],
    same: split && S.sides[0] === S.sides[1],
    id: (i) => S.sides[i],
    note: (i) => NOTES[S.sides[i]],
    /** Two pages' columns, the divider between: `gap` wide. */
    columns: (gap = 'var(--eien-space-2)') => `calc((100% - ${gap}) * ${S.ratio}) ${gap} minmax(0, 1fr)`,
    tools: (names, cls = '') => `<span class="tools ${cls}">${names.map(([n, w]) => `<button class="icon-button" data-icon="${n}" aria-label="${w}" data-tip="${w}"></button>`).join('')}</span>`,
    views: () => ctx.tools([['live', 'Live'], ['source', 'Source'], ['reading', 'Reading']]),
    pageTools: () => ctx.tools([['compare', 'Compare'], ['versions', 'Versions'], ['focus', 'Focus mode'], ['format', 'Formatting bar']]),
    closeBtn: (i) => `<button class="icon-button close-side" data-close-side="${i}" data-icon="close" aria-label="Close this side: ${NOTES[S.sides[i]].title}" data-tip="Close this side  ${KEY('Mod-W')}"></button>`,
    fmtBar: () => (ctx.fmt ? `<div class="fmt" role="toolbar" aria-label="Formatting">${['bold', 'italic', 'underline', 'strike', 'heading', 'quote', 'bullets', 'link', 'table'].map((n) => `<button class="icon-button" data-icon="${n}" aria-label="${n}" data-tip="${n[0].toUpperCase() + n.slice(1)}"></button>`).join('')}</div>` : ''),
    tagset: (i) => `<span class="tagset">${ctx.note(i).tags.map((t) => `<span>#${t}</span>`).join('')}</span>`,
    /** A note's sheet: its running head (A), slips (B), title and words; `flat` lays it flat on the blotter. */
    sheet: (i, { flat = false, close = false } = {}) => {
      const n = ctx.note(i);
      const head = layout === 'band' ? `<div class="sheet__head"><span class="crumb">${n.crumb}</span>${ctx.tagset(i)}</div>` : layout === 'slip' ? `<div class="sheet__head"><span class="crumb">${n.crumb}</span></div>` : '';
      const slips = layout === 'slip' ? `<div class="slips">${n.tags.map((t) => `<span>#${t}</span>`).join('')}</div>` : '';
      return `<article class="sheet${flat ? ' sheet--flat' : ''}" data-side="${i}">${close ? ctx.closeBtn(i).replace('close-side', 'close-side sheet__close quiet') : ''}${head}<h1>${n.title}</h1>${slips}
        <div class="prose" contenteditable="true" spellcheck="true" data-note="${S.sides[i]}" data-side="${i}" aria-label="${n.title}">${paraHtml(S.sides[i])}</div></article>`;
    },
    /** A note's colophon: its words and last seal; today's tally and what Eien says, on the active one. */
    colophon: (i, { today = i === S.active } = {}) => {
      const n = ctx.note(i);
      const tags = layout === 'runhead' ? n.tags.map((t) => `<span class="pill">#${t}</span>`).join('') : '';
      return `<footer class="colophon" data-side="${i}">${ctx.split ? `${n.ord} <span class="dot">·</span>` : ''}<span data-words="${S.sides[i]}">${wordsOf(S.sides[i]).toLocaleString('en')}</span> words${today ? ' <span class="dot">·</span> today 412' : ''} <span class="dot">·</span> sealed ${n.sealed}${tags ? ` <span class="dot">·</span> ${tags}` : ''}${i === S.active ? '<span class="said" role="status" aria-live="polite"></span>' : ''}</footer>`;

let drawn = null;
/** Draws the window, keeping the caret and each page's scroll where they were. */
function draw() {
  const d = root.dataset;
  if (!d.layout || !d.theme || !d.sb || !d.fmt || !d.width) return;
  const caret = keepCaret();
  const scrolls = [...canvas.querySelectorAll('.blotter')].map((b) => b.scrollTop);
  const ctx = context();
  canvas.innerHTML = `<div class="fit">${windowHtml(ctx)}</div>`;
  drawIcons(canvas);
  canvas.querySelectorAll('.blotter').forEach((b, i) => { b.scrollTop = scrolls[i] ?? 0; });
  drawn = ctx;
  fit();
  caret();
  document.querySelector('.xbar output').textContent = `${d.width} px${ctx.folded ? ' · folded' : ''}`;
}
/** Where the caret is, by side and character, to put it back after a draw. */
function keepCaret() {
  const el = document.activeElement;
  const sel = getSelection();
  if (!el?.classList?.contains('prose') || !sel.rangeCount) return () => {};
  const range = sel.getRangeAt(0).cloneRange();
  range.selectNodeContents(el);
  range.setEnd(sel.getRangeAt(0).endContainer, sel.getRangeAt(0).endOffset);
  const at = range.toString().length;
  const side = el.dataset.side;
  return () => {
    const prose = canvas.querySelector(`.prose[data-side="${side}"]`);
    if (prose) placeCaret(prose, at);
  };
}
function placeCaret(prose, at) {
  const walk = document.createTreeWalker(prose, NodeFilter.SHOW_TEXT);
  let left = at;
  let node = walk.nextNode();
  while (node && left > node.length) { left -= node.length; node = walk.nextNode(); }
  prose.focus({ preventScroll: true });
  const range = document.createRange();
  if (node) range.setStart(node, left); else range.selectNodeContents(prose);
  range.collapse(node ? true : false);
  getSelection().removeAllRanges();
  getSelection().addRange(range);
}
function fit() {
  const box = canvas.querySelector('.fit');
  const win = box?.firstElementChild;
  if (!win) return;
  const w = +root.dataset.width;
  const scale = Math.min(1, (canvas.clientWidth - 32) / w, (canvas.clientHeight - 32) / 860);
  win.style.transform = `scale(${scale})`;
  box.style.width = `${w * scale}px`;
  box.style.height = `${860 * scale}px`;
}

let saidTimer;
function say(words) {
  const el = canvas.querySelector('.said');
  if (!el) return;
  el.textContent = words;
  clearTimeout(saidTimer);
  saidTimer = setTimeout(() => { el.textContent = ''; }, 5000);
}

// What the writer does.
const act = {
  /** A side becomes the active one: the list, the tools and the keys follow it. */
  activate(i, focus = false) {
    if (i === S.active || i >= S.sides.length) return;
    S.active = i;
    draw();
    if (focus) canvas.querySelector(`.prose[data-side="${i}"]`)?.focus();
  },
  /** A note chosen in the list or sidebar opens in the active page. */
  open(id) { S.sides[S.active] = id; draw(); },
  /** Open to the Side: a second page, or the other one, now active. */
  toSide(id) {
    const at = S.sides.length === 1 ? 1 : 1 - S.active;
    S.sides[at] = id;
    S.active = at;
    draw();
    if (context().folded) say('Too narrow for two pages: they fold into one');
    canvas.querySelector(`.prose[data-side="${S.active}"]`)?.focus();
  },
  close(i) { S.sides.splice(i, 1); S.active = 0; draw(); say('Closed; the note is where it was'); },
  swap() { S.sides.reverse(); S.active = 1 - S.active; draw(); say('Swapped'); },
  /** ⌥⌘\: the note to the side, or, split, the other side closed. */
  toggle() { if (S.sides.length === 2) act.close(1 - S.active); else act.toSide(S.sides[0]); },
};

function wire() {
  // A click in a page makes it the active one, once the caret has landed, so it stays
  // where it was put; the keyboard's focus does the same.
  const activateFrom = (el) => {
    const side = el?.closest?.('[data-side]');
    if (side && drawn?.split && +side.dataset.side !== S.active) act.activate(+side.dataset.side);
  };
  canvas.addEventListener('click', (e) => { if (!e.target.closest('button, .divider')) activateFrom(e.target); });
  canvas.addEventListener('focusin', (e) => { if (e.target.classList.contains('prose')) setTimeout(() => activateFrom(document.activeElement)); });
  // Typing: one document, so the same note in both sides shows it in both.
  canvas.addEventListener('input', (e) => {
    const prose = e.target.closest('.prose');
    if (!prose) return;
    const id = prose.dataset.note;
    NOTES[id].paras = prose.innerText.split(/\n+/).filter((t) => t.trim());
    for (const other of canvas.querySelectorAll(`.prose[data-note="${id}"]`)) {
      if (other === prose) continue;
      other.replaceChildren(...NOTES[id].paras.map((t) => Object.assign(document.createElement('p'), { textContent: t })));
    }
    for (const el of canvas.querySelectorAll(`[data-words="${id}"]`)) el.textContent = wordsOf(id).toLocaleString('en');
  });
  canvas.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.noteRow) (mod(e) ? act.toSide : act.open)(d.noteRow);
    else if (d.closeSide) act.close(+d.closeSide);
    else if ('swap' in d) act.swap();
    else if (d.showSide) act.activate(+d.showSide, true);
    else if ('seal' in d) document.querySelector(`[data-x-set="sb"] [data-value="${root.dataset.sb === 'open' ? 'shut' : 'open'}"]`).click();
  });
  canvas.addEventListener('keydown', (e) => {
    const row = e.target.closest('[data-note-row]');
    if (row && e.key === 'Enter') { e.preventDefault(); (mod(e) ? act.toSide : act.open)(row.dataset.noteRow); }
    if (row && (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey))) { e.preventDefault(); const r = row.getBoundingClientRect(); openMenu(row.dataset.noteRow, r.left + 24, r.bottom); }
  });
  canvas.addEventListener('contextmenu', (e) => {
    const row = e.target.closest('[data-note-row]');
    if (!row) return;
    e.preventDefault();
    openMenu(row.dataset.noteRow, e.clientX, e.clientY);
  });
  wireDivider();
  wireDrop();
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
    if (!mod(e)) return;
    // ⌘3 goes to the page; pressed in a page, to the other page.
    if (e.key === '3' && !e.altKey && !e.shiftKey) {
      e.preventDefault();
      const inPage = document.activeElement?.classList.contains('prose');
      if (inPage && S.sides.length === 2) act.activate(1 - S.active, true);
      else canvas.querySelector(`.prose[data-side="${S.active}"]`)?.focus();
    }
    if (e.key === '\\' && e.altKey) { e.preventDefault(); act.toggle(); }
  });
}

function wireDivider() {
  let drag = null;
  const set = (ratio) => {
    const ctx = context();
    const min = MIN_SIDE / ctx.pageW;
    S.ratio = Math.min(1 - min, Math.max(min, ratio));
    const pg = canvas.querySelector('.pg');
    for (const el of canvas.querySelectorAll('[data-columns]')) el.style.gridTemplateColumns = ctx.columns(el.dataset.columns || undefined);
    pg.querySelector('.divider')?.setAttribute('aria-valuenow', String(Math.round(S.ratio * 100)));
  };
  canvas.addEventListener('pointerdown', (e) => {
    const div = e.target.closest('.divider');
    if (!div || e.target.closest('button')) return;
    e.preventDefault();
    div.setPointerCapture(e.pointerId);
    div.classList.add('is-dragging');
    drag = { div, rect: div.parentElement.getBoundingClientRect() };
  });
  canvas.addEventListener('pointermove', (e) => { if (drag) set((e.clientX - drag.rect.left) / drag.rect.width); });
  const end = () => { if (drag) { drag.div.classList.remove('is-dragging'); drag = null; } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('dblclick', (e) => { if (e.target.closest('.divider')) set(0.5); });
  canvas.addEventListener('keydown', (e) => {
    if (!e.target.classList?.contains('divider')) return;
    const step = { ArrowLeft: -0.02, ArrowRight: 0.02 }[e.key];
    if (step) { e.preventDefault(); set(S.ratio + step); }
    if (e.key === 'Home') { e.preventDefault(); set(0); }
    if (e.key === 'End') { e.preventDefault(); set(1); }
    if (e.key === 'Enter') { e.preventDefault(); set(0.5); }
  });
}

// Dragging a note from the list: onto the page's right edge, a new page beside;
// onto a page, that page.
function wireDrop() {
  let dragged = null;
  const preview = document.createElement('div');
  preview.className = 'drop-preview';
  const where = (e) => {
    const pg = canvas.querySelector('.pg');
    const r = pg.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    if (S.sides.length === 1 || drawn.folded) return x > 0.6 ? { side: 'new', left: 0.5 } : { side: S.active, left: 0 };
    return x > S.ratio ? { side: 1, left: S.ratio } : { side: 0, left: 0, right: 1 - S.ratio };
  };
  canvas.addEventListener('dragstart', (e) => {
    const row = e.target.closest('[data-note-row]');
    if (!row) return;
    dragged = row.dataset.noteRow;
    e.dataTransfer.setData('text/plain', NOTES[dragged].title);
    e.dataTransfer.effectAllowed = 'copy';
    row.classList.add('is-dragged');
  });
  canvas.addEventListener('dragover', (e) => {
    if (!dragged || !e.target.closest('.pg')) { preview.remove(); return; }
    e.preventDefault();
    const w = where(e);
    const pg = canvas.querySelector('.pg');
    if (preview.parentElement !== pg) pg.append(preview);
    preview.style.left = `${w.left * 100}%`;
    preview.style.right = `${(w.right ?? 0) * 100}%`;
    preview.innerHTML = `<span class="label">${w.side === 'new' ? 'Open to the side' : `Open here, in place of ${NOTES[S.sides[w.side]].title}`}</span>`;
  });
  canvas.addEventListener('dragleave', (e) => { if (!e.relatedTarget || !canvas.querySelector('.pg')?.contains(e.relatedTarget)) preview.remove(); });
  canvas.addEventListener('drop', (e) => {
    if (!dragged || !e.target.closest('.pg')) return;
    e.preventDefault();
    const w = where(e);
    const id = dragged;
    preview.remove();
    if (w.side === 'new') act.toSide(id);
    else { S.active = w.side; act.open(id); }
  });
  canvas.addEventListener('dragend', () => { dragged = null; preview.remove(); canvas.querySelector('.is-dragged')?.classList.remove('is-dragged'); });
}

// A note's right-click menu, with the split's choices.
const menu = document.createElement('div');
menu.className = 'menu';
menu.setAttribute('role', 'menu');
menu.hidden = true;
let menuBack = null;
function openMenu(id, x, y) {
  menuBack = document.activeElement;
  const split = S.sides.length === 2;
  const item = (icon, word, key, run) => `<button class="menu__item" role="menuitem" data-run="${run}">${ICONS[icon] ? `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[icon]}</svg>` : '<span></span>'}<span>${word}</span><span class="menu__key">${key}</span></button>`;
  menu.innerHTML = `<div class="menu__head" aria-hidden="true">${NOTES[id].title}</div>
    ${item('open', 'Open', 'Enter', 'open')}
    ${item('side', 'Open to the Side', `${KEY('Mod-')}click`, 'side')}
    ${item('window', 'Open in New Window', '', 'window')}
    ${split ? `<div class="menu__rule" role="separator"></div>${item('swap', 'Swap Sides', '', 'swap')}${item('close', 'Close the Other Side', KEY('Alt-Mod-\\'), 'close')}` : ''}`;
  menu.setAttribute('aria-label', NOTES[id].title);
  menu.hidden = false;
  menu.style.left = `${Math.min(x, innerWidth - 280)}px`;
  menu.style.top = `${Math.min(y, innerHeight - menu.offsetHeight - 8)}px`;
  menu.onclick = (e) => {
    const run = e.target.closest('[data-run]')?.dataset.run;
    if (!run) return;
    closeMenu(false);
    if (run === 'open') act.open(id);
    if (run === 'side') act.toSide(id);
    if (run === 'window') say('In the app, a new window opens on this note: see New window & phone');
    if (run === 'swap') act.swap();
    if (run === 'close') act.close(1 - S.active);
  };
  menu.onkeydown = (e) => {
    const items = [...menu.querySelectorAll('.menu__item')];
    const i = items.indexOf(document.activeElement);
    const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to !== undefined) { e.preventDefault(); items[(to + items.length) % items.length].focus(); }
    if (e.key === 'Tab') { e.preventDefault(); closeMenu(); }
  };
  menu.querySelector('.menu__item').focus();
}
function closeMenu(back = true) {
  if (menu.hidden) return;
  menu.hidden = true;
  if (back) menuBack?.focus?.();
}
document.addEventListener('pointerdown', (e) => { if (!menu.contains(e.target)) closeMenu(false); });

/** The page: the bar, the window and the notes beside it. `bar`: a direction's own choices. */
function mountSplitPage({ id, note, notes, bar = '' }) {
  const pages = [['apart', '1 · Two whole pages'], ['shared', '2 · One set of tools'], ['sheets', '3 · Two sheets'], ['window', 'New window & phone']];
  const group = (attr, label, choices) => `<div class="xbar__group" data-x-set="${attr}"><span class="xbar__label">${label}</span>${choices.map(([v, w]) => `<button class="word-button" data-value="${v}">${w}</button>`).join('')}</div>`;
  document.body.insertAdjacentHTML('afterbegin', `
<header class="xbar">
  <span class="xbar__name">Eien · Split window</span>
  <nav class="xbar__group" aria-label="Directions">${pages.map(([p, w]) => `<a class="word-button" href="split-${p}.html"${p === id ? ' aria-current="page"' : ''}>${w}</a>`).join('')}</nav>
  ${group('layout', 'Layout', [['band', 'A · Band'], ['slip', 'B · Slip'], ['runhead', 'C · Running head']])}
  ${group('theme', 'Light', [['light', 'Day'], ['dark', 'Night']])}
  ${group('sb', 'Sidebar', [['open', 'Open'], ['shut', 'Shut']])}
  ${group('fmt', 'Formatting bar', [['on', 'On'], ['off', 'Off']])}
  ${bar}
  <label class="xbar__group"><span class="xbar__label">Window</span><input type="range" min="900" max="1680" step="20" value="1440" data-win-width aria-label="Window width" /><output></output></label>
  <span class="xnote">${note}</span>
</header>
<main class="stage"><div class="canvas"></div><aside class="notes">${notes}${COMMON_NOTES()}</aside></main>`);
  document.body.append(menu);
  canvas = document.querySelector('.canvas');
  root.dataset.theme ??= matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const width = document.querySelector('[data-win-width]');
  root.dataset.width = width.value;
  width.addEventListener('input', () => { root.dataset.width = width.value; draw(); });
  wire();
  wireBar(draw);
  addEventListener('resize', fit);
  // Open to the side from the start, so the split shows; one key or click puts it back.
  S.sides = ['iv', 'erwin'];
  S.active = 0;
  draw();
}

/** The same in all three directions. */
const COMMON_NOTES = () => `
  <h2>In all three</h2>
  <ul>
    <li><b>Side by side</b>, a divider between: drag it, <kbd>←</kbd> <kbd>→</kbd> on it, double-click to even it; neither page narrower than ${MIN_SIDE}px. Top and bottom isn't offered: prose wants its measure, and two short pages of it read worse than one.</li>
    <li><b>Opening:</b> a note's right-click, Open to the Side; <kbd>${KEY('Mod-')}click</kbd> or <kbd>${KEY('Mod-Enter')}</kbd> on a row; drag a row onto the page's right edge; <kbd>${KEY('Alt-Mod-\\')}</kbd> opens the note beside itself (<kbd>${KEY('Mod-\\')}</kbd> is Toggle Sidebar, so the split takes ⌥ with it).</li>
    <li><b>Active page:</b> a click in it, or <kbd>${KEY('Mod-3')}</kbd> (Go to Page), which pressed in a page goes to the other one. The list's chosen row is the active page's note; the other side's note keeps a fainter rule, in pencil, with no fill.</li>
    <li><b>Choosing a note</b> in the list (or the sidebar, with two panes) opens it in the active page.</li>
    <li><b>Closing a side:</b> its × on hover, <kbd>${KEY('Mod-W')}</kbd> in it (the window's ⌘W, while split), or <kbd>${KEY('Alt-Mod-\\')}</kbd> again for the other side. Nothing is lost: the note is where it was. <b>Swapping:</b> the ⇄ on the divider, or the row's menu.</li>
    <li><b>The same note on both sides</b> is one document: type in one and it shows in the other (try ${KEY('Alt-Mod-\\')} with one note open).</li>
    <li><b>Narrow:</b> below ${MIN_SIDE * 2}px of page (the window less the panes beside it), the two pages fold into one, with a pager naming both; <kbd>${KEY('Mod-3')}</kbd> turns between them. Shutting the sidebar or the list unfolds them. The split is never refused, only folded.</li>
    <li><b>Copy as HTML</b>, <b>Seal</b>, <b>Versions</b>, <b>Outline cards</b>, the formatting keys and Find all act on the active page.</li>
  </ul>`;


// Each page whole: its own top (A's band, B's slip, C's segment of the running head),
// its own formatting bar and colophon.
function sideHtml(ctx, i) {
  const n = ctx.note(i);
  const active = ctx.shown.length === 2 && i === ctx.active;
  const close = ctx.split ? ctx.closeBtn(i) : '';
  const pager = ctx.folded ? ctx.pager() : '';
  const top = ctx.layout === 'band'
    ? `<div class="band"><span class="tools-row quiet">${ctx.views()}</span>${pager}<span class="tools-row quiet">${ctx.pageTools()}${close}</span></div>`
    : ctx.layout === 'slip' ? `<div class="topline">${pager}<span class="slip quiet">${ctx.views()}${ctx.pageTools()}${close}</span></div>` : '';
  return `<section class="side${active ? ' is-active' : ''}" data-side="${i}" aria-label="${n.title}${active ? ', the active page' : ''}">${top}${ctx.fmtBar()}<div class="blotter">${ctx.sheet(i)}</div>${ctx.colophon(i)}</section>`;
}
Split.page = (ctx) => (ctx.shown.length === 1 ? sideHtml(ctx, ctx.shown[0])
  : `<div class="duo" data-columns style="grid-template-columns:${ctx.columns()}">${sideHtml(ctx, 0)}${ctx.divider()}${sideHtml(ctx, 1)}</div>`);
// C: the running head splits over the two pages, a crumb and the tools for each.
function segHtml(ctx, i) {
  return `<div class="seg" data-side="${i}"><span class="crumb">${ctx.note(i).crumb}</span>${ctx.folded ? ctx.pager() : ''}<span class="tools-row">${ctx.views()}${ctx.pageTools()}${ctx.split ? ctx.closeBtn(i) : ''}</span></div>`;
}
Split.strip = (ctx) => (ctx.shown.length === 1 ? segHtml(ctx, ctx.shown[0])
  : `<div class="duo" data-columns style="grid-template-columns:${ctx.columns()}">${segHtml(ctx, 0)}<span></span>${segHtml(ctx, 1)}</div>`);

mountSplitPage({
  id: 'apart',
  note: 'Each page whole: its own tools, formatting bar and colophon. The active page has a rule across its top.',
  notes: `
  <h2>1 · Two whole pages</h2>
  <p>Each page is a whole page, as if the page pane were cut in two: its own top (A's band with the views, the tools and its ×; B's slip; C's half of the running head, a crumb and the tools over each page), its own formatting bar, its own colophon.</p>
  <ul>
    <li><b>Formatting bar:</b> one per page (A: under its band; B: its slip at the page's top left; C: its rail in the page's margin), acting on its page.</li>
    <li><b>Tags:</b> where the layout puts them, on each page (A: the sheet's running head; B: slips under the title; C: each colophon).</li>
    <li><b>Word counts and seals:</b> each colophon has its note's words and last seal; today's tally sits on the active one.</li>
    <li><b>Versions and Compare</b> open in the page they're about: Versions lays its panel over the other page while it's open, so its own page stays in sight. <b>Outline cards</b> fill the page that asked. <b>Copy as HTML</b> copies the active page's note.</li>
    <li><b>Active page:</b> a 2px ink-soft rule across its top, and the caret. Each page's tools come up while the pointer is over that page.</li>
  </ul>
  <h2>For</h2>
  <ul><li>Nothing to guess: every control sits on the page it acts on.</li><li>Each side reads as Eien's page, unchanged.</li></ul>
  <h2>Against</h2>
  <ul><li>Twice the furniture: two bands, two formatting bars, two colophons. On narrow sides A's band crowds, and C's running head stops being one line across the window.</li><li>The rule on top is the one new mark, and it's more than the other two need.</li></ul>`,
});
</script>
</body>
</html>
