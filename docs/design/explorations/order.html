<!doctype html>
<html lang="en" data-arranging="drag">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Your order, and what's laid over it</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/* Shared by every exploration (inlined into each page by _build.py).
   The tokens are the approved ones from ../tokens.css (Washi, day and night),
   plus what the design pass adds: a radius scale, icon sizes, the machine
   face as a setting, and row weights. New tokens are marked NEW. */

:root { color-scheme: light dark; }
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

:root {
  --eien-desk: light-dark(#d9d2c8, #110e0b);
  --eien-blotter: light-dark(#eae5dd, #1a1713);
  --eien-band: light-dark(#f4f1ea, #201d19);
  --eien-paper: light-dark(#fdfbf7, #28241f);
  --eien-paper-raised: light-dark(#ffffff, #312d28);
  --eien-well: light-dark(#f9f7f3, #24201c);
  --eien-hover: light-dark(rgb(35 32 28 / 0.045), rgb(233 226 212 / 0.05));
  --eien-press: light-dark(rgb(35 32 28 / 0.1), rgb(233 226 212 / 0.1));
  --eien-selected: light-dark(#ede9e3, #38332e);
  --eien-scrim: light-dark(rgb(35 32 28 / 0.22), rgb(0 0 0 / 0.5));
  --eien-shadow-sheet: 0 1px 2px light-dark(rgb(58 44 26 / 0.06), rgb(0 0 0 / 0.4)),
    0 6px 24px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45));
  --eien-shadow-float: 0 2px 6px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45)),
    0 14px 36px light-dark(rgb(58 44 26 / 0.16), rgb(0 0 0 / 0.6));
  --eien-ink: light-dark(#23201c, #e9e2d4);
  --eien-ink-soft: light-dark(#51473c, #c3b9a7);
  --eien-pencil: light-dark(#5d5348, #a7a095);
  --eien-faded: light-dark(#766d62, #837c73);
  --eien-rule-soft: light-dark(rgb(35 32 28 / 0.07), rgb(233 226 212 / 0.07));
  --eien-rule: light-dark(rgb(35 32 28 / 0.13), rgb(233 226 212 / 0.14));
  --eien-rule-strong: light-dark(rgb(35 32 28 / 0.26), rgb(233 226 212 / 0.26));
  --eien-hairline: 1px;
  --eien-mark-w: 2px;
  --eien-seal: light-dark(#c4472d, #e0603f);
  --eien-seal-wash: light-dark(rgb(196 71 45 / 0.08), rgb(224 96 63 / 0.12));
  --eien-on-seal: light-dark(#fbf8f2, #1a1714);
  --eien-focus: var(--eien-ink-soft);
  --eien-added: light-dark(#485c2c, #9cb880);
  --eien-added-wash: light-dark(rgb(79 107 58 / 0.13), rgb(156 184 128 / 0.14));
  --eien-removed: light-dark(#93304a, #e98aa0);
  --eien-caution: light-dark(#6b501f, #d0a659);
  --eien-caution-wash: light-dark(rgb(138 100 32 / 0.11), rgb(208 166 89 / 0.12));

  /* The machine voice: IBM Plex Mono by default, now a setting (NEW: set from FACES). */
  --eien-face-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --eien-face-seal: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --eien-size-meta: 11px;
  --eien-size-label: 10px;
  --eien-leading-row: 1.35;
  --eien-track-label: 0.12em;
  --eien-space-1: 4px; --eien-space-2: 8px; --eien-space-3: 12px; --eien-space-4: 16px;
  --eien-space-5: 24px; --eien-space-6: 32px; --eien-space-7: 48px; --eien-space-8: 72px;
  --eien-row-h: 30px;
  --eien-touch: 44px;
  --eien-seal-size: 22px;
  --eien-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --eien-quick: 120ms;
  --eien-calm: 220ms;
  --eien-leading-tighten: 0;
  --eien-sheet-pad-x: var(--eien-space-8);
  --eien-sheet-pad-top: var(--eien-space-7);
  --eien-page-gutter: var(--eien-space-5);
  --eien-title-gap: var(--eien-space-6);
  --eien-paragraph-gap: var(--eien-space-4);
  --eien-row-pad-y: var(--eien-space-3);

  /* NEW: corners. Not everything is square. A small scale: s for what you press
     (buttons, fields, chips), m for what floats (menus, popovers, the tool slip),
     l for what covers the window (a sheet over it, the phone's bottom sheet).
     Paper itself (the sheet, the panes) stays square. Each exploration sets its own. */
  --eien-radius-s: 3px;
  --eien-radius-m: 6px;
  --eien-radius-l: 10px;
  --eien-radius-dot: 999px;

  /* NEW: icons. Drawn on a 16-unit grid, stroked in the ink they sit in. */
  --eien-icon: 16px;
  --eien-icon-stroke: 1.25;
  --eien-control: 28px; /* an icon control's square, desktop */

  /* NEW: row names' weight, two settings (400–700). A selected list title is 100 heavier. */
  --eien-weight-tree: 400;
  --eien-weight-list: 400;
}

/* The text voice: the writer's choice, sizes tuned per face (from ../tokens.css). */
:root, [data-face='newsreader'] { --eien-face-text: 'Newsreader', 'Iowan Old Style', Georgia, serif; --eien-size-prose: 22px; --eien-size-title: 36px; --eien-size-heading: 23px; --eien-size-row: 16px; --eien-size-preview: 14px; --eien-leading-prose: calc(1.5 - var(--eien-leading-tighten)); --eien-measure: 29em; }
[data-face='literata'] { --eien-face-text: 'Literata', Georgia, serif; --eien-size-prose: 19px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.72 - var(--eien-leading-tighten)); --eien-measure: 34em; }
[data-face='plex-sans'] { --eien-face-text: 'IBM Plex Sans', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.76 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='source-sans'] { --eien-face-text: 'Source Sans 3', Arial, sans-serif; --eien-size-prose: 20px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 31em; }
[data-face='atkinson'] { --eien-face-text: 'Atkinson Hyperlegible Next', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='schibsted'] { --eien-face-text: 'Schibsted Grotesk', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 33em; }
[data-face='hanken'] { --eien-face-text: 'Hanken Grotesk', Arial, sans-serif; --eien-size-prose: 19px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='instrument'] { --eien-face-text: 'Instrument Sans', Arial, sans-serif; --eien-size-prose: 18.5px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.7 - var(--eien-leading-tighten)); --eien-measure: 31em; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--eien-blotter);
  color: var(--eien-ink);
  font-family: var(--eien-face-text);
  font-size: var(--eien-size-row);
  line-height: var(--eien-leading-row);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--eien-seal-wash); }
:focus-visible { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 2px; }

.seal {
  display: inline-grid; place-items: center; flex: none;
  width: var(--eien-seal-size); height: var(--eien-seal-size);
  background: var(--eien-seal); color: var(--eien-on-seal);
  font-family: var(--eien-face-seal); font-size: calc(var(--eien-seal-size) * 0.68); line-height: 1;
  border-radius: calc(var(--eien-radius-s) / 2);
  user-select: none;
}
.seal--small { --eien-seal-size: 10px; font-size: 0; }

.label {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil);
}
.count {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  font-variant-numeric: tabular-nums; color: var(--eien-pencil);
}

/* Where a word stays (menus, choices of a setting). */
.word-button {
  appearance: none; border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; padding: var(--eien-space-1) var(--eien-space-2);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft);
  cursor: pointer;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.word-button[aria-pressed='true'], .word-button[aria-checked='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* NEW: the icon control. The word button's states, a square of --eien-control. */
.icon-button {
  appearance: none; display: inline-grid; place-items: center; flex: none;
  width: var(--eien-control); height: var(--eien-control); padding: 0;
  border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; color: var(--eien-ink-soft); cursor: pointer; position: relative;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.icon-button svg, .icon { width: var(--eien-icon); height: var(--eien-icon); display: block; }
.icon { stroke-width: var(--eien-icon-stroke); }
.icon-button[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }
.icon-button:disabled { color: var(--eien-faded); cursor: default; }
@media (hover: hover) {
  .word-button:hover, .icon-button:not(:disabled):hover { color: var(--eien-ink); background: var(--eien-hover); }
}
.word-button:active, .icon-button:not(:disabled):active { background: var(--eien-press); border-color: var(--eien-rule-strong); }

/* NEW: a tooltip names an icon and its key: raised paper, the machine voice. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none;
  left: 50%; top: calc(100% + 6px); translate: -50% 0;
  white-space: pre; padding: 3px 7px; border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em;
  text-transform: none; color: var(--eien-ink-soft);
  opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
}
[data-tip-side='up']::after { top: auto; bottom: calc(100% + 6px); }
[data-tip-side='right']::after { left: calc(100% + 6px); top: 50%; translate: 0 -50%; }
[data-tip-side='left']::after { left: auto; right: calc(100% + 6px); top: 50%; translate: 0 -50%; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: 450ms; } }
[data-tip]:focus-visible::after { opacity: 1; }

.field {
  appearance: none; width: 100%; border: var(--eien-hairline) solid var(--eien-rule);
  border-radius: var(--eien-radius-s); background: var(--eien-well);
  padding: var(--eien-space-2) var(--eien-space-3);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink);
}
.field::placeholder { color: var(--eien-faded); }
.field:focus { outline: none; border-color: var(--eien-focus); }

/* Explorations' own bar: outside the app, like the mockups' bar. */
.xbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--eien-space-1) var(--eien-space-4);
  padding: var(--eien-space-2) var(--eien-space-4);
  background: var(--eien-paper-raised); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.xbar__name { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink); font-weight: 600; }
.xbar__group { display: flex; align-items: center; gap: 2px; }
.xbar__label { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); margin-right: var(--eien-space-1); }
.xnote { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }

body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.stage { min-height: 0; display: grid; grid-template-columns: 300px 380px minmax(0, 1fr); background: var(--eien-blotter); }
.sb { background: var(--eien-desk); border-right: var(--eien-hairline) solid var(--eien-rule); display: flex; flex-direction: column; min-height: 0; position: relative; }
.ls { background: var(--eien-paper); border-right: var(--eien-hairline) solid var(--eien-rule); display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; min-height: 0; overflow: auto; padding: 4px 0 24px; }

.head { position: relative; display: flex; align-items: center; gap: 2px; min-height: var(--eien-row-h); padding: 6px 8px 6px 16px; }
.head .label { flex: 1; }
.head .icon-button { width: 26px; height: 26px; opacity: 0; }
.head:hover .icon-button, .head .icon-button:focus-visible, .head .icon-button[aria-pressed='true'], .head .icon-button.dotted { opacity: 1; }
.ls__head { position: relative; padding: 12px 8px 14px 16px; background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: baseline; }
.ls__title { margin: 0; font-size: var(--eien-size-heading); font-weight: 500; }
.ls__tools { display: flex; gap: 2px; }
.ls__tools .icon-button { width: 26px; height: 26px; }
.ls__meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }

/* A lens laid over your order says so, with its own ×. */
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 2px 1px 7px; border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em; color: var(--eien-ink); }
.chip.is-out { color: var(--eien-removed); text-decoration: line-through; text-decoration-thickness: 1px; }
.chip .icon-button { width: 18px; height: 18px; opacity: 1; } .chip svg { width: 11px; height: 11px; }
.dotted { position: relative; }
.dotted::after { content: ''; position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--eien-ink-soft); }

.menu { position: absolute; z-index: 30; top: calc(100% - 4px); right: 8px; min-width: 230px; padding: 4px; display: grid; gap: 1px;
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
.menu[hidden] { display: none; }
.menu > .word-button { display: flex; align-items: center; gap: 8px; text-align: left; }
.menu > .word-button::before { content: ''; width: 4px; height: 4px; border-radius: 50%; }
.menu > .word-button[aria-checked='true']::before { background: currentColor; }
.menu hr { border: 0; border-top: var(--eien-hairline) solid var(--eien-rule-soft); margin: 3px 0; width: 100%; }
.menu .hint { padding: 4px 8px; font-family: var(--eien-face-mono); font-size: 10px; color: var(--eien-pencil); max-width: 260px; }
.menu__title { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 4px 8px; }

/* NEW: the three-way tag: left alone, wanted, or kept out. One press moves it on. */
.tri { appearance: none; display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border: 0; border-radius: var(--eien-radius-s);
  background: none; cursor: pointer; text-align: left; font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink-soft); }
.tri:hover { background: var(--eien-hover); }
.tri__box { width: 18px; height: 18px; display: grid; place-items: center; border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-s); color: transparent; }
.tri__box svg { width: 12px; height: 12px; }
.tri[data-state='in'] { color: var(--eien-ink); }
.tri[data-state='in'] .tri__box { color: var(--eien-paper); background: var(--eien-ink-soft); border-color: var(--eien-ink-soft); }
.tri[data-state='out'] { color: var(--eien-removed); }
.tri[data-state='out'] .tri__box { color: var(--eien-removed); border-color: var(--eien-removed); background: var(--eien-paper); }
.tri[data-state='out'] .tri__name { text-decoration: line-through; text-decoration-thickness: 1px; }
.tri .count { font-size: 10px; }
.seg { display: inline-flex; gap: 1px; padding: 2px; border-radius: var(--eien-radius-m); background: var(--eien-press); }
.seg .word-button { padding: 2px 6px; }
.seg .word-button[aria-pressed='true'] { background: var(--eien-paper-raised); border-color: var(--eien-rule); }

/* Rows */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; position: relative; }
.tree ul::before { content: ''; position: absolute; top: 0; bottom: 15px; left: calc(16px + var(--d) * 16px + 6px); width: 1px; background: var(--eien-rule); }
.row { position: relative; display: flex; align-items: center; gap: 8px; height: var(--eien-row-h); padding: 0 12px 0 calc(16px + var(--d) * 16px); color: var(--eien-ink-soft); user-select: none; outline: none; }
.row:focus-visible { box-shadow: inset 0 0 0 2px var(--eien-focus); }
@media (hover: hover) { .row:hover { background: var(--eien-hover); } }
.row .tw { width: 12px; height: 12px; display: inline-grid; place-items: center; color: var(--eien-faded); flex: none; }
.row .tw::before { content: ''; width: 5px; height: 7px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); rotate: 90deg; }
.row .tw.leaf::before { content: none; }
.row .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .hash { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }
.grip { width: 14px; height: 18px; color: var(--eien-faded); display: inline-grid; place-items: center; visibility: hidden; cursor: grab; flex: none; }
/* In the tree the grip sits at the row's own left edge, clear of the guide lines at every depth. */
.row .grip { position: absolute; left: 1px; top: 50%; translate: 0 -50%; }
.grip svg { width: 14px; height: 14px; }
.can-drag .row:hover .grip, .can-drag .nrow:hover .grip, .is-arranging .grip { visibility: visible; }
.is-arranging { background: color-mix(in srgb, var(--eien-selected) 40%, transparent); }
.row.is-dragging, .nrow.is-dragging { opacity: 0.4; }
.row[aria-current='true'] { background: var(--eien-selected); color: var(--eien-ink); }
.row.drop-in { background: var(--eien-selected); box-shadow: inset 0 0 0 1px var(--eien-rule-strong); }
.marker { position: absolute; z-index: 10; height: 2px; background: var(--eien-ink-soft); pointer-events: none; display: none; }
.marker::before { content: ''; position: absolute; left: -4px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: var(--eien-ink-soft); }
.marker__out { position: absolute; top: -18px; left: 0; white-space: nowrap; font-family: var(--eien-face-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--eien-ink-soft); background: var(--eien-paper-raised); padding: 0 4px; border-radius: var(--eien-radius-s); border: 1px solid var(--eien-rule); }
.nrow { position: relative; display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 10px; padding: 10px 16px 10px 12px; border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); color: var(--eien-ink-soft); }
.nrow .grip { margin-left: 0; }
/* Where a dragged note will land: a line the list's full width, in ink, as the tree's marker is. */
.nrow.drop-before::after, .nrow.drop-after::after { content: ''; position: absolute; left: 0; right: 0; height: var(--eien-mark-w); background: var(--eien-ink-soft); pointer-events: none; z-index: 2; }
.nrow.drop-before::after { top: calc(var(--eien-mark-w) / -2); }
.nrow.drop-after::after { bottom: calc(var(--eien-mark-w) / -2); }
.nrow .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nrow .p { grid-column: 2 / -1; font-size: var(--eien-size-preview); color: var(--eien-pencil); }
.nrow .tg { font-family: var(--eien-face-mono); font-size: 10px; color: var(--eien-pencil); }
.locked { padding: 7px 16px; font-family: var(--eien-face-mono); font-size: 10px; color: var(--eien-pencil); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); }
.locked[hidden] { display: none; }
.empty { padding: 32px 16px; text-align: center; font-style: italic; color: var(--eien-ink-soft); }

.notes { padding: var(--eien-space-6); overflow: auto; color: var(--eien-ink-soft); font-size: var(--eien-size-preview); line-height: 1.6; }
.notes h2 { font-size: var(--eien-size-heading); font-weight: 500; color: var(--eien-ink); margin: 0 0 8px; }
.notes kbd { font-family: var(--eien-face-mono); font-size: 11px; padding: 0 4px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-paper); }
.notes p { margin: 0 0 12px; max-width: 40em; }
.log { font-family: var(--eien-face-mono); font-size: 11px; color: var(--eien-pencil); padding: 6px 16px; background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); }

/** An icon as SVG markup, stroked in currentColor. */
function icon(name, label) {
  const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
  return `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICONS[name]}</svg>`;
}

/** Fill every [data-icon] with its icon. */
function drawIcons(root = document) {
  for (const el of root.querySelectorAll('[data-icon]')) {
    el.innerHTML = icon(el.dataset.icon) + (el.dataset.iconText ?? '');
  }
}

/** The faces the text voice offers (all but the mono), and the machine voice (all). */
const TEXT_FACES = FACES.filter((face) => !face.mono);
const MACHINE_FACES = FACES;

function setMachineFace(id) {
  const face = FACES.find((each) => each.id === id) ?? FACES[0];
  document.documentElement.style.setProperty('--eien-face-mono', face.family);
}
function setTextFace(id) {
  if (id === 'newsreader') delete document.documentElement.dataset.face;
  else document.documentElement.dataset.face = id;
}

/** The explorations' bar: [data-x-set="attr"] groups set data-<attr> on <html>. */
function wireBar(onChange = () => {}) {
  for (const group of document.querySelectorAll('[data-x-set]')) {
    const attr = group.dataset.xSet;
    const buttons = [...group.querySelectorAll('button[data-value]')];
    const pick = (value) => {
      document.documentElement.dataset[attr] = value;
      for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.value === value));
      onChange(attr, value);
    };
    for (const b of buttons) b.addEventListener('click', () => pick(b.dataset.value));
    pick(document.documentElement.dataset[attr] ?? buttons[0].dataset.value);
  }
}

// Themes: [day, night] for each colour token. The rules are the ink at low
// strength, so they follow it. Washi is tokens.css's own; the rest are new.
const THEME_TOKENS = ['desk', 'blotter', 'band', 'paper', 'selected', 'ink', 'ink-soft', 'pencil', 'faded', 'seal'];
const THEMES = {
  washi: { name: 'Washi', kanji: '和紙', note: 'Eien’s own: paper and sumi ink', t: {
    desk: ['#d9d2c8', '#110e0b'], blotter: ['#eae5dd', '#1a1713'], band: ['#f4f1ea', '#201d19'], paper: ['#fdfbf7', '#28241f'], selected: ['#ede9e3', '#38332e'],
    ink: ['#23201c', '#e9e2d4'], 'ink-soft': ['#51473c', '#c3b9a7'], pencil: ['#5d5348', '#a7a095'], faded: ['#766d62', '#837c73'], seal: ['#c4472d', '#e0603f'] } },

    ink: ['#2a2418', '#ece3cc'], 'ink-soft': ['#574a33', '#c8bb9c'], pencil: ['#5f523d', '#ab9f86'], faded: ['#7b6d56', '#88806d'], seal: ['#b8432a', '#dc6a43'] } },
  aizome: { name: 'Aizome', kanji: '藍染', note: 'Indigo dye: cool paper, blue-black ink', t: {
    desk: ['#c9cfd8', '#0b0e14'], blotter: ['#dfe3e9', '#121620'], band: ['#edf0f4', '#181d28'], paper: ['#fbfcfd', '#1f2533'], selected: ['#e3e8ef', '#2e3648'],
    ink: ['#17213a', '#dde4f0'], 'ink-soft': ['#34405c', '#b3bfd6'], pencil: ['#3f4b64', '#97a3ba'], faded: ['#5f6a80', '#7a8599'], seal: ['#c4472d', '#e3664a'] } },
  koke: { name: 'Koke', kanji: '苔', note: 'A moss garden: green-grey desk, quiet ink', t: {
    desk: ['#cdd2c4', '#0d100b'], blotter: ['#e1e5d9', '#141811'], band: ['#eef0e8', '#1a1f16'], paper: ['#fafbf6', '#21271c'], selected: ['#e5e9dc', '#30382a'],
    ink: ['#1f2619', '#e2e8d6'], 'ink-soft': ['#3e4833', '#bcc6ab'], pencil: ['#48523c', '#a0aa90'], faded: ['#67705a', '#808a72'], seal: ['#a8432f', '#d76a4e'] } },
  rosoku: { name: 'Rōsoku', kanji: '蝋燭', note: 'Candlelight: amber at night, no blue light', t: {
    desk: ['#dccab2', '#120c06'], blotter: ['#ecdfcb', '#1b130b'], band: ['#f5ece0', '#22180e'], paper: ['#fdf8f0', '#2a1f13'], selected: ['#efe3d1', '#3c2d1e'],
    ink: ['#2b1d10', '#f0dcc0'], 'ink-soft': ['#5a4129', '#d2b894'], pencil: ['#634d37', '#b39b7c'], faded: ['#7f6a53', '#8f7c64'], seal: ['#b9442b', '#e8763f'] } },
  sumi: { name: 'Sumi', kanji: '墨', note: 'For tired eyes: the most contrast there is', t: {
    desk: ['#cfcfcc', '#000000'], blotter: ['#e6e6e3', '#0a0a0a'], band: ['#f2f2ef', '#141414'], paper: ['#ffffff', '#1b1b1b'], selected: ['#e8e8e4', '#2c2c2c'],
    ink: ['#000000', '#f5f5f2'], 'ink-soft': ['#262626', '#d9d9d4'], pencil: ['#3a3a3a', '#bdbdb8'], faded: ['#5e5e5e', '#8f8f8a'], seal: ['#c4361d', '#ff6a45'] } },
  sakura: { name: 'Sakura-nezumi', kanji: '桜鼠', note: 'Cherry-grey: plum ink, a rose seal', t: {
    desk: ['#d8cdcc', '#120d0e'], blotter: ['#e9e1e0', '#1b1415'], band: ['#f3eeed', '#221a1b'], paper: ['#fdfafa', '#2a2122'], selected: ['#eee6e5', '#3a2f30'],
    ink: ['#2a1e20', '#efe1e2'], 'ink-soft': ['#573f43', '#cbb5b8'], pencil: ['#5f464a', '#ad989b'], faded: ['#7c6468', '#8d7b7d'], seal: ['#b2394a', '#e0697a'] } },
};
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function luminance(h) {
  return hexRgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; })
    .reduce((sum, v, i) => sum + v * [0.2126, 0.7152, 0.0722][i], 0);
}
const contrast = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const hsl = (h, s, l) => { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12; const a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return '#' + [f(0), f(8), f(4)].map((v) => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); };
/**
 * An ink of hue `h` and saturation `sat`, starting at lightness `l` and stepped
 * darker by day (`dir` -1) or lighter by night (+1) until it reaches `min`
 * contrast on every one of `grounds`: the hue stays, the contrast holds.
 */
function fitInk(h, sat, l, grounds, min, dir) {
  let ink = hsl(h, sat, l);
  while (grounds.some((g) => contrast(ink, g) < min + 0.1) && l > 0 && l < 100) { l += dir; ink = hsl(h, sat, l); }
  return ink;
}
/** "Custom": four choices, and every token worked out from them, day and night. */
function mixTheme({ paper: ph, warmth: w, ink: ih, seal: sh }, name = 'My Room') {
  const surf = (dl, nl) => [hsl(ph, w, dl), hsl(ph, Math.min(w, 22), nl)];
  const t = { desk: surf(83, 5), blotter: surf(89, 8), band: surf(94, 11), paper: surf(98.5, 14), selected: surf(91, 19), seal: [hsl(sh, 63, 47), hsl(sh, 72, 56)] };
  const grounds = (s) => ['desk', 'band', 'paper', 'selected'].map((k) => t[k][s]);
  // The inks carry their hue, saturated enough to see by day, each as light as Eien's contrast allows.
  const ink = (sat, dl, nsat, nl, min) => [fitInk(ih, sat, dl, grounds(0), min, -1), fitInk(ih, nsat, nl, grounds(1), min, 1)];
  Object.assign(t, { ink: ink(48, 16, 38, 88, 7), 'ink-soft': ink(38, 30, 30, 70, 4.5), pencil: ink(30, 34, 20, 62, 4.5), faded: ink(20, 46, 12, 52, 3) });
  return { name, kanji: '', note: 'Your own', t };
}
/** A theme on the whole page: each token as light-dark(day, night); the rules from the ink. */
function applyTheme(theme, el = document.documentElement) {
  for (const k of THEME_TOKENS) el.style.setProperty(`--eien-${k}`, `light-dark(${theme.t[k][0]}, ${theme.t[k][1]})`);
  const [d, n] = theme.t.ink.map((c) => hexRgb(c).join(' '));
  el.style.setProperty('--eien-rule-soft', `light-dark(rgb(${d} / 0.07), rgb(${n} / 0.07))`);
  el.style.setProperty('--eien-rule', `light-dark(rgb(${d} / 0.13), rgb(${n} / 0.14))`);
  el.style.setProperty('--eien-rule-strong', `light-dark(rgb(${d} / 0.26), rgb(${n} / 0.26))`);
  el.style.setProperty('--eien-paper-raised', `light-dark(color-mix(in srgb, ${theme.t.paper[0]} 45%, #fff), color-mix(in srgb, ${theme.t.paper[1]} 88%, #fff))`);
  el.style.setProperty('--eien-well', `light-dark(color-mix(in srgb, ${theme.t.paper[0]} 70%, ${theme.t.band[0]}), color-mix(in srgb, ${theme.t.paper[1]} 60%, ${theme.t.blotter[1]}))`);
}

const NOTES = [
  ['The Last Bell', 'Sep 2', ['posted', 'fic/aot']], ['Wall Rose, at Dusk', 'Sep 9', ['posted']], ['Rations', 'Aug 21', ['draft']], ['What the Recruits Say', 'Oct 18', ['draft', 'fic/aot']],
  ['Night Watch', 'Oct 2', ['ideas']], ['A Borrowed Coat', 'Jul 30', ['posted', 'fic/aot']], ['The Gate Holds', 'Oct 20', ['draft', 'ideas']],
].map(([t, d, tags], i) => ({ id: 100 + i, t, d, tags, when: Date.parse(`${d} 2026`) }));
const ALL_TAGS = [...new Set(NOTES.flatMap((n) => n.tags))].sort();

// The lens: a sort per list, and the list's tag filter (each tag left alone, wanted, or kept out).
const lens = { Folders: 'yours', Tags: 'yours', list: 'yours' };
const filter = { tags: new Map(), match: 'all' }; // tag → 'in' | 'out'
const arranging = { Folders: false, Tags: false, list: false };
const SORTS = { yours: 'Your order', newest: 'Newest', oldest: 'Oldest', az: 'Title A–Z', za: 'Title Z–A' };
const TREE_SORTS = { yours: 'Your order', az: 'A–Z', za: 'Z–A' };
const setting = () => document.documentElement.dataset.arranging; // 'drag' | 'mode'
const log = (s) => { document.getElementById('log').textContent = s; };
const filtered = () => filter.tags.size > 0;

/** The order a pane shows: your order while it's arranging (the lens waits), else its lens. */
const how = (which) => (arranging[which] ? 'yours' : lens[which]);
const lensOn = (which) => !arranging[which] && (lens[which] !== 'yours' || (which === 'list' && filtered()));
/** Reordering is allowed only with your order showing, and in Arrange mode only while arranging. */
const canDrag = (which) => !lensOn(which) && (setting() === 'drag' || arranging[which]);

const sorted = (items, by, key) => {
  const out = [...items];
  if (by === 'az') out.sort((a, b) => key(a).localeCompare(key(b)));
  if (by === 'za') out.sort((a, b) => key(b).localeCompare(key(a)));
  if (by === 'newest') out.sort((a, b) => b.when - a.when);
  if (by === 'oldest') out.sort((a, b) => a.when - b.when);
  return out;
};
function passes(n) {
  if (arranging.list) return true;
  const wanted = [...filter.tags].filter(([, s]) => s === 'in').map(([t]) => t);
  const kept = [...filter.tags].filter(([, s]) => s === 'out').map(([t]) => t);
  if (kept.some((t) => n.tags.includes(t))) return false;
  if (!wanted.length) return true;
  return filter.match === 'all' ? wanted.every((t) => n.tags.includes(t)) : wanted.some((t) => n.tags.includes(t));
}

function treeHtml(list, depth, which) {
  return sorted(list, how(which), (n) => n.name).map((n) => `<li data-id="${n.id}"><div class="row" tabindex="0" draggable="${canDrag(which)}" data-id="${n.id}" style="--d:${depth}" ${n.current ? 'aria-current="true"' : ''}>
    <span class="grip">${icon('grip')}</span><span class="tw${n.children?.length ? '' : ' leaf'}"></span><span class="nm">${n.tag ? '<span class="hash">#</span>' : ''}${n.name}</span></div>
    ${n.children?.length ? `<ul style="--d:${depth}">${treeHtml(n.children, depth + 1, which)}</ul>` : ''}</li>`).join('');
}
const sortMenu = (which, sorts) => `<div class="menu" hidden data-menu="${which}">${Object.entries(sorts).map(([k, label]) =>
  `<button class="word-button" role="menuitemradio" aria-checked="${lens[which] === k}" data-lens="${which}" data-v="${k}">${label}</button>`).join('')}<hr /><span class="hint">Your order stays underneath</span></div>`;
const arrangeButton = (which) => setting() === 'mode'
  ? `<button class="icon-button" data-arrange="${which}" aria-pressed="${arranging[which]}" data-icon="grip" data-tip="${arranging[which] ? 'Done arranging' : 'Arrange'}" aria-label="Arrange"></button>` : '';
const sortChip = (which, sorts) => lens[which] !== 'yours' && !arranging[which]
  ? `<span class="chip">${sorts[lens[which]]}<button class="icon-button" data-clear="${which}" aria-label="Back to your order">${icon('close')}</button></span>` : '';

function drawSidebar() {
  document.getElementById('sb').innerHTML = `<div class="scroll">${Object.keys(TREES).map((which) => `<div class="head"><span class="label">${which}</span>${sortChip(which, TREE_SORTS)}
    ${arrangeButton(which)}<button class="icon-button${lens[which] !== 'yours' ? ' dotted' : ''}" data-open="${which}" data-icon="sort" data-tip="Sort" aria-label="Sort" ${arranging[which] ? 'disabled' : ''}></button>${sortMenu(which, TREE_SORTS)}
    <button class="icon-button" data-icon="plus" data-tip="New ${which === 'Tags' ? 'tag' : 'folder'}" aria-label="New"></button></div>
    <ul class="tree${canDrag(which) ? ' can-drag' : ''}${arranging[which] ? ' is-arranging' : ''}" data-tree="${which}">${treeHtml(TREES[which], 0, which)}</ul>`).join('')}</div>
    <div class="marker" id="marker"><span class="marker__out" hidden>Out of its folder</span></div>`;
}
function filterMenu() {
  return `<div class="menu" hidden data-menu="filter"><div class="menu__title"><span class="label">Tags</span>
      <span class="seg"><button class="word-button" aria-pressed="${filter.match === 'all'}" data-match="all">All of</button><button class="word-button" aria-pressed="${filter.match === 'any'}" data-match="any">Any of</button></span></div>
    ${ALL_TAGS.map((t) => { const st = filter.tags.get(t) ?? 'none'; return `<button class="tri" data-tri="${t}" data-state="${st}" aria-label="#${t}: ${st === 'in' ? 'wanted' : st === 'out' ? 'kept out' : 'left alone'}">
      <span class="tri__box">${st === 'out' ? icon('exclude') : icon('check')}</span><span class="tri__name">#${t}</span><span class="count">${NOTES.filter((n) => n.tags.includes(t)).length}</span></button>`; }).join('')}
    <hr /><span class="hint">Press once to want it, twice to keep it out, again to leave it alone. ⌥ and a press keeps it out at once.</span>
    ${filtered() ? '<button class="word-button" data-clearfilter>Every note</button>' : ''}</div>`;
}
function drawList() {
  const shown = sorted(NOTES.filter(passes), how('list'), (n) => n.t);
  const tagChips = arranging.list ? '' : [...filter.tags].map(([t, s]) => `<span class="chip${s === 'out' ? ' is-out' : ''}" title="${s === 'out' ? 'Kept out' : 'Wanted'}">#${t}<button class="icon-button" data-untag="${t}" aria-label="Leave #${t} alone">${icon('close')}</button></span>`).join('');
  const matchNote = !arranging.list && [...filter.tags.values()].filter((s) => s === 'in').length > 1 ? `<span class="label">${filter.match === 'all' ? 'all of' : 'any of'}</span>` : '';
  const ls = document.getElementById('ls');
  ls.innerHTML = `<header class="ls__head"><h2 class="ls__title">Beneath the Walls</h2>
      <span class="ls__tools">${arrangeButton('list')}
        <button class="icon-button${filtered() ? ' dotted' : ''}" data-open="filter" data-icon="filter" data-tip="Filter by tag" aria-label="Filter by tag" ${arranging.list ? 'disabled' : ''}></button>
        <button class="icon-button${lens.list !== 'yours' ? ' dotted' : ''}" data-open="list" data-icon="sort" data-tip="Sort" aria-label="Sort" ${arranging.list ? 'disabled' : ''}></button>${sortMenu('list', SORTS)}${filterMenu()}</span>
      <div class="ls__meta"><span class="label">${shown.length} of ${NOTES.length} notes · book</span>${sortChip('list', SORTS)}${matchNote}${tagChips}</div></header>
    <div class="locked" ${lensOn('list') ? '' : 'hidden'}>Sorted or filtered: your order is kept underneath. Clear it to drag.</div>
    <div class="locked" ${setting() === 'mode' && !arranging.list && !lensOn('list') ? '' : 'hidden'}>Your order. Choose Arrange to move notes.</div>
    <div class="scroll${canDrag('list') ? ' can-drag' : ''}${arranging.list ? ' is-arranging' : ''}">${shown.length ? shown.map((n) => `<div class="nrow" draggable="${canDrag('list')}" data-note="${n.id}" tabindex="0"><span class="grip">${icon('grip')}</span><span class="t">${n.t}</span><span class="count">${n.d}</span>
      <span class="p">${n.tags.map((t) => `<span class="tg">#${t}</span>`).join(' ')}</span></div>`).join('') : '<p class="empty">No note here passes that filter.</p>'}</div>`;
}
function draw() { drawSidebar(); drawList(); drawIcons(); wire(); }

function findIn(list, id, parent = null) { for (const [i, n] of list.entries()) { if (n.id === id) return { list, i, n, parent }; const f = n.children && findIn(n.children, id, n); if (f) return f; } return null; }
const contains = (n, id) => n.id === id || (n.children ?? []).some((c) => contains(c, id));
function move(which, id, targetId, place) {
  const tree = TREES[which];
  const src = findIn(tree, id); if (!src || contains(src.n, targetId)) return;
  src.list.splice(src.i, 1);
  const dst = findIn(tree, targetId);
  if (place === 'in') { dst.n.children = dst.n.children ?? []; dst.n.children.push(src.n); log(`“${src.n.name}” moved into “${dst.n.name}”.`); }
  else { dst.list.splice(dst.i + (place === 'after' ? 1 : 0), 0, src.n); log(`“${src.n.name}” placed ${place} “${dst.n.name}”, in your order.`); }
  draw();
}
/** Out of its folder: placed just after the folder it was in. */
function outdent(which, id) {
  const tree = TREES[which]; const f = findIn(tree, id); if (!f?.parent) return;
  f.list.splice(f.i, 1); const p = findIn(tree, f.parent.id); p.list.splice(p.i + 1, 0, f.n);
  log(`“${f.n.name}” taken out of “${f.parent.name}”.`); draw();
}
const reopen = (name) => { const m = document.querySelector(`[data-menu="${name}"]`); if (m) m.hidden = false; };

let dragging = null;
function wire() {
  for (const b of document.querySelectorAll('[data-open]')) b.onclick = (e) => { e.stopPropagation(); const m = document.querySelector(`[data-menu="${b.dataset.open}"]`); const was = !m.hidden; for (const x of document.querySelectorAll('.menu')) x.hidden = true; m.hidden = was; };
  for (const b of document.querySelectorAll('[data-lens]')) b.onclick = () => { lens[b.dataset.lens] = b.dataset.v; log(b.dataset.v === 'yours' ? 'Back to your order.' : `${SORTS[b.dataset.v] ?? TREE_SORTS[b.dataset.v]}, laid over your order.`); draw(); };
  for (const b of document.querySelectorAll('[data-clear]')) b.onclick = () => { lens[b.dataset.clear] = 'yours'; log('Back to your order.'); draw(); };
  for (const b of document.querySelectorAll('[data-untag]')) b.onclick = () => { filter.tags.delete(b.dataset.untag); draw(); };
  for (const b of document.querySelectorAll('[data-clearfilter]')) b.onclick = () => { filter.tags.clear(); draw(); };
  for (const b of document.querySelectorAll('[data-match]')) b.onclick = (e) => { e.stopPropagation(); filter.match = b.dataset.match; draw(); reopen('filter'); };
  for (const b of document.querySelectorAll('[data-tri]')) b.onclick = (e) => {
    e.stopPropagation();
    const t = b.dataset.tri; const now = filter.tags.get(t);
    const next = e.altKey ? (now === 'out' ? undefined : 'out') : now === undefined ? 'in' : now === 'in' ? 'out' : undefined;
    if (next) filter.tags.set(t, next); else filter.tags.delete(t);
    draw(); reopen('filter');
  };
  for (const b of document.querySelectorAll('[data-arrange]')) b.onclick = () => {
    const w = b.dataset.arrange; arranging[w] = !arranging[w];
    log(arranging[w] ? 'Arranging: your order shows, any sort or filter set aside. Drag, or ⌥ and the arrows.' : 'Done. The sort and filter you had are back.'); draw();
  };
  const marker = document.getElementById('marker');
  for (const row of document.querySelectorAll('.tree .row')) {
    const which = row.closest('[data-tree]').dataset.tree;
    row.ondragstart = (e) => { dragging = { which, id: +row.dataset.id }; row.classList.add('is-dragging'); e.dataTransfer.effectAllowed = 'move'; };
    row.ondragend = () => { row.classList.remove('is-dragging'); marker.style.display = 'none'; for (const r of document.querySelectorAll('.drop-in')) r.classList.remove('drop-in'); };
    row.ondragover = (e) => {
      if (!dragging || dragging.which !== which || !canDrag(which)) return;
      e.preventDefault();
      const r = row.getBoundingClientRect(); const sb = document.getElementById('sb').getBoundingClientRect();
      const y = (e.clientY - r.top) / r.height; const depth = +row.style.getPropertyValue('--d');
      const out = depth > 0 && e.clientX - r.left < 16 + depth * 16 - 8;
      const place = out ? 'out' : y < 0.3 ? 'before' : y > 0.7 ? 'after' : 'in';
      row.dataset.place = place;
      for (const x of document.querySelectorAll('.drop-in')) x.classList.remove('drop-in');
      marker.querySelector('.marker__out').hidden = place !== 'out';
      if (place === 'in') { row.classList.add('drop-in'); marker.style.display = 'none'; return; }
      const d = place === 'out' ? depth - 1 : depth;
      marker.style.display = 'block'; marker.style.top = `${(place === 'before' ? r.top : r.bottom) - sb.top - 1}px`;
      marker.style.left = `${16 + d * 16 + 18}px`; marker.style.right = '12px';
    };
    row.ondrop = (e) => {
      e.preventDefault(); if (!dragging) return;
      if (row.dataset.place === 'out') outdent(which, dragging.id);
      else if (dragging.id !== +row.dataset.id) move(which, dragging.id, +row.dataset.id, row.dataset.place);
      dragging = null;
    };
    row.onkeydown = (e) => {
      if (!e.altKey || !canDrag(which)) return;
      const f = findIn(TREES[which], +row.dataset.id); if (!f) return; const id = f.n.id;
      if (e.key === 'ArrowUp' && f.i > 0) move(which, id, f.list[f.i - 1].id, 'before');
      else if (e.key === 'ArrowDown' && f.i < f.list.length - 1) move(which, id, f.list[f.i + 1].id, 'after');
      else if (e.key === 'ArrowLeft' && f.parent) outdent(which, id);
      else if (e.key === 'ArrowRight' && f.i > 0) move(which, id, f.list[f.i - 1].id, 'in');
      else return;
      e.preventDefault(); document.querySelector(`.row[data-id="${id}"]`)?.focus();
    };
  }
  for (const row of document.querySelectorAll('.nrow')) {
    row.ondragstart = () => { dragging = { which: 'list', id: +row.dataset.note }; row.classList.add('is-dragging'); };
    const unmark = () => { for (const r of document.querySelectorAll('.drop-before, .drop-after')) r.classList.remove('drop-before', 'drop-after'); };
    row.ondragend = () => { row.classList.remove('is-dragging'); unmark(); };
    row.ondragover = (e) => {
      if (dragging?.which !== 'list' || !canDrag('list')) return;
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const place = e.clientY - r.top < r.height / 2 ? 'before' : 'after';
      if (!row.classList.contains(`drop-${place}`)) { unmark(); row.classList.add(`drop-${place}`); }
      row.dataset.place = place;
    };
    row.ondragleave = (e) => { if (!row.contains(e.relatedTarget)) row.classList.remove('drop-before', 'drop-after'); };
    row.ondrop = (e) => {
      e.preventDefault(); unmark();
      if (!dragging || dragging.id === +row.dataset.note) return;
      const [n] = NOTES.splice(NOTES.findIndex((x) => x.id === dragging.id), 1);
      const at = NOTES.findIndex((x) => x.id === +row.dataset.note) + (row.dataset.place === 'after' ? 1 : 0);
      NOTES.splice(at, 0, n);
      log(`“${n.t}” placed ${row.dataset.place} “${row.querySelector('.t').textContent}”, in your order.`); dragging = null; draw();
    };
  }
}
document.addEventListener('click', (e) => { if (!e.target.closest('.menu') && !e.target.closest('[data-open]')) for (const m of document.querySelectorAll('.menu')) m.hidden = true; });

const NOTES_TEXT = {
  drag: `<h2>Drag anytime (the default)</h2><p>Each pane keeps your order. A sort or a tag filter is a lens laid over it, shown as a chip in the pane's head: <b>NEWEST ×</b>, <b>#draft ×</b>, a struck-through <b>#posted ×</b> for a tag kept out. The × takes it off and your order is back, untouched. While a lens is on, rows can't be dragged, and a line under the head says why.</p><p>Drag a folder onto another to put it inside, to the left of its own row to take it out of its folder. From the keyboard: <kbd>⌥↑</kbd> <kbd>⌥↓</kbd> move, <kbd>⌥←</kbd> out of the folder, <kbd>⌥→</kbd> into the folder above.</p>`,
  mode: `<h2>In Arrange mode</h2><p>The same panes, but order changes only on purpose: <b>Arrange</b> (the grip, in a pane's head) starts it. Grips show on every row, any sort or filter is set aside while you arrange, and both come back when you choose <b>Done</b>. Outside it, nothing can be dragged out of place by accident.</p><p>One setting switches between the two: Settings / Writing / Lists, <b>Arranging</b>: Drag anytime, or In Arrange mode.</p>`,
};
wireBar(() => {
  for (const k of Object.keys(arranging)) arranging[k] = false;
  document.getElementById('notes').innerHTML = NOTES_TEXT[setting()] + '<h2 style="margin-top:28px">The tag filter</h2><p>The filter icon in the list’s head opens the vault’s tags, each in one of three states: left alone, <b>wanted</b> (filled), or <b>kept out</b> (struck through, in carmine). One press moves a tag on to the next; ⌥ and a press keeps it out at once. With two or more wanted, <b>All of</b> or <b>Any of</b> decides. Each state shows as a chip in the head, with its ×.</p><p class="xnote">Where it’s kept: your order of a folder’s notes and subfolders in its .eien-folder.json (as now); the top folders, the tags and All Notes in .eien/order.json, so it syncs. The lens is this device’s, per list, as sorts are now.</p>';
  draw();
});
</script>
</body>
</html>
