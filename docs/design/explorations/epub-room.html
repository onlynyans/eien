<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Showcase 1 · The reading room</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/* Shared by every exploration (inlined into each page by _build.py).
   The tokens are the approved ones from ../tokens.css (Washi, day and night),
   plus what the design pass adds: a radius scale, icon sizes, the machine
   face as a setting, and row weights. New tokens are marked NEW. */

:root { color-scheme: light dark; }
:root[data-theme='light'] { color-scheme: light; }
:root[data-theme='dark'] { color-scheme: dark; }

:root {
  --eien-desk: light-dark(#d9d2c8, #110e0b);
  --eien-blotter: light-dark(#eae5dd, #1a1713);
  --eien-band: light-dark(#f4f1ea, #201d19);
  --eien-paper: light-dark(#fdfbf7, #28241f);
  --eien-paper-raised: light-dark(#ffffff, #312d28);
  --eien-well: light-dark(#f9f7f3, #24201c);
  --eien-hover: light-dark(rgb(35 32 28 / 0.045), rgb(233 226 212 / 0.05));
  --eien-press: light-dark(rgb(35 32 28 / 0.1), rgb(233 226 212 / 0.1));
  --eien-selected: light-dark(#ede9e3, #38332e);
  --eien-scrim: light-dark(rgb(35 32 28 / 0.22), rgb(0 0 0 / 0.5));
  --eien-shadow-sheet: 0 1px 2px light-dark(rgb(58 44 26 / 0.06), rgb(0 0 0 / 0.4)),
    0 6px 24px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45));
  --eien-shadow-float: 0 2px 6px light-dark(rgb(58 44 26 / 0.08), rgb(0 0 0 / 0.45)),
    0 14px 36px light-dark(rgb(58 44 26 / 0.16), rgb(0 0 0 / 0.6));
  --eien-ink: light-dark(#23201c, #e9e2d4);
  --eien-ink-soft: light-dark(#51473c, #c3b9a7);
  --eien-pencil: light-dark(#5d5348, #a7a095);
  --eien-faded: light-dark(#766d62, #837c73);
  --eien-rule-soft: light-dark(rgb(35 32 28 / 0.07), rgb(233 226 212 / 0.07));
  --eien-rule: light-dark(rgb(35 32 28 / 0.13), rgb(233 226 212 / 0.14));
  --eien-rule-strong: light-dark(rgb(35 32 28 / 0.26), rgb(233 226 212 / 0.26));
  --eien-hairline: 1px;
  --eien-mark-w: 2px;
  --eien-seal: light-dark(#c4472d, #e0603f);
  --eien-seal-wash: light-dark(rgb(196 71 45 / 0.08), rgb(224 96 63 / 0.12));
  --eien-on-seal: light-dark(#fbf8f2, #1a1714);
  --eien-focus: var(--eien-ink-soft);
  --eien-added: light-dark(#485c2c, #9cb880);
  --eien-added-wash: light-dark(rgb(79 107 58 / 0.13), rgb(156 184 128 / 0.14));
  --eien-removed: light-dark(#93304a, #e98aa0);
  --eien-caution: light-dark(#6b501f, #d0a659);
  --eien-caution-wash: light-dark(rgb(138 100 32 / 0.11), rgb(208 166 89 / 0.12));

  /* The machine voice: IBM Plex Mono by default, now a setting (NEW: set from FACES). */
  --eien-face-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --eien-face-seal: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', serif;
  --eien-size-meta: 11px;
  --eien-size-label: 10px;
  --eien-leading-row: 1.35;
  --eien-track-label: 0.12em;
  --eien-space-1: 4px; --eien-space-2: 8px; --eien-space-3: 12px; --eien-space-4: 16px;
  --eien-space-5: 24px; --eien-space-6: 32px; --eien-space-7: 48px; --eien-space-8: 72px;
  --eien-row-h: 30px;
  --eien-touch: 44px;
  --eien-seal-size: 22px;
  --eien-ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --eien-quick: 120ms;
  --eien-calm: 220ms;
  --eien-leading-tighten: 0;
  --eien-sheet-pad-x: var(--eien-space-8);
  --eien-sheet-pad-top: var(--eien-space-7);
  --eien-page-gutter: var(--eien-space-5);
  --eien-title-gap: var(--eien-space-6);
  --eien-paragraph-gap: var(--eien-space-4);
  --eien-row-pad-y: var(--eien-space-3);

  /* NEW: corners. Not everything is square. A small scale: s for what you press
     (buttons, fields, chips), m for what floats (menus, popovers, the tool slip),
     l for what covers the window (a sheet over it, the phone's bottom sheet).
     Paper itself (the sheet, the panes) stays square. Each exploration sets its own. */
  --eien-radius-s: 3px;
  --eien-radius-m: 6px;
  --eien-radius-l: 10px;
  --eien-radius-dot: 999px;

  /* NEW: icons. Drawn on a 16-unit grid, stroked in the ink they sit in. */
  --eien-icon: 16px;
  --eien-icon-stroke: 1.25;
  --eien-control: 28px; /* an icon control's square, desktop */

  /* NEW: row names' weight, two settings (400–700). A selected list title is 100 heavier. */
  --eien-weight-tree: 400;
  --eien-weight-list: 400;
}

/* The text voice: the writer's choice, sizes tuned per face (from ../tokens.css). */
:root, [data-face='newsreader'] { --eien-face-text: 'Newsreader', 'Iowan Old Style', Georgia, serif; --eien-size-prose: 22px; --eien-size-title: 36px; --eien-size-heading: 23px; --eien-size-row: 16px; --eien-size-preview: 14px; --eien-leading-prose: calc(1.5 - var(--eien-leading-tighten)); --eien-measure: 29em; }
[data-face='literata'] { --eien-face-text: 'Literata', Georgia, serif; --eien-size-prose: 19px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.72 - var(--eien-leading-tighten)); --eien-measure: 34em; }
[data-face='plex-sans'] { --eien-face-text: 'IBM Plex Sans', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.76 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='source-sans'] { --eien-face-text: 'Source Sans 3', Arial, sans-serif; --eien-size-prose: 20px; --eien-size-title: 32px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 31em; }
[data-face='atkinson'] { --eien-face-text: 'Atkinson Hyperlegible Next', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='schibsted'] { --eien-face-text: 'Schibsted Grotesk', Arial, sans-serif; --eien-size-prose: 18px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.62 - var(--eien-leading-tighten)); --eien-measure: 33em; }
[data-face='hanken'] { --eien-face-text: 'Hanken Grotesk', Arial, sans-serif; --eien-size-prose: 19px; --eien-size-title: 31px; --eien-size-heading: 21px; --eien-size-row: 15px; --eien-size-preview: 13px; --eien-leading-prose: calc(1.66 - var(--eien-leading-tighten)); --eien-measure: 32em; }
[data-face='instrument'] { --eien-face-text: 'Instrument Sans', Arial, sans-serif; --eien-size-prose: 18.5px; --eien-size-title: 30px; --eien-size-heading: 20px; --eien-size-row: 14.5px; --eien-size-preview: 12.5px; --eien-leading-prose: calc(1.7 - var(--eien-leading-tighten)); --eien-measure: 31em; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--eien-blotter);
  color: var(--eien-ink);
  font-family: var(--eien-face-text);
  font-size: var(--eien-size-row);
  line-height: var(--eien-leading-row);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
::selection { background: var(--eien-seal-wash); }
:focus-visible { outline: var(--eien-mark-w) solid var(--eien-focus); outline-offset: 2px; }

.seal {
  display: inline-grid; place-items: center; flex: none;
  width: var(--eien-seal-size); height: var(--eien-seal-size);
  background: var(--eien-seal); color: var(--eien-on-seal);
  font-family: var(--eien-face-seal); font-size: calc(var(--eien-seal-size) * 0.68); line-height: 1;
  border-radius: calc(var(--eien-radius-s) / 2);
  user-select: none;
}
.seal--small { --eien-seal-size: 10px; font-size: 0; }

.label {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil);
}
.count {
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta);
  font-variant-numeric: tabular-nums; color: var(--eien-pencil);
}

/* Where a word stays (menus, choices of a setting). */
.word-button {
  appearance: none; border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; padding: var(--eien-space-1) var(--eien-space-2);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label);
  letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft);
  cursor: pointer;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.word-button[aria-pressed='true'], .word-button[aria-checked='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* NEW: the icon control. The word button's states, a square of --eien-control. */
.icon-button {
  appearance: none; display: inline-grid; place-items: center; flex: none;
  width: var(--eien-control); height: var(--eien-control); padding: 0;
  border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s);
  background: none; color: var(--eien-ink-soft); cursor: pointer; position: relative;
  transition: color var(--eien-quick) var(--eien-ease), background var(--eien-quick) var(--eien-ease),
    border-color var(--eien-quick) var(--eien-ease);
}
.icon-button svg, .icon { width: var(--eien-icon); height: var(--eien-icon); display: block; }
.icon { stroke-width: var(--eien-icon-stroke); }
.icon-button[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }
.icon-button:disabled { color: var(--eien-faded); cursor: default; }
@media (hover: hover) {
  .word-button:hover, .icon-button:not(:disabled):hover { color: var(--eien-ink); background: var(--eien-hover); }
}
.word-button:active, .icon-button:not(:disabled):active { background: var(--eien-press); border-color: var(--eien-rule-strong); }

/* NEW: a tooltip names an icon and its key: raised paper, the machine voice. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none;
  left: 50%; top: calc(100% + 6px); translate: -50% 0;
  white-space: pre; padding: 3px 7px; border-radius: var(--eien-radius-s);
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: 0.06em;
  text-transform: none; color: var(--eien-ink-soft);
  opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease);
}
[data-tip-side='up']::after { top: auto; bottom: calc(100% + 6px); }
[data-tip-side='right']::after { left: calc(100% + 6px); top: 50%; translate: 0 -50%; }
[data-tip-side='left']::after { left: auto; right: calc(100% + 6px); top: 50%; translate: 0 -50%; }
@media (hover: hover) { [data-tip]:hover::after { opacity: 1; transition-delay: 450ms; } }
[data-tip]:focus-visible::after { opacity: 1; }

.field {
  appearance: none; width: 100%; border: var(--eien-hairline) solid var(--eien-rule);
  border-radius: var(--eien-radius-s); background: var(--eien-well);
  padding: var(--eien-space-2) var(--eien-space-3);
  font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink);
}
.field::placeholder { color: var(--eien-faded); }
.field:focus { outline: none; border-color: var(--eien-focus); }

/* Explorations' own bar: outside the app, like the mockups' bar. */
.xbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--eien-space-1) var(--eien-space-4);
  padding: var(--eien-space-2) var(--eien-space-4);
  background: var(--eien-paper-raised); border-bottom: var(--eien-hairline) solid var(--eien-rule);
}
.xbar__name { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink); font-weight: 600; }
.xbar__group { display: flex; align-items: center; gap: 2px; }
.xbar__label { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); margin-right: var(--eien-space-1); }
.xnote { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); }

/* Shared by the EPUB explorations (epub-*.html): the split family's window
   (split.css), with a book open in the page pane, and the phone. What's new
   here is only what a book needs: the shelf section, the contents in the list,
   a book's page and its type, pages in columns, and the phone's reading page. */
/* Shared by the split-window explorations (split-*.html): Eien's window at its
   real size, in A · Band, B · Slip or C · Running head, its page pane holding
   one note or two. Each direction draws the page pane its own way (split.js's
   Split.page); the window, the sidebar, the list, the menus, the divider and the
   keys are the same in all three. */
/* Each layout's corners, as src/ui/chrome/*.css sets them on :root[data-layout]:
   A · Band 2/4/8, B · Slip 4/8/14, C · Running head 3/6/10. */
:root[data-layout='band'] { --eien-radius-s: 2px; --eien-radius-m: 4px; --eien-radius-l: 8px; }
:root[data-layout='slip'] { --eien-radius-s: 4px; --eien-radius-m: 8px; --eien-radius-l: 14px; }
:root[data-layout='runhead'] { --eien-radius-s: 3px; --eien-radius-m: 6px; --eien-radius-l: 10px; }
a.word-button { text-decoration: none; }
.word-button[aria-current='page'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* The seal as a button, as the app draws it: no ground, a hairline that shows on hover.
   Shared by the corner and split explorations. */
.seal-button { appearance: none; display: grid; place-items: center; padding: var(--eien-space-1); border: var(--eien-hairline) solid transparent; border-radius: var(--eien-radius-s); background: none; cursor: pointer; transition: border-color var(--eien-quick) var(--eien-ease); }
@media (hover: hover) { .seal-button:hover { border-color: var(--eien-rule); } }
.seal-button:active { background: var(--eien-press); }


body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.stage { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); }
@media (max-width: 900px) { .stage { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 45%); } }
/* A quiet desktop the window sits on, outside Eien; the window scales to fit it. */
.canvas { min-height: 0; overflow: auto; padding: var(--eien-space-4); background: color-mix(in srgb, var(--eien-desk) 84%, var(--eien-ink)); }
.fit { position: relative; margin: 0 auto; }
.fit > .win { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.notes { min-height: 0; overflow: auto; padding: var(--eien-space-4); background: var(--eien-desk); border-left: var(--eien-hairline) solid var(--eien-rule); font-size: var(--eien-size-preview); line-height: 1.55; color: var(--eien-ink-soft); }
@media (max-width: 900px) { .notes { border-left: 0; border-top: var(--eien-hairline) solid var(--eien-rule); } }
.notes h2 { margin: var(--eien-space-4) 0 var(--eien-space-1); font: inherit; font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); font-weight: 400; }
.notes h2:first-child { margin-top: 0; }
.notes p { margin: 0 0 var(--eien-space-2); }
.notes ul { margin: 0 0 var(--eien-space-2); padding-left: 1.1em; }
.notes code { font-family: var(--eien-face-mono); font-size: 0.9em; }
kbd { font-family: var(--eien-face-mono); font-size: 11px; padding: 0 4px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-paper); white-space: nowrap; }
.xbar input[type='range'] { width: 120px; accent-color: var(--eien-ink-soft); }
.xbar output { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); min-width: 7ch; }

/* The window. Its lengths are the app's: --band 56px (48 in C), C's running
   head 40px, the colophon 40px; the sidebar's and the list's widths
   (--eien-sidebar-w, --eien-list-w) come from split.js, which also measures
   with them. The seal's button is the seal and its padding and hairline. */
.win {
  --band: calc(var(--eien-space-7) + var(--eien-space-2)); --status-h: calc(var(--eien-space-6) + var(--eien-space-2));
  --head-h: 0px; --controls-left: 80px;
  --seal-btn: calc(var(--eien-seal-size) + 2 * var(--eien-space-1) + 2 * var(--eien-hairline));
  --sb: var(--eien-sidebar-w);
  width: var(--win-w); height: var(--win-h); overflow: hidden; position: relative;
  display: grid; grid-template-rows: var(--head-h) minmax(0, 1fr); grid-template-columns: var(--sb) var(--eien-list-w) minmax(0, 1fr);
  background: var(--eien-desk); color: var(--eien-ink); font-size: var(--eien-size-row);
  border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: 10px; box-shadow: var(--eien-shadow-float);
}
.win[data-layout='runhead'] { --band: var(--eien-space-7); --head-h: calc(var(--eien-space-6) + var(--eien-space-2)); }
/* Shut, the sidebar is the seal alone in A and B (the default), and C's 48px strip. */
.win[data-sb='shut'] { --sb: 0px; }
.win[data-layout='runhead'][data-sb='shut'] { --sb: var(--band); }
/* The seal: beside the lights in A and B, open or shut; on C's sidebar head. */
.win { --seal-x: calc(var(--controls-left) + var(--eien-space-3)); --seal-y: calc((var(--band) - var(--seal-btn)) / 2); }
.win[data-layout='runhead'] { --seal-x: var(--eien-space-3); --seal-y: calc(var(--head-h) + (var(--band) - var(--seal-btn)) / 2); }
.win[data-layout='runhead'][data-sb='shut'] { --seal-x: calc((var(--band) - var(--seal-btn)) / 2); }
.seal-btn { position: absolute; z-index: 6; left: var(--seal-x); top: var(--seal-y); }
.win > .sb, .win > .ls, .win > .pg { grid-row: 2; min-width: 0; min-height: 0; overflow: hidden; }
/* macOS's own lights, in macOS's own colours. */
.lights { position: absolute; z-index: 5; left: 20px; top: 22px; display: flex; gap: 8px; }
.win[data-layout='runhead'] .lights { top: 14px; }
.lights i { width: 12px; height: 12px; border-radius: var(--eien-radius-dot); background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgb(0 0 0 / 0.18); }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }

/* C's running head: one strip across the window; its page part is the direction's. */
.strip { grid-row: 1; grid-column: 1 / -1; display: grid; grid-template-columns: var(--sb) var(--eien-list-w) minmax(0, 1fr); background: var(--eien-desk); border-bottom: var(--eien-hairline) solid var(--eien-rule); min-width: 0; }
.strip__panes { grid-column: 1 / 3; display: flex; align-items: center; gap: 2px; padding-left: calc(var(--controls-left) + var(--eien-space-2)); }
.strip__page { grid-column: 3; min-width: 0; display: flex; align-items: center; }
.crumb { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* The sidebar: the desk. */
.sb { display: flex; flex-direction: column; border-right: var(--eien-hairline) solid var(--eien-rule); }
.win[data-sb='shut'] .sb { visibility: hidden; }
/* Its contents keep their width as it shuts, so nothing reflows mid-slide. */
.sb > * { width: var(--eien-sidebar-w); }
.sb__head { flex: none; display: flex; align-items: center; height: var(--band); padding-left: calc(var(--seal-x) + var(--seal-btn) + var(--eien-space-2)); font-weight: 600; }
.sb__sec { display: flex; align-items: center; height: var(--eien-row-h); padding: 0 var(--eien-space-4); margin-top: var(--eien-space-2); }
.trow { position: relative; display: flex; align-items: baseline; gap: var(--eien-space-2); height: var(--eien-row-h); line-height: var(--eien-row-h); padding: 0 var(--eien-space-4) 0 calc(var(--eien-space-4) + var(--d, 0) * 16px); color: var(--eien-ink-soft); }
.trow .n { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.is-chosen { background: var(--eien-selected); color: var(--eien-ink); }
.trow.is-chosen::before, .row.is-chosen::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: var(--eien-mark-w); background: var(--eien-seal); }
.book { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); padding: 0 3px; border: var(--eien-hairline) solid var(--eien-rule); color: var(--eien-pencil); line-height: 14px; }

/* The list: paper, its search on a band. A note open on the other side keeps a
   fainter rule, in pencil and with no fill, so both open notes are findable. */
.ls { background: var(--eien-paper); border-right: var(--eien-hairline) solid var(--eien-rule); }
.ls__band { display: flex; align-items: center; height: var(--band); padding: 0 var(--eien-space-4); background: var(--eien-band); }

.ls__band .field { padding: 6px var(--eien-space-3); color: var(--eien-faded); }
.ls__head { padding: var(--eien-space-3) var(--eien-space-4) var(--eien-space-2); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.ls__title { font-size: var(--eien-size-heading); font-weight: 500; line-height: 1.3; }
.row {
  appearance: none; position: relative; display: grid; grid-template-columns: var(--eien-space-6) 1fr auto; gap: 0 var(--eien-space-1); width: 100%;
  padding: var(--eien-space-3) var(--eien-space-4); border: 0; border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); background: none;
  text-align: left; cursor: pointer; font: inherit; color: var(--eien-ink);
}
@media (hover: hover) { .row:hover { background: var(--eien-hover); } }
.row .ord { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); padding-top: 2px; }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .p { grid-column: 2 / 4; font-size: var(--eien-size-preview); color: var(--eien-pencil); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.is-chosen { background: var(--eien-selected); }
.row.is-beside::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: var(--eien-mark-w); background: var(--eien-pencil); opacity: 0.6; }

/* The page pane and its parts, which each direction arranges. A page's parts
   keep their rows whether or not the formatting bar is there: the band (or B's
   top line), the formatting bar, the sheet's blotter, the colophon. */
.pg { position: relative; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--eien-blotter); }
.pg > * { min-width: 0; min-height: 0; }
.duo { display: grid; min-width: 0; min-height: 0; }
.side, .page { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
:is(.side, .page) > :is(.band, .topline) { grid-row: 1; }
:is(.side, .page) > .fmt { grid-row: 2; }
:is(.side, .page) > :is(.blotter, .duo) { grid-row: 3; }

.topline { display: flex; align-items: center; justify-content: flex-end; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); min-width: 0; }
.win[data-layout='slip'] .blotter { padding-top: 0; }
.band { display: flex; align-items: center; justify-content: space-between; gap: var(--eien-space-2); height: var(--band); padding: 0 var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); min-width: 0; }
.tools { display: flex; gap: 2px; min-width: 0; }
.tools .icon-button { color: var(--eien-pencil); }
.quiet { opacity: 0; transition: opacity var(--eien-calm) var(--eien-ease); }
.pg:hover .quiet, .quiet:focus-within { opacity: 1; }
.slip { display: flex; gap: 2px; padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
/* The blotter scrolls its sheet; the sheet fills what's left of it, so a short note never
   overflows by the blotter's own padding (which showed a scrollbar in the gap). */
.blotter { position: relative; min-height: 0; overflow: auto; display: flex; flex-direction: column; padding: var(--eien-space-4) var(--eien-space-4) 0; }
/* The sheet at the face's own sizes, leading and measure; its margins narrow with

.sheet {
  position: relative; flex: 1 0 auto; width: 100%; max-width: calc(var(--eien-measure) + 2 * var(--eien-space-8)); margin: 0 auto;
  padding: var(--eien-space-6) clamp(var(--eien-space-4), 8%, var(--eien-space-8));
  background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule); box-shadow: var(--eien-shadow-sheet);

.sheet h1 { font-size: var(--eien-size-title); font-weight: 500; line-height: 1.2; margin: var(--eien-space-4) 0 var(--eien-space-5); }
.prose { outline: none; caret-color: var(--eien-seal); }
.prose p { margin: 0 0 var(--eien-paragraph-gap); }
.tagset { display: flex; gap: var(--eien-space-2); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-pencil); white-space: nowrap; }
.slips { display: flex; gap: var(--eien-space-1); margin: calc(var(--eien-space-3) * -1) 0 var(--eien-space-4); }
.slips span { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink-soft); padding: 1px 8px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-s); background: var(--eien-band); }
.colophon { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-4); background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); text-transform: uppercase; color: var(--eien-pencil); white-space: nowrap; overflow: hidden; }
.colophon .dot { color: var(--eien-faded); }
.colophon .pill { text-transform: none; padding: 0 6px; border: var(--eien-hairline) solid var(--eien-rule); border-radius: var(--eien-radius-dot); }
.colophon .said { margin-left: auto; color: var(--eien-ink-soft); overflow: hidden; text-overflow: ellipsis; }

/* The formatting bar, where each layout puts it: A's band's second row, B's
   raised slip at the blotter's top left, C's raised rail down the margin. */
.fmt { display: flex; justify-content: center; gap: 2px; padding: 2px var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.fmt .icon-button { color: var(--eien-ink-soft); }
.win[data-layout='slip'] .fmt { position: absolute; z-index: 3; left: var(--eien-space-3); top: calc((var(--band) - var(--eien-control) - 6px) / 2); padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
.win[data-layout='runhead'] .fmt { position: absolute; z-index: 3; left: var(--eien-space-2); top: var(--eien-space-4); flex-direction: column; padding: 2px; background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }

/* The divider between two pages, as a pane's edge is: its own column (a

   middle, an 8px handle round it to grab; rule-strong on hover, the focus ink
   at 2px while dragged or focused; its swap shows on hover. */
.divider { position: relative; z-index: 4; cursor: col-resize; outline: none; touch-action: none; }

/* A side's own close, quiet till its head is hovered; the pager when folded. */
.close-side { color: var(--eien-pencil); }
.same { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-faded); white-space: nowrap; }
.pager { display: flex; align-items: center; gap: 2px; min-width: 0; }
.pager .word-button { max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Dropping a note on the page's right edge: where the new page would stand. */
.drop-preview { position: absolute; z-index: 8; top: 0; bottom: 0; right: 0; display: grid; place-items: center; pointer-events: none; background: color-mix(in srgb, var(--eien-paper-raised) 82%, transparent); border-left: var(--eien-mark-w) solid var(--eien-ink-soft); }
.drop-preview .label { color: var(--eien-ink-soft); padding: var(--eien-space-1) var(--eien-space-2); background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-s); }

/* The row's menu, as the sidebar's is. */
.menu { position: fixed; z-index: 40; min-width: 18em; padding: var(--eien-space-1); background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float); }
.menu[hidden] { display: none; }
.menu__head { padding: 6px var(--eien-space-2) 4px; font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-pencil); }
.menu__item { appearance: none; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: var(--eien-space-2); width: 100%; padding: 5px var(--eien-space-2); border: 0; border-radius: var(--eien-radius-s); background: none; cursor: pointer; text-align: left; font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); color: var(--eien-ink-soft); }
.menu__item:focus { outline: none; background: var(--eien-selected); color: var(--eien-ink); }
@media (hover: hover) { .menu__item:hover { background: var(--eien-hover); color: var(--eien-ink); } }
.menu__key { font-size: var(--eien-size-label); color: var(--eien-pencil); }
.menu__rule { height: var(--eien-hairline); margin: var(--eien-space-1) var(--eien-space-2); background: var(--eien-rule-soft); }

/* The page's tools in a row; C's running head over the page, one segment a page. */
.tools-row { display: flex; align-items: center; gap: 2px; min-width: 0; }
.strip__page > * { flex: 1; height: 100%; }
.seg { display: flex; align-items: center; gap: var(--eien-space-2); min-width: 0; padding: 0 var(--eien-space-3); }
.seg .crumb { flex: 1; text-align: center; }
/* C's formatting rail keeps a margin of its own, so it never lies over the words. */
.win[data-layout='runhead'] :is(.side, .page):has(> .fmt) .blotter { padding-left: calc(var(--eien-control) + var(--eien-space-5)); }
/* B's slip and C's rail float: placed in the page's own box, not in the bar's row. */

/* The app's field token (src/ui/theme/tokens.css), which the explorations'
   shared tokens predate: a wash of the ink, set into what holds it. */
:root { --eien-field: light-dark(rgb(35 32 28 / 0.06), rgb(233 226 212 / 0.07)); }

.xbar__break { flex-basis: 100%; height: 0; }
/* C's running head is outside the page pane, so its quiet tools show while the window has the pointer. */
.win:hover .strip .quiet, .strip .quiet:focus-within { opacity: 1; }
a.icon-button { text-decoration: none; }
.notes .said-note { margin-top: var(--eien-space-4); font-size: var(--eien-size-meta); color: var(--eien-pencil); }
.tools-rule { width: var(--eien-hairline); height: var(--eien-space-4); margin: 0 var(--eien-space-1); background: var(--eien-rule); align-self: center; }
.win[data-list='hidden'] > .ls { display: none; }
.win > .sb { grid-column: 1; } .win > .ls { grid-column: 2; } .win > .pg { grid-column: 3; }

/* The sidebar as the app draws it (src/ui/sidebar/sidebar.css, tree.css). A section's
   label is a row's height, its twisty at the right, shown on hover, focus, or folded. */
.sb { overflow: auto; padding-bottom: var(--eien-space-4); }
.sb__sec { padding: 0; }
.section { appearance: none; display: flex; align-items: center; justify-content: space-between; width: 100%; height: var(--eien-row-h); padding: 0 var(--eien-space-4); border: 0; background: none; cursor: pointer; color: var(--eien-pencil); }
.section .twisty { opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease); }
.section:is(:hover, :focus-visible) .twisty, .section[aria-expanded='false'] .twisty { opacity: 1; }
.section:focus-visible { outline-offset: calc(var(--eien-mark-w) * -1); }
@media (hover: hover) { .section:hover .label { color: var(--eien-ink-soft); } }
.section:active { background: var(--eien-press); }
/* Disclosure: a small triangle in faded ink that turns rather than swaps. */
.twisty { display: inline-grid; place-items: center; flex: none; width: var(--eien-space-3); height: var(--eien-space-3); color: var(--eien-faded); }
.twisty::before { content: ''; width: calc(var(--eien-space-1) + var(--eien-hairline)); height: calc(var(--eien-space-2) - var(--eien-hairline)); background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); transition: transform var(--eien-quick) var(--eien-ease); }

   its twisty's centre. The books' section is the same tree, holding only books. */
.sb .trow { align-items: center; gap: 0; padding: 0 var(--eien-space-4) 0 calc(var(--eien-space-2) + var(--d, 0) * var(--eien-space-4)); }
.sb .trow .n { margin-right: var(--eien-space-2); }
.tw { flex: none; display: grid; place-items: center; width: var(--eien-space-5); height: var(--eien-row-h); }
.tgroup { position: relative; }
.tgroup::before { content: ''; position: absolute; top: 0; bottom: calc(var(--eien-row-h) / 2); left: calc(var(--eien-space-2) + var(--d, 0) * var(--eien-space-4) + var(--eien-space-5) / 2); width: var(--eien-hairline); background: var(--eien-rule); }
button.trow { appearance: none; width: 100%; border: 0; background: none; text-align: left; font: inherit; cursor: pointer; }
@media (hover: hover) { button.trow:not(.is-chosen):hover { background: var(--eien-hover); color: var(--eien-ink); } }
button.trow:focus-visible { outline-offset: calc(var(--eien-mark-w) * -1); }
.trow .count { flex: none; }
.book-mark { font-family: var(--eien-face-mono); font-size: var(--eien-size-label); letter-spacing: var(--eien-track-label); padding: 0 3px; border: var(--eien-hairline) solid var(--eien-rule); color: var(--eien-pencil); line-height: 14px; }

/* The list, as the book's contents: rows of chapters, the page each starts on. */
.ls { display: flex; flex-direction: column; }
.ls__rows { flex: 1; min-height: 0; overflow: auto; }
.row--ch { grid-template-columns: 1fr auto; padding-block: var(--eien-space-2); }
.row--ch .t { font-size: var(--eien-size-row); }

/* A book's page: the face's prose, set as a book sets it: indented paragraphs, no gap. */
/* Ragged right, as a note is, so no hyphens; every line on one grid, the chapter's
   heading included, so facing pages and columns line up line for line. */
.book-text { --line: calc(var(--eien-size-prose) * var(--eien-leading-prose)); font-size: var(--eien-size-prose); line-height: var(--line); hanging-punctuation: first; }

.book-text .ch-head + p, .book-text p.not-held { text-indent: 0; }
.ch-head { font-size: var(--eien-size-heading); font-weight: 500; line-height: var(--line); margin: 0 0 var(--line); color: var(--eien-ink); break-after: avoid; }
.book-text p.not-held { font-style: italic; color: var(--eien-ink-soft); }
.book-text ::selection { background: var(--eien-seal-wash); }
.book-text .hit { background: var(--eien-field); box-shadow: 0 0 0 var(--eien-hairline) var(--eien-rule-strong); border-radius: 1px; }
.book-text .hit.is-at { background: var(--eien-seal-wash); box-shadow: 0 0 0 var(--eien-mark-w) var(--eien-focus); }

/* Pages: a chapter flows in columns as tall as the page, and a turn slides it one page. */
.leaves { position: relative; min-height: 0; overflow: hidden; outline: none; --leaf-gap: var(--eien-space-7); }
.leaves:focus-visible { box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.flow { column-fill: auto; transition: transform var(--eien-calm) var(--eien-ease); }
.flow--measure { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .flow { transition: none; } }

/* A book's sheet, holding pages: as tall as the blotter leaves it, never scrolling. */
.blotter.is-paged { overflow: hidden; padding-bottom: var(--eien-space-4); }
.sheet.book-sheet { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; flex: 1 1 auto; padding-bottom: var(--eien-space-4); }
.book-sheet .sheet__head { margin-bottom: var(--eien-space-5); }
.folio { display: flex; justify-content: space-between; align-items: center; gap: var(--eien-space-3); min-height: var(--eien-space-6); padding-top: var(--eien-space-3); }
.folio .count { white-space: nowrap; }

/* Turning by the margins: the sheet's outer margins are buttons, quiet till the pointer finds them. */
.turn { appearance: none; position: absolute; z-index: 2; top: 0; bottom: 0; width: clamp(var(--eien-space-4), 8%, var(--eien-space-8)); padding: 0; border: 0; background: none; display: grid; place-items: center; color: var(--eien-faded); cursor: pointer; opacity: 0; transition: opacity var(--eien-quick) var(--eien-ease), color var(--eien-quick) var(--eien-ease); }
.turn--prev { left: 0; cursor: w-resize; }
.turn--next { right: 0; cursor: e-resize; }
@media (hover: hover) { .turn:hover { opacity: 1; color: var(--eien-ink-soft); } }
.turn:focus-visible { opacity: 1; outline-offset: -4px; }
.turn:disabled { display: none; }

/* The phone: its own size and corner, not Eien's; one page at a time. */
.phone { width: 360px; height: 740px; display: grid; grid-template-rows: var(--eien-touch) minmax(0, 1fr) auto; overflow: hidden; position: relative; background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule-strong); border-radius: 36px; box-shadow: var(--eien-shadow-float); --eien-size-prose-phone: calc(var(--eien-size-prose) * 0.82); }
.backbar { display: flex; align-items: center; gap: var(--eien-space-1); padding: 0 var(--eien-space-2) 0 var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.backbar .back { appearance: none; display: flex; align-items: center; gap: var(--eien-space-1); flex: 1; min-width: 0; height: var(--eien-touch); padding: 0 var(--eien-space-1); border: 0; background: none; color: var(--eien-ink-soft); font: inherit; font-size: var(--eien-size-preview); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.phone .icon-button { width: var(--eien-touch); height: var(--eien-touch); }
.phone__body { position: relative; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--eien-paper); }
/* The phone's shelf is its contents, so it's the desk, as the sidebar is. */
.phone:is([data-view='shelf']) .phone__body { background: var(--eien-desk); }
.phone[data-view='shelf'] .phone__row { border-bottom-color: var(--eien-rule-soft); }
.phone .book-text { --line: calc(var(--eien-size-prose-phone) * var(--eien-leading-prose)); font-size: var(--eien-size-prose-phone); }
.phone .ch-head { font-size: calc(var(--eien-size-heading) * 0.9); }
/* The phone's indent a step less, as a token the page's own rules can still set. */
.phone .book-text { --indent: var(--eien-space-5); }
.phone__page { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; padding: var(--eien-space-5) var(--eien-space-5) 0; }
.phone__foot { display: flex; justify-content: space-between; align-items: center; min-height: var(--eien-space-7); }
/* B's floating slip rests in the page's foot, the folio stepping aside for it, so it never lies over the words. */
.phone__slip { position: absolute; z-index: 3; right: var(--eien-space-3); bottom: var(--eien-space-2); padding: 2px; }
.phone[data-layout='slip'] .phone__foot { min-height: calc(var(--eien-touch) + var(--eien-space-4)); padding-right: calc(var(--eien-touch) * var(--slip-n, 1) + var(--eien-space-5)); }
.phone .rail { display: flex; justify-content: space-around; align-items: center; min-height: calc(var(--eien-touch) + var(--eien-space-3)); background: var(--eien-band); border-top: var(--eien-hairline) solid var(--eien-rule); }
.phone__list { overflow: auto; }
.phone__title { padding: var(--eien-space-4) var(--eien-space-4) var(--eien-space-2); }
.phone__group { padding: var(--eien-space-4) var(--eien-space-4) var(--eien-space-1); }
.phone__row { appearance: none; display: flex; align-items: center; justify-content: space-between; gap: var(--eien-space-3); width: 100%; min-height: var(--eien-touch); padding: var(--eien-space-2) var(--eien-space-4); border: 0; border-bottom: var(--eien-hairline) solid var(--eien-rule-soft); background: none; font: inherit; color: var(--eien-ink); text-align: left; cursor: pointer; position: relative; }
.phone__row.is-chosen { background: var(--eien-selected); }
.phone__row.is-chosen::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: var(--eien-mark-w); background: var(--eien-seal); }
.phone__row:focus-visible { outline-offset: -2px; }

/* The contents as a menu: as long as the window lets it be. */
.menu--contents { max-height: min(70vh, 520px); overflow: auto; min-width: 14em; }
.menu__item[aria-current='true'] { color: var(--eien-ink); }
.menu__item[aria-current='true'] .menu__key::before { content: ''; display: inline-block; width: var(--eien-space-1); height: var(--eien-space-1); margin-right: var(--eien-space-2); border-radius: var(--eien-radius-dot); background: var(--eien-ink); vertical-align: middle; }

/* Find in the book: the field as system.md sets it (a wash of ink at rest, the
   well and an inset focus ring with the keyboard), its count, and the steps. */
.find { position: relative; display: flex; align-items: center; gap: 2px; min-width: 0; flex: 0 1 auto; }
.find__icon { position: absolute; left: var(--eien-space-2); top: 50%; translate: 0 -50%; color: var(--eien-pencil); pointer-events: none; }
.find__icon svg { width: var(--eien-space-3); height: var(--eien-space-3); }
.find .find__field { width: 15em; min-width: 6em; flex: 0 1 auto; padding: var(--eien-space-1) var(--eien-space-2) var(--eien-space-1) calc(var(--eien-space-2) + var(--eien-space-4)); background: var(--eien-field); border-color: transparent; border-radius: var(--eien-radius-s); color: var(--eien-ink); }
@media (hover: hover) { .find .find__field:hover { border-color: var(--eien-rule); } }
.find .find__field:focus { background: var(--eien-well); border-color: transparent; box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.find__field::-webkit-search-cancel-button { display: none; }
.find__says { min-width: 0; padding: 0 var(--eien-space-2); white-space: nowrap; text-align: right; }
.find .icon-button { color: var(--eien-pencil); }
.find .icon-button svg { width: var(--eien-space-3); height: var(--eien-space-3); }
/* While finding, the band's tools stay in sight; where the bar is too narrow for
   both, the field takes it alone until Esc gives the tools back. */
.is-finding .quiet, .quiet.is-finding { opacity: 1; }
.band, .seg, .topline { container-type: inline-size; }
@container (max-width: 640px) {
  .is-finding > .tools-row, .find ~ .tools-row, .is-finding > .tools, .is-finding > .tools-rule, .slip.is-finding > .icon-button { display: none; }
}

/* The colophon keeps to one line: the items it can spare go first when it's narrow. */
.colophon { container-type: inline-size; }
.colophon .item { white-space: nowrap; }
@container (max-width: 460px) { .colophon .item.opt { display: none; } }
@container (max-width: 300px) { .colophon .item.opt2 { display: none; } }

/* Folded, the pager's names give way to an ellipsis, down to a control's square. */
.pager { flex: 0 1 auto; overflow: hidden; }
.pager .word-button { flex: 0 1 auto; min-width: var(--eien-control); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band .tools-row { flex: none; }
/* Scrolling under B's floating slip, the page's end can always scroll clear of it. */
.phone[data-layout='slip'] .phone__page.is-scroll { padding-bottom: calc(var(--eien-touch) + var(--eien-space-6)); }


/* Showcase 1 · The reading room. Asked for (R, or the room tool), the window
   steps back: the sidebar, the list, the bands and their rules go, and what's
   left is the desk with one sheet on it. Two surfaces instead of five: desk,
   then paper, so the sheet is the only object in the room. The seal stays in
   the corner (its first place, the app's mark), the lights beside it; the
   tools wait, quiet, where the layout keeps them; the colophon is a line of
   pencil on the desk. Out of the room, it's Pages 2's leaf. */

/* The leaf and its fore-edge (Pages 2's): the pages to come stacked at the
   sheet's right, the pages read at its left, a mark's width apart. */
.stack { position: relative; isolation: isolate; flex: 1 1 auto; display: flex; width: 100%; max-width: calc(var(--eien-measure) + 2 * var(--eien-space-8)); margin: 0 auto; min-height: 0; }
.stack .sheet { margin: 0; z-index: 1; }
.edge { position: absolute; top: calc(var(--i) * var(--eien-hairline)); bottom: calc(var(--i) * var(--eien-hairline)); background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule); z-index: calc(-1 * var(--i)); }
.win[data-layout='slip'] .edge { border-radius: calc(var(--eien-radius-s) - var(--eien-hairline)); }
.edge--after { left: 0; right: calc(var(--i) * -1 * var(--eien-mark-w)); }
.edge--before { right: 0; left: calc(var(--i) * -1 * var(--eien-mark-w)); }
.edges { position: absolute; top: 0; bottom: 0; z-index: 0; width: var(--eien-space-3); }
.edges--after { left: 100%; }
.edges--before { right: 100%; }
.edges button { appearance: none; position: absolute; inset: 0; padding: 0; border: 0; background: none; cursor: e-resize; }
.edges--before button { cursor: w-resize; }
.stack .folio .count:last-child { margin-left: auto; }

/* In the room: the panes go, and the page pane is the desk. */
:root[data-room='in'] .win, :root[data-room='in'] .strip { grid-template-columns: 0px 0px minmax(0, 1fr); }
:root[data-room='in'] .win > :is(.sb, .ls), :root[data-room='in'] .strip__panes { display: none; }
:root[data-room='in'] .pg { background: var(--eien-desk); }
/* The bands give their ground and rule to the desk; their tools stay quiet until the pointer comes. */
:root[data-room='in'] :is(.band, .colophon, .strip) { background: none; border-color: transparent; }
:root[data-room='in'] .strip { background: var(--eien-desk); }
/* The corner: the lights, then the seal, in every layout's top row; the bands start past them. */
:root[data-room='in'] .win[data-layout] { --seal-x: calc(var(--controls-left) + var(--eien-space-3)); --seal-y: calc((var(--band) - var(--seal-btn)) / 2); }
:root[data-room='in'] .win[data-layout='runhead'] { --seal-y: calc((var(--head-h) - var(--seal-btn)) / 2); }
:root[data-room='in'] :is(.band, .strip__page .seg) { padding-left: calc(var(--seal-x) + var(--seal-btn) + var(--eien-space-3)); }
:root[data-room='in'] .blotter.is-paged { padding: var(--eien-space-2) var(--eien-space-5) 0; }
:root[data-room='in'] .win[data-layout='runhead'] .blotter.is-paged { padding-top: var(--eien-space-5); }
/* The colophon, a line of pencil on the desk under the sheet. */
:root[data-room='in'] .colophon { justify-content: center; }
:root[data-room='in'] .colophon .said { position: absolute; right: var(--eien-space-4); }
.colophon { position: relative; }

/* The phone: in the room, the page is the whole screen; a tap in its middle brings the bar. */
.phone__head { display: flex; justify-content: space-between; gap: var(--eien-space-3); padding-bottom: var(--eien-space-4); }
.phone .phone__page { position: relative; grid-template-rows: auto minmax(0, 1fr) auto; }
.phone .phone-edge { position: absolute; top: var(--eien-space-5); bottom: var(--eien-space-7); right: 0; width: var(--eien-space-2); }
.phone .phone-edge i { position: absolute; top: 0; bottom: 0; right: calc(var(--i) * var(--eien-mark-w)); width: var(--eien-hairline); background: var(--eien-rule); }
:root[data-room='in']:not([data-phonebar='shown']) .phone { grid-template-rows: minmax(0, 1fr); }
:root[data-room='in']:not([data-phonebar='shown']) .phone :is(.backbar, .rail, .phone__slip) { display: none; }
:root[data-room='in']:not([data-phonebar='shown']) .phone .phone__page { padding-top: var(--eien-space-6); }

/* Going in and out is asked for: one calm cross-fade, none with reduced motion. */
::view-transition-group(root), ::view-transition-old(root), ::view-transition-new(root) { animation-duration: var(--eien-calm); animation-timing-function: var(--eien-ease); }
@media (prefers-reduced-motion: reduce) { ::view-transition-group(root), ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
</style>

/** An icon as SVG markup, stroked in currentColor. */
function icon(name, label) {
  const a11y = label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"';
  return `<svg class="icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${a11y}>${ICONS[name]}</svg>`;
}

/** Fill every [data-icon] with its icon. */
function drawIcons(root = document) {
  for (const el of root.querySelectorAll('[data-icon]')) {
    el.innerHTML = icon(el.dataset.icon) + (el.dataset.iconText ?? '');
  }
}

// One list of faces drives every face setting: the text face and the machine
// voice both choose from it. A face added later is one more entry here (in the
// app: one entry in core/config, its fonts and its tuning in tokens.css).
const FACES = [
  { id: 'plex-mono', name: 'IBM Plex Mono', family: "'IBM Plex Mono', ui-monospace, monospace", mono: true },
  { id: 'newsreader', name: 'Newsreader', family: "'Newsreader', Georgia, serif" },
  { id: 'literata', name: 'Literata', family: "'Literata', Georgia, serif" },
  { id: 'plex-sans', name: 'IBM Plex Sans', family: "'IBM Plex Sans', Arial, sans-serif" },
  { id: 'source-sans', name: 'Source Sans 3', family: "'Source Sans 3', Arial, sans-serif" },
  { id: 'atkinson', name: 'Atkinson Hyperlegible Next', family: "'Atkinson Hyperlegible Next', Arial, sans-serif" },
  { id: 'schibsted', name: 'Schibsted Grotesk', family: "'Schibsted Grotesk', Arial, sans-serif" },
  { id: 'hanken', name: 'Hanken Grotesk', family: "'Hanken Grotesk', Arial, sans-serif" },
  { id: 'instrument', name: 'Instrument Sans', family: "'Instrument Sans', Arial, sans-serif" },
];
/** The faces the text voice offers (all but the mono), and the machine voice (all). */
const TEXT_FACES = FACES.filter((face) => !face.mono);
const MACHINE_FACES = FACES;

function setMachineFace(id) {
  const face = FACES.find((each) => each.id === id) ?? FACES[0];
  document.documentElement.style.setProperty('--eien-face-mono', face.family);
}
function setTextFace(id) {
  if (id === 'newsreader') delete document.documentElement.dataset.face;
  else document.documentElement.dataset.face = id;
}

/** The explorations' bar: [data-x-set="attr"] groups set data-<attr> on <html>. */
function wireBar(onChange = () => {}) {
  for (const group of document.querySelectorAll('[data-x-set]')) {
    const attr = group.dataset.xSet;
    const buttons = [...group.querySelectorAll('button[data-value]')];
    const pick = (value) => {
      document.documentElement.dataset[attr] = value;
      for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.value === value));
      onChange(attr, value);
    };
    for (const b of buttons) b.addEventListener('click', () => pick(b.dataset.value));
    pick(document.documentElement.dataset[attr] ?? buttons[0].dataset.value);
  }
}

// Themes: [day, night] for each colour token. The rules are the ink at low
// strength, so they follow it. Washi is tokens.css's own; the rest are new.
const THEME_TOKENS = ['desk', 'blotter', 'band', 'paper', 'selected', 'ink', 'ink-soft', 'pencil', 'faded', 'seal'];
const THEMES = {
  washi: { name: 'Washi', kanji: '和紙', note: 'Eien’s own: paper and sumi ink', t: {
    desk: ['#d9d2c8', '#110e0b'], blotter: ['#eae5dd', '#1a1713'], band: ['#f4f1ea', '#201d19'], paper: ['#fdfbf7', '#28241f'], selected: ['#ede9e3', '#38332e'],
    ink: ['#23201c', '#e9e2d4'], 'ink-soft': ['#51473c', '#c3b9a7'], pencil: ['#5d5348', '#a7a095'], faded: ['#766d62', '#837c73'], seal: ['#c4472d', '#e0603f'] } },

// Drawing: the whole window (or the phone) from the state, keeping focus and scroll.

  };
  // A row of the tree: a twisty's column (a folder's twisty, or nothing), its name, its count.
  const twist = (open) => `<span class="tw" aria-hidden="true">${open == null ? '' : `<span class="twisty${open ? ' is-open' : ''}"></span>`}</span>`;

  const shelfTree = (d, parent) => SHELF.filter((f) => f.d === d && (f.parent ?? null) === parent).map((f) => {
    const inner = shelfTree(d + 1, f.name) + f.books.map((b) => book(b, d + 1)).join('');

}
function listHtml() {

function phoneHtml(ctx) {

let drawn = false;
function draw() {
  const ctx = context();
  if (!canvas) return;
  const focusKey = document.activeElement?.closest?.('[data-k]')?.dataset.k;
  // The book itself has the keyboard: it keeps it through a redraw.
  const hadBook = !!document.activeElement?.matches?.('.leaves[data-main], [data-main-scroll]');
  const scrolls = {};
  for (const el of canvas.querySelectorAll('[data-keep-scroll]')) scrolls[el.dataset.keepScroll] = el.scrollTop;
  canvas.innerHTML = ctx.device === 'phone' ? `<div class="fit">${phoneHtml(ctx)}</div>` : `<div class="fit">${windowHtml(ctx)}</div>`;
  drawIcons(canvas);
  fit();
  for (const el of canvas.querySelectorAll('[data-keep-scroll]')) if (scrolls[el.dataset.keepScroll] != null) el.scrollTop = scrolls[el.dataset.keepScroll];
  const lv = main();
  if (lv) {
    layoutLeaves(lv);
    if (R.goal != null) { R.p = pageOf(lv, R.goal); R.goal = null; }
    R.p = clamp(R.p === Infinity ? lv._.pages - 1 : R.p, 0, lv._.pages - 1);
    R.p -= R.p % lv._.span;
    place(lv, true);
  } else if (R.goal != null) {
    // Scrolling: the place kept (from another exploration, or before a redraw) at the top.
    const sc = canvas.querySelector('[data-main-scroll]');
    const flow = sc?.querySelector(`.book-text[data-c="${R.c}"]`);
    if (flow && R.goal > 0) {
      const r = rangeOf(flow, R.goal, R.goal).getBoundingClientRect();
      const s = sc.getBoundingClientRect();
      sc.scrollTop += (r.top - s.top) / (s.width / sc.offsetWidth || 1) - 48;
    } else if (flow && sc.dataset.mainScroll === 'roll') sc.scrollTop += (flow.getBoundingClientRect().top - sc.getBoundingClientRect().top) / (sc.getBoundingClientRect().width / sc.offsetWidth || 1) - 48;
    R.goal = null;
  }
  Epub.drawn?.(ctx);
  settle();
  canvas.querySelector('.row.is-chosen')?.scrollIntoView({ block: 'nearest' });
  if (focusKey) canvas.querySelector(`[data-k="${CSS.escape(focusKey)}"]`)?.focus({ preventScroll: true });
  else if (hadBook) (main() ?? canvas.querySelector('[data-main-scroll]'))?.focus({ preventScroll: true });
  const out = document.querySelector('.xbar output');
  if (out) out.textContent = ctx.device === 'phone' ? 'phone' : `${ctx.width} px`;
  drawn = true;
}
function fit() {
  const box = canvas.querySelector('.fit');
  const el = box?.firstElementChild;
  if (!el) return;
  const phone = choices().device === 'phone';
  const [w, h] = phone ? [PHONE.w, PHONE.h] : [choices().width, WIN_H];
  const scale = Math.min(1, (canvas.clientWidth - 32) / w, (canvas.clientHeight - 32) / h);
  el.style.transform = `scale(${scale})`;
  box.style.width = `${w * scale}px`;
  box.style.height = `${h * scale}px`;
}
let saidTimer;
function say(words) {
  const el = canvas.querySelector('.said') ?? document.querySelector('.xsaid');
  if (!el) return;
  el.textContent = words;
  clearTimeout(saidTimer);
  saidTimer = setTimeout(() => { el.textContent = ''; }, 4000);
}

// The contents as a menu, where the list isn't shown (and the phone's ⋯).
const menu = document.createElement('div');
menu.className = 'menu menu--contents';
menu.setAttribute('role', 'menu');
menu.hidden = true;
let menuBack = null;
function openMenu(items, label, x, y) {
  menuBack = document.activeElement;
  menu.innerHTML = `<div class="menu__head" aria-hidden="true">${esc(label)}</div>${items.map((it) => (it.rule ? '<div class="menu__rule" role="separator"></div>' : `<button class="menu__item" role="menuitem" data-run="${it.run}"${it.current ? ' aria-current="true"' : ''}>${it.icon ? icon(it.icon) : '<span></span>'}<span>${esc(it.word)}</span><span class="menu__key">${esc(it.key ?? '')}</span></button>`)).join('')}`;
  menu.setAttribute('aria-label', label);
  menu.hidden = false;
  const r = menu.getBoundingClientRect();
  menu.style.left = `${clamp(x, 8, innerWidth - r.width - 8)}px`;
  menu.style.top = `${clamp(y, 8, innerHeight - r.height - 8)}px`;
  menu._run = (run) => items.find((it) => it.run === run)?.go();
  (menu.querySelector('[aria-current="true"]') ?? menu.querySelector('.menu__item'))?.focus();
  menu.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest' });
}
function closeMenu(back = true) {
  if (menu.hidden) return;
  menu.hidden = true;
  if (back) menuBack?.focus?.();
}
menu.addEventListener('click', (e) => { const run = e.target.closest('[data-run]')?.dataset.run; if (run) { closeMenu(false); menu._run(run); } });
menu.addEventListener('keydown', (e) => {
  const items = [...menu.querySelectorAll('.menu__item')];
  const i = items.indexOf(document.activeElement);
  const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
  if (to !== undefined) { e.preventDefault(); e.stopPropagation(); items[(to + items.length) % items.length].focus(); }
  if (e.key === 'Tab') { e.preventDefault(); closeMenu(); }
  if (e.key === 'Escape') { e.stopPropagation(); closeMenu(); }
});
document.addEventListener('pointerdown', (e) => { if (!menu.contains(e.target)) closeMenu(false); });
function contentsMenu(anchor) {
  const r = anchor.getBoundingClientRect();
  openMenu(CHAPTERS.map((ch, i) => ({ run: `ch${i}`, word: ch.title, key: R.nums?.chapterStart ? String(R.nums.chapterStart(i)) : '', current: i === R.c, go: () => act.go(i) })), 'Contents', r.left - 180, r.bottom + 6);
}

const typing = (el) => el?.closest?.('input, textarea, [contenteditable="true"]');
function wire() {
  canvas.addEventListener('click', (e) => {
    const b = e.target.closest('button, [data-turn]');
    if (!b) {
      // The phone's page: a tap in its outer thirds turns, as a finger does.
      const body = e.target.closest('.phone__body');
      if (body && Epub.paged && R.phoneView === 'page' && getSelection().isCollapsed) {
        const r = body.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width;
        if (x < 0.3) act.turn(-1); else if (x > 0.7) act.turn(1);
      }
      return;
    }
    const d = b.dataset;
    if (d.turn) act.turn(+d.turn);
    else if (d.ch) { R.phoneView = 'page'; act.go(+d.ch); }
    else if ('book' in d) { if (d.book) { R.phoneView = 'page'; draw(); } else say('This exploration holds one book: Pride and Prejudice'); }
    else if (d.fold) { R.folds[d.fold] = !R.folds[d.fold]; draw(); }
    else if ('contents' in d) { if (choices().device === 'phone') { R.phoneView = 'contents'; draw(); } else if (choices().list === 'shown') canvas.querySelector('.row.is-chosen')?.focus(); else contentsMenu(b); }
    else if ('toggleList' in d) document.querySelector(`[data-x-set="list"] [data-value="${choices().list === 'shown' ? 'hidden' : 'shown'}"]`)?.click();
    else if (d.phoneView) { R.phoneView = d.phoneView; draw(); }
    else if ('seal' in d) document.querySelector(`[data-x-set="sb"] [data-value="${choices().sb === 'open' ? 'shut' : 'open'}"]`)?.click();
    else if ('bookmark' in d) act.bookmark();
    else if ('highlight' in d) act.highlight();
    else Epub.click?.(b, e);
  });
  canvas.addEventListener('input', (e) => { if (e.target.matches('[data-find]')) finder.set(e.target.value); });
  canvas.addEventListener('keydown', (e) => {
    if (!e.target.matches('[data-find]')) return;
    if (e.key === 'Enter') { e.preventDefault(); finder.step(e.shiftKey ? -1 : 1); canvas.querySelector('[data-find]')?.focus(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finder.close(); }
  });
  canvas.addEventListener('click', (e) => {
    const b = e.target.closest('[data-find-step], [data-find-close], [data-mark-go]');
    if (!b) return;
    e.stopPropagation();
    if (b.dataset.findStep) { finder.step(+b.dataset.findStep); canvas.querySelector('[data-find]')?.focus(); }
    else if ('findClose' in b.dataset) finder.close();
    else { const [c, o] = b.dataset.markGo.split(':').map(Number); R.phoneView = 'page'; act.go(c, o); }
  }, true);
  canvas.addEventListener('scroll', (e) => { if (e.target.matches?.('[data-main-scroll]')) settle(); }, true);
  // Rows move with the arrows, as Eien's lists do.
  canvas.addEventListener('keydown', (e) => {
    const row = e.target.closest('.row, .trow--book, .phone__row');
    if (!row || !['ArrowDown', 'ArrowUp'].includes(e.key)) return;
    e.preventDefault();
    e.stopPropagation();
    const rows = [...row.parentElement.closest('.ls__rows, .shelf, .phone__shelf, .sb').querySelectorAll('.row, .trow--book, .phone__row')];
    rows[clamp(rows.indexOf(row) + (e.key === 'ArrowDown' ? 1 : -1), 0, rows.length - 1)]?.focus();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !menu.hidden) return;
    if (Epub.key(e)) return;
    if (mod(e) && e.key === '2') { e.preventDefault(); const row = canvas.querySelector('.row.is-chosen'); if (row) row.focus(); else contentsMenu(canvas.querySelector('[data-contents]') ?? canvas); return; }
    if (Epub.marks && mod(e) && e.key.toLowerCase() === 'f' && !e.altKey) { e.preventDefault(); finder.open(); return; }
    if (mod(e) && e.key === '3') { e.preventDefault(); (main() ?? canvas.querySelector('[data-main-scroll]'))?.focus(); return; }
    if (mod(e) && e.key.toLowerCase() === 'z' && undo) { e.preventDefault(); R.highlights.push(undo); undo = null; Epub.marksChanged?.(); draw(); say('Highlight put back'); return; }
    if (mod(e) || e.altKey || typing(e.target) || e.target.closest?.('.menu, .ls__rows, .sb, .phone__shelf, input')) return;
    const paged = !!main();
    if (paged && (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) && !e.shiftKey) { e.preventDefault(); act.turn(1); }
    else if (paged && (['ArrowLeft', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) && !(e.shiftKey && e.key !== ' ')) { e.preventDefault(); act.turn(-1); }
    else if (paged && e.key === 'Home') { e.preventDefault(); act.chapterEdge(false); }
    else if (paged && e.key === 'End') { e.preventDefault(); act.chapterEdge(true); }
    else if (Epub.marks && e.shiftKey && ['ArrowRight', 'ArrowLeft'].includes(e.key)) { e.preventDefault(); sentenceSelect(e.key === 'ArrowRight' ? 1 : -1); }
    else if (Epub.marks && e.key.toLowerCase() === 'b') { e.preventDefault(); act.bookmark(); }
    else if (Epub.marks && e.key.toLowerCase() === 'h') { e.preventDefault(); act.highlight(); }
    else if (Epub.marks && (e.key === ']' || e.key === '[')) { e.preventDefault(); stepMark(e.key === ']' ? 1 : -1); }
    else if (e.key === 'Escape') { kb = null; getSelection().removeAllRanges(); }
  });
}

/** The page: the bar, the window and the notes beside it. */
function mountEpubPage({ id, note, notes, bar = '', list = 'shown' }) {
  Epub.id = id;
  const groups = [
    ['Pages', [['spread', '1 · The spread'], ['leaf', '2 · One leaf'], ['columns', '3 · Columns']]],
    ['Scroll', [['chapter', '1 · A chapter'], ['roll', '2 · One roll'], ['beside', '3 · Beside a note']]],
    ['Features', [['margin', '1 · On the page'], ['index', '2 · In the list'], ['edge', '3 · On the edge']]],
    ['Showcase', [['room', '1 · The room'], ['set', '2 · Set as a book'], ['lamp', '3 · By lamplight']]],

  <span class="xbar__break" aria-hidden="true"></span>
  ${group('device', 'Device', [['desktop', 'Desktop'], ['phone', 'Phone']])}
  ${group('layout', 'Layout', [['band', 'A · Band'], ['slip', 'B · Slip'], ['runhead', 'C · Running head']])}
  ${group('theme', 'Light', [['light', 'Day'], ['dark', 'Night']])}
  ${group('name', 'Section', [['shelf', 'Shelf'], ['reading', 'Reading'], ['bookshelf', 'Bookshelf']])}
  ${group('sb', 'Sidebar', [['open', 'Open'], ['shut', 'Shut']])}
  ${group('list', 'List', [['shown', 'Shown'], ['hidden', 'Hidden']])}
  ${bar}
  <label class="xbar__group"><span class="xbar__label">Window</span><input type="range" min="900" max="1680" step="20" value="1440" data-win-width aria-label="Window width" /><output></output></label>
  <span class="xnote">${note}</span>
</header>
<main class="stage"><div class="canvas"></div><aside class="notes">${notes}${COMMON_NOTES()}</aside></main>`);

  for (const k of ['layout', 'theme', 'sb', 'name', 'device', 'width']) if (kept[k]) root.dataset[k] = kept[k];

  root.dataset.theme ??= matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  if (Number.isInteger(kept.c) && kept.c < HELD) { R.c = kept.c; R.goal = kept.o ?? 0; }
  const width = document.querySelector('[data-win-width]');
  width.value = root.dataset.width ?? '1440';
  root.dataset.width = width.value;
  width.addEventListener('input', () => { root.dataset.width = width.value; draw(); });
  wire();
  wireBar(() => { if (R.nums) R.goal = R.nums.start; draw(); });
  addEventListener('resize', () => { fit(); });
  // Pages are counted in the face as it draws: once a face's font arrives, count again, keeping your place.
  const recount = () => { for (const k of Object.keys(pageCache)) delete pageCache[k]; R.goal = R.nums?.start ?? 0; draw(); };
  document.fonts?.ready.then(recount);
  document.fonts?.addEventListener('loadingdone', recount);

/** The same in all nine. */
const COMMON_NOTES = () => `
  <h2>In all nine</h2>

    <li><b>Opening a book</b> reads it in the page pane; the note list becomes its contents, chapters in the book's order, each with the page it starts on; the chosen row is the chapter you're in (the selected fill and the seal's rule, as a note's row). With the list hidden, the Contents tool (or ${KEY('Mod-2')}) opens them as a menu.</li>
    <li><b>The views' place holds the book's two:</b> Pages and Scroll, a pressed pair as Live · Source · Reading are. Here the other one opens its exploration, keeping your place.</li>
    <li><b>The book's words are set as Eien sets yours:</b> your Typeface, its size, leading and measure; ${KEY('Mod-+')} and ${KEY('Mod--')} zoom them as they zoom a note. The book's own styles keep only its structure (italics, headings, a centred line), never its fonts or colours, so it reads by Night too.</li>
    <li><b>Safely:</b> each chapter is drawn in a sandboxed frame, with no scripts and no network; the zip is read with sizes capped and no path out of it. Nothing in a book can reach the vault.</li>
    <li><b>Where you were</b>, and your bookmarks and highlights, are kept in <code>.eien/reading/</code>, keyed by the book's contents, so a renamed or moved book keeps them, and they sync with the vault. The book file is never written.</li>
    <li><b>Keys</b> (the book has the keyboard after a click in it, or ${KEY('Mod-3')}): <kbd>→</kbd> <kbd>Space</kbd> <kbd>PgDn</kbd> next page, <kbd>←</kbd> <kbd>⇧Space</kbd> <kbd>PgUp</kbd> back, <kbd>Home</kbd> <kbd>End</kbd> the chapter's start and end; in the list, <kbd>↑</kbd> <kbd>↓</kbd> and <kbd>Enter</kbd>. Scrolling, the usual keys scroll.</li>
    <li><b>The phone</b> (the bar's Device): the book is a page in the phone's stack, the shelf behind its back bar; the book's tools where the layout keeps a phone's (A in the bar, B a floating slip, C a rail).</li>
  </ul>
  <p class="said-note">Text: <i>Pride and Prejudice</i>, Jane Austen (1813), public domain; Chapters I to III here.</p>`;


// A sheet standing on the desk's edge: the room.
ICONS.room = '<path d="M2 13.5h12"/><path d="M4.5 2.5h7v8.5h-7z"/><path d="M6.5 5.5h3M6.5 7.5h3"/>';

const inRoom = () => root.dataset.room === 'in';
/** In or out, as the bar's Room says: one calm cross-fade where the browser has them. */
function room(on) {
  // The book keeps the keyboard, in the room and out of it.
  const go = () => { document.querySelector(`[data-x-set="room"] [data-value="${on ? 'in' : 'out'}"]`)?.click(); main()?.focus({ preventScroll: true }); };
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(go);
  else go();
  say(on ? `The reading room: Esc or R to leave` : 'Out of the reading room');
}

/** How many edges show: the pages left (or read), in sixths of the book, at least one while any are. */
const EDGES = 6;
const edgesFor = (n, before) => {
  if (!n) return 0;
  const frac = before ? (n.page - 1) / n.pages : (n.pages - n.page - n.span + 1) / n.pages;
  return frac <= 0 ? 0 : Math.max(1, Math.round(frac * EDGES));
};
const edgeHtml = (side, k) => Array.from({ length: k }, (_, i) => `<span class="edge edge--${side}" style="--i:${i + 1}" aria-hidden="true"></span>`).join('');
/** Minutes left in the chapter from the page's first words, at 250 words a minute (5.6 characters a word). */
const minutesLeft = (n) => Math.max(1, Math.ceil((CHAPTERS[R.c].chars - n.start) / 5.6 / 250));

const roomTool = (ctx) => ctx.tool('room', inRoom() ? 'Leave the reading room' : 'The reading room', 'R', `data-room-tool aria-pressed="${inRoom()}"`);
Epub.tools = (ctx) => `${ctx.contentsTool()}${roomTool(ctx)}`;
/** In the room the sheet carries the book's own running head: its title, and the chapter. */
const head = (ctx) => (inRoom() ? `<div class="sheet__head"><span class="crumb">${BOOK.title}</span><span class="crumb">${CHAPTERS[R.c].title}</span></div>` : ctx.head());
Epub.page = (ctx) => `<div class="page">${ctx.top()}<div class="blotter is-paged">
  <div class="stack">
    <span data-edges></span>
    <article class="sheet book-sheet">${head(ctx)}${ctx.leaves(R.c)}
      <footer class="folio"><span class="count" data-chapter-pages></span><span class="count" data-folio></span></footer>
    </article>
    <span class="edges edges--before"><button data-turn="-1" data-k="edge-before" aria-label="Previous page" data-tip="Previous page  ←" data-tip-side="left"></button></span>
    <span class="edges edges--after"><button data-turn="1" data-k="edge-after" aria-label="Next page" data-tip="Next page  →" data-tip-side="right"></button></span>
  </div></div>${ctx.colophon([`<span>${CHAPTERS[R.c].ord}</span>`, '<span data-col-page></span>', '<span data-col-left></span>'])}</div>`;
/** C's running head: out of the room the crumb and tools; in it, only the quiet tools, the sheet naming the book. */
Epub.strip = (ctx) => (inRoom()
  ? `<div class="seg"><span class="crumb"></span><span class="tools-row quiet">${ctx.views()}${Epub.tools(ctx)}</span></div>`
  : `<div class="seg"><span class="crumb">${ctx.crumb()}</span><span class="tools-row">${ctx.views()}${Epub.tools(ctx)}</span></div>`);
Epub.phone = () => `<div class="phone__page"><div class="phone__head"><span class="crumb">${BOOK.title}</span><span class="crumb">${CHAPTERS[R.c].ord}</span></div>${context().leaves(R.c)}<span class="phone-edge" aria-hidden="true"></span><div class="phone__foot"><span class="count" data-col-left></span><span class="count" data-folio></span></div></div>`;
Epub.phoneTools = (ctx) => `${ctx.tool('contents', 'Contents', '', 'data-contents')}${ctx.tool('room', inRoom() ? 'Leave the reading room' : 'The reading room', '', `data-room-tool aria-pressed="${inRoom()}"`)}`;
Epub.after = (ctx, n) => {
  if (!n?.paged) return;
  const set = (sel, text) => { for (const el of canvas.querySelectorAll(sel)) el.textContent = text; };
  set('[data-folio]', `${n.page}`);
  set('[data-chapter-pages]', `${CHAPTERS[R.c].ord} · ${n.chPage} of ${n.chPages}`);
  set('[data-col-page]', `page ${n.page} of ${n.pages}`);
  set('[data-col-left]', `${minutesLeft(n)} min left in the chapter`);
  const edges = canvas.querySelector('[data-edges]');
  if (edges) edges.innerHTML = edgeHtml('before', edgesFor(n, true)) + edgeHtml('after', edgesFor(n, false));
  const pe = canvas.querySelector('.phone-edge');
  if (pe) pe.innerHTML = Array.from({ length: edgesFor(n, false) }, (_, i) => `<i style="--i:${i}"></i>`).join('');
  for (const b of canvas.querySelectorAll('.edges button')) {
    const before = b.dataset.turn === '-1';
    const k = before ? n.page - 1 : n.pages - n.page;
    b.dataset.tip = `${before ? 'Previous page  ←' : 'Next page  →'}\n${k} page${k === 1 ? '' : 's'} ${before ? 'read' : 'to go'}`;
  }
};
/** In the room the seal, the app's mark, is the way out; out of it, it shows and hides the sidebar as always. */
Epub.drawn = () => {
  const seal = canvas.querySelector('[data-seal]');
  if (seal && inRoom()) { seal.setAttribute('aria-label', 'Leave the reading room'); seal.dataset.tip = 'Leave the reading room  Esc'; seal.removeAttribute('aria-expanded'); }
};
Epub.click = (b) => { if ('roomTool' in b.dataset) room(!inRoom()); };
Epub.key = (e) => {
  if (mod(e) || e.altKey || typing(e.target) || e.target.closest?.('.menu')) return false;
  if (e.key === 'Escape' && inRoom()) { e.preventDefault(); room(false); return true; }
  if (e.key.toLowerCase() === 'r' && !e.target.closest?.('.ls__rows, .sb')) { e.preventDefault(); room(!inRoom()); return true; }
  return false;
};

mountEpubPage({
  id: 'room',
  bar: `<div class="xbar__group" data-x-set="room"><span class="xbar__label">Room</span><button class="word-button" data-value="in">In</button><button class="word-button" data-value="out">Out</button></div>`,
  note: 'Asked for, the window steps back: the desk, one sheet on it, the seal in its corner.',
  notes: `
  <h2>Showcase 1 · The reading room</h2>
  <p>Press <kbd>R</kbd> (or the room tool) and the window steps back. The sidebar, the list, the bands and their rules go; what's left is the desk with one sheet on it, and the rest of the book under the sheet as its fore-edge (Pages 2's). Two surfaces instead of five: desk, then paper, so the sheet is the only thing in the room. <kbd>Esc</kbd>, <kbd>R</kbd> or the seal brings the window back.</p>
  <ul>
    <li><b>What stays:</b> the lights and the seal in the corner (the app's mark, its first place), in every layout's top row. The tools wait where the layout keeps them, unseen till the pointer comes: A's on the desk where its band was, B's slip, C's running head with its ground and rule gone.</li>
    <li><b>The sheet's own running head</b> names the book and the chapter in label type, as a printed book's does; its folio counts at the foot.</li>
    <li><b>The colophon</b> is a line of pencil on the desk under the sheet: the chapter, the page of the pages, and the minutes left in the chapter at 250 words a minute.</li>
    <li><b>Going in and out</b> is asked for, so it may move: one calm cross-fade, none with reduced motion. Nothing else moves; turning is the leaf's slide.</li>
    <li><b>In the app</b> this is a mode over whichever reading view wins (here Pages 2), the way Focus mode is over Live: kept per device, and the panes come back as they were.</li>
  </ul>
  <h2>The phone</h2>
  <p>The phone is already one pane, so its room is the page alone: the back bar and the tools go, the screen is paper from edge to edge, the book's name and chapter at its head and the minutes left and the folio at its foot. A tap in the page's middle third brings the bar and tools back (and another sends them away); the outer thirds still turn.</p>
  <h2>For</h2>
  <ul><li>Eien's depth, shown plainly: one object on the desk, one shadow, hairlines for the book under it. The calmest a page can be.</li><li>Nothing new to learn: the same sheet, keys and tools; one key in and out.</li><li>Works over any of the reading directions, and later over a note's Reading view too.</li></ul>
  <h2>Against</h2>
  <ul><li>A mode: the contents and the shelf are a key away, not in sight.</li><li>On a wide window the desk is mostly empty; Showcase 2's spread would fill it better.</li><li>The tools are found by pointing; a newcomer may not know they're there (the tooltip and the menu name the key).</li></ul>`,
});
// The phone's bar comes and goes with a tap in the page's middle third, in the room.
canvas.addEventListener('click', (e) => {
  const body = e.target.closest('.phone__body');
  if (!body || e.target.closest('button, a') || !inRoom() || !getSelection().isCollapsed) return;
  const r = body.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  if (x >= 0.3 && x <= 0.7) { root.dataset.phonebar = root.dataset.phonebar === 'shown' ? 'hidden' : 'shown'; R.goal = R.nums?.start ?? 0; draw(); }
});
// In the room, the seal leaves it (before the window's own handler shows or hides the sidebar).
canvas.addEventListener('click', (e) => {
  if (!e.target.closest('[data-seal]') || !inRoom()) return;
  e.stopPropagation();
  room(false);
}, true);
</script>
</body>
</html>
