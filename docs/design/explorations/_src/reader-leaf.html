<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Pages 2 · One leaf, its edges</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:reader.css*/

/* Pages 2 · One leaf, its edges. One page on the blotter, as a note's sheet
   lies; under it, the book's fore-edge: the pages still to read stacked at its
   right, the pages read at its left, each a paper edge in a soft hairline,
   2px apart, up to six. How far you are is how the book looks. */
.stack { position: relative; isolation: isolate; flex: 1 1 auto; display: flex; width: 100%; max-width: calc(var(--eien-measure) + 2 * var(--eien-space-8)); margin: 0 auto; min-height: 0; }
.stack .sheet { margin: 0; z-index: 1; }
.edge { position: absolute; top: 0; bottom: 0; background: var(--eien-paper); border: var(--eien-hairline) solid var(--eien-rule); }
.edge--after { left: 0; right: calc(var(--i) * -1 * var(--eien-mark-w)); top: calc(var(--i) * var(--eien-hairline)); bottom: calc(var(--i) * var(--eien-hairline)); z-index: calc(-1 * var(--i)); }
.edge--before { right: 0; left: calc(var(--i) * -1 * var(--eien-mark-w)); top: calc(var(--i) * var(--eien-hairline)); bottom: calc(var(--i) * var(--eien-hairline)); z-index: calc(-1 * var(--i)); }
/* The edges are where a hand reaches to turn: they're the turn buttons' ground. */
.edges { position: absolute; top: 0; bottom: 0; z-index: 0; }
.edges--after { left: 100%; width: var(--eien-space-3); }
.edges--before { right: 100%; width: var(--eien-space-3); }
.edges button { appearance: none; position: absolute; inset: 0; padding: 0; border: 0; background: none; cursor: e-resize; }
.edges--before button { cursor: w-resize; }
.edges button:focus-visible { outline-offset: 0; }
.stack .folio .count:last-child { margin-left: auto; }
:root[data-frame='full'] .stack .edge { display: none; }
/* The phone: the fore-edge stays, narrower, on the page's right. */
.phone .phone__page { position: relative; }
.phone .phone-edge { position: absolute; top: var(--eien-space-5); bottom: var(--eien-space-7); right: 0; width: var(--eien-space-2); }
.phone .phone-edge i { position: absolute; top: 0; bottom: 0; right: calc(var(--i) * 2px); width: var(--eien-hairline); background: var(--eien-rule); }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:reader.js*/

/** How many edges show: the pages left (or read), in sixths of the book, at least one while any are. */
const EDGES = 6;
const edgesFor = (n, before) => {
  if (!n) return 0;
  const frac = before ? (n.page - 1) / n.pages : (n.pages - n.page - n.span + 1) / n.pages;
  return frac <= 0 ? 0 : Math.max(1, Math.round(frac * EDGES));
};
const edgeHtml = (side, k) => Array.from({ length: k }, (_, i) => `<span class="edge edge--${side}" style="--i:${i + 1}" aria-hidden="true"></span>`).join('');

Reader.tools = (ctx) => ctx.contentsTool();
Reader.page = (ctx) => `<div class="page">${ctx.top()}<div class="blotter is-paged">
  <div class="stack" data-stack>
    <span data-edges></span>
    <article class="sheet book-sheet">${ctx.head()}${ctx.leaves(R.c)}
      <footer class="folio"><span class="count" data-chapter-pages></span><span class="count" data-folio></span></footer>
    </article>
    <span class="edges edges--before"><button data-turn="-1" data-k="edge-before" aria-label="Previous page" data-tip="Previous page  ←" data-tip-side="left"></button></span>
    <span class="edges edges--after"><button data-turn="1" data-k="edge-after" aria-label="Next page" data-tip="Next page  →" data-tip-side="right"></button></span>
  </div></div>${ctx.colophon([`<span data-col-chapter>${CHAPTERS[R.c].ord}</span>`, '<span data-col-page></span>', '<span data-col-left></span>'])}</div>`;
Reader.phone = (ctx) => `<div class="phone__page">${ctx.leaves(R.c)}<span class="phone-edge" aria-hidden="true"></span><div class="phone__foot"><span class="count" data-col-chapter>${CHAPTERS[R.c].ord}</span><span class="count" data-folio></span></div></div>`;
Reader.phoneTools = (ctx) => ctx.tool('contents', 'Contents', '', 'data-contents');
Reader.after = (ctx, n) => {
  if (!n?.paged) return;
  const set = (sel, text) => { for (const el of canvas.querySelectorAll(sel)) el.textContent = text; };
  set('[data-folio]', `${n.page}`);
  set('[data-chapter-pages]', `${CHAPTERS[R.c].ord} · ${n.chPage} of ${n.chPages}`);
  set('[data-col-page]', `page ${n.page} of ${n.pages}`);
  set('[data-col-left]', `${n.pages - n.page} to go`);
  const edges = canvas.querySelector('[data-edges]');
  if (edges) edges.innerHTML = edgeHtml('before', edgesFor(n, true)) + edgeHtml('after', edgesFor(n, false));
  const pe = canvas.querySelector('.phone-edge');
  if (pe) pe.innerHTML = Array.from({ length: edgesFor(n, false) }, (_, i) => `<i style="--i:${i}"></i>`).join('');
  for (const b of canvas.querySelectorAll('.edges button')) {
    const before = b.dataset.turn === '-1';
    const k = before ? n.page - 1 : n.pages - n.page;
    b.dataset.tip = `${before ? 'Previous page  ←' : 'Next page  →'}\n${k} page${k === 1 ? '' : 's'} ${before ? 'read' : 'to go'}`;
  }
};

mountReaderPage({
  id: 'leaf',
  note: 'One page on the blotter; the book’s fore-edge shows how far you are.',
  notes: `
  <h2>Pages 2 · One leaf, its edges</h2>
  <p>A book opens as a note does: one sheet on the blotter, the same width, margins and type. Under it lies the rest of the book. The pages still to read stack at its right edge, and the pages read at its left: each a paper edge in a soft hairline, 2px apart, up to six. How far you are is how the book looks, before any number.</p>
  <ul>
    <li><b>Turning:</b> the arrow keys, Space, Page Up and Down; or the edges: point at the pages to come (or the ones read) and click. The page slides once, in the calm time (none with reduced motion).</li>
    <li><b>Numbers, quiet:</b> the folio at the page's foot (the chapter's page of its pages at the left, the book's page at the right); the colophon says the chapter, the page of the book's pages and how many are left. Hover an edge for the same.</li>
    <li><b>Page numbers</b> are counted at this size: a wider window or a bigger zoom changes them. Features 1 compares that with steady pages.</li>
    <li><b>Contents:</b> the list (the chosen row is your chapter, each row with its first page); hidden, the Contents tool.</li>
    <li><b>Page frame Full:</b> no sheet, so no edges; the colophon still says how far.</li>
  </ul>
  <h2>The phone</h2>
  <p>The page fills the screen with the face's prose a size down. Tap the right third to turn on, the left third to turn back, or swipe. The fore-edge stays as hairlines down the page's right side; the folio below it.</p>
  <h2>For</h2>
  <ul><li>It's the note's own sheet: nothing new to learn, every width works, the list keeps its place.</li><li>Progress you see without reading a number, drawn only in paper and hairlines.</li><li>One page to a turn suits the measure Eien already sets.</li></ul>
  <h2>Against</h2>
  <ul><li>A wide window shows one page with blotter either side; Pages 1's spread uses it.</li><li>Six edges are coarse: a sixth of a long book is a lot of pages. The numbers are there for the rest.</li></ul>`,
});
</script>
</body>
</html>
