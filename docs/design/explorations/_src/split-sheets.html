<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Split window: 3 · Two sheets on one blotter</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:split.css*/

/* 3 · Two sheets on one blotter: one set of tools, as in 2. The notes are two
   sheets on the blotter, each with the same margin of blotter round it, and
   between them one hairline, as a pane's edge is (the companion's edge): the
   divider, rule-strong under the pointer, the focus ink while it's handled.
   The active sheet lies on top, with the sheet's shadow; the other lies flat.
   Page frame Full has no sheets: the hairline parts two pages of paper, and a
   2px ink-soft rule tops the active one. */
.band .tools-row:last-child { margin-left: auto; }
/* Flat: no shadow, and its edge a step softer, so it reads as under the other. */
.sheet--flat { box-shadow: none; border-color: var(--eien-rule-soft); }
/* Each sheet with the same margin of blotter all round, the hairline between them. */
.duo[data-columns] > .blotter { padding: var(--eien-space-5) var(--eien-space-5) 0; }
.duo[data-columns] .sheet { max-width: none; }
.sheet__close { position: absolute; top: var(--eien-space-2); right: var(--eien-space-2); }
.sheet:hover .sheet__close, .sheet__close:focus-visible { opacity: 1; }
:root[data-frame='full'] .pg .blotter { padding: 0; background: var(--eien-paper); }
:root[data-frame='full'] .pg .sheet { border: 0; box-shadow: none; border-radius: 0; max-width: none; }
:root[data-frame='full'] .duo[data-columns] .sheet:not(.sheet--flat)::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--eien-mark-w); background: var(--eien-ink-soft); }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:split.js*/

// One set of tools for the active page: A's band, B's slip, C's running head as they are.
function topHtml(ctx) {
  const pager = ctx.folded ? ctx.pager() : '';
  if (ctx.layout === 'band') return `<div class="band"><span class="tools-row quiet">${ctx.views()}</span>${pager}<span class="tools-row quiet">${ctx.pageTools()}</span></div>`;
  if (ctx.layout === 'slip') return `<div class="topline">${pager}<span class="slip quiet">${ctx.views()}${ctx.pageTools()}</span></div>`;
  return '';
}
// C's running head: the active note's crumb, and the tools that act on it.
Split.strip = (ctx) => `<div class="seg"><span class="crumb">${ctx.note(ctx.active).crumb}</span>${ctx.folded ? ctx.pager() : ''}<span class="tools-row">${ctx.views()}${ctx.pageTools()}</span></div>`;
function sheetHtml(ctx, i) {
  const two = ctx.shown.length === 2;
  return `<div class="blotter" data-side="${i}" aria-label="${ctx.note(i).title}${two && i === ctx.active ? ', the active page' : ''}" role="region">${ctx.sheet(i, { flat: two && i !== ctx.active, close: ctx.split })}</div>`;
}
Split.page = (ctx) => {
  const body = ctx.shown.length === 1 ? `<div class="duo">${sheetHtml(ctx, ctx.shown[0])}</div>`
    : `<div class="duo" data-columns style="grid-template-columns:${ctx.columns()}">${sheetHtml(ctx, 0)}${ctx.divider()}${sheetHtml(ctx, 1)}</div>`;
  return `<div class="page">${topHtml(ctx)}${ctx.fmtBar()}${body}${ctx.colophon(ctx.active)}</div>`;
};

mountSplitPage({
  id: 'sheets',
  note: 'Two sheets on one blotter, one set of tools; the active sheet lies on top.',
  bar: `<div class="xbar__group" data-x-set="frame"><span class="xbar__label">Page frame</span><button class="word-button" data-value="sheet">Sheet</button><button class="word-button" data-value="full">Full</button></div>`,
  notes: `
  <h2>3 · Two sheets on one blotter</h2>
  <p>The page pane isn't cut in two. It's one blotter, with one set of tools (A's band, B's slip, C's running head), one formatting bar and one colophon, as in 2, and the two notes are two sheets lying side by side on it. Each lies in the same margin of blotter, and between them runs one hairline, as a pane's edge does: that's the divider. Drag it; it's rule-strong under the pointer and the focus ink while it's handled.</p>
  <ul>
    <li><b>Active page:</b> the sheet on top. The active sheet has the sheet's shadow, the object you work on; the other lies flat, its hairline only. No colour, and nothing new: it's the depth Eien already has. In Page frame Full, where there are no sheets, a 2px ink-soft rule tops the active page instead (Page frame → Full).</li>
    <li><b>Closing:</b> the × at the sheet's top right corner, on hover.</li>
    <li><b>Formatting bar, tags, colophon, Versions, outline cards, Copy as HTML:</b> as in 2, for the active sheet.</li>
  </ul>
  <h2>For</h2>
  <ul><li>It's Eien's own picture, two papers on a desk, and its cue is one Eien already has.</li><li>As calm as 2: one set of tools in their usual place, C's single strip kept.</li><li>The divider is a pane's edge, the line Eien already draws between panes; nothing new.</li></ul>
  <h2>Against</h2>
  <ul><li>The blotter round each sheet costs width: 48px between the two sheets.</li><li>A shadow is a subtle signal, quieter in Night, and Full needs its own (the rule).</li><li>As in 2, a tool's target isn't always beside it.</li></ul>`,
});
</script>
</body>
</html>
