<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Scroll 1 · A chapter a sheet</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:reader.css*/

/* Scroll 1 · A chapter a sheet. A chapter reads as a note does in Reading:
   one sheet on the blotter, scrolling. At its foot the next chapter waits, a
   word button; nothing loads or moves until it's pressed. The chapter is what
   the EPUB holds as one file, so it's one sandboxed frame in the app. */
.blotter[data-main-scroll] { outline: none; }
.blotter[data-main-scroll]:focus-visible { box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.sheet.ch-sheet { flex: 1 0 auto; }
.ch-end { display: flex; justify-content: space-between; align-items: center; gap: var(--eien-space-3); margin-top: var(--eien-space-7); padding-top: var(--eien-space-4); border-top: var(--eien-hairline) solid var(--eien-rule-soft); }
.ch-end .word-button { display: inline-flex; align-items: center; gap: var(--eien-space-1); text-transform: none; letter-spacing: 0; font-size: var(--eien-size-meta); }
.ch-end .word-button svg { width: var(--eien-space-3); height: var(--eien-space-3); }
.ch-end .label { color: var(--eien-faded); }
.phone__page.is-scroll { display: block; overflow: auto; padding-bottom: var(--eien-space-5); }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:reader.js*/
Reader.paged = false;

const chEnd = () => {
  const prev = R.c > 0 ? `<button class="word-button" data-go="${R.c - 1}" data-k="go-prev">${icon('left')}${CHAPTERS[R.c - 1].title}</button>` : '<span></span>';
  const next = R.c < CHAPTERS.length - 1 ? `<button class="word-button" data-go="${R.c + 1}" data-k="go-next">${CHAPTERS[R.c + 1].title}${icon('right')}</button>` : '<span class="label">The end</span>';
  return `<nav class="ch-end" aria-label="Chapters">${prev}${next}</nav>`;
};
const textHtml = () => `<div class="book-text" data-c="${R.c}">${chapterHtml(R.c)}</div>`;
Reader.tools = (ctx) => ctx.contentsTool();
Reader.page = (ctx) => `<div class="page">${ctx.top()}<div class="blotter" data-main-scroll="chapter" data-keep-scroll="ch${R.c}" tabindex="0" role="region" aria-roledescription="book" aria-label="${BOOK.title}, ${CHAPTERS[R.c].title}">
  <article class="sheet ch-sheet">${ctx.head()}${textHtml()}${chEnd()}</article></div>${ctx.colophon([CHAPTERS[R.c].ord, '<span data-col-ch></span>', '<span data-col-book></span>'])}</div>`;
Reader.phone = () => `<div class="phone__page is-scroll" data-main-scroll="chapter" data-keep-scroll="pch${R.c}" tabindex="0">${textHtml()}${chEnd()}</div>`;
Reader.phoneTools = (ctx) => ctx.tool('contents', 'Contents', '', 'data-contents');
Reader.after = (ctx, n) => {
  const set = (sel, text) => { for (const el of canvas.querySelectorAll(sel)) el.textContent = text; };
  set('[data-col-ch]', `${n.chPct}% of the chapter`);
  set('[data-col-book]', `${n.pct}% of the book`);
};
Reader.click = (b) => { if (b.dataset.go) act.go(+b.dataset.go); };
// A new chapter opens at its top.
const go = act.go;
act.go = (c) => { go(c); const sc = canvas.querySelector('[data-main-scroll]'); if (sc) sc.scrollTop = 0; settle(); };

mountReaderPage({
  id: 'chapter',
  note: 'A chapter is a sheet that scrolls, as a note does in Reading; the next waits at its foot.',
  notes: `
  <h2>Scroll 1 · A chapter a sheet</h2>
  <p>A chapter reads as a note does in the Reading view: one sheet on the blotter, the same width, margins and type, and it scrolls. At its foot, after a soft rule, the chapter before and the chapter after are word buttons. Nothing loads or moves until one is pressed: the end of a chapter is a place to stop.</p>
  <ul>
    <li><b>Keys:</b> the usual scrolling keys (arrows, Space, Page Up and Down, Home, End) once the book has the keyboard; Tab reaches the next chapter's button.</li>
    <li><b>Where you are:</b> the list's chosen row is the chapter; the colophon says how far through the chapter and the book; the shelf's row, how far through the book.</li>
    <li><b>A chapter is one of the EPUB's files</b>, so it's one sandboxed frame in the app: the simplest build, and the one the plan's phases start from.</li>
  </ul>
  <h2>The phone</h2>
  <p>The chapter fills the screen and scrolls under the thumb; the chapter buttons wait at its foot, at a finger's size.</p>
  <h2>For</h2>
  <ul><li>Exactly how a note reads, so nothing to learn; every width, every layout, the phone.</li><li>The simplest to build safely: one chapter, one frame.</li><li>The chapter's end is a natural pause.</li></ul>
  <h2>Against</h2>
  <ul><li>A press at every chapter's end: reading straight through, that's a stop you didn't ask for.</li><li>Progress through a chapter is only the scroll bar and the colophon.</li></ul>`,
});
</script>
</body>
</html>
