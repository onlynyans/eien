<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Showcase 3 · By lamplight</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:epub.css*/

/* Showcase 3 · By lamplight. Eien's own writing tools, Focus mode and
   typewriter scrolling, turned to reading. Your place is a paragraph: it's in
   full ink, the rest of the chapter in pencil, and it stands on the reading
   line, a third of the way down the pane. ↓ or Space moves the lamp to the
   next paragraph and the page glides up under it, so the eye never travels.
   By Night (inkstone) it reads as one lit paragraph on a dark desk; by Day it
   whispers. No glow: the light is an ink's strength, and pencil still reads. */
.blotter[data-main-scroll] { outline: none; }
.blotter[data-main-scroll]:focus-visible { box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.sheet.lamp-sheet { flex: 1 0 auto; }
/* The foot runs on, so the last paragraph can come up to the reading line (as typewriter scrolling does). */
.lamp-sheet, .phone__page.is-scroll { padding-bottom: var(--lamp-run, var(--eien-space-8)); }
.ch-end { display: flex; justify-content: space-between; align-items: center; gap: var(--eien-space-3); margin-top: var(--eien-space-7); padding-top: var(--eien-space-4); border-top: var(--eien-hairline) solid var(--eien-rule-soft); }
.ch-end .word-button { display: inline-flex; align-items: center; gap: var(--eien-space-1); text-transform: none; letter-spacing: 0; font-size: var(--eien-size-meta); }
.ch-end .word-button svg { width: var(--eien-space-3); height: var(--eien-space-3); }
.ch-end .label { color: var(--eien-faded); }

/* The lamp: the lit paragraph in ink, the rest in pencil; the change in the calm time. */
:root:not([data-lamp='off']) .lamp-text :is(p, .ch-head) { color: var(--eien-pencil); transition: color var(--eien-calm) var(--eien-ease); }
:root:not([data-lamp='off']) .lamp-text p.is-lit { color: var(--eien-ink); }
:root:not([data-lamp='off']) .lamp-text p { cursor: default; }
@media (prefers-reduced-motion: reduce) { .lamp-text :is(p, .ch-head) { transition: none; } }
.icon-button[data-lamp-tool][aria-pressed='true'] { color: var(--eien-ink); }

.phone__page.is-scroll { display: block; overflow: auto; }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:epub.js*/
Epub.paged = false;
// Night is where the lamp shows best, so the page opens by Night unless you chose otherwise.
if (!kept.theme) root.dataset.theme = 'dark';

const lampOn = () => root.dataset.lamp !== 'off';
const L = { c: R.c, i: 0, steering: false };
const scroller = () => canvas.querySelector('[data-main-scroll]');
const paras = () => [...(canvas.querySelector(`.lamp-text[data-c="${R.c}"]`)?.querySelectorAll('p[data-o]') ?? [])];
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
/** The reading line: a third of the way down the scrolling pane, in screen pixels. */
function lineY(sc) { const r = sc.getBoundingClientRect(); return r.top + r.height / 3; }

/** Light a paragraph: it alone in ink. */
function light(i) {
  const ps = paras();
  if (!ps.length) return;
  L.c = R.c;
  L.i = clamp(i, 0, ps.length - 1);
  ps.forEach((p, k) => p.classList.toggle('is-lit', k === L.i));
  tell();
}
/** Bring the lit paragraph's top to the reading line: asked for, so it glides (none with reduced motion). */
function steer(instant = false) {
  const sc = scroller();
  const p = paras()[L.i];
  if (!sc || !p) return;
  const s = sc.getBoundingClientRect().height / sc.offsetHeight || 1;
  const by = (p.getBoundingClientRect().top - lineY(sc)) / s;
  const room = by > 0 ? sc.scrollHeight - sc.clientHeight - sc.scrollTop : sc.scrollTop;
  if (Math.abs(by) < 1 || room < 1) return;
  // While the page glides, its scrolling is the lamp's, not yours: the lamp stays put.
  L.steering = true;
  const done = () => { clearTimeout(L.timer); L.steering = false; };
  sc.addEventListener('scrollend', done, { once: true });
  clearTimeout(L.timer);
  L.timer = setTimeout(done, 1200);
  sc.scrollBy({ top: by, behavior: instant || reduced() ? 'auto' : 'smooth' });
}
/** ↓ and ↑: the next paragraph, or the one before; past the chapter's end, the next chapter's first. */
function step(dir) {
  const ps = paras();
  const to = L.i + dir;
  if (to >= ps.length) { if (R.c < CHAPTERS.length - 1) { act.go(R.c + 1); say(CHAPTERS[R.c].title); } else say('The end of the book'); return; }
  if (to < 0) { if (R.c > 0) { act.go(R.c - 1); light(paras().length - 1); steer(); } else say('The beginning of the book'); return; }
  light(to);
  steer();
}
/** The paragraph standing on the reading line (or the first below it): where your scrolling left you. */
function atLine() {
  const sc = scroller();
  const ps = paras();
  // At the chapter's top, its first paragraph, wherever the line falls.
  if (!sc || !ps.length || sc.scrollTop < 1) return 0;
  const y = lineY(sc);
  const k = ps.findIndex((p) => p.getBoundingClientRect().bottom > y);
  return k < 0 ? ps.length - 1 : k;
}
/** The colophon and the room under the sheet: from the lit paragraph. */
function tell() {
  const ps = paras();
  const p = ps[L.i];
  const set = (sel, text) => { for (const el of canvas.querySelectorAll(sel)) el.textContent = text; };
  if (!p) { set('[data-col-para]', ''); set('[data-col-left]', ''); return; }
  const o = +p.dataset.o;
  set('[data-col-para]', `¶ ${L.i + 1} of ${ps.length}`);
  set('[data-col-left]', `${Math.max(1, Math.ceil((CHAPTERS[R.c].chars - o) / 5.6 / 250))} min left in the chapter`);
  set('[data-col-book]', `${Math.round(((charsBefore(R.c) + o) / BOOK_CHARS) * 100)}% of the book`);
}

const chEnd = () => {
  const prev = R.c > 0 ? `<button class="word-button" data-go="${R.c - 1}" data-k="go-prev">${icon('left')}${CHAPTERS[R.c - 1].title}</button>` : '<span></span>';
  const next = R.c < CHAPTERS.length - 1 ? `<button class="word-button" data-go="${R.c + 1}" data-k="go-next">${CHAPTERS[R.c + 1].title}${icon('right')}</button>` : '<span class="label">The end</span>';
  return `<nav class="ch-end" aria-label="Chapters">${prev}${next}</nav>`;
};
const textHtml = () => `<div class="book-text lamp-text" data-c="${R.c}">${chapterHtml(R.c)}</div>`;
const lampTool = (ctx, key = 'L') => ctx.tool('focus', lampOn() ? 'Put the lamp out' : 'Light the lamp', key, `data-lamp-tool aria-pressed="${lampOn()}"`);
Epub.tools = (ctx) => `${ctx.contentsTool()}${lampTool(ctx)}`;
Epub.page = (ctx) => `<div class="page">${ctx.top()}<div class="blotter" data-main-scroll="chapter" data-keep-scroll="ch${R.c}" tabindex="0" role="region" aria-roledescription="book" aria-label="${BOOK.title}, ${CHAPTERS[R.c].title}">
  <article class="sheet lamp-sheet">${ctx.head()}${textHtml()}${chEnd()}</article></div>${ctx.colophon([CHAPTERS[R.c].ord, '<span data-col-para></span>', '<span data-col-left></span>', '<span data-col-book></span>'])}</div>`;
Epub.phone = () => `<div class="phone__page is-scroll" data-main-scroll="chapter" data-keep-scroll="pch${R.c}" tabindex="0" role="region" aria-roledescription="book" aria-label="${BOOK.title}, ${CHAPTERS[R.c].title}">${textHtml()}${chEnd()}</div>`;
Epub.phoneTools = (ctx) => `${ctx.tool('contents', 'Contents', '', 'data-contents')}${lampTool(ctx, '')}`;
Epub.after = () => {
  // A draw keeps the lamp where it was; a scroll you made moves it to the reading line; one the lamp made doesn't.
  if (L.hold) { L.hold = false; return; }
  if (L.c === R.c && !L.steering && drawnOnce) light(atLine());
};
let drawnOnce = false;
Epub.drawn = () => {
  const sc = scroller();
  if (!sc) return;
  sc.style.setProperty('--lamp-run', `${Math.round(sc.clientHeight * 2 / 3)}px`);
  // A new chapter, or a fresh draw: the lamp on the paragraph at the line (the first, at a chapter's top).
  if (L.c !== R.c) { L.c = R.c; L.i = 0; }
  // A redraw (a layout, a width, Day or Night) keeps your paragraph on the line: the place holds, not the scroll.
  if (drawnOnce) { light(L.i); steer(true); } else light(atLine());
  drawnOnce = true;
  L.hold = true;
};
Epub.click = (b) => {
  if (b.dataset.go) act.go(+b.dataset.go);
  else if ('lampTool' in b.dataset) {
    document.querySelector(`[data-x-set="lamp"] [data-value="${lampOn() ? 'off' : 'on'}"]`)?.click();
    say(lampOn() ? 'The lamp is lit: ↓ and Space step a paragraph' : 'The lamp is out');
    if (!b.closest) scroller()?.focus({ preventScroll: true });
  }
};
Epub.key = (e) => {
  if (mod(e) || e.altKey || typing(e.target) || e.target.closest?.('.menu, .ls__rows, .sb, .xbar, button, a')) return false;
  if (e.key.toLowerCase() === 'l') { e.preventDefault(); Epub.click({ dataset: { lampTool: '' } }); return true; }
  if (!lampOn()) return false;
  const down = e.key === 'ArrowDown' || e.key === 'j' || (e.key === ' ' && !e.shiftKey);
  const up = e.key === 'ArrowUp' || e.key === 'k' || (e.key === ' ' && e.shiftKey);
  if (!down && !up) return false;
  e.preventDefault();
  step(down ? 1 : -1);
  return true;
};
// A new chapter opens at its top, the lamp on its first paragraph.
const go = act.go;
act.go = (c, o) => { go(c, o); const sc = scroller(); if (sc && !o) sc.scrollTop = 0; L.c = R.c; light(o ? atLine() : 0); settle(); scroller()?.focus({ preventScroll: true }); };

mountEpubPage({
  id: 'lamp',
  bar: `<div class="xbar__group" data-x-set="lamp"><span class="xbar__label">Lamp</span><button class="word-button" data-value="on">On</button><button class="word-button" data-value="off">Off</button></div>`,
  note: 'Your place is a paragraph in full ink on the reading line; the page glides up under it.',
  notes: `
  <h2>Showcase 3 · By lamplight</h2>
  <p>Eien's own writing tools, Focus mode and typewriter scrolling, turned to reading. Your place is a paragraph: it's in full ink, the rest of the chapter in pencil, and it stands on the reading line, a third of the way down the pane. <kbd>↓</kbd> or <kbd>Space</kbd> lights the next paragraph and the page glides up under it, so your eyes stay where they are and the book moves to them.</p>
  <ul>
    <li><b>By Night</b> (it opens by Night here) the page is inkstone and one paragraph is lit on it; by Day the same thing whispers. No glow and no new colour: the light is an ink's strength. Unlit words are in pencil, which still passes contrast on paper, unlike Focus mode's dimming, so you can always read on ahead.</li>
    <li><b>Keys:</b> <kbd>↓</kbd> <kbd>J</kbd> <kbd>Space</kbd> the next paragraph, <kbd>↑</kbd> <kbd>K</kbd> <kbd>⇧Space</kbd> the one before; past the chapter's end, the next chapter's first. <kbd>L</kbd> or the lamp tool (Focus mode's icon) puts it out and lights it again; out, the keys scroll as they always do.</li>
    <li><b>Nothing moves you didn't move.</b> The page glides only when you step (the calm time; a jump with reduced motion). Scroll by hand and the lamp comes to the paragraph on the reading line; click a paragraph and it's lit where it stands.</li>
    <li><b>Your place is exact:</b> a paragraph, not a page that changes with the window. It's what's kept in <code>.eien/reading/</code>, and the colophon counts by it: the paragraph of the chapter's, the minutes left at 250 words a minute, the share of the book.</li>
    <li><b>The sheet's foot runs on</b> so the last paragraph can come up to the line, as typewriter scrolling lets a note's last line.</li>
  </ul>
  <h2>The phone</h2>
  <p>The chapter scrolls under the thumb, and the lamp follows the reading line as it does; a tap on a paragraph lights it. The lamp's tool sits with Contents where the layout keeps a phone's tools. On a phone in bed at night this is the reason to read in Eien.</p>
  <h2>For</h2>
  <ul><li>Two of Eien's writing tools, the same look and keys, given a second use: nothing new to learn.</li><li>A place you never lose: the exact paragraph, by Night or Day, on any screen.</li><li>Calm for tired eyes: the eye stays on one line of the screen; the page comes to it.</li></ul>
  <h2>Against</h2>
  <ul><li>By Day the lamp is faint: ink against pencil, a whisper. It's for Night first.</li><li>A paragraph is an uneven step: a line of dialogue, then half a page.</li><li>Scrolling only: a page-turner wouldn't have it.</li></ul>`,
});
// A paragraph pointed at is lit where it stands; nothing scrolls.
canvas.addEventListener('click', (e) => {
  const p = e.target.closest('.lamp-text p[data-o]');
  if (!p || !lampOn() || !getSelection().isCollapsed) return;
  light(paras().indexOf(p));
});
</script>
</body>
</html>
