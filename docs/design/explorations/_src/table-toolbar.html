<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Tables in Live: 2 · Toolbar</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:table.css*/

/* 2 · Toolbar: the table's tools on one bar, there only while the caret is in
   the table. It floats over the table's top left, or joins the formatting
   bar's row; on a phone it docks above the keyboard. */
.tbar {
  display: none; align-items: center; gap: 2px; padding: 2px; width: max-content;
  background: var(--eien-paper-raised); border: var(--eien-hairline) solid var(--eien-rule-strong);
  border-radius: var(--eien-radius-m); box-shadow: var(--eien-shadow-float);
  font-family: var(--eien-face-mono);
}
.tbar.is-shown { display: flex; }
/* Over the table's top left, in a gap kept for it, so it never covers the words above. */
.tbl-wrap { margin-top: var(--eien-space-7); }
.tbl-layer .tbar { position: absolute; translate: 0 -100%; }
.tbar__rule { width: var(--eien-hairline); align-self: stretch; margin: var(--eien-space-1) 2px; background: var(--eien-rule); }
.tbar__where { padding: 0 var(--eien-space-2) 0 var(--eien-space-1); white-space: nowrap; }
.tbar .icon-button[aria-disabled='true'] { color: var(--eien-faded); }
@media (hover: hover) { .tbar .tbar__off:not([aria-disabled='true']):hover { color: var(--eien-removed); } }

/* The formatting bar, as Band draws it: the page's second row, on the band. */
.pane { grid-template-rows: auto minmax(0, 1fr) var(--status-h, 40px); }
.fbar { display: flex; justify-content: center; align-items: center; gap: 2px; min-height: 40px; padding: 2px var(--eien-space-3); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); flex-wrap: wrap; }
.fbar .fbar__rule { width: var(--eien-hairline); height: 18px; margin: 0 var(--eien-space-1); background: var(--eien-rule); }
/* Joined to it, the table's tools are the bar's own: no float, no edge. */
.fbar .tbar { background: none; border: 0; box-shadow: none; padding: 0; }
.fbar .tbar.is-shown::before { content: ''; width: var(--eien-hairline); height: 18px; margin: 0 var(--eien-space-1); background: var(--eien-rule); }
.fbar__table[aria-pressed='true'] { color: var(--eien-ink); border-color: var(--eien-rule-strong); }

/* A phone: docked to the foot, above where the keyboard comes; one row that scrolls sideways. */
.is-touch .pane > .tbar {
  position: absolute; left: 0; right: 0; bottom: var(--status-h, 40px); width: auto; z-index: 5;
  overflow-x: auto; border-radius: 0; border-width: var(--eien-hairline) 0 0; box-shadow: none; background: var(--eien-band);
}
.is-touch .tbar .icon-button { width: var(--eien-touch); height: var(--eien-touch); }
.is-touch .tbar .tbar__where { display: none; }
:root[data-device='phone'] .fbar { display: none; }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:table.js*/

mountTablePage({
  id: 'toolbar',
  name: 'the plan',
  note: 'Put the caret in a cell: the table’s tools come with it, and go when it leaves.',
  bar: `<div class="xbar__group" data-x-set="where"><span class="xbar__label">Bar</span><button class="word-button" data-value="float">Over the table</button><button class="word-button" data-value="row">In the formatting bar</button></div>`,
  notes: `
  <h2>2 · A toolbar with the caret</h2>
  <p>Nothing on the table at rest, nothing on hover: the tools come when the caret goes into a cell, on one bar of icons with their names and keys in tooltips, and go when it leaves. Rows, then columns, then the column's alignment, then where the caret is.</p>
  <h2>Try</h2>
  <ul>
    <li>click a cell; the bar sits over the table's top left</li>
    <li>Bar → In the formatting bar: the same tools join the page's formatting row (Band's second row, where the Table button lives) instead of floating</li>
    <li><kbd>${KEY('Alt-F10')}</kbd> from a cell to the bar; <kbd>←</kbd> <kbd>→</kbd> along it, <kbd>Esc</kbd> back to the cell</li>
    <li>remove a row with words in it: the colophon says <kbd>${KEY('Mod-Z')}</kbd> puts it back</li>
  </ul>
  ${SHARED_KEYS()}
  <h2>On a phone</h2>
  <p>This is where 2 is strongest. The bar docks at the foot, just above the keyboard, as the phone's formatting row does: one row of 44px targets that scrolls sideways. Nothing to hover, nothing to find in the margin (Show → Phone).</p>`,
});

const pane = document.querySelector('.pane');
pane.insertAdjacentHTML('afterbegin', `<div class="fbar" role="toolbar" aria-label="Formatting">
  ${['bold', 'italic', 'underline', 'strike'].map((n) => `<button class="icon-button" tabindex="-1" data-icon="${n}" aria-label="${n}" data-tip="${n[0].toUpperCase() + n.slice(1)}"></button>`).join('')}
  <span class="fbar__rule"></span>
  ${['heading', 'quote', 'bullets', 'numbers', 'checklist', 'link'].map((n) => `<button class="icon-button" tabindex="-1" data-icon="${n}" aria-label="${n}" data-tip="${n[0].toUpperCase() + n.slice(1)}"></button>`).join('')}
  <button class="icon-button fbar__table" tabindex="-1" data-icon="table" aria-label="Table" data-tip="Table"></button>
</div>`);
const fbar = pane.querySelector('.fbar');

const TOOLS = [
  ['rowAbove', 'Add a row above', 'Mod-Alt-↑'],
  ['rowBelow', 'Add a row below', 'Mod-Alt-↓'],
  ['rowDelete', 'Remove this row', 'Mod-Alt-⌫', 'tbar__off'],
  '|',
  ['colLeft', 'Add a column to the left', 'Mod-Alt-←'],
  ['colRight', 'Add a column to the right', 'Mod-Alt-→'],
  ['colDelete', 'Remove this column', 'Mod-Alt-Shift-⌫', 'tbar__off'],
  '|',
  ['alignLeft', 'Align the column left'],
  ['alignCenter', 'Align the column centre'],
  ['alignRight', 'Align the column right'],
  '|',
];
const bar = document.createElement('div');
bar.className = 'tbar';
bar.setAttribute('role', 'toolbar');
bar.setAttribute('aria-label', 'Table');
bar.dataset.tablePart = '';
bar.innerHTML = TOOLS.map((t) => (t === '|'
  ? '<span class="tbar__rule" aria-hidden="true"></span>'
  : `<button class="icon-button ${t[3] ?? ''}" tabindex="-1" data-act="${t[0]}" aria-label="${t[1]}" data-tip="${t[1]}${t[2] ? `  ${KEY(t[2])}` : ''}">${icon(t[0])}</button>`)).join('') + '<span class="tbar__where count" aria-live="off"></span>';
const buttons = [...bar.querySelectorAll('button')];
let roving = 0;

function place() {
  const touch = isTouch();
  const where = document.documentElement.dataset.where;
  const home = touch ? pane : where === 'row' ? fbar : layer;
  if (bar.parentElement !== home) home.append(bar);
  const shown = inTable || bar.contains(document.activeElement);
  bar.classList.toggle('is-shown', shown);
  fbar.querySelector('.fbar__table').setAttribute('aria-pressed', String(shown));
  if (home === layer) {
    const g = geometry();
    bar.style.left = `${g.left}px`;
    bar.style.top = `${g.top - 6}px`;
  } else {
    bar.style.left = bar.style.top = '';
  }
  // How each tool looks now: what can't be done says so when pressed, rather than vanishing.
  bar.querySelector('[data-act="rowDelete"]').setAttribute('aria-disabled', String(here.r === 0));
  bar.querySelector('[data-act="colDelete"]').setAttribute('aria-disabled', String(cols() === 1));
  for (const a of ['left', 'center', 'right']) bar.querySelector(`[data-act="${ALIGN_ICON[a]}"]`).setAttribute('aria-pressed', String(T.align[here.c] === a));
  bar.querySelector('.tbar__where').textContent = `${here.r === 0 ? 'HEAD' : `ROW ${here.r}`} · COL ${here.c + 1}`;
  buttons.forEach((b, i) => { b.tabIndex = i === roving ? 0 : -1; });
}
Table.onDraw = place;
Table.onMove = place;
Table.onKey = (e) => {
  if (e.key !== 'F10' || !e.altKey) return false;
  e.preventDefault();
  buttons[roving].focus();
  return true;
};

const act = {
  rowAbove: () => ops.insertRow(Math.max(0, here.r - 1)),
  rowBelow: () => ops.insertRow(here.r),
  rowDelete: () => ops.deleteRow(here.r),
  colLeft: () => ops.insertCol(here.c),
  colRight: () => ops.insertCol(here.c + 1),
  colDelete: () => ops.deleteCol(here.c),
  alignLeft: () => ops.align(here.c, 'left'),
  alignCenter: () => ops.align(here.c, 'center'),
  alignRight: () => ops.align(here.c, 'right'),
};
// The pointer's press keeps the caret in its cell; the keyboard stays on the bar.
bar.addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); });
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const fromKeys = e.detail === 0;
  act[b.dataset.act]();
  if (fromKeys) { roving = buttons.indexOf(b); place(); b.focus(); }
});
bar.addEventListener('keydown', (e) => {
  const i = buttons.indexOf(document.activeElement);
  const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: buttons.length - 1 }[e.key];
  if (to !== undefined) {
    e.preventDefault();
    roving = (to + buttons.length) % buttons.length;
    place();
    buttons[roving].focus();
  } else if (e.key === 'Escape') { e.preventDefault(); toCell(); }
});
bar.addEventListener('focusout', () => setTimeout(place));
fbar.querySelector('.fbar__table').addEventListener('click', () => focusCell(here.r, here.c));
drawIcons(fbar);
requestAnimationFrame(place);
</script>
</body>
</html>
