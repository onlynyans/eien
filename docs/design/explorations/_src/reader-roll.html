<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Scroll 2 · One roll</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:reader.css*/

/* Scroll 2 · One roll. The whole book on one long sheet: chapters follow each
   other with no stop. The sheet's running head stays at the top as a band,
   naming the chapter you're in, and the list's chosen row follows you. */
.blotter[data-main-scroll] { outline: none; }
.blotter[data-main-scroll]:focus-visible { box-shadow: inset 0 0 0 var(--eien-mark-w) var(--eien-focus); }
.roll { padding-top: 0; }
.roll .sheet__head { position: sticky; top: calc(-1 * var(--eien-space-4)); z-index: 2; margin: 0 calc(-1 * clamp(var(--eien-space-4), 8%, var(--eien-space-8))) var(--eien-space-5); padding: var(--eien-space-3) clamp(var(--eien-space-4), 8%, var(--eien-space-8)); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
.roll .book-text + .book-text { margin-top: var(--eien-space-8); }
.roll-end { margin: var(--eien-space-8) 0 var(--eien-space-6); text-align: center; font-style: italic; color: var(--eien-ink-soft); }
.win[data-layout='runhead'] .roll { padding-top: var(--eien-space-6); }
.win[data-layout='slip'] .roll .sheet__head { top: 0; }
.phone__page.is-scroll { display: block; overflow: auto; padding-top: 0; }
.phone .roll-head { position: sticky; top: 0; z-index: 2; margin: 0 calc(-1 * var(--eien-space-5)) var(--eien-space-4); padding: var(--eien-space-2) var(--eien-space-5); background: var(--eien-band); border-bottom: var(--eien-hairline) solid var(--eien-rule); }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:reader.js*/
Reader.paged = false;

const rollHtml = () => BOOK_TEXT.map((_, c) => `<div class="book-text" data-c="${c}" id="roll-${c}">${chapterHtml(c)}</div>`).join('')
  + '<p class="roll-end">This exploration holds Chapters I to III; in the app the roll runs on to the end of the book.</p>';
/** A word's reading time, at 250 words a minute: the machine's count, said plainly. */
const timeLeft = (n) => {
  const min = Math.round(((1 - n.pct / 100) * BOOK_CHARS) / 5.7 / 250);
  return min >= 60 ? `about ${Math.round(min / 60)} h left` : `${min} min left`;
};
Reader.tools = (ctx) => ctx.contentsTool();
Reader.page = (ctx) => `<div class="page">${ctx.top()}<div class="blotter" data-main-scroll="roll" data-keep-scroll="roll" tabindex="0" role="region" aria-roledescription="book" aria-label="${BOOK.title}">
  <article class="sheet roll">${ctx.layout === 'runhead' ? '' : `<div class="sheet__head"><span class="crumb" data-roll-crumb>${ctx.crumb()}</span>${ctx.layout === 'band' ? `<span class="crumb">${BOOK.author}</span>` : ''}</div>`}${rollHtml()}</article></div>${ctx.colophon(['<span data-col-ch></span>', '<span data-col-book></span>', '<span data-col-left></span>'])}</div>`;
Reader.strip = (ctx) => `<div class="seg"><span class="crumb" data-roll-crumb>${ctx.crumb()}</span><span class="tools-row">${ctx.views()}${Reader.tools(ctx)}</span></div>`;
Reader.phone = () => `<div class="phone__page is-scroll" data-main-scroll="roll" data-keep-scroll="proll" tabindex="0"><div class="roll-head crumb" data-roll-crumb></div>${rollHtml()}</div>`;
Reader.phoneTools = (ctx) => ctx.tool('contents', 'Contents', '', 'data-contents');
/** You've scrolled into another chapter: the head and the list follow, without a redraw. */
Reader.chapterChanged = () => {
  for (const row of canvas.querySelectorAll('.row--ch')) {
    const on = +row.dataset.ch === R.c;
    row.classList.toggle('is-chosen', on);
    if (on) { row.setAttribute('aria-current', 'true'); row.scrollIntoView({ block: 'nearest' }); } else row.removeAttribute('aria-current');
  }
};
Reader.after = (ctx, n) => {
  const set = (sel, text) => { for (const el of canvas.querySelectorAll(sel)) el.textContent = text; };
  set('[data-roll-crumb]', `${BOOK.folder} / ${BOOK.title} / ${CHAPTERS[R.c].ord}`);
  set('[data-col-ch]', CHAPTERS[R.c].ord);
  set('[data-col-book]', `${n.pct}% of the book`);
  set('[data-col-left]', timeLeft(n));
};
// A chapter chosen in the list scrolls the roll to it.
act.go = (c) => {
  const target = canvas.querySelector(`#roll-${c}`);
  if (!target) { if (c < HELD) { R.pendingGo = c; draw(); } else say('This exploration holds Chapters I to III'); return; }
  const sc = canvas.querySelector('[data-main-scroll]');
  const s = sc.getBoundingClientRect().width / sc.offsetWidth || 1;
  const head = sc.querySelector('.sheet__head, .roll-head')?.offsetHeight ?? 0;
  sc.scrollTop += (target.getBoundingClientRect().top - sc.getBoundingClientRect().top) / s - head - 16;
};
Reader.drawn = () => { if (R.pendingGo != null) { act.go(R.pendingGo); R.pendingGo = null; } };

mountReaderPage({
  id: 'roll',
  note: 'The whole book on one sheet: chapters run on; the head and the list follow you.',
  notes: `
  <h2>Scroll 2 · One roll</h2>
  <p>The whole book on one long sheet. Chapters follow each other with a wide space and their heading, and no stop. The sheet's running head stays at its top as a band, naming the chapter you're in (C's names it in the running head over the page), and the list's chosen row follows you as you scroll.</p>
  <ul>
    <li><b>Where you are:</b> the head, the list, and the colophon: the chapter, how far through the book, and the time left at an ordinary pace (the machine's count, plainly said).</li>
    <li><b>Going to a chapter</b> from the list scrolls the roll to it; the scroll bar is the whole book.</li>
    <li><b>In the app</b> each chapter is still its own sandboxed frame, stacked, and only those near the screen are drawn, as the long note list draws only the rows in sight.</li>
  </ul>
  <h2>The phone</h2>
  <p>The roll under the thumb, the chapter's name in a thin band at the top that stays as you scroll; the contents behind the bar.</p>
  <h2>For</h2>
  <ul><li>Reading straight through: no stops, no presses.</li><li>The head that follows you says where you are without looking away.</li><li>Searching or skimming the whole book is one scroll.</li></ul>
  <h2>Against</h2>
  <ul><li>The hardest to build: many frames stacked, drawn and dropped as you scroll, and a place that must hold while they load.</li><li>The scroll bar is the whole book, so it's too fine to drag through a chapter.</li><li>A band always over the sheet's top: more furniture than a note has.</li></ul>`,
});
</script>
</body>
</html>
