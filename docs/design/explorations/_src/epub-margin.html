<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Features 1 · On the page</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:epub.css*/

/* Features 1 · On the page. Every mark is where it was made, as a reader with
   a pencil leaves them: the ribbon over the page's top edge for a bookmark (the
   split's ribbon, ink-soft, forked), a pencil line under highlighted words and
   a tick in the margin beside them, Find in the layout's bar, the count in
   the colophon and the folio. Nothing lists them: ] and [ walk them. */
.seg .find { flex: 1; justify-content: center; }
.marked-sheet { position: relative; }
.marked-sheet .leaves { overflow: clip; overflow-clip-margin: var(--eien-space-5); }
/* The ribbon: the book's silk marker, over the sheet's top edge in the outer margin. */
.ribbon { position: absolute; z-index: 3; top: calc(-1 * var(--eien-hairline)); right: var(--eien-space-6); width: var(--eien-space-2); height: var(--eien-space-6); background: var(--eien-ink-soft); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); animation: drop var(--eien-calm) var(--eien-ease); }
@keyframes drop { from { translate: 0 calc(-1 * var(--eien-space-4)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ribbon { animation: none; } }
/* Highlights in pencil: a line under the words, a tick in the margin by their paragraph. */
.marked-sheet .hl, .phone .hl { text-decoration-line: underline; text-decoration-color: var(--eien-pencil); text-decoration-thickness: var(--eien-mark-w); text-underline-offset: 0.22em; text-decoration-skip-ink: none; }
.book-text p.has-hl { position: relative; }
.book-text p.has-hl::before { content: ''; position: absolute; left: calc(-1 * var(--eien-space-4)); top: 0.35em; bottom: 0.35em; width: var(--eien-mark-w); background: var(--eien-pencil); }
.icon-button[data-bookmark][aria-pressed='true'] svg { fill: currentColor; }
.folio .count:last-child { margin-left: auto; }
.pagenum-note { color: var(--eien-faded); text-transform: none; }
.phone .ribbon { right: var(--eien-space-5); }
[data-ribbon] { display: contents; }
.phone__page.marked-sheet { position: relative; grid-template-rows: auto minmax(0, 1fr) auto; }
.phone-find:not(:empty) { padding-bottom: var(--eien-space-3); }
.phone-find .find { flex-wrap: wrap; }
.phone-find .find__field { flex: 1; width: auto; }
.phone-find .find__says { min-width: 0; }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:epub.js*/
Epub.marks = true;
Epub.findInBar = true;

/** Page numbers three ways: the screen's, steady ones of 1,500 characters, or the print edition's. */
const STEADY = 1500;
const PRINT = 2450; // the 1894 edition's pages, from the EPUB's page-list
function pageWords(n) {
  const at = charsBefore(R.c) + n.start;
  const how = root.dataset.pagenums ?? 'screen';
  if (how === 'steady') return [`page ${Math.floor(at / STEADY) + 1} of ${Math.ceil(BOOK_CHARS / STEADY)}`, String(Math.floor(at / STEADY) + 1)];
  if (how === 'print') return [`page ${Math.floor(at / PRINT) + 1} of ${Math.ceil(BOOK_CHARS / PRINT)} in print`, String(Math.floor(at / PRINT) + 1)];
  return [`page ${n.page} of ${n.pages}`, String(n.page)];
}
const pageMarked = () => !!R.nums && R.bookmarks.some((b) => b.c === R.c && b.o >= R.nums.start && b.o <= Math.max(R.nums.end, R.nums.start));

Epub.tools = (ctx) => `${ctx.contentsTool()}${ctx.tool('search', 'Find in the book', KEY('Mod-F'), 'data-open-find')}${ctx.tool('ribbon', 'Bookmark this page', 'B', `data-bookmark aria-pressed="${pageMarked()}"`)}${ctx.tool('highlight', 'Highlight the selection', 'H', 'data-highlight')}`;
Epub.page = (ctx) => `<div class="page">${ctx.top()}<div class="blotter is-paged">
  <article class="sheet book-sheet marked-sheet">
    <span data-ribbon></span>
    <button class="turn turn--prev" data-turn="-1" data-k="turn-prev" aria-label="Previous page" data-tip="Previous page  ←" data-tip-side="right">${icon('left')}</button>
    <button class="turn turn--next" data-turn="1" data-k="turn-next" aria-label="Next page" data-tip="Next page  →" data-tip-side="left">${icon('right')}</button>
    ${ctx.head()}${ctx.leaves(R.c)}
    <footer class="folio"><span class="count">${CHAPTERS[R.c].ord}</span><span class="count" data-folio></span></footer>
  </article></div>${ctx.colophon([CHAPTERS[R.c].ord, '<span data-col-page></span>', '<span data-fill="pct"></span>', `${R.bookmarks.length} bookmark${R.bookmarks.length === 1 ? '' : 's'}`, `${R.highlights.length} highlight${R.highlights.length === 1 ? '' : 's'}`])}</div>`;
Epub.phone = (ctx) => `<div class="phone__page marked-sheet"><span data-ribbon></span><div class="phone-find">${R.find.open ? finder.field() : ''}</div>${ctx.leaves(R.c)}<div class="phone__foot"><span class="count">${CHAPTERS[R.c].ord}</span><span class="count" data-col-page></span></div></div>`;
Epub.phoneTools = (ctx) => `${ctx.tool('contents', 'Contents', '', 'data-contents')}${ctx.tool('search', 'Find in the book', '', 'data-open-find')}${ctx.tool('ribbon', 'Bookmark this page', '', `data-bookmark aria-pressed="${pageMarked()}"`)}${ctx.tool('highlight', 'Highlight the selection', '', 'data-highlight')}`;
Epub.after = (ctx, n) => {
  if (!n?.paged) return;
  const [words, folio] = pageWords(n);
  const set = (sel, text) => { for (const el of canvas.querySelectorAll(sel)) el.textContent = text; };
  set('[data-col-page]', words);
  set('[data-folio]', folio);
  const on = pageMarked();
  for (const el of canvas.querySelectorAll('[data-ribbon]')) el.innerHTML = on ? '<span class="ribbon" role="img" aria-label="Bookmarked"></span>' : '';
  for (const b of canvas.querySelectorAll('[data-bookmark]')) { b.setAttribute('aria-pressed', String(on)); b.dataset.tip = `${on ? 'Take the bookmark off' : 'Bookmark this page'}  B`; }
  for (const b of canvas.querySelectorAll('.turn--prev')) b.disabled = n.page <= 1;
};
Epub.click = (b) => { if ('openFind' in b.dataset) finder.open(); };

mountEpubPage({
  id: 'margin',
  note: 'Marks where they were made: a ribbon, pencil under the words, Find in the bar, the count in the colophon.',
  bar: `<div class="xbar__group" data-x-set="pagenums"><span class="xbar__label">Page numbers</span><button class="word-button" data-value="screen">The screen’s</button><button class="word-button" data-value="steady">Steady</button><button class="word-button" data-value="print">Print</button></div>`,
  notes: `
  <h2>Features 1 · On the page</h2>
  <p>Every mark stays where it was made, as a reader with a pencil leaves them. Nothing new opens: the page, the layout's bar and the colophon carry it all.</p>
  <ul>
    <li><b>Page count:</b> the folio at the page's foot and, in the colophon, the page of the book's pages, the share read, and how many bookmarks and highlights it holds. The bar's <b>Page numbers</b> compares three ways to count (below).</li>
    <li><b>Bookmark:</b> <kbd>B</kbd>, or the ribbon tool. A bookmarked page wears the ribbon over its top edge, in the outer margin: the split's Facing-pages ribbon, ink-soft, its end forked; it drops in. <kbd>B</kbd> again takes it off.</li>
    <li><b>Highlight:</b> select words (drag, or from the keyboard <kbd>⇧→</kbd>: the page's first sentence, then a sentence more each time, <kbd>⇧←</kbd> one fewer) and press <kbd>H</kbd>. They're underlined in pencil, 2px, with a pencil tick in the margin by their paragraph. <kbd>H</kbd> on a highlight takes it off, and <kbd>${KEY('Mod-Z')}</kbd> puts it back.</li>
    <li><b>Walking your marks:</b> <kbd>]</kbd> goes to the next bookmark or highlight, <kbd>[</kbd> to the one before. That's the only list there is.</li>
    <li><b>Find:</b> <kbd>${KEY('Mod-F')}</kbd> (as in a note, #41) puts a field where the layout's tools are: A's band, B's slip, C's running head. Matches wear a wash of ink; the one you're on, the selection's wash and a ring. <kbd>Enter</kbd> and <kbd>⇧Enter</kbd> step, turning the pages; <kbd>Esc</kbd> closes it where you are.</li>
  </ul>
  <h2>Counting pages</h2>
  <ul>
    <li><b>The screen's</b> (Pages 1–3): exact for what you see, but they change when the window, the panes or the zoom do, so "page 212" means nothing tomorrow.</li>
    <li><b>Steady</b>: a page is 1,500 characters of the book, whatever the screen. A page then holds more or less than one screen, but its number never moves, and it's the same on the phone.</li>
    <li><b>Print</b>: many EPUBs carry the printed edition's pages (a page-list); where one does, its numbers match the paper copy, for citing. Where none, Steady.</li>
    <li>Recommended: Print where the book has it, else Steady, and the screen's turns underneath.</li>
  </ul>
  <h2>The phone</h2>
  <p>The same marks on a phone's page. Long-press to select, then the bar's highlight; the ribbon tool bookmarks; Find opens a field at the page's top. The tools sit where the layout keeps a phone's (A in the bar, B a floating slip, C a rail).</p>
  <h2>For</h2>
  <ul><li>Nothing new opens: the fewest parts, and every mark seen in place, like a used paperback.</li><li>Pencil, ribbon, ink: marks in the colours Eien already has, none the seal's.</li></ul>
  <h2>Against</h2>
  <ul><li>No list: you find a mark by walking to it. Thirty highlights later, that's slow.</li><li>The underline is quiet; a long highlighted passage reads as underlined text, which some books use for emphasis.</li></ul>`,
});
</script>
</body>
</html>
