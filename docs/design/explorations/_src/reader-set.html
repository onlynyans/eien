<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eien — Reading EPUBs: Showcase 2 · Set as a book</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:reader.css*/

/* Showcase 2 · Set as a book. The book as a compositor would set it in the
   writer's own face: a title page and its imprint from the book's own
   details, each chapter opening low on its page, its first line in capitals,
   the text justified and hyphenated with no line left alone at a page's head
   or foot, running heads that stay off an opening page, folios at the outer
   corners. Two voices, and you can see which is which: what the book's
   author and publisher wrote is in the text face; what Eien knows and counts
   (the heads, the folios, the imprint's record) is in the machine's. */
.blotter.is-paged { padding: var(--eien-space-5) var(--eien-space-5) var(--eien-space-4); }
.set-sheet { max-width: none; position: relative; }
.set-sheet:not([data-open]) { max-width: calc(var(--eien-measure) + 2 * var(--eien-space-8)); }
.set-sheet .leaves { --leaf-gap: var(--eien-space-8); }
/* The gutter: Facing pages' soft hairline, between the two text blocks. */
.set-sheet[data-open] .leaves::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: var(--eien-hairline); background: var(--eien-rule-soft); }
.pair { display: grid; grid-template-columns: 1fr var(--eien-space-8) 1fr; align-items: baseline; }
.pair > :nth-child(2) { grid-column: 3; text-align: right; }
.set-sheet:not([data-open]) .pair { grid-template-columns: 1fr auto; }
.set-sheet:not([data-open]) .pair > :nth-child(2) { grid-column: 2; }
.set-sheet .sheet__head { margin-bottom: var(--eien-space-5); }
/* A head or folio that a page leaves off keeps its line, so the text block never moves. */
.pair > .is-off { visibility: hidden; }

/* The text, set: justified and hyphenated (a note is ragged, unhyphenated), each line as even as
   the browser can make it, no widow or orphan. Every line stays on the book's one grid (--line). */
.set-text { hyphens: auto; -webkit-hyphens: auto; hyphenate-limit-chars: 6 3 2; }
:root[data-justify='ragged'] .set-text { hyphens: manual; -webkit-hyphens: manual; }
:root:not([data-justify='ragged']) .set-text p { text-align: justify; }
.set-text p { text-wrap: pretty; widows: 2; orphans: 2; hanging-punctuation: first allow-end; }
/* A chapter opens low on its page (a sink of four lines), its heading the book's own words in the
   text face: the word on one line, the numeral on two, so the opening keeps to the grid too. */
.set-text .ch-head { margin: calc(4 * var(--line)) 0 var(--line); font-weight: 400; line-height: var(--line); }
.set-text .ch-word { display: block; font-size: var(--eien-size-preview); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft); }
.set-text .ch-num { display: block; font-size: calc(var(--eien-size-title) * 1.5); line-height: calc(2 * var(--line)); color: var(--eien-ink); }
/* The opening line in capitals a step down, lightly tracked: the faces have no small capitals of their own. */
.set-text .ch-head + p { text-indent: 0; }
.set-text .ch-head + p::first-line { text-transform: uppercase; font-size: 0.8em; letter-spacing: calc(var(--eien-track-label) / 2); }

/* The title page and its imprint: the front matter, each a page of its own. */
.front { height: 100%; display: flex; flex-direction: column; break-after: column; break-inside: avoid; }
.title-page { padding-top: calc(2 * var(--eien-space-8)); }
.tp-title { font-size: calc(var(--eien-size-title) * 1.5); line-height: 1.1; color: var(--eien-ink); }
.tp-rule { width: var(--eien-space-7); height: var(--eien-hairline); margin: var(--eien-space-5) 0; background: var(--eien-rule); }
.tp-author { font-size: var(--eien-size-preview); letter-spacing: var(--eien-track-label); text-transform: uppercase; color: var(--eien-ink-soft); line-height: var(--eien-leading-row); }
.tp-shelf { margin-top: auto; }
.imprint { justify-content: flex-end; }
.book-text .imprint p { margin: 0 0 var(--eien-space-2); text-indent: 0; text-align: left; font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); line-height: var(--eien-leading-prose); color: var(--eien-pencil); hyphens: manual; }
:root:not([data-justify='ragged']) .set-text .imprint p { text-align: left; }
.imprint .face { font-size: var(--eien-size-row); color: var(--eien-ink); }
.imprint .face--text { font-family: var(--eien-face-text); }
.imprint .face--mono { font-family: var(--eien-face-mono); font-size: var(--eien-size-meta); }
.imprint i { font-family: var(--eien-face-text); font-size: var(--eien-size-row); color: var(--eien-ink-soft); }
.imprint .label { display: block; margin-bottom: var(--eien-space-3); }

/* The phone: one page; the sink and the title a step smaller; ragged right, hyphenated, as
   a measure this short opens rivers when it's justified. */
:root:not([data-justify='ragged']) .phone .set-text p { text-align: left; }
.phone__head { display: flex; justify-content: space-between; gap: var(--eien-space-3); padding-bottom: var(--eien-space-4); }
.phone .phone__page { grid-template-rows: auto minmax(0, 1fr) auto; }
.phone .title-page { padding-top: var(--eien-space-8); }
.phone .set-text .ch-head { margin-top: calc(2 * var(--line)); }
.phone .tp-title, .phone .set-text .ch-num { font-size: var(--eien-size-title); }
.phone .imprint p { line-height: var(--eien-leading-row); }
</style>
</head>
<body>
<script>
/*@shared-js*/
/*@include:keys.js*/
/*@include:reader.js*/

// A title page: the title set high on a sheet.
ICONS.titlepage = '<path d="M3.5 2.5h9v11h-9z"/><path d="M6 5.5h4M6.5 7.5h3"/>';

/** Room for two pages: each text block at least 20em of the face's prose, with the sheet's margins and the gutter (Facing pages' rule). */
function canOpen(ctx) {
  const prose = parseFloat(getComputedStyle(root).getPropertyValue('--eien-size-prose')) || 22;
  const sheet = ctx.pageW - 2 * 24;
  const margins = 2 * Math.min(72, Math.max(16, sheet * 0.08));
  return (sheet - margins - 72) / 2 >= 20 * prose;
}

/** The face the book is set in: the Typeface setting's. */
const faceName = () => (TEXT_FACES.find((f) => f.id === (root.dataset.face ?? 'newsreader')) ?? TEXT_FACES[0]).name;
const WORDS = Math.round(BOOK_CHARS / 5.6 / 1000) * 1000;

/** The front matter, made from the book's own details (its title, author and date) and the vault's. */
function frontMatter() {
  return `<section class="front title-page" aria-label="Title page">
    <div class="tp-title">${esc(BOOK.title)}</div>
    <div class="tp-rule" aria-hidden="true"></div>
    <div class="tp-author">${esc(BOOK.author)}</div>
    <div class="tp-shelf label">${esc(BOOK.folder)}</div>
  </section>
  <section class="front imprint" aria-label="Imprint">
    <span class="label">This copy</span>
    <p><i>${esc(BOOK.title)}</i>, by ${esc(BOOK.author)}. First published in 1813; in the public domain.</p>
    <p>61 chapters, about ${WORDS.toLocaleString('en')} words.</p>
    <p>Set in <span class="face face--text">${esc(faceName())}</span> <span data-set-as></span>. Counted in <span class="face face--mono">IBM Plex Mono</span>.</p>
    <p>From ${esc(BOOK.file)}. The book’s own styles are kept for its structure only.</p>
    <p>Your place, ${R.bookmarks.length} bookmark${R.bookmarks.length === 1 ? '' : 's'} and ${R.highlights.length} highlight${R.highlights.length === 1 ? '' : 's'} are kept in .eien/reading/.</p>
  </section>`;
}

// A chapter, set: its heading parted into the word and the numeral, and the front matter before the first.
const plainChapter = chapterHtml;
chapterHtml = (c) => {
  const html = plainChapter(c).replace(/<h2 class="ch-head"([^>]*)>Chapter ([IVXLC]+)<\/h2>/, '<h2 class="ch-head"$1><span class="ch-word">Chapter</span> <span class="ch-num">$2</span></h2>');
  return c === 0 ? frontMatter() + html : html;
};

/** The page in the chapter where its heading stands: after the front matter in Chapter I, else the first. */
const openerOf = (lv) => (R.c === 0 && lv?._ ? pageOf(lv, 0) : 0);

Reader.tools = (ctx) => `${ctx.contentsTool()}${ctx.tool('titlepage', 'Title page and imprint', 'T', 'data-title-page')}`;
Reader.page = (ctx) => {
  const open = canOpen(ctx);
  return `<div class="page">${ctx.top()}<div class="blotter is-paged">
  <article class="sheet book-sheet set-sheet"${open ? ' data-open' : ''}>
    <button class="turn turn--prev" data-turn="-1" data-k="turn-prev" aria-label="Previous ${open ? 'pages' : 'page'}" data-tip="Previous ${open ? 'pages' : 'page'}  ←" data-tip-side="right">${icon('left')}</button>
    <button class="turn turn--next" data-turn="1" data-k="turn-next" aria-label="Next ${open ? 'pages' : 'page'}" data-tip="Next ${open ? 'pages' : 'page'}  →" data-tip-side="left">${icon('right')}</button>
    <div class="sheet__head pair"><span class="crumb" data-head-v>${esc(BOOK.title)}</span><span class="crumb" data-head-r>${open ? CHAPTERS[R.c].title : ''}</span></div>
    ${ctx.leaves(R.c, { span: open ? 2 : 1, cls: 'set-text' })}
    <footer class="folio pair"><span class="count" data-folio-v></span><span class="count" data-folio-r></span></footer>
  </article></div>${ctx.colophon(['<span data-col-where></span>', '<span data-col-page></span>', '<span data-fill="pct"></span>', open ? '' : 'one page: too narrow for two'])}</div>`;
};
Reader.strip = (ctx) => `<div class="seg"><span class="crumb">${ctx.crumb()}</span><span class="tools-row">${ctx.views()}${Reader.tools(ctx)}</span></div>`;
Reader.phone = (ctx) => `<div class="phone__page"><div class="phone__head pair"><span class="crumb" data-head-v>${esc(BOOK.title)}</span><span class="crumb" data-head-r></span></div>${ctx.leaves(R.c, { cls: 'set-text' })}<div class="phone__foot pair"><span class="count" data-folio-v></span><span class="count" data-folio-r></span></div></div>`;
Reader.phoneTools = (ctx) => `${ctx.tool('contents', 'Contents', '', 'data-contents')}${ctx.tool('titlepage', 'Title page and imprint', '', 'data-title-page')}`;
Reader.after = (ctx, n) => {
  if (!n?.paged) return;
  const lv = main();
  const opener = openerOf(lv);
  const two = n.span === 2;
  /** What a page in this chapter carries at its head and foot: none in the front matter, no head on an opening page. */
  const parts = (p) => {
    const exists = p < n.chPages;
    const front = R.c === 0 && p < opener;
    return { head: exists && !front && p !== opener, folio: exists && !front };
  };
  const v = parts(R.p);
  const r = parts(R.p + 1);
  const put = (sel, text, on) => { for (const el of canvas.querySelectorAll(sel)) { el.textContent = text; el.classList.toggle('is-off', !on); } };
  // One page shows the chapter at its head (the book's title would say less); a spread, the book on the left and the chapter on the right.
  put('[data-head-v]', two ? BOOK.title : CHAPTERS[R.c].title, v.head);
  put('[data-head-r]', two ? CHAPTERS[R.c].title : '', r.head && two);
  put('[data-folio-v]', String(n.page), v.folio);
  put('[data-folio-r]', two ? String(n.page + 1) : '', r.folio && two);
  // The phone's folio sits at the outer corner of a one-page book: the right.
  if (!two) for (const el of canvas.querySelectorAll('[data-folio-v]')) { el.textContent = ''; }
  if (!two) put('[data-folio-r]', String(n.page), v.folio);
  // The imprint says how the page is set, read off it: size on leading, the line's length, justified or not.
  const flow = lv?.querySelector('.flow');
  if (flow) {
    const cs = getComputedStyle(flow);
    const size = parseFloat(cs.fontSize);
    const ragged = root.dataset.justify === 'ragged' || ctx.device === 'phone';
    for (const el of canvas.querySelectorAll('[data-set-as]')) el.textContent = `at ${Math.round(size)} on ${Math.round(parseFloat(cs.lineHeight))} px, lines of ${Math.round(lv._.W / size)} em${two ? ' a page' : ''}, ${ragged ? 'ragged right' : 'justified'} and hyphenated`;
  }
  // Where in the front matter you are, so a redraw (a new face, a layout) keeps the page and doesn't jump to Chapter I.
  R.front = R.c === 0 && R.p < opener ? R.p : null;
  const where = R.c === 0 && R.p < opener ? (R.p === 0 ? 'title page' : 'imprint') : CHAPTERS[R.c].ord;
  for (const el of canvas.querySelectorAll('[data-col-where]')) el.textContent = where;
  for (const el of canvas.querySelectorAll('[data-col-page]')) el.textContent = two ? `pages ${n.page}–${Math.min(n.page + 1, n.pages)} of ${n.pages}` : `page ${n.page} of ${n.pages}`;
  for (const b of canvas.querySelectorAll('.turn--prev')) b.disabled = n.page <= 1;
};
Reader.drawn = () => { const lv = main(); if (R.front != null && R.c === 0 && lv?._) { R.p = Math.min(R.front, lv._.pages - 1); R.p -= R.p % lv._.span; place(lv, true); } };
// Going to a chapter means its opening, not the front matter.
const goChapter = act.go;
act.go = (c, o) => { R.front = null; goChapter(c, o); };
/** The title page: the book's first page, before the first chapter's opening. */
function toTitle() { R.c = 0; R.p = 0; R.front = 0; R.goal = null; draw(); main()?.focus({ preventScroll: true }); say('Title page'); }
Reader.click = (b) => { if ('titlePage' in b.dataset) toTitle(); };
Reader.key = (e) => {
  if (mod(e) || e.altKey || typing(e.target) || e.target.closest?.('.menu, .ls__rows, .sb')) return false;
  if (e.key.toLowerCase() === 't') { e.preventDefault(); toTitle(); return true; }
  return false;
};

const SHORT = { 'plex-sans': 'Plex Sans', 'source-sans': 'Source Sans', atkinson: 'Atkinson', schibsted: 'Schibsted', hanken: 'Hanken', instrument: 'Instrument' };
mountReaderPage({
  id: 'set',
  list: 'hidden',
  bar: `<div class="xbar__group" data-x-set="face"><span class="xbar__label">Typeface</span>${TEXT_FACES.map((f) => `<button class="word-button" data-value="${f.id}">${esc(SHORT[f.id] ?? f.name)}</button>`).join('')}</div>
  <div class="xbar__group" data-x-set="justify"><span class="xbar__label">Lines</span><button class="word-button" data-value="justified">Justified</button><button class="word-button" data-value="ragged">Ragged</button></div>`,
  note: 'The book as a compositor would set it, in your face: title page, imprint, openings, heads and folios.',
  notes: `
  <h2>Showcase 2 · Set as a book</h2>
  <p>The book set with a compositor's care, in the writer's own face. The type is the Typeface setting's; what changes is how it's set on the page. Two voices, and you can see which is which: <b>what the book's author and publisher wrote</b> (the title, the author, a chapter's heading, the text) is in the text face; <b>what Eien knows and counts</b> (the running heads, the folios, the imprint's record of this copy) is in the machine's.</p>
  <ul>
    <li><b>The title page</b> is made from the book's own details (its title, author and date), not the publisher's page, so it's set like every other: the title high on the page at display size (Newsreader and Literata switch to their display cuts there, by their optical-size axis), a short hairline, the author in the face's capitals, the folder it's shelved in at the foot. <kbd>T</kbd> or the title-page tool goes there.</li>
    <li><b>The imprint</b>, on the next page, is Eien's record of this copy, in the machine voice: the book's details, its length, and how it's set, read off the page as it is (the face's name in that face, its size on its leading, the line's length, justified or ragged), where it came from, and where your marks are kept. Change the bar's Typeface and the imprint says so.</li>
    <li><b>A chapter opens low on its page</b> (a sink of four lines), its heading the book's words: CHAPTER in the face's tracked capitals, the numeral large on two lines, so the opening keeps to the book's line grid and facing pages line up line for line. The first line runs in capitals a step down, lightly tracked: none of the bundled faces has small capitals of its own (checked in their font files), so these are capitals at 80%, the way a careful compositor fakes them.</li>
    <li><b>The text</b> is justified and hyphenated with each line evened by the browser's <code>text-wrap: pretty</code>, and no line is left alone at a page's head or foot (widows and orphans of two). The bar's Lines sets it ragged instead, as a note is set. Opening quotes hang in the margin where the system honours <code>hanging-punctuation</code> (WebKit: the iPhone); Chromium doesn't yet.</li>
    <li><b>Running heads and folios:</b> the book on the left page, the chapter on the right, in label type; folios at the outer corners of the foot. An opening page leaves its head off, and the front matter has neither, as a printed book does. The pages are counted from the title page, so Chapter I starts on page 3.</li>
    <li><b>Room:</b> two pages when each can have 20em of your face (Facing pages' rule; the list is hidden here to give it room), else one.</li>
  </ul>
  <h2>The phone</h2>
  <p>One page, set the same: the title page, the imprint, each chapter's opening (its sink and numeral a step smaller), the first line in capitals. Ragged right but hyphenated: a phone's measure is too short to justify without rivers. The chapter at the page's head in label type, the folio at its outer corner.</p>
  <h2>For</h2>
  <ul><li>Shows the writer's own face as a book face: the opening, the capitals, the even lines are what a typeface is for.</li><li>The two voices drawn as a rule a reader can see: the book's words in one, Eien's knowledge in the other.</li><li>The imprint is a colophon for one copy: how it's set, and where your marks are. Nothing else tells you that.</li></ul>
  <h2>Against</h2>
  <ul><li>Justified text in a narrow pane opens rivers, and hyphenation depends on the system's dictionary; ragged is the safer default for a phone.</li><li>Fake small capitals are lighter than real ones; a face with them (a later choice) would do better.</li><li>The front matter is two pages to turn past at the start of every book (the contents skip them).</li></ul>`,
});
</script>
</body>
</html>
