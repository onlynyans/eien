<title>Eien — Reading EPUBs: Turning 4 · The curl</title>
<link rel="stylesheet" href="../fonts.css" />
<style>
/*@shared-css*/
/*@include:epub.css*/
/*@include:epub-flip.css*/

/* Turning 4 · The curl. The page bends: the corner you hold is under your
   finger, and the paper rolls over a cylinder whose axis follows it, then lies
   back on itself on top. The roll is drawn in strips of the live page, each
   laid where its part of the cylinder falls and shaded by how it faces you:
   the front turning away, then the back coming over, the words faint through
   the paper. The roll is round half way and flat at rest and once turned.
   No picture of the page is taken.

   The exception it asks for (system.md allows no gradient and two shadows):
   the light on a bending page, only while a page moves, as three tokens a
   theme can carry. At rest the page is flat paper, as always. */
:root {
  /* NEW, for the owner: the shade where paper bends away, from the sheet shadow's own ink. */
  --eien-curl-shade: light-dark(rgb(58 44 26 / 0.18), rgb(0 0 0 / 0.5));
  /* NEW: the crest of the roll catching the light. */
  --eien-curl-light: light-dark(rgb(255 255 255 / 0.6), rgb(233 226 212 / 0.1));
  /* NEW: how much of the words shows through the back of the paper. */
  --eien-curl-through: 0.12;
}
.curl { position: absolute; z-index: 3; pointer-events: none; }
.curl > * { position: absolute; inset: 0; }
.curl-page { position: absolute; left: 0; top: 0; margin: 0; width: 100% !important; max-width: none; height: 100%; box-shadow: none; background: var(--eien-paper); }
/* The phone's page has no paper of its own (the screen is its paper), so each copy brings it. */
.curl-wash { pointer-events: none; }
.curl-page > .curl-wash { position: absolute; inset: 0; z-index: 5; }
/* The back: the page's own paper over its mirrored words, so they show through faintly. */
.curl-paper { position: absolute; inset: 0; z-index: 4; background: var(--eien-paper); opacity: calc(1 - var(--eien-curl-through)); }
.curl-back, .curl-strip { transform-origin: 0 0; }
/* A strip of the roll: the shade where it turns from you, the glint where its back tops the roll. */
.curl-tone { position: absolute; inset: 0; z-index: 5; }
/* The lifted paper's one soft shadow on the page it lies over: the exception's third shadow. */
.curl-flap { filter: drop-shadow(0 0 var(--eien-space-2) var(--eien-curl-shade)); }
.phone .phone__page, .sheet { touch-action: pan-y; }
</style>

    <li><code>--eien-curl-shade</code>: the shade where the paper bends away, made from the sheet shadow's own ink. It's on the page beneath along the fold (the roll's shadow) and on the page as it curves up into the fold. It's also the one soft shadow the lifted paper casts on the page it lies over: a third shadow, the exception's other half.</li>
    <li><code>--eien-curl-light</code>: the crest of the roll catching the light.</li>
    <li><code>--eien-curl-through</code>: how much of the words shows through the back of the paper (12%).</li>
  </ul>
  <p>The gradients are the light on a bending page, never decoration. At rest there's no gradient and no third shadow; the page is flat paper on the blotter as always.</p>
  <h2>The phone</h2>
  <p>Take hold of the page anywhere: a finger on the right of the page peels the next; drawn rightward, the page before curls back from beyond the spine. Tap the outer thirds for a turn without a hand.</p>
  <h2>For</h2>
  <ul><li>The turn people know from the best readers: held, thrown, caught.</li><li>A drag that feels tight: the paper never trails the finger, and the finish carries the hand's speed.</li><li>Live text throughout, so it works with the book's frame and your own type.</li></ul>
  <h2>Against</h2>
  <ul><li>It bends two of Eien's rules (gradients, two shadows), if only in motion.</li><li>Fourteen clipped copies of the page every frame cost more than the other three motions, on a slow phone most of all (fewer strips there would do).</li><li>The roll is twelve flat strips: smooth at reading size, faceted if you look closely; a shader would be exact.</li><li>The longest to build and to test.</li></ul>
